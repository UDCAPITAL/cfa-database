  return{q:`A payment of ${H.m(C0,c)} has just been made and will grow at ${H.p(g)} forever. With a discount rate of ${H.p(r)}, the present value of the future payments is <i>closest to</i>:`,
    c:H.m(C1/(r-g),c),w:[H.m(C0/(r-g),c),H.m(C1/r,c)],
    e:bxStep(`C₁ = ${C0} × (1 + ${g}) = ${C1.toFixed(4)}`,`PV = ${C1.toFixed(4)} / (${r} − ${g}) = <b>${H.m(C1/(r-g),c)}</b>`,`Trap: using C₀ instead of the next payment C₁.`)}});
bx('qm-sd',1,5,'Sample standard deviation','s = √[Σ(Xᵢ − X̄)² / (n − 1)]',H=>{
  const xs=Array.from({length:5},()=>H.ri(-12,25)),mu=xs.reduce((a,x)=>a+x,0)/5,ss=xs.reduce((a,x)=>a+(x-mu)**2,0);
  const s=Math.sqrt(ss/4),sp=Math.sqrt(ss/5),mad=xs.reduce((a,x)=>a+Math.abs(x-mu),0)/5;
  return{q:`The annual returns (%) of a strategy are ${xs.join(', ')}. The <b>sample</b> standard deviation is <i>closest to</i>:`,
    c:H.n(s)+'%',w:[H.n(sp)+'%',H.n(mad)+'%'],
    e:bxStep(`Mean = ${H.n(mu)}%; Σ(X − X̄)² = ${H.n(ss)}`,`s = √(${H.n(ss)} / 4) = <b>${H.n(s)}%</b>`,`Dividing by n gives the population figure (${H.n(sp)}%); ${H.n(mad)}% is the mean absolute deviation.`)}});
bx('qm-cv',1,5,'Coefficient of variation','CV = s / X̄ (risk per unit of return)',H=>{
  let A;for(let i=0;i<30;i++){A=['A','B','C'].map(k=>({k,m:H.rf(0.04,0.16,0.005),s:H.rf(0.06,0.3,0.005)}));A.forEach(a=>a.cv=a.s/a.m);const best=A.reduce((x,y)=>y.cv<x.cv?y:x),lowS=A.reduce((x,y)=>y.s<x.s?y:x),hiM=A.reduce((x,y)=>y.m>x.m?y:x);if(best!==lowS&&best!==hiM)break}
  const best=A.reduce((x,y)=>y.cv<x.cv?y:x);
  return{q:`Which fund has the lowest risk per unit of mean return?<br>${A.map(a=>`Fund ${a.k}: mean ${H.p(a.m,1)}, standard deviation ${H.p(a.s,1)}`).join('<br>')}`,
    c:'Fund '+best.k,w:A.filter(a=>a!==best).map(a=>'Fund '+a.k),
    e:bxStep(...A.map(a=>`CV(${a.k}) = ${H.p(a.s,1)} / ${H.p(a.m,1)} = ${a.cv.toFixed(2)}`),`Lowest CV → <b>Fund ${best.k}</b>. Neither the lowest volatility nor the highest return alone answers the question.`)}});
bx('qm-ci',1,6,'Normal distribution: confidence interval','90%: ±1.645σ · 95%: ±1.96σ · 99%: ±2.58σ',H=>{
  const mu=H.rf(0.03,0.12,0.005),sd=H.rf(0.08,0.25,0.005),ZS=[[90,1.645],[95,1.96],[99,2.58]],lv=H.pick(ZS),oth=ZS.filter(x=>x!==lv);
  const iv=z=>`${H.p(mu-z*sd,1)} to ${H.p(mu+z*sd,1)}`;
  return{q:`Annual returns are normally distributed with a mean of ${H.p(mu,1)} and a standard deviation of ${H.p(sd,1)}. The ${lv[0]}% confidence interval for next year's return is <i>closest to</i>:`,
    c:iv(lv[1]),w:oth.map(x=>iv(x[1])),
    e:bxStep(`${lv[0]}% two-sided → z = ${lv[1]}`,`${H.p(mu,1)} ± ${lv[1]} × ${H.p(sd,1)} = <b>${iv(lv[1])}</b>`)}});
bx('qm-sfr',1,6,"Roy's safety-first ratio",'SFRatio = [E(R_P) − R_L] / σ_P ; choose the highest',H=>{
  const RL=H.rf(0.01,0.05,0.005);let P;for(let i=0;i<40;i++){P=['1','2','3'].map(k=>({k,m:H.rf(0.05,0.15,0.005),s:H.rf(0.06,0.25,0.005)}));P.forEach(x=>x.r=(x.m-RL)/x.s);const b=P.reduce((x,y)=>y.r>x.r?y:x),hm=P.reduce((x,y)=>y.m>x.m?y:x),ls=P.reduce((x,y)=>y.s<x.s?y:x);if(b!==hm&&b!==ls)break}
  const b=P.reduce((x,y)=>y.r>x.r?y:x);
  return{q:`${H.name()} wants to minimise the probability of earning less than ${H.p(RL,1)}. Using Roy's safety-first criterion, which portfolio is preferred?<br>${P.map(x=>`Portfolio ${x.k}: expected return ${H.p(x.m,1)}, standard deviation ${H.p(x.s,1)}`).join('<br>')}`,
    c:'Portfolio '+b.k,w:P.filter(x=>x!==b).map(x=>'Portfolio '+x.k),
    e:bxStep(...P.map(x=>`SFR(${x.k}) = (${H.p(x.m,1)} − ${H.p(RL,1)}) / ${H.p(x.s,1)} = ${x.r.toFixed(3)}`),`Highest ratio → <b>Portfolio ${b.k}</b>.`)}});
bx('qm-t',1,7,'t-statistic for a mean','t = (X̄ − μ₀) / (s / √n)',H=>{
  const n=H.pick([16,25,36,49,64,81,100]),mu0=H.rf(0,0.08,0.005),xb=+(mu0+H.rf(-0.04,0.05,0.001)).toFixed(4),s=H.rf(0.05,0.25,0.005);
  const t=(xb-mu0)/(s/Math.sqrt(n));
  return{q:`A sample of ${n} monthly observations has a mean of ${H.p(xb,2)} and a standard deviation of ${H.p(s,1)}. The t-statistic for testing H₀: μ = ${H.p(mu0,1)} is <i>closest to</i>:`,
    c:t.toFixed(2),w:[((xb-mu0)/s).toFixed(2),((xb-mu0)/(s/n)).toFixed(2)],
    e:bxStep(`Standard error = ${s} / √${n} = ${(s/Math.sqrt(n)).toFixed(4)}`,`t = (${xb} − ${mu0}) / ${(s/Math.sqrt(n)).toFixed(4)} = <b>${t.toFixed(2)}</b>`)}});
bx('qm-port',1,8,'Two-asset portfolio risk','σ_P = √(w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂)',H=>{
  const w1=H.rf(0.2,0.8,0.05),w2=1-w1,s1=H.rf(0.08,0.3,0.01),s2=H.rf(0.05,0.25,0.01),rho=H.rf(-0.5,0.8,0.05);
  const v=w1*w1*s1*s1+w2*w2*s2*s2+2*w1*w2*rho*s1*s2,sp=Math.sqrt(v);
  return{q:`A portfolio holds ${H.p(w1,0)} in asset 1 (σ = ${H.p(s1,0)}) and ${H.p(w2,0)} in asset 2 (σ = ${H.p(s2,0)}). The correlation is ${rho.toFixed(2)}. The portfolio standard deviation is <i>closest to</i>:`,
    c:H.p(sp),w:[H.p(w1*s1+w2*s2),H.p(Math.sqrt(w1*w1*s1*s1+w2*w2*s2*s2))],
    e:bxStep(`σ²_P = ${w1.toFixed(2)}²×${s1}² + ${w2.toFixed(2)}²×${s2}² + 2×${w1.toFixed(2)}×${w2.toFixed(2)}×${rho}×${s1}×${s2} = ${v.toFixed(5)}`,`σ_P = <b>${H.p(sp)}</b>`,`The weighted average of σ (${H.p(w1*s1+w2*s2)}) only applies when ρ = 1.`)}});
bx('qm-reg',1,10,'Simple linear regression: prediction','Ŷ = b̂₀ + b̂₁X',H=>{
  const b0=H.rf(-0.02,0.03,0.001),b1=H.rf(0.4,1.6,0.01),X=H.rf(-0.05,0.12,0.005),y=b0+b1*X;
  return{q:`A regression of a stock's monthly return on the market's monthly return gives an intercept of ${b0.toFixed(3)} and a slope of ${b1.toFixed(2)}. If the market returns ${H.p(X,1)} next month, the predicted stock return is <i>closest to</i>:`,
    c:H.p(y),w:[H.p(b1*X),H.p(b0+b1)],
    e:bxStep(`Ŷ = ${b0.toFixed(3)} + ${b1.toFixed(2)} × ${X.toFixed(3)} = <b>${H.p(y)}</b>`)}});

/* ===== Economics ===== */
bx('eco-elast',2,1,'Own-price elasticity of demand','E = %ΔQ / %ΔP ; |E| > 1 elastic, < 1 inelastic',H=>{
  const dp=H.rf(0.04,0.2,0.01)*(H.chance(.5)?1:-1),e=-H.rf(0.3,2.5,0.05),dq=e*dp,cls=x=>Math.abs(x)>1?'elastic':'inelastic';
  const good=H.pick(['coffee','gasoline','streaming subscriptions','airline tickets','bread','sneakers']);
  return{q:`When the price of ${good} ${dp>0?'rises':'falls'} by ${H.p(Math.abs(dp),0)}, quantity demanded ${dq<0?'falls':'rises'} by ${H.p(Math.abs(dq),1)}. Demand is best described as having a price elasticity of:`,
    c:`${e.toFixed(2)}, ${cls(e)}`,w:[`${(1/e).toFixed(2)}, ${cls(1/e)}`,`${e.toFixed(2)}, ${cls(e)==='elastic'?'inelastic':'elastic'}`],
    e:bxStep(`E = ${H.p(dq,1)} / ${H.p(dp,0)} = <b>${e.toFixed(2)}</b>`,`|E| ${Math.abs(e)>1?'>':'<'} 1 → ${cls(e)}`)}});
bx('eco-shut',2,1,'Short-run shutdown and long-run exit','P ≥ ATC: stay · AVC ≤ P < ATC: operate short run, exit long run · P < AVC: shut down',H=>{
  const avc=H.rf(10,40,0.5),atc=+(avc+H.rf(3,15,0.5)).toFixed(2),cs=H.ri(0,2),P=cs===0?+(atc+H.rf(0.5,8,0.5)).toFixed(2):cs===1?+(avc+(atc-avc)*H.rf(0.2,0.8,0.1)).toFixed(2):+(avc-H.rf(0.5,6,0.5)).toFixed(2);
  const S=['Continue operating in both the short run and the long run','Continue operating in the short run but exit the market in the long run','Shut down production immediately'];
  return{q:`A perfectly competitive firm faces a market price of ${H.n(P)}. At its profit-maximising output, average variable cost is ${H.n(avc)} and average total cost is ${H.n(atc)}. The firm should <i>most likely</i>:`,
    c:S[cs],w:S.filter((_,i)=>i!==cs),
    e:bxStep(cs===0?`P (${P}) ≥ ATC (${atc}): it covers all costs.`:cs===1?`AVC (${avc}) ≤ P (${P}) < ATC (${atc}): it covers variable costs and part of fixed costs, so it keeps producing in the short run but leaves in the long run.`:`P (${P}) < AVC (${avc}): every unit sold increases the loss, so it shuts down.`)}});
bx('eco-mult',2,3,'Fiscal multiplier','Multiplier = 1 / [1 − c(1 − t)] ; ΔY = multiplier × ΔG',H=>{
  const c=H.rf(0.6,0.9,0.05),t=H.rf(0.1,0.35,0.05),G=H.ri(5,80)*10,k=1/(1-c*(1-t));
  return{q:`The marginal propensity to consume is ${c.toFixed(2)} and the tax rate is ${H.p(t,0)}. If government spending rises by ${G} billion, the eventual increase in output is <i>closest to</i>:`,
    c:H.n(G*k,1)+' billion',w:[H.n(G/(1-c),1)+' billion',H.n(G,1)+' billion'],
    e:bxStep(`Multiplier = 1 / [1 − ${c}(1 − ${t})] = ${k.toFixed(3)}`,`ΔY = ${G} × ${k.toFixed(3)} = <b>${H.n(G*k,1)} billion</b>`,`Ignoring taxes gives 1/(1 − c) = ${(1/(1-c)).toFixed(2)}.`)}});
bx('eco-mm',2,4,'Money multiplier','Money multiplier = 1 / reserve requirement',H=>{
  const rr=H.pick([0.05,0.08,0.1,0.125,0.2,0.25]),D=H.ri(1,50)*100;
  return{q:`The required reserve ratio is ${H.p(rr,1)}. A new deposit of ${H.n(D,0)} million enters the banking system. The maximum increase in total deposits is <i>closest to</i>:`,
    c:H.n(D/rr,0)+' million',w:[H.n(D*rr,0)+' million',H.n(D*(1/rr-1),0)+' million'],
    e:bxStep(`Multiplier = 1 / ${rr} = ${(1/rr).toFixed(2)}`,`Total deposits = ${D} × ${(1/rr).toFixed(2)} = <b>${H.n(D/rr,0)} million</b> (${H.n(D*(1/rr-1),0)} million of it is newly created).`)}});
bx('eco-neut',2,4,'Neutral policy rate','Neutral rate = real trend growth + inflation target',H=>{
  const g=H.rf(0.01,0.035,0.0025),pi=H.pick([0.02,0.02,0.025,0.03]),N=g+pi,pr=+(N+H.rf(-0.025,0.025,0.0025)).toFixed(4);const st=pr>N+0.0001?'contractionary':pr<N-0.0001?'expansionary':'neutral';
  const S={contractionary:'Contractionary, because the policy rate is above the neutral rate',expansionary:'Expansionary, because the policy rate is below the neutral rate',neutral:'Neutral, because the policy rate equals the neutral rate'};
  return{q:`Trend real GDP growth is ${H.p(g)}, the inflation target is ${H.p(pi,1)} and the policy rate is ${H.p(pr)}. The monetary policy stance is best described as:`,
    c:S[st],w:Object.keys(S).filter(k=>k!==st).map(k=>S[k]),
    e:bxStep(`Neutral = ${H.p(g)} + ${H.p(pi,1)} = ${H.p(N)}`,`Policy rate ${H.p(pr)} → <b>${st}</b>`)}});
bx('eco-cross',2,8,'Cross exchange rate','(JPY/EUR) = (JPY/USD) × (USD/EUR)',H=>{
  const pairs=[['USD','EUR',H.rf(1.02,1.2,0.0005)],['USD','GBP',H.rf(1.18,1.38,0.0005)]][H.ri(0,1)],third=H.pick([['JPY',H.rf(130,160,0.05)],['CHF',H.rf(0.82,0.95,0.0005)],['CAD',H.rf(1.3,1.42,0.0005)]]);
  const [usd,base,q1]=pairs,[pc,q2]=third,x=q1*q2,d=pc==='JPY'?2:4;
  return{q:`The ${usd}/${base} rate is ${q1.toFixed(4)} and the ${pc}/${usd} rate is ${q2.toFixed(pc==='JPY'?2:4)} (price currency/base currency). The ${pc}/${base} cross rate is <i>closest to</i>:`,
    c:x.toFixed(d),w:[(q2/q1).toFixed(d),(1/x).toFixed(4)],
    e:bxStep(`${pc}/${base} = ${pc}/${usd} × ${usd}/${base} = ${q2} × ${q1} = <b>${x.toFixed(d)}</b>`,`The ${usd} cancels out; dividing instead of multiplying is the classic slip.`)}});
bx('eco-fwd',2,8,'Forward rate (covered interest parity)','F(f/d) = S(f/d) × (1 + i_f·τ) / (1 + i_d·τ), τ = days/360',H=>{
  const S=H.rf(1.05,1.45,0.0001),ip=H.rf(0.005,0.06,0.0025),ib=H.rf(0.005,0.06,0.0025),d=H.pick([90,180,270,360]),t=d/360;
  const F=S*(1+ip*t)/(1+ib*t),Fw=S*(1+ib*t)/(1+ip*t);
  return{q:`The spot USD/EUR rate is ${S.toFixed(4)} (USD per EUR). USD ${d}-day Libor-style rate: ${H.p(ip)}; EUR rate: ${H.p(ib)} (actual/360). The ${d}-day forward USD/EUR rate is <i>closest to</i>:`,
    c:F.toFixed(4),w:[Fw.toFixed(4),(S*(1+ip-ib)).toFixed(4)],
    e:bxStep(`F = ${S.toFixed(4)} × (1 + ${ip}×${d}/360) / (1 + ${ib}×${d}/360) = <b>${F.toFixed(4)}</b>`,`The price-currency rate (USD) goes in the numerator.`)}});
bx('eco-appr',2,8,'Currency appreciation from a quote','Base currency: S₁/S₀ − 1 · price currency: S₀/S₁ − 1',H=>{
  const S0=H.rf(1.05,1.45,0.0001),S1=+(S0*(1+H.rf(-0.08,0.08,0.002))).toFixed(4),askBase=H.chance(.5);
  const b=S1/S0-1,pc=S0/S1-1;const v=askBase?b:pc;
  return{q:`The GBP/EUR rate moves from ${S0.toFixed(4)} to ${S1.toFixed(4)} (GBP per EUR). The percentage change in the value of the <b>${askBase?'EUR':'GBP'}</b> is <i>closest to</i>:`,
    c:H.p(v),w:[H.p(askBase?pc:b),H.p(-v)],
    e:bxStep(askBase?`EUR is the base currency: ${S1.toFixed(4)}/${S0.toFixed(4)} − 1 = <b>${H.p(b)}</b>`:`GBP is the price currency: ${S0.toFixed(4)}/${S1.toFixed(4)} − 1 = <b>${H.p(pc)}</b>`)}});

/* ===== Corporate Issuers ===== */
bx('cf-ccc',3,4,'Cash conversion cycle','CCC = DIO + DSO − DPO',H=>{
  const c=H.cur(),Rev=H.ri(200,900)*1000,COGS=Math.round(Rev*H.rf(0.5,0.75,0.01)),Inv=Math.round(COGS*H.rf(0.08,0.25,0.01)),AR=Math.round(Rev*H.rf(0.06,0.2,0.01)),AP=Math.round(COGS*H.rf(0.05,0.18,0.01));
  const dio=Inv/(COGS/365),dso=AR/(Rev/365),dpo=AP/(COGS/365),ccc=dio+dso-dpo;
  return{q:`${H.firm()} reports revenue of ${H.m(Rev,c,0)}, COGS of ${H.m(COGS,c,0)}, inventory of ${H.m(Inv,c,0)}, receivables of ${H.m(AR,c,0)} and payables of ${H.m(AP,c,0)}. Using a 365-day year (purchases ≈ COGS), its cash conversion cycle is <i>closest to</i>:`,
    c:H.n(ccc,1)+' days',w:[H.n(dio+dso+dpo,1)+' days',H.n(dso-dpo,1)+' days'],
    e:bxStep(`DIO = ${Inv}/(${COGS}/365) = ${dio.toFixed(1)}`,`DSO = ${AR}/(${Rev}/365) = ${dso.toFixed(1)}`,`DPO = ${AP}/(${COGS}/365) = ${dpo.toFixed(1)}`,`CCC = ${dio.toFixed(1)} + ${dso.toFixed(1)} − ${dpo.toFixed(1)} = <b>${ccc.toFixed(1)} days</b>`)}});
bx('cf-trade',3,4,'Cost of trade credit','Cost = (1 + d/(1 − d))^(365/(N − discount days)) − 1',H=>{
  const d=H.pick([0.01,0.015,0.02,0.025,0.03]),D=H.pick([10,15]),N=H.pick([30,45,60]);const per=d/(1-d),k=Math.pow(1+per,365/(N-D))-1;
  return{q:`A supplier offers terms of ${(d*100).toFixed(1)}/${D}, net ${N}. The implicit annual cost of forgoing the discount and paying on day ${N} is <i>closest to</i>:`,
    c:H.p(k),w:[H.p(per*365/(N-D)),H.p(d*365/N)],
    e:bxStep(`Period cost = ${d}/(1 − ${d}) = ${H.p(per,3)} for ${N-D} days`,`Annualised = (1 + ${per.toFixed(5)})^(365/${N-D}) − 1 = <b>${H.p(k)}</b>`)}});
bx('cf-npv',3,5,'Net present value','NPV = Σ CFₜ / (1 + r)^t − initial outlay',H=>{
  const c=H.cur(),n=H.ri(3,5),I=H.ri(50,500)*1000,cfs=Array.from({length:n},()=>Math.round(I*H.rf(0.2,0.45,0.01)/100)*100),r=H.rf(0.06,0.14,0.005);
  const pv=cfs.reduce((a,x,i)=>a+x/Math.pow(1+r,i+1),0),npv=pv-I,pv2=cfs.reduce((a,x,i)=>a+x/Math.pow(1+r,i+2),0);
  return{q:`A project costs ${H.m(I,c,0)} today and generates year-end cash flows of ${cfs.map(x=>H.m(x,'',0)).join(', ')} (${c}). At a ${H.p(r,1)} cost of capital, its NPV is <i>closest to</i>:`,
    c:H.m(npv,c,0),w:[H.m(cfs.reduce((a,x)=>a+x,0)-I,c,0),H.m(pv2-I,c,0)],
    e:bxStep(...cfs.map((x,i)=>`${x} / ${(1+r).toFixed(3)}^${i+1} = ${(x/Math.pow(1+r,i+1)).toFixed(0)}`),`NPV = ${pv.toFixed(0)} − ${I} = <b>${H.m(npv,c,0)}</b> → ${npv>0?'accept':'reject'}`)}});
bx('cf-irr',3,5,'Internal rate of return','IRR: the rate that sets NPV = 0',H=>{
  const c=H.cur(),irr=H.rf(0.06,0.22,0.005),n=H.ri(3,4),I=H.ri(100,600)*1000;let cfs=Array.from({length:n-1},()=>Math.round(I*H.rf(0.2,0.4,0.01)));
  const pvSoFar=cfs.reduce((a,x,i)=>a+x/Math.pow(1+irr,i+1),0);const last=Math.round((I-pvSoFar)*Math.pow(1+irr,n));cfs.push(last);
  const simple=(cfs.reduce((a,x)=>a+x,0)-I)/I/n;
  return{q:`An investment of ${H.m(I,c,0)} produces year-end cash flows of ${cfs.map(x=>H.m(x,'',0)).join(', ')} (${c}). Its IRR is <i>closest to</i>:`,
    c:H.p(irr,1),w:[H.p(irr+H.pick([0.02,0.025,0.03]),1),H.p(simple,1)],
    e:bxStep(`At ${H.p(irr,1)}: ${cfs.map((x,i)=>`${x}/${(1+irr).toFixed(3)}^${i+1}`).join(' + ')} ≈ ${I} → NPV ≈ 0, so <b>IRR ≈ ${H.p(irr,1)}</b>`,`${H.p(simple,1)} is the average undiscounted return, not the IRR.`)}});
bx('cf-wacc',3,6,'Weighted average cost of capital','WACC = w_d·r_d(1 − t) + w_p·r_p + w_e·r_e',H=>{
  const wd=H.rf(0.2,0.5,0.05),wp=H.chance(.4)?H.rf(0.05,0.15,0.05):0,we=+(1-wd-wp).toFixed(2),rd=H.rf(0.03,0.08,0.0025),rp=H.rf(0.05,0.09,0.0025),re=H.rf(0.08,0.15,0.0025),t=H.rf(0.15,0.35,0.01);
  const w=wd*rd*(1-t)+wp*rp+we*re,w0=wd*rd+wp*rp+we*re;
  return{q:`A company targets ${H.p(wd,0)} debt${wp?`, ${H.p(wp,0)} preferred stock`:''} and ${H.p(we,0)} equity. Pre-tax cost of debt: ${H.p(rd)}${wp?`; cost of preferred: ${H.p(rp)}`:''}; cost of equity: ${H.p(re)}; marginal tax rate: ${H.p(t,0)}. WACC is <i>closest to</i>:`,
    c:H.p(w),w:[H.p(w0),H.p((rd*(1-t)+(wp?rp:0)+re)/(wp?3:2))],
    e:bxStep(`${wd}×${rd}×(1 − ${t})${wp?` + ${wp}×${rp}`:''} + ${we}×${re} = <b>${H.p(w)}</b>`,`Without the tax shield: ${H.p(w0)}.`)}});
bx('cf-mm2',3,6,'MM Proposition II with taxes','r_e = r₀ + (r₀ − r_d)(1 − t)(D/E)',H=>{
  const r0=H.rf(0.07,0.13,0.0025),rd=H.rf(0.03,0.06,0.0025),t=H.rf(0.15,0.35,0.01),de=H.rf(0.2,1.5,0.1);
  const re=r0+(r0-rd)*(1-t)*de;
  return{q:`An all-equity firm has a cost of capital of ${H.p(r0)}. It moves to a debt-to-equity ratio of ${de.toFixed(1)} with debt costing ${H.p(rd)}; the tax rate is ${H.p(t,0)}. Under MM with taxes, the new cost of equity is <i>closest to</i>:`,
    c:H.p(re),w:[H.p(r0+(r0-rd)*de),H.p(r0+(r0-rd)*(1-t)*de/(1+de))],
    e:bxStep(`r_e = ${r0} + (${r0} − ${rd}) × (1 − ${t}) × ${de} = <b>${H.p(re)}</b>`)}});
bx('cf-dtl',3,6,'Degree of total leverage','DOL = Q(P−V)/[Q(P−V) − F] · DFL = EBIT/(EBIT − I) · DTL = DOL × DFL',H=>{
  const P=H.ri(20,120),V=Math.round(P*H.rf(0.3,0.7,0.05)),Q=H.ri(20,200)*1000,F=Math.round(Q*(P-V)*H.rf(0.2,0.6,0.05)),EBIT=Q*(P-V)-F,I=Math.round(EBIT*H.rf(0.1,0.5,0.05));
  const dol=Q*(P-V)/EBIT,dfl=EBIT/(EBIT-I);
  return{q:`A firm sells ${H.n(Q,0)} units at ${P} each; variable cost is ${V} per unit, fixed operating costs are ${H.n(F,0)} and interest expense is ${H.n(I,0)}. Its degree of total leverage is <i>closest to</i>:`,
    c:(dol*dfl).toFixed(2),w:[dol.toFixed(2),dfl.toFixed(2)],
    e:bxStep(`Contribution = ${Q}×(${P} − ${V}) = ${Q*(P-V)}; EBIT = ${EBIT}`,`DOL = ${dol.toFixed(2)}; DFL = ${EBIT}/(${EBIT} − ${I}) = ${dfl.toFixed(2)}`,`DTL = <b>${(dol*dfl).toFixed(2)}</b>`)}});

/* ===== Financial Statement Analysis ===== */
bx('fsa-eps',4,2,'Basic EPS with a share issuance','Basic EPS = (NI − preferred dividends) / weighted average shares',H=>{
  const c=H.cur(),NI=H.ri(20,300)*100000,PD=H.ri(0,30)*10000,N0=H.ri(5,50)*100000,X=H.ri(1,20)*50000,mo=H.pick([[3,'1 October'],[6,'1 July'],[9,'1 April']]);
  const w=N0+X*mo[0]/12,eps=(NI-PD)/w;
  return{q:`${H.firm()} had ${H.n(N0,0)} shares outstanding on 1 January and issued ${H.n(X,0)} new shares on ${mo[1]}. Net income is ${H.m(NI,c,0)} and preferred dividends are ${H.m(PD,c,0)}. Basic EPS for the calendar year is <i>closest to</i>:`,
    c:H.m(eps,c),w:[H.m(NI/w,c),H.m((NI-PD)/(N0+X),c)],
    e:bxStep(`Weighted shares = ${N0} + ${X} × ${mo[0]}/12 = ${w.toFixed(0)}`,`EPS = (${NI} − ${PD}) / ${w.toFixed(0)} = <b>${H.m(eps,c)}</b>`)}});
bx('fsa-deps',4,2,'Diluted EPS with convertible preferred','Diluted EPS = NI / (weighted shares + shares from conversion), if dilutive',H=>{
  const c=H.cur(),N=H.ri(10,80)*100000,NI=Math.round(N*H.rf(1.5,6,0.1)),PD=Math.round(NI*H.rf(0.05,0.2,0.01)),C=Math.round(N*H.rf(0.05,0.25,0.01));
  const basic=(NI-PD)/N,dil=NI/(N+C),d=Math.min(basic,dil);
  return{q:`Net income is ${H.m(NI,c,0)}, with ${H.n(N,0)} common shares outstanding all year. Preferred dividends of ${H.m(PD,c,0)} were paid on preferred shares convertible into ${H.n(C,0)} common shares. Diluted EPS is <i>closest to</i>:`,
    c:H.m(d,c),w:[H.m(d===basic?dil:basic,c),H.m((NI-PD)/(N+C),c)],
    e:bxStep(`Basic = (${NI} − ${PD}) / ${N} = ${H.m(basic,c)}`,`If converted: no preferred dividend, ${N} + ${C} shares → ${NI}/${N+C} = ${H.m(dil,c)}`,dil<basic?`Dilutive → <b>${H.m(dil,c)}</b>`:`Antidilutive (higher than basic) → diluted EPS = basic = <b>${H.m(basic,c)}</b>`)}});
bx('fsa-inv',4,6,'FIFO vs LIFO cost of goods sold','FIFO: oldest costs to COGS · LIFO: newest costs to COGS (periodic)',H=>{
  const c=H.cur(),b=[H.ri(100,400)*10,H.rf(8,20,0.5)],p1=[H.ri(100,400)*10,+(b[1]*H.rf(1.02,1.15,0.01)).toFixed(2)],p2=[H.ri(100,400)*10,+(b[1]*H.rf(1.1,1.3,0.01)).toFixed(2)];
  const tot=b[0]+p1[0]+p2[0],sold=Math.round(tot*H.rf(0.4,0.75,0.01)/10)*10,lay=[b,p1,p2];
  const cogs=order=>{let left=sold,x=0;for(const[l,cst]of order){const u=Math.min(l,left);x+=u*cst;left-=u}return x};
  const fifo=cogs(lay),lifo=cogs(lay.slice().reverse()),avg=sold*(lay.reduce((a,[u,cst])=>a+u*cst,0)/tot),ask=H.chance(.5)?'FIFO':'LIFO';
  return{q:`Beginning inventory: ${H.n(b[0],0)} units at ${H.m(b[1],c)}. Purchases: ${H.n(p1[0],0)} units at ${H.m(p1[1],c)}, then ${H.n(p2[0],0)} units at ${H.m(p2[1],c)}. ${H.n(sold,0)} units were sold. Under periodic <b>${ask}</b>, cost of goods sold is <i>closest to</i>:`,
    c:H.m(ask==='FIFO'?fifo:lifo,c,0),w:[H.m(ask==='FIFO'?lifo:fifo,c,0),H.m(avg,c,0)],
    e:bxStep(`${ask} takes the ${ask==='FIFO'?'oldest':'most recent'} layers first until ${sold} units are reached.`,`COGS = <b>${H.m(ask==='FIFO'?fifo:lifo,c,0)}</b> (FIFO ${H.m(fifo,c,0)} · LIFO ${H.m(lifo,c,0)} · weighted average ${H.m(avg,c,0)})`,`With rising prices, LIFO gives the higher COGS and the lower ending inventory.`)}});
bx('fsa-ddb',4,7,'Double-declining balance depreciation','DDB rate = 2 / useful life, applied to beginning carrying amount',H=>{
  const c=H.cur(),cost=H.ri(20,400)*1000,life=H.pick([4,5,8,10]),salv=Math.round(cost*H.rf(0.05,0.15,0.01)),rate=2/life,y1=cost*rate,y2=(cost-y1)*rate;
  return{q:`Equipment costs ${H.m(cost,c,0)}, has a ${life}-year life and a residual value of ${H.m(salv,c,0)}. Using double-declining balance, depreciation in <b>year 2</b> is <i>closest to</i>:`,
    c:H.m(y2,c,0),w:[H.m((cost-salv)/life,c,0),H.m((cost-salv)*rate*(1-rate),c,0)],
    e:bxStep(`Rate = 2/${life} = ${H.p(rate,1)}`,`Year 1 = ${cost} × ${rate.toFixed(3)} = ${y1.toFixed(0)}`,`Year 2 = (${cost} − ${y1.toFixed(0)}) × ${rate.toFixed(3)} = <b>${H.m(y2,c,0)}</b>`,`Residual value is ignored in the DDB base (it only caps total depreciation).`)}});
bx('fsa-dtl',4,9,'Deferred tax liability','DTL = (carrying amount − tax base) × tax rate',H=>{
  const c=H.cur(),cost=H.ri(50,500)*1000,life=H.pick([4,5,8,10]),t=H.rf(0.2,0.35,0.01),book=cost/life,tax=cost*2/life;
  const diff=tax-book;
  return{q:`An asset costing ${H.m(cost,c,0)} is depreciated straight-line over ${life} years in the financial statements and by double-declining balance for tax. The tax rate is ${H.p(t,0)}. At the end of year 1, the deferred tax liability is <i>closest to</i>:`,
    c:H.m(diff*t,c,0),w:[H.m(diff*(1-t),c,0),H.m(diff,c,0)],
    e:bxStep(`Carrying amount = ${cost} − ${book.toFixed(0)} = ${(cost-book).toFixed(0)}; tax base = ${cost} − ${tax.toFixed(0)} = ${(cost-tax).toFixed(0)}`,`Difference ${diff.toFixed(0)} × ${t} = <b>${H.m(diff*t,c,0)}</b>`)}});
bx('fsa-dupont',4,11,'DuPont ROE','ROE = net profit margin × asset turnover × (assets / equity)',H=>{
  const npm=H.rf(0.03,0.18,0.005),at=H.rf(0.5,2,0.05),de=H.rf(0.2,1.5,0.05),em=1+de;
  return{q:`A company has a net profit margin of ${H.p(npm,1)}, total asset turnover of ${at.toFixed(2)} and a debt-to-equity ratio of ${de.toFixed(2)} (liabilities consist only of debt). Its ROE is <i>closest to</i>:`,
    c:H.p(npm*at*em),w:[H.p(npm*at*de),H.p(npm*at)],
    e:bxStep(`Equity multiplier = assets/equity = 1 + D/E = ${em.toFixed(2)}`,`ROE = ${H.p(npm,1)} × ${at.toFixed(2)} × ${em.toFixed(2)} = <b>${H.p(npm*at*em)}</b>`,`${H.p(npm*at)} is ROA.`)}});
bx('fsa-cfo',4,4,'Cash flow from operations (indirect method)','CFO = NI + non-cash charges − gains − ΔAR − Δinventory + ΔAP',H=>{
  const c=H.cur(),NI=H.ri(100,900)*1000,dep=Math.round(NI*H.rf(0.1,0.4,0.01)),gain=Math.round(NI*H.rf(0,0.15,0.01)),dAR=Math.round(NI*H.rf(-0.1,0.2,0.01)),dInv=Math.round(NI*H.rf(-0.15,0.15,0.01)),dAP=Math.round(NI*H.rf(-0.1,0.15,0.01));
  const cfo=NI+dep-gain-dAR-dInv+dAP,wrong=NI+dep+gain+dAR+dInv-dAP;
  const ch=(x,l)=>`${l} ${x>=0?'increased':'decreased'} by ${H.m(Math.abs(x),c,0)}`;
  return{q:`Net income is ${H.m(NI,c,0)}, depreciation ${H.m(dep,c,0)} and the gain on sale of equipment ${H.m(gain,c,0)}. ${ch(dAR,'Receivables')}, ${ch(dInv,'inventory').toLowerCase()} and ${ch(dAP,'payables').toLowerCase()}. Cash flow from operations is <i>closest to</i>:`,
    c:H.m(cfo,c,0),w:[H.m(cfo+2*gain===cfo?wrong:cfo+2*gain,c,0),H.m(wrong,c,0)],
    e:bxStep(`${NI} + ${dep} − ${gain} − (${dAR}) − (${dInv}) + (${dAP}) = <b>${H.m(cfo,c,0)}</b>`,`Increases in operating assets use cash; increases in operating liabilities provide cash; the gain belongs to investing activities.`)}});
bx('fsa-quick',4,11,'Liquidity ratios','Current = CA/CL · Quick = (cash + ST investments + receivables)/CL · Cash = (cash + ST inv.)/CL',H=>{
  const cash=H.ri(5,80)*1000,sti=H.ri(0,50)*1000,ar=H.ri(10,120)*1000,inv=H.ri(10,150)*1000,cl=H.ri(40,250)*1000,ask=H.pick(['quick','current','cash']);
  const v={quick:(cash+sti+ar)/cl,current:(cash+sti+ar+inv)/cl,cash:(cash+sti)/cl};
  return{q:`Cash ${H.n(cash,0)}, short-term investments ${H.n(sti,0)}, receivables ${H.n(ar,0)}, inventory ${H.n(inv,0)}, current liabilities ${H.n(cl,0)}. The <b>${ask} ratio</b> is <i>closest to</i>:`,
    c:v[ask].toFixed(2),w:Object.keys(v).filter(k=>k!==ask).map(k=>v[k].toFixed(2)),
    e:bxStep(`Current ${v.current.toFixed(2)} · quick ${v.quick.toFixed(2)} · cash ${v.cash.toFixed(2)} → <b>${v[ask].toFixed(2)}</b>`,`The quick ratio excludes inventory; the cash ratio also excludes receivables.`)}});

/* ===== Equity ===== */
bx('eq-ggm',5,6,'Gordon growth model','V₀ = D₁ / (r − g) = D₀(1 + g) / (r − g)',H=>{
  const c=H.cur(),D0=H.rf(0.5,6,0.05),g=H.rf(0.02,0.06,0.0025),r=+(g+H.rf(0.03,0.07,0.0025)).toFixed(4),v=D0*(1+g)/(r-g);
  return{q:H.say(`${H.firm()} just paid a dividend of ${H.m(D0,c)} which is expected to grow at ${H.p(g)} indefinitely. With a required return of ${H.p(r)}, the intrinsic value per share is <i>closest to</i>:`,`A stock's most recent dividend is ${H.m(D0,c)}. Dividends grow at a constant ${H.p(g)} and investors require ${H.p(r)}. What is the value of the share?`),
    c:H.m(v,c),w:[H.m(D0/(r-g),c),H.m(D0*(1+g)/r,c)],
    e:bxStep(`D₁ = ${D0} × (1 + ${g}) = ${(D0*(1+g)).toFixed(4)}`,`V₀ = ${(D0*(1+g)).toFixed(4)} / (${r} − ${g}) = <b>${H.m(v,c)}</b>`)}});
bx('eq-pe',5,7,'Justified P/E','Leading P/E = payout / (r − g) · trailing P/E = payout × (1 + g) / (r − g)',H=>{
  const p=H.rf(0.25,0.7,0.05),g=H.rf(0.02,0.06,0.0025),r=+(g+H.rf(0.03,0.07,0.0025)).toFixed(4),lead=H.chance(.5),L=p/(r-g),T=p*(1+g)/(r-g);
  return{q:`A company pays out ${H.p(p,0)} of earnings, dividends grow at ${H.p(g)} and the required return is ${H.p(r)}. Its justified <b>${lead?'leading':'trailing'}</b> P/E is <i>closest to</i>:`,
    c:(lead?L:T).toFixed(2),w:[(lead?T:L).toFixed(2),(p/r).toFixed(2)],
    e:bxStep(`Leading = ${p}/(${r} − ${g}) = ${L.toFixed(2)}; trailing = leading × (1 + g) = ${T.toFixed(2)}`,`→ <b>${(lead?L:T).toFixed(2)}</b>`)}});
bx('eq-margin',5,3,'Margin call price','P = P₀ × (1 − initial margin) / (1 − maintenance margin)',H=>{
  const c=H.cur(),P0=H.rf(20,150,0.5),im=H.pick([0.4,0.5,0.6]),mm=H.pick([0.25,0.3,0.35]),P=P0*(1-im)/(1-mm);
  return{q:`${H.name()} buys shares at ${H.m(P0,c)} on margin, with an initial margin of ${H.p(im,0)} and a maintenance margin of ${H.p(mm,0)}. Below which price will a margin call occur?`,
    c:H.m(P,c),w:[H.m(P0*(1-mm),c),H.m(P0*im/mm*(1-im),c)],
    e:bxStep(`Loan per share = ${P0} × (1 − ${im}) = ${(P0*(1-im)).toFixed(2)}`,`Margin call when (P − loan)/P = ${mm} → P = loan/(1 − ${mm}) = <b>${H.m(P,c)}</b>`)}});
bx('eq-lev',5,3,'Return on a leveraged (margin) purchase','Return on equity = (P₁ − P₀ + D − interest) / equity invested',H=>{
  const c=H.cur(),P0=H.rf(20,100,0.5),P1=+(P0*(1+H.rf(-0.2,0.35,0.01))).toFixed(2),D=+(P0*H.rf(0,0.04,0.005)).toFixed(2),im=H.pick([0.4,0.5,0.6]),i=H.rf(0.03,0.08,0.0025);
  const loan=P0*(1-im),eq=P0*im,ret=(P1-P0+D-loan*i)/eq;
  return{q:`An investor buys a share at ${H.m(P0,c)} with ${H.p(im,0)} initial margin, borrowing the rest at ${H.p(i)}. One year later the share pays a ${H.m(D,c)} dividend and is sold at ${H.m(P1,c)}. The return on the investor's equity is <i>closest to</i>:`,
    c:H.p(ret),w:[H.p((P1-P0+D)/P0),H.p((P1-P0+D)/eq)],
    e:bxStep(`Equity = ${eq.toFixed(2)}; loan = ${loan.toFixed(2)}; interest = ${(loan*i).toFixed(2)}`,`(${P1} − ${P0} + ${D} − ${(loan*i).toFixed(2)}) / ${eq.toFixed(2)} = <b>${H.p(ret)}</b>`)}});
bx('eq-capm',5,12,'CAPM required return','E(R) = R_f + β [E(R_M) − R_f]',H=>{
  const rf=H.rf(0.01,0.05,0.0025),rm=+(rf+H.rf(0.03,0.08,0.0025)).toFixed(4),b=H.rf(0.4,1.8,0.05),er=rf+b*(rm-rf);
  return{q:H.say(`The risk-free rate is ${H.p(rf)}, the expected market return is ${H.p(rm)} and ${H.firm()}'s beta is ${b.toFixed(2)}. Its required return under the CAPM is <i>closest to</i>:`,`With a beta of ${b.toFixed(2)}, a market risk premium of ${H.p(rm-rf)} and a risk-free rate of ${H.p(rf)}, what return does the CAPM require?`),
    c:H.p(er),w:[H.p(rf+b*rm),H.p(b*rm)],
    e:bxStep(`${H.p(rf)} + ${b.toFixed(2)} × (${H.p(rm)} − ${H.p(rf)}) = <b>${H.p(er)}</b>`)}});

/* ===== Fixed Income ===== */
bx('fi-price',6,6,'Bond price from yield-to-maturity','P = Σ C/(1 + r)^t + FV/(1 + r)^N',H=>{
  const cr=H.rf(0.02,0.08,0.0025),y=+(cr+H.rf(-0.025,0.03,0.0025)).toFixed(4),n=H.ri(3,12),semi=H.chance(.4);
  const price=(cpn,rate,N)=>{let p=0;for(let t=1;t<=N;t++)p+=cpn/Math.pow(1+rate,t);return p+100/Math.pow(1+rate,N)};
  const P=semi?price(cr*50,y/2,2*n):price(cr*100,y,n),Pw=semi?price(cr*100,y,n):price(cr*50,y/2,2*n);
  return{q:`A ${n}-year bond pays a ${H.p(cr)} coupon ${semi?'semiannually':'annually'}. Its yield-to-maturity is ${H.p(y)} (${semi?'semiannual bond basis':'annual'}). Its price per 100 of par is <i>closest to</i>:`,
    c:H.n(P,3),w:[H.n(Pw,3),H.n(100+(cr-y)*100*n,3)],
    e:bxStep(semi?`Coupon ${(cr*50).toFixed(3)} per period, rate ${H.p(y/2,3)}, ${2*n} periods`:`Coupon ${(cr*100).toFixed(2)}, rate ${H.p(y)}, ${n} periods`,`Price = <b>${H.n(P,3)}</b> (${P>100?'premium: coupon > yield':P<100?'discount: coupon < yield':'par'})`)}});
bx('fi-cy',6,7,'Current yield','Current yield = annual coupon / price',H=>{
  const cr=H.rf(0.02,0.09,0.0025),P=H.rf(85,115,0.25),n=H.ri(3,15);
  return{q:`A bond with a ${H.p(cr)} annual coupon and ${n} years to maturity trades at ${H.n(P)} per 100 of par. Its current yield is <i>closest to</i>:`,
    c:H.p(cr*100/P),w:[H.p(cr),H.p((cr*100+(100-P)/n)/((100+P)/2))],
    e:bxStep(`${(cr*100).toFixed(2)} / ${P} = <b>${H.p(cr*100/P)}</b>`,`Current yield ignores the pull to par; ${H.p((cr*100+(100-P)/n)/((100+P)/2))} is an approximate YTM.`)}});
bx('fi-fwd',6,9,'Implied forward rate','(1 + S₂)² = (1 + S₁)(1 + 1y1y)',H=>{
  const s1=H.rf(0.01,0.06,0.0025),s2=+(s1+H.rf(-0.01,0.02,0.0025)).toFixed(4),f=Math.pow(1+s2,2)/(1+s1)-1;
  return{q:`The 1-year spot rate is ${H.p(s1)} and the 2-year spot rate is ${H.p(s2)}. The implied one-year rate one year from now (1y1y) is <i>closest to</i>:`,
    c:H.p(f),w:[H.p((s1+s2)/2),H.p((1+s2)/(1+s1)-1)],
    e:bxStep(`(1 + ${s2})² / (1 + ${s1}) − 1 = <b>${H.p(f)}</b>`,`An upward-sloping spot curve implies forwards above the spot rates.`)}});
bx('fi-dur',6,11,'Price change with modified duration','ModDur = MacDur / (1 + r) · %ΔP ≈ −ModDur × Δy',H=>{
  const mac=H.rf(2,12,0.05),y=H.rf(0.02,0.08,0.0025),dy=H.pick([-100,-75,-50,-25,25,50,75,100])/10000,mod=mac/(1+y),pc=-mod*dy;
  return{q:`A bond has a Macaulay duration of ${mac.toFixed(2)} and an annual yield-to-maturity of ${H.p(y)}. If its yield ${dy>0?'rises':'falls'} by ${Math.abs(dy*10000)} bp, the approximate percentage price change is:`,
    c:(pc>0?'+':'')+H.p(pc),w:[(-mac*dy>0?'+':'')+H.p(-mac*dy),(mod*dy>0?'+':'')+H.p(mod*dy)],
    e:bxStep(`ModDur = ${mac.toFixed(2)} / (1 + ${y}) = ${mod.toFixed(3)}`,`%ΔP ≈ −${mod.toFixed(3)} × ${dy>0?'+':''}${dy} = <b>${(pc>0?'+':'')+H.p(pc)}</b>`,`Price moves opposite to yield; Macaulay duration must first be converted.`)}});
bx('fi-conv',6,12,'Duration and convexity adjustment','%ΔP ≈ −ModDur·Δy + ½·Convexity·(Δy)²',H=>{
  const mod=H.rf(3,14,0.05),cvx=H.rf(15,200,0.5),dy=H.pick([-200,-150,-100,100,150,200])/10000,pc=-mod*dy+0.5*cvx*dy*dy;
  return{q:`A bond has a modified duration of ${mod.toFixed(2)} and an annual convexity of ${cvx.toFixed(1)}. For a ${dy>0?'+':'−'}${Math.abs(dy*10000)} bp change in yield, the estimated percentage price change is <i>closest to</i>:`,
    c:(pc>0?'+':'')+H.p(pc),w:[(-mod*dy>0?'+':'')+H.p(-mod*dy),((-mod*dy+cvx*dy*dy)>0?'+':'')+H.p(-mod*dy+cvx*dy*dy)],
    e:bxStep(`Duration effect: −${mod.toFixed(2)} × ${dy} = ${H.p(-mod*dy)}`,`Convexity effect: ½ × ${cvx} × ${dy}² = ${H.p(0.5*cvx*dy*dy)}`,`Total ≈ <b>${(pc>0?'+':'')+H.p(pc)}</b> — convexity always adds for a plain bond.`)}});
bx('fi-el',6,14,'Expected credit loss','Expected loss = POD × LGD ; LGD = exposure × (1 − recovery rate)',H=>{
  const c=H.cur(),E=H.ri(1,50)*1e6,pd=H.rf(0.005,0.08,0.0025),rr=H.rf(0.2,0.7,0.05);
  return{q:`A bond position has an exposure of ${H.m(E,c,0)}. The probability of default is ${H.p(pd)} and the recovery rate is ${H.p(rr,0)}. The expected loss is <i>closest to</i>:`,
    c:H.m(E*pd*(1-rr),c,0),w:[H.m(E*pd,c,0),H.m(E*pd*rr,c,0)],
    e:bxStep(`LGD = ${E} × (1 − ${rr}) = ${(E*(1-rr)).toFixed(0)}`,`EL = ${pd} × ${(E*(1-rr)).toFixed(0)} = <b>${H.m(E*pd*(1-rr),c,0)}</b>`)}});

/* ===== Derivatives ===== */
bx('der-fwd',7,5,'Forward price with an income-paying asset','F₀(T) = [S₀ − PV(income)] × (1 + r)^T',H=>{
  const c=H.cur(),S=H.rf(30,150,0.5),r=H.rf(0.01,0.06,0.0025),T=H.pick([0.5,0.75,1]),D=+(S*H.rf(0.005,0.03,0.001)).toFixed(2),tD=+(T/2).toFixed(3);
  const pvD=D/Math.pow(1+r,tD),F=(S-pvD)*Math.pow(1+r,T);
  return{q:`A stock trades at ${H.m(S,c)} and will pay a ${H.m(D,c)} dividend in ${tD*12} months. The annual risk-free rate is ${H.p(r)}. The no-arbitrage price of a ${T*12}-month forward is <i>closest to</i>:`,
    c:H.m(F,c),w:[H.m(S*Math.pow(1+r,T),c),H.m((S+pvD)*Math.pow(1+r,T),c)],
    e:bxStep(`PV(dividend) = ${D} / (1 + ${r})^${tD} = ${pvD.toFixed(3)}`,`F = (${S} − ${pvD.toFixed(3)}) × (1 + ${r})^${T} = <b>${H.m(F,c)}</b>`,`Income reduces the forward price; carrying costs would increase it.`)}});
bx('der-opt',7,2,'Option payoff and profit at expiration','Long call profit = max(0, S_T − X) − c · long put profit = max(0, X − S_T) − p',H=>{
  const c=H.cur(),X=H.ri(20,150),call=H.chance(.5),prem=+(X*H.rf(0.02,0.08,0.005)).toFixed(2),ST=+(X*(1+H.rf(-0.25,0.25,0.01))).toFixed(2);
  const pay=call?Math.max(0,ST-X):Math.max(0,X-ST),prof=pay-prem;
  return{q:`An investor buys a ${call?'call':'put'} with an exercise price of ${H.m(X,c)} for a premium of ${H.m(prem,c)}. At expiration the underlying is at ${H.m(ST,c)}. The investor's profit per share is:`,
    c:H.m(prof,c),w:[H.m(pay,c)===H.m(prof,c)?H.m(prof+2*prem,c):H.m(pay,c),H.m(-prof,c)],
    e:bxStep(`Payoff = max(0, ${call?`${ST} − ${X}`:`${X} − ${ST}`}) = ${pay.toFixed(2)}`,`Profit = ${pay.toFixed(2)} − ${prem} = <b>${H.m(prof,c)}</b>`)}});
bx('der-pcp',7,9,'Put–call parity','S₀ + p₀ = c₀ + X / (1 + r)^T',H=>{
  const c=H.cur(),S=H.rf(40,120,0.5),X=Math.round(S*H.rf(0.9,1.1,0.01)),r=H.rf(0.01,0.06,0.0025),T=H.pick([0.25,0.5,1]),call=+(S*H.rf(0.04,0.12,0.005)).toFixed(2);
  const pv=X/Math.pow(1+r,T),put=call+pv-S;if(put<=0.05)return H.R&&bxAgain(H,'der-pcp');
  return{q:`A European call with an exercise price of ${H.m(X,c)} and ${T*12} months to expiry costs ${H.m(call,c)}. The stock trades at ${H.m(S,c)} and the risk-free rate is ${H.p(r)}. By put–call parity, the matching European put is worth <i>closest to</i>:`,
    c:H.m(put,c),w:[H.m(call+X-S,c),H.m(call+S-pv,c)],
    e:bxStep(`PV(X) = ${X} / (1 + ${r})^${T} = ${pv.toFixed(3)}`,`p = c + PV(X) − S = ${call} + ${pv.toFixed(3)} − ${S} = <b>${H.m(put,c)}</b>`)}});
function bxAgain(H,id){return BONUS_BY['bx.'+id].fn(H)}
bx('der-bin',7,10,'One-period binomial option value','q = (1 + r − d)/(u − d) · c₀ = [q·c_u + (1 − q)·c_d] / (1 + r)',H=>{
  const c=H.cur(),S=H.ri(40,120),u=H.rf(1.1,1.35,0.05),d=+H.rf(0.75,0.92,0.01).toFixed(2),r=H.rf(0.01,0.06,0.0025),X=Math.round(S*H.rf(0.95,1.08,0.01));
  const q=(1+r-d)/(u-d),cu=Math.max(0,S*u-X),cd=Math.max(0,S*d-X),v=(q*cu+(1-q)*cd)/(1+r);
  return{q:`A stock at ${H.m(S,c)} will move up by a factor of ${u.toFixed(2)} or down by a factor of ${d.toFixed(2)} in one year. The risk-free rate is ${H.p(r)}. The value of a one-year European call with an exercise price of ${H.m(X,c)} is <i>closest to</i>:`,
    c:H.m(v,c),w:[H.m(q*cu+(1-q)*cd,c),H.m((0.5*cu+0.5*cd)/(1+r),c)],
    e:bxStep(`q = (1 + ${r} − ${d}) / (${u.toFixed(2)} − ${d}) = ${q.toFixed(4)}`,`c_u = ${cu.toFixed(2)}, c_d = ${cd.toFixed(2)}`,`c₀ = (${q.toFixed(4)}×${cu.toFixed(2)} + ${(1-q).toFixed(4)}×${cd.toFixed(2)}) / ${(1+r).toFixed(4)} = <b>${H.m(v,c)}</b>`)}});

/* ===== Alternative Investments ===== */
bx('alt-fees',8,2,'Hedge fund net return after fees','Management fee on year-end AUM; incentive fee on gains net of the management fee',H=>{
  const V0=H.ri(50,500),g=H.rf(0.05,0.3,0.005),mf=H.pick([0.01,0.015,0.02]),inc=H.pick([0.1,0.15,0.2]);
  const end=V0*(1+g),m=mf*end,i=inc*(end-V0-m),net=(end-m-i)/V0-1,iW=inc*(end-V0),netW=(end-m-iW)/V0-1,netB=(end-mf*V0-inc*(end-V0-mf*V0))/V0-1;
  return{q:`A fund starts the year at ${V0} million and earns a gross return of ${H.p(g,1)}. It charges a ${H.p(mf,1)} management fee on year-end assets and a ${H.p(inc,0)} incentive fee on gains net of the management fee (no hurdle). The investor's net return is <i>closest to</i>:`,
    c:H.p(net),w:[H.p(netW),H.p(netB)===H.p(net)?H.p(g-mf-inc*g):H.p(netB)],
    e:bxStep(`Year-end = ${end.toFixed(2)}; management fee = ${m.toFixed(3)}`,`Incentive = ${inc} × (${end.toFixed(2)} − ${V0} − ${m.toFixed(3)}) = ${i.toFixed(3)}`,`Net = (${end.toFixed(2)} − ${m.toFixed(3)} − ${i.toFixed(3)}) / ${V0} − 1 = <b>${H.p(net)}</b>`)}});
bx('alt-cap',8,4,'Direct capitalization (cap rate)','Value = NOI / cap rate ; NOI = rental income − operating expenses (before financing)',H=>{
  const c=H.cur(),rent=H.ri(500,5000)*1000,opex=Math.round(rent*H.rf(0.2,0.45,0.01)),int=Math.round(rent*H.rf(0.1,0.25,0.01)),cap=H.rf(0.04,0.09,0.0025),noi=rent-opex;
  return{q:`A property generates rental income of ${H.m(rent,c,0)}, operating expenses of ${H.m(opex,c,0)} and interest expense of ${H.m(int,c,0)}. With a market cap rate of ${H.p(cap)}, its value is <i>closest to</i>:`,
    c:H.m(noi/cap,c,0),w:[H.m(rent/cap,c,0),H.m((noi-int)/cap,c,0)],
    e:bxStep(`NOI = ${rent} − ${opex} = ${noi} (financing costs excluded)`,`Value = ${noi} / ${cap} = <b>${H.m(noi/cap,c,0)}</b>`)}});

/* ===== Portfolio Management ===== */
bx('pm-util',9,1,'Utility and portfolio choice','U = E(r) − ½ A σ²',H=>{
  const A=H.ri(2,8);let P;for(let i=0;i<40;i++){P=['W','X','Y'].map(k=>({k,m:H.rf(0.04,0.16,0.005),s:H.rf(0.05,0.35,0.01)}));P.forEach(x=>x.u=x.m-0.5*A*x.s*x.s);const b=P.reduce((x,y)=>y.u>x.u?y:x),hm=P.reduce((x,y)=>y.m>x.m?y:x),ls=P.reduce((x,y)=>y.s<x.s?y:x);if(b!==hm&&b!==ls)break}
  const b=P.reduce((x,y)=>y.u>x.u?y:x);
  return{q:`An investor has a risk-aversion coefficient of ${A}. Which portfolio gives the highest utility?<br>${P.map(x=>`Portfolio ${x.k}: E(r) ${H.p(x.m,1)}, σ ${H.p(x.s,0)}`).join('<br>')}`,
    c:'Portfolio '+b.k,w:P.filter(x=>x!==b).map(x=>'Portfolio '+x.k),
    e:bxStep(...P.map(x=>`U(${x.k}) = ${x.m.toFixed(3)} − ½×${A}×${x.s.toFixed(2)}² = ${x.u.toFixed(4)}`),`→ <b>Portfolio ${b.k}</b>`)}});
bx('pm-sharpe',9,2,'Sharpe and Treynor ratios','Sharpe = (R_P − R_f)/σ_P · Treynor = (R_P − R_f)/β_P',H=>{
  const rp=H.rf(0.05,0.16,0.0025),rf=H.rf(0.01,0.04,0.0025),s=H.rf(0.08,0.3,0.005),b=H.rf(0.6,1.5,0.05),ask=H.chance(.5)?'Sharpe':'Treynor';
  const sh=(rp-rf)/s,tr=(rp-rf)/b;
  return{q:`A portfolio returned ${H.p(rp)} with a standard deviation of ${H.p(s,1)} and a beta of ${b.toFixed(2)}; the risk-free rate is ${H.p(rf)}. Its <b>${ask} ratio</b> is <i>closest to</i>:`,
    c:(ask==='Sharpe'?sh:tr).toFixed(3),w:[(ask==='Sharpe'?tr:sh).toFixed(3),(rp/(ask==='Sharpe'?s:b)).toFixed(3)],
    e:bxStep(`Sharpe = (${rp} − ${rf}) / ${s} = ${sh.toFixed(3)} · Treynor = (${rp} − ${rf}) / ${b} = ${tr.toFixed(3)}`,`→ <b>${(ask==='Sharpe'?sh:tr).toFixed(3)}</b>`)}});
bx('pm-alpha',9,2,"Jensen's alpha",'α = R_P − [R_f + β_P (R_M − R_f)]',H=>{
  const rf=H.rf(0.01,0.04,0.0025),rm=+(rf+H.rf(0.03,0.08,0.0025)).toFixed(4),b=H.rf(0.5,1.6,0.05),rp=+(rf+b*(rm-rf)+H.rf(-0.03,0.03,0.0025)).toFixed(4);
  const a=rp-(rf+b*(rm-rf));
  return{q:`A manager earned ${H.p(rp)} with a beta of ${b.toFixed(2)}. The market returned ${H.p(rm)} and the risk-free rate was ${H.p(rf)}. Jensen's alpha is <i>closest to</i>:`,
    c:H.p(a),w:[H.p(rp-rm),H.p(rp-b*rm)],
    e:bxStep(`Required = ${H.p(rf)} + ${b.toFixed(2)} × (${H.p(rm)} − ${H.p(rf)}) = ${H.p(rf+b*(rm-rf))}`,`α = ${H.p(rp)} − ${H.p(rf+b*(rm-rf))} = <b>${H.p(a)}</b>`)}});
bx('pm-beta',9,2,'Beta from correlation and volatilities','β_i = ρ_i,M × σ_i / σ_M = Cov(i, M) / σ²_M',H=>{
  const rho=H.rf(0.2,0.95,0.05),si=H.rf(0.12,0.45,0.01),sm=H.rf(0.12,0.22,0.01),b=rho*si/sm;
  return{q:`A stock's return volatility is ${H.p(si,0)}, the market's is ${H.p(sm,0)} and their correlation is ${rho.toFixed(2)}. The stock's beta is <i>closest to</i>:`,
    c:b.toFixed(2),w:[(rho*sm/si).toFixed(2),(si/sm).toFixed(2)],
    e:bxStep(`β = ${rho.toFixed(2)} × ${si} / ${sm} = <b>${b.toFixed(2)}</b>`)}});

     ['IV(B)',H=>`${H.name()} accepts a bonus from a client for outperforming a target, without telling the employer or obtaining written consent.`,'Compensation that may conflict with the employer\'s interest requires written consent from all parties.'],
     ['IV(C)',H=>`${H.name()}, a compliance supervisor, knows procedures are inadequate but does nothing; a subordinate then front-runs client orders.`,'Supervisors must make reasonable efforts, including adequate compliance procedures, to prevent violations.']],
  7:[['V(A)',H=>`${H.name()} issues a strong-buy recommendation on ${H.firm()} based solely on a third-party report, without checking its assumptions.`,'Recommendations need diligence and a reasonable, adequate basis.'],
     ['V(B)',H=>`${H.name()}'s team switches from fundamental to purely quantitative stock selection without informing clients.`,'Clients must be told about the investment process and promptly informed of significant changes.'],
     ['V(C)',H=>`After publishing a report, ${H.name()} discards all supporting notes and models to save storage space.`,'Records supporting recommendations must be retained (seven years recommended absent regulation).']],
  8:[['VI(A)',H=>`${H.name()} recommends ${H.firm()} to clients without disclosing a large personal holding in the stock.`,'Matters that could impair objectivity, such as personal holdings, must be disclosed.'],
     ['VI(B)',H=>`${H.name()} buys shares for a personal account just before executing a large block purchase for client accounts.`,'Client and employer transactions take priority over personal transactions (no front-running).'],
     ['VI(C)',H=>`${H.name()} receives a fee from an estate lawyer for every client referred, and tells neither the employer nor the clients.`,'Referral compensation must be disclosed to the employer, clients and prospective clients.']],
  9:[['VII(A)',H=>`After sitting the Level I exam, ${H.name()} posts on a forum the specific topics and formulas tested.`,'Disclosing confidential exam information compromises the integrity of the CFA Program.'],
     ['VII(B)',H=>`${H.name()}, who passed Level II, writes "Chartered Financial Analyst (Level II)" on a business card.`,'There is no partial designation; misrepresenting the CFA designation is prohibited.']]
};

/* ---------- question bank & notes index ---------- */
let QB=[],QID={},QBY={},NOTE={},RAWNOTE={},PERSO=null,PDX=null;
const noteOf=(s,r)=>(NOTE[s]||{})[r]||null;
const losLetter=t=>{const m=/^\s*(?:LOS\s*)?\d*\s*\(?([a-z])\)?\s*:/i.exec(t||'');return m?m[1].toLowerCase():null};
function rappelFor(q){
  if(q.c)return q.c;if(q.pf)return'';
  const n=noteOf(q.s,q.r);if(!n||!n.los)return'';const L=losLetter(q.los);const x=L&&n.los.find(l=>l.code===L);
  return x?`LOS ${q.r}${L} · ${x.title}\n${x.rappel}`:'';
}
const mkQID=()=>new Proxy({},{get:(o,k)=>{if(typeof k==='string'&&!(k in o)&&k.startsWith('bx.')&&k.includes('~')){const v=bonusInst(k);if(v)o[k]=v}return o[k]}});
const pk=id=>String(id).split('~')[0]; // progress is tracked per bonus template, not per numeric variant
const plain=s=>String(s||'').replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').replace(/&[a-z#0-9]+;/gi,' ');
function indexAll(){
  QB=[];QID=mkQID();QBY={};NOTE={};RAWNOTE={};
  CURR.forEach(c=>{QBY[c.id]={};c.r.forEach((_,i)=>QBY[c.id][i+1]=[])});
  const add=o=>{if(!QBY[o.s]||!QBY[o.s][o.r]||QID[o.id])return;QB.push(o);QID[o.id]=o;QBY[o.s][o.r].push(o)};
  if(PDX)Object.entries(PDX.subj).forEach(([s,v])=>{s=+s;if(v.qa)(PDX.qa[v.qa]||[]).forEach(q=>{const L=losLetter(q.los);add({s,r:q.r,src:'ap',id:'ap'+s+'.'+q.n,q:q.q,o:q.o,a:q.a,e:q.e,los:q.los,d:0,t:'Q.'+q.n+(L?' · LOS '+q.r+L:''),pf:v.qa,pq:q})})});

async function submitAuth(){

  const v=id=>($('#'+id)||{}).value||'';

      if(r.data.session){$('#auth').hidden=true;enterAs(r.data.session.user)}

    }else if(mode==='forgot'){

      const r=await SB.auth.resetPasswordForEmail(e,{redirectTo:SITE_URL()});if(r.error)return fail(authMsg(r.error));
      showAuth('','check',`If an account exists for ${e}, a reset link is on its way. Open it on this device (check your spam folder).`);

function sStats(s){

  c.r.forEach((_,i)=>{const x=rStats(s,i+1);o.total+=x.total;o.att+=x.att;o.ok+=x.ok;o.flag+=x.flag;o.wrong+=x.wrong;o.ap+=x.ap;if(x.att)o.started++});
  o.acc=o.att?o.ok/o.att:null;o.cov=o.total?o.att/o.total:0;return o;
}
function gStats(){

  if(sf==='all'){if(q.src==='bonus')return false}else if(sf!=='mix'&&q.src!==sf)return false;

function pickBalanced(list,n,balance){
  if(!balance||n>=list.length)return shuffle(list).slice(0,n);
  const g={};list.forEach(q=>{(g[q.s+'-'+q.r]||(g[q.s+'-'+q.r]=[])).push(q)});
  const groups=shuffle(Object.values(g).map(shuffle));const out=[];
  while(out.length<n){let added=false;for(const gr of groups){if(out.length>=n)break;if(gr.length){out.push(gr.pop());added=true}}if(!added)break}
  return shuffle(out);
}
/* exam-weighted pick across subjects (CFA simulation) */
function pickWeighted(list,n){
  const bySub={};list.forEach(q=>(bySub[q.s]||(bySub[q.s]=[])).push(q));
  const subs=Object.keys(bySub).map(Number);const W=subs.reduce((a,s)=>a+(subj(s).w[0]+subj(s).w[1])/2,0);
  let out=[];subs.forEach(s=>{const k=Math.round(n*((subj(s).w[0]+subj(s).w[1])/2)/W);out=out.concat(pickBalanced(bySub[s],Math.min(k,bySub[s].length),true))});
  const rest=shuffle(list.filter(q=>!out.includes(q)));while(out.length<n&&rest.length)out.push(rest.pop());
  return shuffle(out.slice(0,n));
}

/* web mode: same call shape as claude.ai's sample(), served by the ai-tutor Edge Function (OpenRouter) */
function webSample(){
  const fn=async(turns,opt={})=>{
    const{data}=await SB.auth.getSession();const tok=data&&data.session&&data.session.access_token;
    if(!tok)throw{code:'session_expired'};
    let r;try{r=await fetch(SUPA.url+'/functions/v1/ai-tutor',{method:'POST',signal:opt.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok,apikey:SUPA.key},body:JSON.stringify({messages:turns.slice(1)})})}
    catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
    if(!r.ok){let j={};try{j=await r.json()}catch(e){}
      throw{code:r.status===401?'session_expired':j.error==='daily_limit'?'daily_limit':j.error==='no_credits'?'no_credits':j.error==='not_configured'?'not_configured':'upstream_error',limit:j.limit}}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='',truncated=false;
    try{for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')continue;
        try{const j=JSON.parse(d);const c=j.choices&&j.choices[0];const piece=c&&c.delta&&c.delta.content||'';if(c&&c.finish_reason==='length')truncated=true;if(piece){text+=piece;opt.onText&&opt.onText({text,delta:piece})}}catch(e){}}}}
    catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error',text}}
    if(!text.trim())throw{code:'empty_completion'};
    return{text,truncated};
  };
  return fn;
}

function renderChat(){
  let h='';
  if(!CHAT.turns.length)h+=`<div class="msg a"><p>Ask me anything about the CFA Level I curriculum: a concept, a formula, or a question you got wrong.</p></div><div class="sugg">${suggestions().map(s=>`<button data-act="askSugg">${esc(s)}</button>`).join('')}</div>`;

const ASK_ERR={daily_limit:'You reached today’s limit of questions to the tutor. It resets tomorrow.',no_credits:'The tutor is out of credits for now. Tell the site owner.',not_configured:'The tutor is not set up yet.',not_granted:'This page is not allowed to use Claude. You can change that in the artifact’s Permissions menu.',sampling_disabled:'Claude is not available for this account.',rate_limited:'Too many requests or usage limit reached. Try again in a moment.',session_expired:'Your claude.ai session expired: sign in again and retry.',refused:'Claude declined this wording. Try rephrasing your question.',prompt_too_large:'Question too long: shorten it or clear the conversation.'};
async function sendAsk(){
  if(CHAT.busy){CHAT.ctl&&CHAT.ctl.abort();return}
  const inp=$('#askin');const text=inp.value.trim();if(!text)return;
  const sample=await getSample();
  if(!sample){CHAT.turns.push({role:'user',content:text},{role:'assistant',content:'The tutor works when this site is opened from claude.ai while signed in. It is not available in this copy.',err:true});inp.value='';renderChat();return}
  const content=CHAT.ctx&&!CHAT.turns.some(t=>t.ctxSent)?'Context:\n'+CHAT.ctx+'\n\nMy question: '+text:text;
  CHAT.turns.push({role:'user',content,shown:text,ctxSent:content!==text});inp.value='';CHAT.busy=true;renderChat();
  CHAT.ctl=new AbortController();
  const hist=CHAT.turns.filter(t=>!t.err).slice(-12);while(hist.length&&hist[0].role!=='user')hist.shift();
  try{
    const r=await sample([{role:'user',content:RULES},...hist.map(t=>({role:t.role,content:t.content}))],{cache:false,signal:CHAT.ctl.signal,onText:({text})=>{const el=$('#streaming');if(el){el.innerHTML=md(text);const b=$('#msgs');b.scrollTop=b.scrollHeight}}});
    CHAT.turns.push({role:'assistant',content:r.text+(r.truncated?'\n\n(Answer cut short: ask for one part at a time.)':'')});
  }catch(e){
    if(e&&e.text)CHAT.turns.push({role:'assistant',content:e.text});
    if(e&&e.code!=='cancelled')CHAT.turns.push({role:'assistant',content:ASK_ERR[e&&e.code]||'The answer was interrupted. Try again.',err:true});
    if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))CHAT.sample=null;
  }finally{CHAT.busy=false;CHAT.ctl=null;renderChat()}
}

  acEmail:async el=>{const e=($('#acEmail').value||'').trim().toLowerCase();if(!EMAIL_RE.test(e))return toast('Enter a valid email address.');el.disabled=true;

    if(r.error)return toast(authMsg(r.error));toast('Confirmation link sent to '+e+'. Open it to finish (check spam).')},
  acPass:async el=>{const p=$('#acPass').value||'';if(p.length<8)return toast('Password: at least 8 characters.');el.disabled=true;
    const r=await SB.auth.updateUser({password:p});el.disabled=false;if(r.error)return toast(authMsg(r.error));$('#acPass').value='';toast('Password changed')},
  logout:async()=>{try{await flushWeb()}catch(e){}try{await SB.auth.signOut()}catch(e){}location.hash='';location.reload()},
  askOpen:()=>openAsk(),
  askClose:()=>{$('#drawer').hidden=true},
  askClear:()=>{if(CHAT.ctl)CHAT.ctl.abort();CHAT.turns=[];renderChat()},
  askCtxOff:()=>{CHAT.ctx=null;CHAT.ctxKind=null;$('#dctx').hidden=true;renderChat()},
  askSugg:el=>openAsk(undefined,undefined,el.textContent,true),
  askQ:el=>{const ch=el.dataset.ch===''?null:+el.dataset.ch;const c=qContext(el.dataset.id,ch);CHAT.turns=[];CHAT.ctxKind='q';openAsk(c.txt,c.label)},
  askNote:el=>{const s=+el.dataset.s,r=+el.dataset.r,n=noteOf(s,r),c=subj(s);CHAT.turns=[];CHAT.ctxKind='note';openAsk(`CFA Level I reading: ${c.name}, R${r} "${c.r[r-1]}".${n?'\nStudy sheet summary: '+n.summary+'\nFormulas: '+(n.formulas||[]).map(f=>f.name+': '+f.f).join('; ')+'\nSheet content:\n'+(n.sections||[]).map(x=>x.h+': '+x.body).join('\n'):''}`.slice(0,9000),`${c.code} R${r} · ${c.r[r-1]}`)},
  askSum:el=>{ACT.askNote(el);openAsk(undefined,undefined,'Summarise this reading for exam revision: the key ideas, the formulas to know and the classic exam traps.',true)},
  setRead:el=>{const k=el.dataset.k;if(el.dataset.v)S.meta.read[k]={st:el.dataset.v,ts:Date.now()};else delete S.meta.read[k];touch('meta');render()},
  quizKeys:el=>{const keys=el.dataset.keys.split(',');const f={status:el.dataset.status||'all',diff:[1,2,3],src:'all'};const p=pool(keys,f);startQuiz(pickBalanced(p,keys.length>1?20:Math.min(20,p.length),true),{mode:'practice',label:el.dataset.label||'Quiz',keys})},
  addSubject:el=>{const s=+el.dataset.s;subj(s).r.forEach((_,i)=>SEL.add(s+'-'+(i+1)));if(!UI.open.includes(s))UI.open.push(s);saveUI();go('builder')},
  selSubject:el=>{const s=+el.dataset.s;subj(s).r.forEach((_,i)=>{const k=s+'-'+(i+1);el.checked?SEL.add(k):SEL.delete(k)});reRender()},
  selReading:el=>{el.checked?SEL.add(el.dataset.k):SEL.delete(el.dataset.k);reRender()},
  selAll:()=>{CURR.forEach(c=>c.r.forEach((_,i)=>SEL.add(c.id+'-'+(i+1))));reRender()},
  selNone:()=>{SEL.clear();reRender()},
  selWeak:()=>{SEL.clear();CURR.forEach(c=>c.r.forEach((_,i)=>{const x=rStats(c.id,i+1);if(x.acc!=null&&x.acc<.75){SEL.add(c.id+'-'+(i+1));if(!UI.open.includes(c.id))UI.open.push(c.id)}}));if(!SEL.size)toast('No weak spot identified yet.');reRender()},
  selNew:()=>{SEL.clear();CURR.forEach(c=>c.r.forEach((_,i)=>{if(!rStats(c.id,i+1).att)SEL.add(c.id+'-'+(i+1))}));reRender()},
  setStatus:el=>{UI.status=el.dataset.v;reRender()},
  setSrc:el=>{UI.src=el.dataset.v;reRender()},
  setDiff:el=>{const v=+el.dataset.v;UI.diff=UI.diff.includes(v)?UI.diff.filter(x=>x!==v):[...UI.diff,v].sort();if(!UI.diff.length)UI.diff=[v];reRender()},
  setMode:el=>{UI.mode=el.dataset.v;reRender()},
  start:()=>{const p=pool([...SEL]);const n=Math.min(UI.count,p.length);const codes=[...new Set([...SEL].map(k=>subj(+k.split('-')[0]).code))];const label=SEL.size===1?(()=>{const[s,r]=[...SEL][0].split('-');return subj(+s).code+' R'+r})():codes.length<=3?codes.join(' + '):plural(SEL.size,'reading');startQuiz(pickBalanced(p,n,UI.balance),{mode:UI.mode,label,keys:[...SEL]})},
  savePreset:()=>{const name=($('#presetName').value||'').trim()||('Selection of '+fmtD(Date.now()));S.meta.presets.unshift({name,keys:[...SEL]});touch('meta');toast('Selection saved');render()},
  loadPreset:el=>{const p=S.meta.presets[+el.dataset.i];SEL.clear();p.keys.forEach(k=>SEL.add(k));UI.open=[...new Set(p.keys.map(k=>+k.split('-')[0]))];reRender()},
  delPreset:el=>{S.meta.presets.splice(+el.dataset.i,1);touch('meta');render()},
  choose:el=>{const it=Q.items[Q.i];if(Q.mode!=='exam'&&it.done)return;it.ch=+el.dataset.k;lsSet(LS_ACTIVE,Q);keepTimer(render)},
  validate:()=>{const it=Q.items[Q.i];if(it.ch==null||it.done)return;stamp();it.done=true;record(it.id,it.ch===QID[it.id].a);touch('prog','meta');lsSet(LS_ACTIVE,Q);render()},
  next:()=>{stamp();if(Q.i<Q.items.length-1)Q.i++;lsSet(LS_ACTIVE,Q);render()},
  prev:()=>{stamp();if(Q.i>0)Q.i--;lsSet(LS_ACTIVE,Q);render()},
  jump:el=>{stamp();Q.i=+el.dataset.i;lsSet(LS_ACTIVE,Q);render()},
  finish:el=>{if(Q.mode==='exam'){const left=Q.items.filter(x=>x.ch==null).length;if(left&&el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent=left+' unanswered — confirm?';return}}stamp();finishQuiz()},
  flag:()=>{const on=toggleFlag(Q.items[Q.i].id);toast(on?'Flagged: it goes to Review':'Flag removed');keepTimer(render)},
  flagId:el=>{const on=toggleFlag(el.dataset.id);el.classList.toggle('on',on);el.textContent='⚑ '+(on?'Flagged':'Flag')},
  rvFilter:el=>{el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));document.querySelectorAll('#rvlist details').forEach(d=>d.hidden=el.dataset.v==='ko'&&d.dataset.ok==='1')},
  redoWrong:el=>{const s=S.sessions.find(x=>x.id===el.dataset.id);startQuiz(shuffle(s.items.filter(([id,ch])=>QID[id]&&ch!==QID[id].a).map(x=>QID[x[0]])),{mode:'practice',label:s.label+' · mistakes',keys:s.keys})},
  redoSame:el=>{const s=S.sessions.find(x=>x.id===el.dataset.id);startQuiz(shuffle(s.items.map(x=>QID[x[0]]).filter(Boolean)),{mode:s.mode,label:s.label,keys:s.keys})},
  reviewQuiz:el=>{const st=el.dataset.st;const qs=QB.filter(q=>{const p=S.prog[q.id];if(!p)return false;const w=p.n&&!p.l;return st==='flag'?p.f:st==='wrong'?w:(w||p.f)});startQuiz(shuffle(qs).slice(0,60),{mode:'practice',label:st==='flag'?'Review · flagged':st==='wrong'?'Review · missed':'Review'})},
  reviewGroup:el=>startQuiz(shuffle(el.dataset.ids.split(',').map(id=>QID[id]).filter(Boolean)),{mode:'practice',label:el.dataset.label}),
  dueQuiz:()=>{const qs=QB.filter(q=>isDue(S.prog[q.id]));startQuiz(shuffle(qs).slice(0,40),{mode:'practice',label:'Spaced review · due today'})},
  newQuiz:el=>{const keys=CURR.flatMap(c=>c.r.map((_,i)=>c.id+'-'+(i+1)));const qs=pool(keys,{status:'new',diff:[1,2,3],src:'all'});startQuiz(pickBalanced(qs,+el.dataset.n||20,true),{mode:'practice',label:'New questions'})},
  bonusDrill:el=>{const n=+el.dataset.n||10;let L=BONUS;if(el.dataset.id)L=[BONUS_BY[el.dataset.id]];else if(el.dataset.s)L=BONUS.filter(T=>T.s===+el.dataset.s);else if(el.dataset.weak)L=BONUS.filter(T=>{const x=bStats(T);return x.n&&x.acc<.7});
    if(!L.length)return toast('Nothing to practise here yet.');const pick=[];let pool2=shuffle(L);while(pick.length<n){if(!pool2.length)pool2=shuffle(L);pick.push(QID[pool2.pop().id])}
    startQuiz(pick,{mode:'practice',label:el.dataset.id?'Bonus · '+BONUS_BY[el.dataset.id].t:el.dataset.s?'Bonus · '+subj(+el.dataset.s).code:'Bonus drills'})},
  fToggle:el=>{const d=el.nextElementSibling,open=d.hidden;d.hidden=!open;el.setAttribute('aria-expanded',open);el.classList.toggle('open',open)},
  fReveal:el=>{el.classList.remove('hid')},
  spHide:()=>{UI.spHide=!UI.spHide;saveUI();keepScroll(render)},
  losCheck:el=>{const s=+el.dataset.s,r=+el.dataset.r,k=+el.dataset.k,n=+el.dataset.n,pn=pdfNote(s,r),l=pn&&pn.m.los[k-1];
    const P=losCheckPool(s,r,l),pick=P.ap.slice(0,n);let b=shuffle(P.bonus);while(pick.length<n&&P.bonus.length){if(!b.length)b=shuffle(P.bonus);pick.push(QID[b.pop().id])}
    const d=losDone(s,r);if(!d.includes(k)){S.meta.los[s+'-'+r]=[...d,k].sort((a,b)=>a-b);const nl=pn.m.los.length||1;if(S.meta.los[s+'-'+r].length>=nl&&!readSt(s,r))S.meta.read[s+'-'+r]={st:'read',ts:Date.now()};touch('meta')}
    startQuiz(pick,{mode:'practice',label:`${subj(s).code} ${l&&l.c?secLabel(r,l):'R'+r} · check`,keys:[s+'-'+r],back:el.dataset.back||`#note-${s}-${r}-${k}`})},
  quizLos:el=>{const s=+el.dataset.s,r=+el.dataset.r,qs=losQs(s,r,{c:el.dataset.c});startQuiz(shuffle(qs).slice(0,20),{mode:'practice',label:`${subj(s).code} LOS ${r}${el.dataset.c}`,keys:[s+'-'+r]})},
  aiVariant:async el=>{const q=QID[el.dataset.id],box=$('#aivar');if(!q||!box)return;const sample=await getSample();
    if(!sample){toast('The AI tutor is not available here.');return}
    box.hidden=false;box.innerHTML='<div class="nbload"><i></i><i></i><i></i><span>Writing a new question on the same concept…</span></div>';el.disabled=true;
    const prompt=`Write ONE new CFA Level I multiple-choice question that tests exactly the same concept as the question below, with different numbers, a different scenario and different wording. Exactly three options, one correct, the two others based on classic mistakes. Return ONLY minified JSON, no markdown: {"q":"question text","o":["option A","option B","option C"],"a":<index of the correct option 0-2>,"e":"short step-by-step explanation"}\n\nOriginal question:\n${plain(q.q)}\nOptions: ${q.o.map((o,k)=>LET[k]+'. '+plain(o)).join(' | ')}\nCorrect: ${LET[q.a]}`;
    try{const r=await sample([{role:'user',content:RULES},{role:'user',content:prompt}],{cache:false});const s=r.text,j=JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1));
      if(!j.q||!Array.isArray(j.o)||j.o.length!==3||!(j.a>=0&&j.a<=2))throw 0;AIV=j;renderAiv();}
    catch(e){box.innerHTML=`<p class="small muted">${esc(ASK_ERR[e&&e.code]||'Could not create a variant this time. Try again.')}</p>`}finally{el.disabled=false}},
  aivChoose:el=>{if(!AIV||AIV.ch!=null)return;AIV.ch=+el.dataset.k;renderAiv()},
  nTone:el=>{UI.tone=el.dataset.v;saveUI();const d=$('#pdfdoc');if(d)d.className='pdfdoc tone-'+UI.tone;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
  nZoom:el=>{UI.nzoom=Math.min(1.6,Math.max(.8,Math.round(((UI.nzoom||1)+(+el.dataset.d)*.1)*10)/10));if(+el.dataset.d>0&&!UI.nfocus&&innerWidth>1020)UI.nfocus=true;saveUI();keepScroll(render)},
  nMode:el=>{UI.nmode=el.dataset.v;saveUI();keepScroll(render)},
  nLayout:el=>{UI.nlayout=el.dataset.v;saveUI();keepScroll(render)},
  nFocus:()=>{UI.nfocus=!UI.nfocus;saveUI();keepScroll(render)},
  losDone:el=>{const s=+el.dataset.s,r=+el.dataset.r,k=+el.dataset.k,key=s+'-'+r;let d=losDone(s,r).filter(x=>x!==k);if(!el.dataset.off)d.push(k);d.sort((a,b)=>a-b);S.meta.los[key]=d;
    const n=pdfNote(s,r).m.los.length||1;if(d.length>=n&&!readSt(s,r))S.meta.read[key]={st:'read',ts:Date.now()};touch('meta');
    if(el.dataset.go)go(el.dataset.go.slice(1));else{toast(el.dataset.off?'Marked as not read':d.length>=n?'Reading complete':'Marked as read');keepScroll(render)}},
  pdfDrop:el=>dropPdfSubject(+el.dataset.s).then(()=>toast('PDFs removed from this browser')),
  pdfJump:el=>{const p=+el.dataset.p,y=+el.dataset.y;const c=[...document.querySelectorAll('#pdfdoc canvas')].find(c=>+c.dataset.pp===p&&y>=+c.dataset.py0-1&&y<=+c.dataset.py1);
    if(c){const b=c.getBoundingClientRect();window.scrollTo({top:window.scrollY+b.top+(y-c.dataset.py0)/(c.dataset.py1-c.dataset.py0)*b.height-16,behavior:'smooth'})}},
  dropPerso:async()=>{await idbSet('perso',null).catch(()=>{});PERSO=null;indexAll();toast('AnalystPrep data removed from this browser');render()},
  export:()=>{const io=$('#io');io.value=JSON.stringify({app:'cfa-qcm-lab',kind:'progress',v:2,prog:S.prog,sessions:S.sessions,meta:S.meta});io.select();(navigator.clipboard?navigator.clipboard.writeText(io.value):Promise.reject()).then(()=>toast('Progress copied'),()=>toast('Text selected: press Ctrl+C'))},
  import:()=>{try{const d=JSON.parse($('#io').value);if(!d||d.app!=='cfa-qcm-lab'||d.kind==='perso')throw 0;S.prog=d.prog||{};S.sessions=d.sessions||[];S.meta=d.meta||S.meta;normalize();touch('prog','sessions','meta');toast('Progress imported');go('dashboard')}catch(e){toast('Invalid text: paste a full QCM Lab progress export.')}},
  reset1:()=>{$('#resetzone').innerHTML='<span class="small">Erase all progress for good?</span><button class="btn danger" data-act="reset2">Yes, erase</button><button class="btn ghost" data-act="resetNo">Cancel</button>'},
  resetNo:()=>render(),
  reset2:()=>{const keep=S.t;S=blank();S.t=keep;touch('prog','sessions','meta');Q=null;lsSet(LS_ACTIVE,null);toast('Progress erased');go('dashboard')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(el.tagName==='INPUT'&&el.type==='checkbox'&&a!=='selSubject'&&a!=='selReading')return;if(ACT[a]){if(el.tagName==='A')e.preventDefault();if(a==='selSubject')e.stopPropagation();ACT[a](el,e)}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='balance'){UI.balance=el.checked;saveUI()}
  if(el.id==='persoFile'&&el.files&&el.files[0])importPerso(el.files[0]);
  if(el.id==='pdfFiles'&&el.files&&el.files.length)importPdfs(el.files);
  if(el.id==='onlyMine'){S.meta.settings.onlyMine=el.checked;touch('meta');indexAll();render()}
  if(el.dataset.set){const k=el.dataset.set;S.meta.settings[k]=el.type==='number'?Math.max(30,Math.min(300,+el.value||90)):el.value;touch('meta');toast('Saved')}
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='count'){UI.count=+el.value;$('#countv').textContent=el.value;saveUI()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName!=='DETAILS'||!d.dataset)return;
  if(d.dataset.s){const s=+d.dataset.s;UI.open=d.open?[...new Set([...UI.open,s])]:UI.open.filter(x=>x!==s);saveUI()}
  if(d.dataset.nopen){const s=+d.dataset.nopen;UI.notesOpen=d.open?[...new Set([...UI.notesOpen,s])]:UI.notesOpen.filter(x=>x!==s);saveUI()}},true);
document.addEventListener('keydown',e=>{
  if(route()!=='quiz'||!Q||e.target.matches('input,textarea,select'))return;const k=e.key.toLowerCase(),it=Q.items[Q.i],exam=Q.mode==='exam';if(!QID[it.id])return;
  const idx={a:0,b:1,c:2,'1':0,'2':1,'3':2}[k];
  if(idx!=null&&!(e.ctrlKey||e.metaKey)){if(!exam&&it.done)return;it.ch=idx;lsSet(LS_ACTIVE,Q);keepTimer(render);e.preventDefault()}
  else if(k==='enter'){e.preventDefault();if(exam){if(Q.i<Q.items.length-1)ACT.next()}else if(!it.done){if(it.ch!=null)ACT.validate()}else Q.i<Q.items.length-1?ACT.next():ACT.finish({dataset:{}})}
  else if(k==='f')ACT.flag();
  else if(exam&&k==='arrowright')ACT.next();else if(exam&&k==='arrowleft')ACT.prev();
});
window.addEventListener('scroll',()=>{const b=$('#rprog'),d=$('#pdfdoc');if(!b||!d)return;const r=d.getBoundingClientRect();b.style.width=Math.min(100,Math.max(0,(innerHeight*.6-r.top)/r.height*100))+'%'},{passive:true});
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();document.body.classList.add('dropping')}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dropping')});
document.addEventListener('drop',e=>{document.body.classList.remove('dropping');const fs=e.dataTransfer&&[...e.dataTransfer.files].filter(f=>/\.pdf$/i.test(f.name));if(!fs||!fs.length)return;e.preventDefault();if(route()!=='settings')go('settings');setTimeout(()=>importPdfs(fs),50)});
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el){tip.hidden=true;return}tip.textContent=el.dataset.tip;tip.hidden=false});
document.addEventListener('mousemove',e=>{if(tip.hidden)return;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-10;if(y+h>innerHeight-8)y=e.clientY-h-10;tip.style.left=x+'px';tip.style.top=y+'px'});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.hidden=false;tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'}});
document.addEventListener('focusout',()=>{tip.hidden=true});
window.addEventListener('hashchange',()=>{if(Q&&route()!=='quiz')try{stamp()}catch(e){}render()});
document.addEventListener('submit',e=>{if(e.target.id==='authform'){e.preventDefault();submitAuth()}});
if(MODE==='web')startWeb();else loadPerso().finally(()=>{render();initCloud()});
</script>
