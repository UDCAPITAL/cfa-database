nt starts at USD 100 million, falls to USD 90 million at the end of Year 1, and rises to USD 110 million at the end of Year 2. The incentive fee for Year 2 is closest to:","o":["USD 4 million.","USD 0.","USD 2 million."],"a":2,"e":"With a high-water mark of 100 million, the fee applies only to the increase above 100 million: 20% × (110 − 100) = 2 million. 4 million applies the fee to the full Year 2 increase (20% × 20), which would make the investor pay twice for recovering the losses. Zero would be correct only if the ending value remained below the high-water mark.","d":2,"t":"High-water mark","c":"A high-water mark is the highest net asset value on which an incentive fee has been paid; the manager earns an incentive fee only on gains above it, so investors do not pay again for recovering earlier losses."},{"r":2,"q":"A private equity fund invested USD 50 million in a portfolio company. It has received USD 80 million in realized proceeds, and its remaining stake is valued at USD 40 million. The multiple of invested capital (MOIC) is closest to:","o":["1.6x.","2.4x.","1.4x."],"a":1,"e":"MOIC = (realized value + unrealized value) / invested capital = (80 + 40) / 50 = 2.4x. 1.6x keeps only realized proceeds (80 / 50), and 1.4x divides the net gain (120 − 50 = 70) by invested capital. Unlike IRR, MOIC does not account for timing.","d":1,"t":"MOIC","c":"Multiple of invested capital (MOIC) = (realized value + unrealized value) / total invested capital. It measures total value created but ignores the timing of cash flows, unlike the IRR."},{"r":2,"q":"A private equity fund makes two investments of equal timing priority: Deal A (USD 40 million invested, exited for USD 70 million) and Deal B (USD 60 million invested, exited for USD 50 million). Carried interest is 20% with no hurdle. Under a European (whole-of-fund) waterfall, total carried interest is closest to:","o":["USD 6 million.","USD 4 million.","USD 8 million."],"a":1,"e":"In a European waterfall, carry is calculated on the fund's overall profit: (70 − 40) + (50 − 60) = 20 million, so 20% × 20 = 4 million. 6 million corresponds to an American (deal-by-deal) waterfall, which takes carry only on Deal A (20% × 30) without offsetting the loss. 8 million wrongly treats the 10 million loss as a gain.","d":3,"t":"European vs American waterfall","c":"Distribution waterfall: in a European (whole-of-fund) waterfall, the GP earns carried interest only after LPs recover all contributed capital (plus any hurdle) at the fund level; in an American (deal-by-deal) waterfall, carry is paid on each profitable deal, which favors the GP and makes clawbacks more important."},{"r":2,"q":"Returns on private real estate and private equity indexes are often based on appraisals rather than transaction prices. As a result, reported returns most likely:","o":["overstate volatility and correlation with public markets.","understate volatility but overstate correlation with public markets.","understate volatility and correlation with public markets."],"a":2,"e":"Appraisal-based valuations are infrequent and anchored on past values, which smooths returns. Measured volatility is therefore understated, as is the correlation with public markets, which exaggerates the diversification benefits. The other two answers reverse at least one of these effects.","d":2,"t":"Appraisal smoothing","c":"Appraisal-based and illiquid-asset indexes suffer from return smoothing: reported volatility and correlations with public markets are biased downward, overstating risk-adjusted returns (e.g., Sharpe ratio) and diversification benefits."},{"r":2,"q":"Hedge fund databases include only funds that are still reporting and allow new funds to add their past returns when they join. These features most likely cause index returns to be:","o":["overstated.","understated.","unbiased, because the two effects offset."],"a":0,"e":"Survivorship bias excludes funds that have disappeared, generally poor performers, and backfill bias adds only the histories of funds that performed well before joining the database. Both biases work in the same direction and overstate returns. They therefore do not offset each other.","d":1,"t":"Survivorship and backfill bias","c":"Hedge fund index biases: survivorship bias (failed funds drop out of the database) and backfill bias (funds add their good past records when they start reporting) both inflate reported returns and understate risk."},{"r":2,"q":"An investor commits USD 100 million to a private investment today. It receives USD 30 million at the end of Year 1 and USD 130 million at the end of Year 2. The internal rate of return (IRR) is closest to:","o":["26.5%.","30.0%.","60.0%."],"a":1,"e":"The IRR sets the NPV to zero: −100 + 30/(1+r) + 130/(1+r)² = 0; setting x = 1+r, 100x² − 30x − 130 = 0, so x = 1.30 and r = 30.0%. 60% is the total non-annualized gain ((160 − 100)/100), and 26.5% is the geometric return 1.6^0.5 − 1, which ignores the interim date of the first cash flow.","d":3,"t":"IRR of private investment","c":"The internal rate of return is the discount rate that sets the NPV of all cash flows (contributions and distributions) to zero. It is the standard money-weighted performance measure for private capital and is sensitive to the timing of cash flows."},{"r":3,"q":"A company that has a prototype product but has not yet generated revenues, and is raising capital to begin commercial manufacturing, is most likely at which stage of venture capital financing?","o":["Early stage.","Later stage.","Mezzanine (pre-IPO) stage."],"a":0,"e":"Early-stage financing (including start-up and first-stage) is used to move from prototype to production and commercialization, before the company generates significant revenue. Later-stage financing funds the expansion of a company that already has sales. Mezzanine/pre-IPO financing prepares the initial public offering.","d":1,"t":"Venture capital stages","c":"Venture capital stages: formative stage (pre-seed/angel, seed, early stage: idea to prototype to initial production, little or no revenue), later stage (expansion of a company with revenues), and mezzanine/pre-IPO stage (financing to prepare a public listing)."},{"r":3,"q":"A venture capital fund invests USD 6 million in a start-up in exchange for a 25% ownership stake after the investment. The pre-money valuation of the start-up is closest to:","o":["USD 24 million.","USD 8 million.","USD 18 million."],"a":2,"e":"Post-money value = 6 / 25% = 24 million; pre-money value = 24 − 6 = 18 million. 24 million is the post-money valuation. 8 million wrongly divides the investment by the stake held by the existing shareholders (6 / 75%).","d":2,"t":"Pre-money valuation","c":"Post-money valuation = investment / ownership fraction acquired; pre-money valuation = post-money − new investment. The new investor's stake = investment / post-money."},{"r":3,"q":"A private equity firm acquires a company for USD 500 million, financed with USD 300 million of debt and USD 200 million of equity. Five years later, the company is sold for USD 750 million, and net debt outstanding at exit is USD 150 million. Ignoring fees and interim cash flows, the annualized return on the equity is closest to:","o":["40.0%.","8.4%.","24.6%."],"a":2,"e":"Exit equity = 750 − 150 = 600 million, i.e., a multiple of 600/200 = 3.0x; annualized return = 3.0^(1/5) − 1 ≈ 24.6%. 40% is an arithmetic average ((3 − 1)/5) that ignores compounding. 8.4% is the unlevered return on enterprise value (750/500)^(1/5) − 1, which ignores leverage and debt paydown.","d":3,"t":"LBO return","c":"LBO equity returns come from growth in enterprise value, multiple expansion and debt paydown. Equity value at exit = exit EV − remaining net debt; annualized return = (exit equity / initial equity)^(1/n) − 1. Leverage magnifies both gains and losses."},{"r":3,"q":"A venture capital fund owns 40% of a company. In a new financing round, an investor contributes USD 15 million at a pre-money valuation of USD 45 million. After the round, the venture capital fund's ownership is closest to:","o":["40%.","30%.","15%."],"a":1,"e":"Post-money = 45 + 15 = 60 million; the new investor holds 15/60 = 25%. Existing shareholders are diluted to 75% of the capital, and the VC fund holds 40% × 75% = 30%. 40% ignores dilution, and 15% wrongly subtracts the 25% directly from the fund's stake.","d":2,"t":"Dilution in VC rounds","c":"In a new funding round, existing shareholders are diluted proportionally: new stake = old stake × (pre-money / post-money) = old stake × (1 − new investor's share)."},{"r":3,"q":"Private debt that is subordinated to senior secured loans and frequently includes warrants or conversion features is best described as:","o":["direct lending.","mezzanine debt.","venture debt."],"a":1,"e":"Mezzanine debt is subordinated to senior debt and often includes an equity kicker (warrants, conversion), which justifies a higher return. Direct lending refers mainly to senior secured loans made directly by private funds. Venture debt finances unprofitable VC-backed start-ups.","d":1,"t":"Mezzanine debt","c":"Private debt categories: direct lending (mostly senior secured loans by non-bank lenders), mezzanine debt (subordinated, often with warrants or conversion rights), venture debt (loans to VC-backed start-ups), distressed debt (debt of troubled firms bought at a discount), and unitranche debt (blended senior/subordinated)."},{"r":3,"q":"A private equity fund sells a portfolio company to a strategic buyer operating in the same industry. This exit route is best described as a:","o":["secondary sale.","trade sale.","recapitalization."],"a":1,"e":"A trade sale is a sale to a strategic (industry) buyer, who can often pay a premium due to synergies. A secondary sale is a sale to another financial investor (another PE fund). A recapitalization raises debt to pay a dividend to shareholders without giving up control.","d":2,"t":"Private capital exit routes","c":"Private equity exit routes: trade sale (to a strategic buyer), IPO (listing on a public market), secondary sale (to another PE firm or financial buyer), recapitalization (releveraging to pay a dividend while keeping control), and write-off/liquidation."},{"r":3,"q":"Which of the following correctly ranks private capital strategies from lowest to highest expected risk and return?","o":["Senior direct lending, mezzanine debt, venture capital.","Mezzanine debt, senior direct lending, leveraged buyouts.","Senior direct lending, venture capital, mezzanine debt."],"a":0,"e":"Expected risk and return increase with subordination: senior debt is repaid first, mezzanine is subordinated but still ranks as a creditor, and venture capital (equity in young companies) is the riskiest. The other rankings place mezzanine above senior debt in safety or above venture capital in risk, which is inconsistent.","d":3,"t":"Risk/return ranking of private capital","c":"Across private capital, expected risk and return rise with lower seniority in the capital structure and earlier company stage: senior private debt < mezzanine/unitranche < distressed debt and buyout equity < venture capital."},{"r":3,"q":"The J-curve pattern observed in private equity fund returns most likely reflects:","o":["strong early returns from quick exits, followed by declining returns as the fund ages.","negative early returns from fees and investment costs, followed by gains as investments mature and are exited.","returns that are stable over time because of appraisal-based valuations."],"a":1,"e":"In the early years, management fees and investment costs weigh on performance while gains are not yet realized, hence negative returns. Returns become positive as portfolio companies gain value and are exited. The other two statements describe the opposite or the absence of any pattern.","d":2,"t":"J-curve","c":"J-curve effect: private equity fund returns (and cumulative cash flows) are negative in early years due to fees, capital calls and unrealized investments, then turn positive as investments mature and are exited."},{"r":4,"q":"An office building generates gross potential rental income of USD 3.5 million. Vacancy and collection losses are 5%, operating expenses are USD 0.9 million, and annual mortgage interest is USD 0.7 million. Using a capitalization rate of 6%, the estimated property value is closest to:","o":["USD 28.75 million.","USD 43.33 million.","USD 40.42 million."],"a":2,"e":"NOI = 3.5 × (1 − 5%) − 0.9 = 2.425 million; value = 2.425 / 6% ≈ 40.42 million. Interest expense is not deducted from NOI (it relates to financing): deducting it gives 28.75 million. 43.33 million forgets vacancy ((3.5 − 0.9)/6%).","d":3,"t":"Direct capitalization method","c":"Net operating income = gross potential rent − vacancy and collection losses − operating expenses (excluding financing costs, depreciation and income taxes). Direct capitalization: value = NOI / cap rate."},{"r":4,"q":"A comparable property recently sold for USD 25 million and has a net operating income of USD 1.5 million. Using the implied cap rate, the value of a similar property with NOI of USD 1.8 million is closest to:","o":["USD 20.8 million.","USD 10.8 million.","USD 30.0 million."],"a":2,"e":"Implied cap rate = 1.5 / 25 = 6%; value = 1.8 / 6% = 30 million. 20.8 million inverts the ratio (25 × 1.5/1.8). 10.8 million wrongly multiplies NOI by the cap rate expressed in points (1.8 × 6). At a constant cap rate, value rises proportionally with NOI.","d":1,"t":"Cap rate from comparables","c":"Cap rate = NOI / property value, often derived from comparable transactions; the subject property's value = its NOI / comparable cap rate."},{"r":4,"q":"A property's NOI is expected to remain constant at USD 3 million. If the market cap rate rises from 5% to 6%, the percentage change in the property's value is closest to:","o":["-16.7%.","-20.0%.","-1.0%."],"a":0,"e":"Initial value = 3 / 5% = 60 million; new value = 3 / 6% = 50 million; change = 50/60 − 1 ≈ −16.7%. −20% relates the cap rate increase (1 point) to 5% as if value moved proportionally with the rate. −1% confuses the change in the cap rate with the change in value.","d":2,"t":"Cap rate sensitivity","c":"With constant NOI, property value = NOI / cap rate, so value moves inversely with the cap rate: new value / old value = old cap rate / new cap rate. Rising cap rates (e.g., from higher interest rates) reduce real estate values."},{"r":4,"q":"Compared with direct ownership of commercial property, investing in publicly traded REITs most likely provides:","o":["greater control over property management decisions.","returns with lower correlation to the equity market.","greater liquidity and lower minimum investment, but less control over the properties."],"a":2,"e":"Listed REITs offer liquidity, diversification and a low minimum investment, but the investor has no direct control over property management. Being exchange-traded, they show higher correlation with equities than directly held real estate, whose returns are smoothed by appraisals.","d":1,"t":"REITs vs direct ownership","c":"Publicly traded real estate (REITs) offers liquidity, low minimum investment, diversification and professional management, but no control over properties and higher short-term correlation with equities; direct ownership offers control and tax benefits but is illiquid, concentrated and management-intensive."},{"r":4,"q":"Compared with a greenfield infrastructure investment, a brownfield infrastructure investment most likely has:","o":["higher risk, because it involves construction of a new asset.","lower risk, because the asset already exists and has an operating cash flow history.","higher expected return, because of development risk."],"a":1,"e":"A brownfield asset already exists and has a cash flow history, which reduces risk and therefore expected return. Greenfield involves building a new asset, with development, cost overrun and demand risks, and a higher expected return.","d":2,"t":"Brownfield vs greenfield","c":"Brownfield infrastructure = existing assets with operating history (lower risk, stable cash flows, lower expected return); greenfield = assets to be built (construction and demand risk, higher expected return)."},{"r":4,"q":"A real estate fund focuses on fully leased, high-quality properties in major cities with modest leverage and returns derived mainly from rental income. This strategy is best described as:","o":["core.","value-add.","opportunistic."],"a":0,"e":"The core strategy targets high-quality, well-leased assets with low leverage, whose return comes mainly from rents. Value-add seeks to create value through renovation or repositioning, and opportunistic takes high risks (development, high debt, distressed assets), aiming mainly for capital gains.","d":2,"t":"Real estate strategies","c":"Real estate strategies, from lowest to highest risk: core (stabilized, fully leased, low leverage, income-driven), core-plus, value-add (renovation, repositioning, leasing up) and opportunistic (development, high leverage, distressed assets, return from appreciation)."},{"r":4,"q":"Which type of real estate index is most likely to suffer from a lag in reflecting changes in market conditions and to understate volatility?","o":["A REIT index.","An appraisal-based index.","A repeat-sales transaction-based index."],"a":1,"e":"Appraisal-based indexes rely on infrequent valuations anchored on the past: they react with a lag and smooth volatility. REIT indexes reflect market prices continuously (with even higher volatility). Repeat-sales indexes use actual transactions, although they suffer from sample selection bias.","d":3,"t":"Real estate index construction","c":"Real estate indexes: appraisal-based (lagged, smoothed, understate volatility), repeat-sales/transaction-based (actual prices, but sample selection bias) and REIT indexes (real-time market prices, reflect public market sentiment)."},{"r":4,"q":"A toll-free hospital built under a public-private partnership receives fixed payments from the government as long as the facility is maintained and available for use. These revenues are best described as:","o":["user fees, which expose the investor to demand risk.","regulated tariffs, which are set by an independent regulator based on usage.","availability payments, which limit demand risk for the investor."],"a":2,"e":"In a PPP, availability payments are made by the public authority as long as the asset is available, regardless of usage: the investor therefore does not bear demand risk. Tolls/user fees expose the investor to volume risk, and regulated tariffs apply mainly to utilities.","d":1,"t":"Availability payments in infrastructure","c":"Infrastructure revenue models: availability payments (fixed payments from the public sector for keeping the asset available, no demand risk), user-based/toll revenue (exposed to demand/volume risk), and regulated returns (utilities with tariffs set by a regulator)."},{"r":5,"q":"Over one year, the spot price of a commodity rises from USD 80 to USD 84. An investor holding a fully collateralized long futures position earns a roll yield of -1.5% and a collateral return of 3.0%. The total return is closest to:","o":["5.0%.","6.5%.","9.5%."],"a":1,"e":"Spot return = 84/80 − 1 = 5.0%; total return = spot + roll yield + collateral = 5.0% − 1.5% + 3.0% = 6.5%. 5.0% keeps only the change in the spot price. 9.5% wrongly treats the negative roll yield as a gain.","d":2,"t":"Commodity futures total return","c":"Total return on a fully collateralized commodity futures position = spot (price) return + roll return + collateral return (interest earned on the margin/collateral)."},{"r":5,"q":"An investor rolls a long futures position by closing the expiring contract at USD 50 and buying the next contract at USD 52. Using roll return = (expiring contract price - new contract price) / expiring contract price, the roll return is closest to:","o":["+4.00%.","-3.85%.","-4.00%."],"a":2,"e":"Roll return = (50 − 52)/50 = −4.00%. The market is in contango (the deferred contract is more expensive), so rolling is negative for a long position: +4% reverses the sign. −3.85% wrongly divides by the price of the new contract (2/52).","d":2,"t":"Roll yield in contango","c":"Roll return arises when an expiring futures contract is replaced with a longer-dated one: roll return = (price of expiring contract − price of new contract) / price of expiring contract. Negative in contango, positive in backwardation for long positions."},{"r":5,"q":"A commodity futures market in which futures prices are below the spot price is said to be in:","o":["contango, which generates a positive roll yield for long positions.","backwardation, which generates a negative roll yield for long positions.","backwardation, which generates a positive roll yield for long positions."],"a":2,"e":"In backwardation, futures prices are below the spot price: when rolling, the long investor sells the expiring contract at a higher price than it pays for the next one, hence a positive roll yield. Contango is the opposite situation (futures above spot), with a negative roll yield for long positions.","d":1,"t":"Backwardation","c":"Contango: futures prices above spot (upward-sloping curve, typical when storage and financing costs dominate), negative roll yield for longs. Backwardation: futures prices below spot (often when convenience yield is high or supply is tight), positive roll yield for longs."},{"r":5,"q":"A commodity has a spot price of USD 70. The annual risk-free rate is 5%, annual storage costs are USD 1.50, and the annual convenience yield is USD 2.00 (both in dollar terms, paid/received at year-end). The no-arbitrage one-year futures price is closest to:","o":["USD 77.00.","USD 69.50.","USD 73.00."],"a":2,"e":"F = S × (1 + r) + storage costs − convenience yield = 70 × 1.05 + 1.50 − 2.00 = USD 73.00. 77.00 wrongly adds the convenience yield, which lowers the futures price because it benefits the holder of the physical commodity. 69.50 forgets the financing cost (70 + 1.50 − 2.00).","d":3,"t":"Cost of carry futures pricing","c":"Commodity futures pricing: futures price ≈ spot price × (1 + risk-free rate) + storage costs − convenience yield. Financing and storage costs push futures above spot; the convenience yield of holding the physical good pushes them below."},{"r":5,"q":"A key advantage of timberland over farmland as an investment is that:","o":["it produces income every year regardless of prices.","its returns are unaffected by commodity prices.","harvesting can be delayed when timber prices are low, because trees continue to grow."],"a":2,"e":"Timber can be 'stored on the stump': if prices are low, the owner postpones harvesting and the trees keep growing, which creates a timing option. Agricultural crops, on the contrary, must be harvested when ripe. Timber income is not annual and does depend on timber prices.","d":1,"t":"Timberland flexibility","c":"Timberland vs farmland: timber offers flexibility in harvest timing (trees can be left to grow when prices are low), whereas crops must be harvested at maturity. Both provide land appreciation, income and some inflation protection."},{"r":5,"q":"Which of the following return sources is unique to timberland compared with most other real assets?","o":["Changes in the price of the underlying commodity.","Changes in the value of the land.","Biological growth of the trees."],"a":2,"e":"Biological growth increases the volume of timber regardless of prices: it is a return source specific to forests. Changes in the product (timber) price and in land value also exist for farmland and other real assets, so they are not specific.","d":2,"t":"Timberland return drivers","c":"Timberland returns come from three sources: biological growth (unique to timber, independent of prices), changes in timber prices, and changes in land value."},{"r":5,"q":"An investor seeks commodity exposure by buying shares of mining and energy companies rather than commodity futures. The most likely drawback of this approach is that the investment:","o":["requires physical storage and insurance of the commodities.","is exposed to negative roll yield when futures markets are in contango.","is significantly correlated with the overall equity market and affected by company-specific factors."],"a":2,"e":"Producer equities replicate commodity prices only imperfectly: they are correlated with the equity market and sensitive to company management, hedging and capital structure. Physical storage concerns direct holding, and roll yield concerns futures positions, not equities.","d":2,"t":"Commodity-producer equities","c":"Ways to gain commodity exposure: physical holdings (storage and insurance costs), futures (roll and collateral returns), commodity ETFs/ETNs, and equities of commodity producers (indirect exposure diluted by equity market, operating and hedging effects)."},{"r":5,"q":"Commodities are often included in diversified portfolios primarily because their returns:","o":["provide a steady stream of cash income.","tend to be positively correlated with unexpected inflation.","are highly correlated with bond returns."],"a":1,"e":"Commodity prices are components of inflation: they tend to rise when inflation surprises on the upside, making commodities a hedge against unexpected inflation. They pay no income stream (apart from collateral), and tend to have low or even negative correlation with bonds during inflationary periods.","d":1,"t":"Commodities as inflation hedge","c":"Commodities are used in portfolios mainly for diversification (low correlation with stocks and bonds) and as a hedge against unexpected inflation, since commodity prices feed directly into inflation measures; they generate no cash flows of their own."},{"r":6,"q":"A hedge fund strategy that holds long and short equity positions of similar size and beta so that the portfolio's exposure to overall market movements is close to zero is best described as:","o":["long/short equity with a net long bias.","equity market neutral.","global macro."],"a":1,"e":"Market neutral balances long and short positions to achieve a beta close to zero: performance comes from security selection. A long-biased long/short fund keeps positive net market exposure. Global macro takes directional bets on broad variables (rates, currencies, indexes).","d":1,"t":"Equity market neutral","c":"Equity hedge strategies: market neutral (net beta ≈ 0, return from stock selection), fundamental long/short (variable net exposure, often long-biased), short bias, and quantitative directional. Global macro and managed futures take top-down directional positions across asset classes."},{"r":6,"q":"Company X announces it will acquire Company Y in an all-stock transaction. A merger arbitrage hedge fund would most likely:","o":["buy shares of Company Y and short shares of Company X.","buy shares of Company X and short shares of Company Y.","buy shares of both companies to benefit from synergies."],"a":0,"e":"In a stock offer, the arbitrageur buys the target (Y), which trades below the offer price, and short sells the acquirer (X) according to the exchange ratio to hedge price risk. It thus captures the spread if the deal closes. The other two positions do not exploit this spread or are exposed to market risk.","d":2,"t":"Merger arbitrage positioning","c":"Merger arbitrage (event-driven): in a stock-for-stock deal, buy the target and short the acquirer in the exchange ratio; in a cash deal, simply buy the target. The profit is the deal spread, and the main risk is deal failure."},{"r":6,"q":"An acquirer offers 0.8 of its shares for each share of a target company. The acquirer's shares trade at USD 60 and the target's shares trade at USD 45. If the deal closes at these prices, the merger arbitrage gross return on the target position is closest to:","o":["6.25%.","5.00%.","6.67%."],"a":2,"e":"Offer value = 0.8 × 60 = USD 48; spread = 48 − 45 = USD 3; return = 3/45 ≈ 6.67%. 6.25% wrongly divides the spread by the offer price (3/48), and 5.00% by the acquirer's price (3/60). The return is calculated on the price paid for the target.","d":3,"t":"Merger arbitrage spread","c":"Merger arbitrage spread = offer value per target share (exchange ratio × acquirer price, or cash offer) − target price; the potential return if the deal closes = spread / target's current price."},{"r":6,"q":"A convertible bond arbitrage strategy typically involves:","o":["shorting convertible bonds and buying the issuer's common stock.","buying convertible bonds and shorting the issuer's common stock.","buying convertible bonds and buying put options on government bonds."],"a":1,"e":"Convertible arbitrage buys the convertible bond, deemed undervalued (cheap conversion option), and sells the underlying stock to hedge equity (delta) risk. The opposite strategy does not capture the undervaluation, and the third does not hedge the security's equity risk.","d":2,"t":"Convertible bond arbitrage","c":"Convertible bond arbitrage: buy convertible bonds whose embedded option is underpriced and short the underlying stock (delta hedge), profiting from mispricing, volatility and carry while staying hedged against equity price moves."},{"r":6,"q":"A hedge fund strategy that relies on systematic, trend-following models to trade futures across commodities, currencies, interest rates, and equity indexes is best described as:","o":["managed futures (CTA).","fixed-income arbitrage.","distressed securities."],"a":0,"e":"CTAs/managed futures use systematic, often trend-following models on liquid futures across all asset classes. Fixed income arbitrage exploits valuation gaps between rate instruments, and the distressed strategy buys the debt of troubled companies.","d":1,"t":"Managed futures","c":"Macro strategies: global macro (discretionary top-down bets on rates, currencies, equity indexes, commodities) and managed futures/CTAs (mostly systematic trend-following in liquid futures). Relative value strategies (fixed income or convertible arbitrage) exploit pricing discrepancies."},{"r":6,"q":"An investor allocates USD 100 to a fund of funds (FoF) that charges 1% management fee on beginning assets and a 10% incentive fee on gains net of its management fee. The FoF invests in a single hedge fund that charges 2% on beginning assets and 20% on gains net of management fee. If the hedge fund earns 20% gross, the investor's net return is closest to:","o":["14.40%.","12.06%.","11.70%."],"a":1,"e":"Underlying fund: 120 − 2 − 20% × (120 − 100 − 2) = 114.4. FoF: management fee 1; incentive fee = 10% × (114.4 − 100 − 1) = 1.34; ending value = 114.4 − 1 − 1.34 = 112.06, i.e., 12.06%. 14.40% ignores the FoF fee layer; 11.70% computes the underlying fund's incentive fee without deducting the management fee (20% × 20).","d":3,"t":"Fund of funds fees","c":"Funds of funds offer diversification, manager selection and access to closed funds, but add a second layer of fees: compute the underlying fund's net return first, then apply the FoF's own management and incentive fees to that net result."},{"r":6,"q":"A hedge fund provision that allows the manager to limit the amount of redemptions during a period of heavy withdrawal requests is a:","o":["gate.","lockup period.","redemption notice period."],"a":0,"e":"A gate lets the manager cap redemptions over a given period when requests are heavy. A lockup period prohibits any redemption for an initial period after investment, and a redemption notice period requires the investor to inform the manager some time before withdrawing funds.","d":2,"t":"Hedge fund liquidity terms","c":"Hedge fund liquidity terms: lockup period (no redemptions for an initial period), notice period (advance notice required), redemption frequency, redemption fees, and gates (limit on total redemptions in a period); side pockets segregate illiquid assets."},{"r":6,"q":"A hedge fund has USD 100 million of equity capital and borrows USD 50 million at 5% to invest USD 150 million in a strategy that returns 10% for the year. Ignoring fees, the return on the fund's equity is closest to:","o":["10.0%.","15.0%.","12.5%."],"a":2,"e":"Gain on assets = 10% × 150 = 15 million; borrowing cost = 5% × 50 = 2.5 million; return on equity = (15 − 2.5)/100 = 12.5%. 10% ignores leverage, and 15% forgets the financing cost. Leverage magnifies the return as long as the strategy earns more than the cost of debt.","d":3,"t":"Leverage and hedge fund returns","c":"Leveraged return = [r × (equity + borrowing) − borrowing cost × borrowing] / equity = r + (borrowed / equity) × (r − cost of debt). Leverage amplifies both gains and losses and can trigger margin calls."},{"r":7,"q":"A distributed ledger network in which anyone can participate, view the records, and validate transactions without approval from a central authority is best described as:","o":["permissionless.","permissioned.","centralized."],"a":0,"e":"A permissionless network (e.g., Bitcoin) is open to everyone, including for validating transactions. A permissioned network restricts participation to authorized parties, often within a consortium. A centralized ledger is kept by a single entity, the opposite of a distributed ledger.","d":1,"t":"Permissioned vs permissionless ledger","c":"Distributed ledger technology: permissionless networks are open to anyone to join, view and validate; permissioned networks restrict access or validation rights to approved participants. Both replace a single central record-keeper with a shared, synchronized ledger."},{"r":7,"q":"Compared with a proof-of-work consensus mechanism, a proof-of-stake mechanism most likely:","o":["selects validators based on the amount of tokens they commit, using far less energy.","requires miners to solve computationally intensive puzzles.","makes a 51% attack impossible."],"a":0,"e":"In proof of stake, validators are chosen according to the tokens they put at stake, which consumes far less energy. Solving intensive computations characterizes proof of work. Proof of stake does not eliminate majority attack risk: it only makes such an attack costly (one must control the majority of the tokens).","d":2,"t":"Proof of work vs proof of stake","c":"Consensus mechanisms: proof of work (miners solve computationally intensive puzzles, energy-heavy, secure through computing cost) vs proof of stake (validators chosen in proportion to tokens staked, energy-efficient, secured by the economic cost of acquiring the majority of the stake)."},{"r":7,"q":"A digital asset designed to maintain a stable value by being pegged to a fiat currency or backed by reserve assets is best described as a:","o":["non-fungible token.","central bank digital currency.","stablecoin."],"a":2,"e":"A stablecoin targets a stable value by being backed by a fiat currency, reserve assets or an algorithm. An NFT is a unique, non-interchangeable token. A CBDC is issued directly by a central bank and is a claim on it, which is not the case for private stablecoins.","d":1,"t":"Stablecoins","c":"Types of digital assets: cryptocurrencies (native tokens such as bitcoin), stablecoins (pegged to fiat or backed by reserves), central bank digital currencies (issued by and a claim on a central bank), NFTs (unique tokens) and security/governance tokens."},{"r":7,"q":"Which of the following best describes a non-fungible token (NFT)?","o":["A unique digital token recorded on a blockchain that represents ownership of a specific asset and is not interchangeable with other tokens.","A token whose units are interchangeable and used primarily as a medium of exchange.","A token that gives holders voting rights over a decentralized protocol."],"a":0,"e":"An NFT is unique: each token has its own characteristics and cannot be exchanged one-for-one for another, which makes it possible to represent ownership of a specific asset (digital artwork, tokenized object). Interchangeable tokens are fungible (cryptocurrencies), and voting rights belong to governance tokens.","d":2,"t":"Non-fungible tokens","c":"Fungible tokens are interchangeable units (one bitcoin equals any other bitcoin); non-fungible tokens are unique and indivisible, used to prove ownership of a specific digital or tokenized physical asset."},{"r":7,"q":"An institutional investor wants exposure to digital asset prices without managing private keys or wallets directly. Which of the following investments is most appropriate?","o":["A regulated exchange-traded product holding cryptocurrencies.","Purchasing tokens on a cryptocurrency exchange and holding them in a self-custodied wallet.","Running a validator node and staking tokens."],"a":0,"e":"A regulated ETP/ETF holding crypto assets provides price exposure without the investor having to manage private keys: custody is handled by the product's custodian. Direct purchase with self-custody and running a validator node both involve key management and operational risks.","d":2,"t":"Indirect digital asset exposure","c":"Digital asset exposure can be direct (buying coins, self-custody or exchange custody, staking, mining) or indirect (crypto ETPs/ETFs, futures, equities of crypto-related firms, funds); indirect routes avoid key management but add fees and tracking differences."},{"r":7,"q":"An investor holds 10 tokens bought at USD 2,000 each. Over the year, the investor earns a staking reward of 4% paid in additional tokens, while the token price falls to USD 1,900. The investor's total return for the year is closest to:","o":["-1.00%.","-1.20%.","-5.00%."],"a":1,"e":"Initial value = 10 × 2,000 = USD 20,000; final tokens = 10 × 1.04 = 10.4; final value = 10.4 × 1,900 = USD 19,760; return = 19,760/20,000 − 1 = −1.20%. −1.00% simply adds −5% and +4%, forgetting that the reward is paid in tokens that have also lost 5%. −5.00% ignores the staking reward.","d":3,"t":"Staking return calculation","c":"When income is paid in units of the asset itself (staking rewards, stock dividends), the total return compounds: (1 + growth in units) × (1 + price return) − 1, rather than the simple sum of the two."},{"r":7,"q":"Self-executing code stored on a blockchain that automatically carries out the terms of an agreement when predefined conditions are met is called a:","o":["consensus mechanism.","smart contract.","hash function."],"a":1,"e":"A smart contract is a program stored on the blockchain that executes automatically when the specified conditions are met; it is the foundation of decentralized finance (DeFi). The consensus mechanism is used to validate blocks, and the hash function produces a unique fingerprint of data to guarantee its integrity.","d":2,"t":"Smart contracts and DeFi","c":"Blockchain building blocks: blocks of transactions linked by cryptographic hashes, a consensus mechanism to validate them, and smart contracts (self-executing code) that automate agreements and enable DeFi applications."},{"r":7,"q":"Which of the following is least likely a risk specific to investing directly in cryptocurrencies?","o":["Credit risk from the issuer failing to make coupon payments.","Permanent loss of assets if private keys are lost or stolen.","Regulatory uncertainty regarding the legal status of the assets."],"a":0,"e":"Cryptocurrencies such as bitcoin have no issuer promising cash flows: there are therefore neither coupons nor issuer credit risk. By contrast, loss or theft of private keys leads to permanent loss of the assets, and regulatory uncertainty is a major risk for this asset class.","d":3,"t":"Digital asset risks","c":"Key risks of direct crypto investing: extreme price volatility, no intrinsic cash flows (hard to value), custody risk (lost or stolen private keys are unrecoverable), exchange/counterparty failure, fraud and manipulation, and regulatory uncertainty."}]},{"subject":9,"questions":[{"r":1,"q":"An investor buys a share for $50.00, receives a dividend of $1.50 during the year, and sells the share at year-end for $54.00. The holding period return is closest to:","o":["11.0%","8.0%","3.0%"],"a":0,"e":"HPR = (P1 − P0 + D) / P0 = (54 − 50 + 1.50) / 50 = 11.0%. 8.0% ignores the dividend (capital gain return only), and 3.0% keeps only the dividend yield.","d":1,"t":"Holding period return","c":"Holding period return = (ending price − beginning price + income received) / beginning price. It is the sum of the capital gain yield and the income (dividend) yield."},{"r":1,"q":"A fund earned annual returns of 15%, −10%, and 20% over three consecutive years. The fund's geometric mean annual return is closest to:","o":["8.33%","7.49%","8.07%"],"a":1,"e":"Geometric mean = (1.15 × 0.90 × 1.20)^(1/3) − 1 = 1.242^(1/3) − 1 = 7.49%. 8.33% is the arithmetic mean (always ≥ the geometric mean), and 8.07% simply divides the cumulative return of 24.2% by 3, which ignores compounding.","d":2,"t":"Geometric mean return","c":"Geometric mean return = [(1 + R1)(1 + R2)...(1 + Rn)]^(1/n) − 1; it measures compound growth and is always ≤ the arithmetic mean, the gap widening with return volatility."},{"r":1,"q":"An investor buys one share at $100 at t = 0. At t = 1 the share price is $120 and the investor buys a second share. At t = 2 the investor sells both shares at $114 each. No dividends are paid. The investor's annual money-weighted return is closest to:","o":["6.77%","3.64%","2.48%"],"a":2,"e":"The MWR is the IRR of the cash flows: −100 − 120/(1+r) + 228/(1+r)² = 0, giving r ≈ 2.48%. 6.77% is the time-weighted return [(1.20 × 0.95)^0.5 − 1], which neutralizes the effect of the timing of contributions; 3.64% simply compares 228 with the 220 invested without accounting for time. The MWR is below the TWR because the investor invested more just before the decline in the second period.","d":3,"t":"Money-weighted return","c":"Money-weighted return = IRR of all portfolio cash flows (affected by the size and timing of contributions and withdrawals); time-weighted return = geometric linking of sub-period returns (unaffected by cash flows), the preferred measure of a manager's performance."},{"r":1,"q":"A portfolio is invested 60% in Asset X (standard deviation 20%) and 40% in Asset Y (standard deviation 30%). The correlation between the two assets' returns is 0.30. The portfolio's standard deviation is closest to:","o":["24.00%","19.35%","16.97%"],"a":1,"e":"σp² = 0.6² × 0.20² + 0.4² × 0.30² + 2 × 0.6 × 0.4 × 0.30 × 0.20 × 0.30 = 0.0144 + 0.0144 + 0.00864 = 0.03744, so σp = 19.35%. 24.00% is the weighted average of the standard deviations (valid only if ρ = 1), and 16.97% omits the covariance term (case ρ = 0).","d":2,"t":"Two-asset portfolio risk","c":"Two-asset portfolio variance: σp² = w1²σ1² + w2²σ2² + 2w1w2ρ12σ1σ2. Unless ρ = 1, portfolio standard deviation is below the weighted average of individual standard deviations: this is the diversification benefit."},{"r":1,"q":"An investor has a risk aversion coefficient A = 4 and uses the utility function U = E(r) − 0.5 × A × σ². Which portfolio should the investor select?\nPortfolio X: E(r) = 12%, σ = 20%\nPortfolio Y: E(r) = 9%, σ = 12%\nPortfolio Z: E(r) = 15%, σ = 25%","o":["Portfolio X","Portfolio Z","Portfolio Y"],"a":2,"e":"U(X) = 0.12 − 0.5 × 4 × 0.04 = 4.00%; U(Y) = 0.09 − 0.5 × 4 × 0.0144 = 6.12%; U(Z) = 0.15 − 0.5 × 4 × 0.0625 = 2.50%. Y maximizes utility. Choosing Z amounts to looking only at expected return, and X ignores the heavy variance penalty for an investor with A = 4.","d":2,"t":"Utility and risk aversion","c":"Mean-variance utility: U = E(r) − 0.5 × A × σ², with σ² as a decimal variance. A higher risk aversion coefficient A means a larger penalty for risk; the investor selects the portfolio with the highest utility."},{"r":1,"q":"Compared with a less risk-averse investor, a more risk-averse investor's indifference curves in expected return–standard deviation space are most likely:","o":["steeper","flatter","horizontal"],"a":0,"e":"A more risk-averse investor requires a larger increase in expected return for each additional unit of risk: their indifference curves are therefore steeper. Flatter curves characterize a less risk-averse investor; horizontal curves correspond to a risk-neutral investor (A = 0).","d":1,"t":"Indifference curves","c":"Indifference curves link portfolios of equal utility; for a risk-averse investor they slope upward and are convex. The more risk-averse the investor, the steeper the curves; a risk-neutral investor's curves are flat and a risk seeker's slope downward."},{"r":1,"q":"The risk-free rate is 3% and the optimal risky portfolio has an expected return of 11% and a standard deviation of 20%. An investor wants a complete portfolio on the capital allocation line with a standard deviation of 12%. The expected return of the complete portfolio is closest to:","o":["6.6%","6.2%","7.8%"],"a":2,"e":"Weight in the risky portfolio = 12% / 20% = 0.60. E(Rc) = 3% + 0.60 × (11% − 3%) = 7.8%. 6.6% (0.60 × 11%) forgets the 40% invested at the risk-free rate; 6.2% mistakenly applies the 40% weight to the risk premium.","d":2,"t":"Capital allocation line","c":"Capital allocation line: combining the risk-free asset with a risky portfolio P gives σc = y × σp and E(Rc) = rf + y × [E(Rp) − rf], i.e., E(Rc) = rf + [(E(Rp) − rf)/σp] × σc, where the slope is the Sharpe ratio of P."},{"r":1,"q":"The risky portfolio has an expected return of 11% and a standard deviation of 20%; the risk-free rate is 3%. For an investor with a risk aversion coefficient of 3 (using U = E(r) − 0.5Aσ²), the optimal proportion of wealth invested in the risky portfolio is closest to:","o":["66.7%","133.3%","13.3%"],"a":0,"e":"Optimal weight y* = [E(Rp) − rf] / (A × σ²) = 0.08 / (3 × 0.04) = 66.7%. 133.3% results from using 0.5A in the denominator (the 0.5 disappears when differentiating), and 13.3% uses the standard deviation instead of the variance.","d":3,"t":"Optimal capital allocation","c":"The optimal allocation to the risky portfolio on the CAL is y* = [E(Rp) − rf] / (A × σp²): it increases with the risk premium and decreases with risk aversion and variance."},{"r":2,"q":"The risk-free rate is 2.5%, the expected market return is 8.5%, and a stock's beta is 1.3. Using the CAPM, the stock's expected return is closest to:","o":["13.55%","10.30%","11.05%"],"a":1,"e":"E(Ri) = rf + β × [E(Rm) − rf] = 2.5% + 1.3 × (8.5% − 2.5%) = 10.30%. 13.55% applies beta to the total market return instead of the risk premium; 11.05% additionally omits the risk-free rate.","d":1,"t":"CAPM expected return","c":"CAPM: E(Ri) = rf + βi × [E(Rm) − rf]. The expected return equals the risk-free rate plus beta times the market risk premium; only systematic risk (beta) is priced."},{"r":2,"q":"The covariance between a stock's returns and the market's returns is 0.018, and the standard deviation of market returns is 15%. The stock's beta is closest to:","o":["0.80","0.12","1.25"],"a":0,"e":"β = Cov(i,m) / σm² = 0.018 / 0.15² = 0.018 / 0.0225 = 0.80. 0.12 divides by the standard deviation instead of the variance, and 1.25 inverts the ratio.","d":1,"t":"Beta from covariance","c":"Beta measures systematic risk: βi = Cov(Ri, Rm) / σm². The market has a beta of 1; beta > 1 means the asset amplifies market moves."},{"r":2,"q":"A stock has a standard deviation of returns of 30% and a correlation with the market of 0.60. The market's standard deviation is 18%. The stock's beta is closest to:","o":["0.36","1.00","0.60"],"a":1,"e":"β = ρ × σi / σm = 0.60 × 30% / 18% = 1.00. 0.36 inverts the standard deviations (ρ × σm / σi), and 0.60 confuses correlation with beta, which also depends on the ratio of volatilities.","d":2,"t":"Beta from correlation","c":"Equivalent beta formula: βi = ρi,m × σi / σm, since Cov(i,m) = ρ × σi × σm. Beta combines the correlation with the market and the asset's relative volatility."},{"r":2,"q":"A portfolio has a return of 12%, a standard deviation of 18%, and a beta of 1.2. The risk-free rate is 3%. The portfolio's Treynor ratio is closest to:","o":["0.50","10.00%","7.50%"],"a":2,"e":"Treynor = (Rp − rf) / βp = (12% − 3%) / 1.2 = 7.50%. 0.50 is the Sharpe ratio (premium divided by σ = 9%/18%), and 10.00% forgets to subtract the risk-free rate.","d":2,"t":"Treynor ratio","c":"Risk-adjusted performance measures: Sharpe ratio = (Rp − rf) / σp (total risk); Treynor ratio = (Rp − rf) / βp (systematic risk). Treynor is appropriate for well-diversified portfolios."},{"r":2,"q":"A portfolio with a beta of 1.1 earned 14% last year. Over the same period the market returned 10% and the risk-free rate was 3%. The portfolio's Jensen's alpha is closest to:","o":["4.0%","3.3%","3.0%"],"a":1,"e":"Required return (CAPM) = 3% + 1.1 × (10% − 3%) = 10.7%; α = 14% − 10.7% = 3.3%. 4.0% compares with the market without adjusting for beta; 3.0% applies beta to the total market return and forgets the risk-free rate.","d":2,"t":"Jensen's alpha","c":"Jensen's alpha = Rp − [rf + βp × (Rm − rf)]: the return earned above (or below) what the CAPM requires for the portfolio's beta. A positive alpha indicates superior risk-adjusted performance."},{"r":2,"q":"A portfolio returned 11% with a standard deviation of 25%. The market returned 9% with a standard deviation of 20%, and the risk-free rate was 3%. The portfolio's M-squared (M²) alpha relative to the market is closest to:","o":["2.0%","4.0%","0.4%"],"a":2,"e":"Portfolio Sharpe ratio = (11% − 3%)/25% = 0.32. M² = rf + Sp × σm − Rm = 3% + 0.32 × 20% − 9% = 0.4%. 2.0% compares raw returns without adjusting for risk; 4.0% multiplies the premium by σp/σm instead of σm/σp (increasing leverage instead of reducing it).","d":3,"t":"M-squared","c":"M-squared (M²) rescales the portfolio to the market's volatility: M² = (Rp − rf) × (σm/σp) + rf − Rm = Sharpe ratio × σm + rf − Rm. It ranks portfolios like the Sharpe ratio but expresses the result as a return difference versus the market."},{"r":2,"q":"According to the capital asset pricing model, investors holding well-diversified portfolios are compensated for bearing:","o":["systematic risk only","total risk","unsystematic risk only"],"a":0,"e":"Unsystematic (specific) risk can be eliminated at no cost through diversification: the market therefore does not reward it. Only systematic risk, measured by beta, earns a premium; total risk includes a diversifiable portion that is not rewarded.","d":1,"t":"Systematic vs unsystematic risk","c":"Total risk = systematic (market, non-diversifiable) risk + unsystematic (firm-specific, diversifiable) risk. In equilibrium, investors are compensated only for systematic risk, measured by beta."},{"r":2,"q":"An analyst forecasts a 13% return for a stock with a beta of 1.4. The risk-free rate is 3% and the expected market return is 9%. Based on the security market line, the stock is best described as:","o":["overvalued, because its forecast return is below its required return of 15.6%","fairly valued, because its forecast return exceeds the expected market return","undervalued, because its forecast return exceeds its required return of 11.4%"],"a":2,"e":"Required return = 3% + 1.4 × (9% − 3%) = 11.4%. The 13% forecast lies above the SML: the stock is undervalued (positive alpha). 15.6% applies beta to the total market return; comparing with the market return ignores beta.","d":2,"t":"Security market line","c":"Security market line: plots CAPM required return against beta. An asset whose forecast return plots above the SML is undervalued (positive alpha); below the SML, overvalued; on the SML, fairly priced."},{"r":3,"q":"In the portfolio management process, the investment policy statement (IPS) is developed during the:","o":["planning step","execution step","feedback step"],"a":0,"e":"Drafting the IPS is part of the planning step (understanding the client, setting objectives and constraints). Execution covers asset allocation, security analysis and portfolio construction; feedback covers monitoring, rebalancing and performance measurement.","d":1,"t":"Portfolio management process","c":"The portfolio management process has three steps: planning (understand the client, write the IPS, set capital market expectations), execution (asset allocation, security analysis, portfolio construction) and feedback (monitoring, rebalancing, performance evaluation)."},{"r":3,"q":"In a defined benefit pension plan, the investment risk is borne primarily by the:","o":["plan participants (employees)","plan sponsor (employer)","plan's investment consultant"],"a":1,"e":"In a defined benefit plan, the employer commits to a future pension level: if assets underperform, the employer must cover the shortfall. In a defined contribution plan, on the contrary, the employee bears the risk; the consultant bears no investment risk.","d":1,"t":"Defined benefit vs defined contribution","c":"Defined benefit plans promise a specified pension, so the sponsor (employer) bears investment risk; defined contribution plans specify contributions only, so the employee bears investment risk and the outcome depends on returns."},{"r":3,"q":"Which type of institutional investor typically has the shortest investment horizon and the highest liquidity needs?","o":["Banks","University endowments","Defined benefit pension plans with a young workforce"],"a":0,"e":"Banks must be able to meet depositor withdrawals: short horizon and high liquidity needs, hence a preference for short-term liquid securities. Endowments have a quasi-perpetual horizon, and a pension fund with young employees has a long horizon and few liquidity needs.","d":2,"t":"Institutional investor needs","c":"Institutional investor profiles: banks (short horizon, high liquidity needs, liability-driven), insurers (life: long horizon; property & casualty: shorter, higher liquidity), pension funds (horizon depends on workforce age), endowments and foundations (very long horizon, low liquidity needs), sovereign wealth funds (long horizon)."},{"r":3,"q":"The average standard deviation of the individual securities in a portfolio is 30%, while the standard deviation of an equally weighted portfolio of those securities is 18%. The diversification ratio is closest to:","o":["1.67","0.60","0.40"],"a":1,"e":"Diversification ratio = σ of the equally weighted portfolio / average σ of a single security = 18% / 30% = 0.60. The lower it is, the more effective the diversification. 1.67 inverts the ratio, and 0.40 is the risk reduction (1 − ratio), not the ratio itself.","d":2,"t":"Diversification ratio","c":"Diversification ratio = risk of an equally weighted portfolio / average risk of a randomly chosen single security. A lower ratio means greater risk reduction from diversification."},{"r":3,"q":"Which of the following statements best describes a closed-end mutual fund?","o":["Investors buy and redeem shares directly with the fund at net asset value","The number of shares outstanding changes daily as investors invest and redeem","Its shares trade on an exchange and can trade at a premium or discount to net asset value"],"a":2,"e":"A closed-end fund issues a fixed number of shares, which then trade on an exchange between investors at a price that can deviate from NAV (premium or discount). Direct subscriptions/redemptions at NAV and a daily change in the number of shares characterize an open-end fund.","d":1,"t":"Open-end vs closed-end funds","c":"Open-end funds issue and redeem shares at NAV, so the number of shares varies; closed-end funds have a fixed number of shares traded on an exchange, potentially at a premium or discount to NAV. ETFs trade on exchanges but use creation/redemption to keep prices close to NAV."},{"r":3,"q":"Compared with traditional open-end mutual funds, exchange-traded funds (ETFs) are typically more tax efficient because:","o":["ETFs are legally exempt from capital gains taxation","redemptions are usually made in kind, so the fund does not have to sell securities and realize capital gains","ETFs must distribute all realized capital gains to investors daily"],"a":1,"e":"ETFs generally redeem their shares in kind (a basket of securities delivered to authorized participants), which spares the fund from selling securities and realizing taxable capital gains for the remaining holders. They enjoy no statutory exemption, and no daily distribution requirement exists.","d":3,"t":"ETF tax efficiency","c":"ETF creation/redemption mechanism: authorized participants exchange baskets of securities for ETF shares (in kind). This keeps the ETF price close to NAV and improves tax efficiency, since the fund rarely has to sell securities to meet redemptions."},{"r":3,"q":"Which of the following is least likely a recent trend in the asset management industry?","o":["Growth of passive investing","Increasing use of big data and alternative data in the investment process","Rising average management fees for actively managed funds"],"a":2,"e":"The industry is seeing strong growth in passive management, which puts downward pressure on active management fees, as well as increasing use of big data and alternative data. A rise in active management fees therefore runs against the observed trends.","d":2,"t":"Asset management industry trends","c":"Key asset management industry trends: growth of passive investing, fee compression for active managers, increasing use of big data, alternative data and AI, rising importance of ESG, and industry consolidation."},{"r":3,"q":"An equally weighted portfolio contains 25 securities. Each security has a standard deviation of 40%, and the average pairwise correlation is 0.30. The portfolio's standard deviation is closest to:","o":["22.9%","21.9%","8.0%"],"a":0,"e":"Average covariance = 0.30 × 0.40² = 0.048. σp² = σ²/n + (n−1)/n × cov = 0.16/25 + 24/25 × 0.048 = 0.0064 + 0.04608 = 0.05248, so σp = 22.9%. 21.9% is the limit as n tends to infinity (square root of the average covariance), and 8.0% assumes uncorrelated securities (σ/√n).","d":3,"t":"Diversification with many assets","c":"Equally weighted portfolio variance: σp² = σ̄²/n + [(n − 1)/n] × average covariance. As n grows, the first (specific) term vanishes and portfolio variance converges to the average covariance, the non-diversifiable risk."},{"r":4,"q":"Which of the following is least likely to be included in an investment policy statement?","o":["The client's return objective and risk tolerance","Liquidity, time horizon, tax, legal and unique constraints","A list of specific securities the manager will purchase"],"a":2,"e":"The IPS sets the objectives (return, risk), constraints and procedures (monitoring, rebalancing, benchmark). The choice of specific securities belongs to execution and depends on market conditions; it has no place in a long-term document like the IPS.","d":1,"t":"Investment policy statement","c":"An IPS typically includes: client description, purpose, duties and responsibilities, procedures to update the IPS, investment objectives (return and risk), constraints (liquidity, time horizon, tax, legal/regulatory, unique circumstances), investment guidelines, evaluation and review, and often a strategic asset allocation. It does not list individual securities."},{"r":4,"q":"A 32-year-old surgeon with a high, stable income, substantial savings, and a 30-year horizon tells her adviser she cannot tolerate any decline in her portfolio's value. Her ability and willingness to take risk are best described as:","o":["above-average ability and below-average willingness","below-average ability and above-average willingness","above-average ability and above-average willingness"],"a":0,"e":"Ability to take risk is objective (long horizon, high and stable income, substantial wealth): here it is above average. Willingness is subjective and, here, low since she refuses any decline. When the two conflict, the adviser generally adopts the more conservative level and tries to educate the client.","d":2,"t":"Ability vs willingness to take risk","c":"Risk tolerance combines ability to take risk (objective: horizon, wealth, income stability, liabilities) and willingness to take risk (subjective, psychological). When they conflict, the more conservative of the two usually prevails, with client education where willingness is the constraint."},{"r":4,"q":"A retiree has a $1,250,000 portfolio and needs to withdraw $75,000 at the end of the coming year to cover living expenses. She wants the portfolio's real value to be maintained, and expected inflation is 3%. Using the multiplicative approach, her required nominal return is closest to:","o":["6.00%","9.18%","9.57%"],"a":1,"e":"Required real return = 75,000 / 1,250,000 = 6.00%. Nominal return = (1.06 × 1.03) − 1 = 9.18%. 6.00% ignores inflation; 9.57% wrongly computes the need on the basis of the post-withdrawal portfolio (75,000 / 1,175,000), whereas the withdrawal takes place at year-end.","d":2,"t":"Required return","c":"Required return = spending need / portfolio value at the start of the period (adjusted for withdrawal timing). To preserve purchasing power, convert a real requirement to nominal multiplicatively: (1 + real) × (1 + inflation) − 1."},{"r":4,"q":"A client instructs her portfolio manager not to invest in companies that produce tobacco or weapons. In an IPS, this restriction is best classified as a:","o":["unique circumstances constraint","legal and regulatory constraint","liquidity constraint"],"a":0,"e":"Ethical or personal exclusions belong to unique circumstances. This is not a legal or regulatory requirement, and it has nothing to do with liquidity needs.","d":1,"t":"IPS constraints","c":"IPS constraints: liquidity, time horizon, tax, legal and regulatory, and unique circumstances (ethical or religious preferences, ESG exclusions, special holdings or personal considerations)."},{"r":4,"q":"An asset allocation reflecting the long-term target weights to asset classes, set to meet the client's objectives and constraints, is best described as:","o":["tactical asset allocation","strategic asset allocation","security selection"],"a":1,"e":"Strategic allocation sets the long-term target weights derived from the IPS. Tactical allocation refers to deliberate temporary deviations from those targets to exploit short-term expectations; security selection concerns choosing securities within an asset class.","d":1,"t":"Strategic asset allocation","c":"Strategic asset allocation = long-term policy weights to asset classes that meet the IPS objectives and constraints; tactical asset allocation = short-term deliberate deviations from those weights; security selection = choices within each asset class."},{"r":4,"q":"A portfolio manager invests only in companies that rank in the top quintile of their industry on environmental, social and governance criteria. This ESG approach is best described as:","o":["negative screening","impact investing","positive (best-in-class) screening"],"a":2,"e":"Selecting the highest-rated companies in their industry is positive screening (best-in-class). Negative screening excludes sectors or companies deemed undesirable, and impact investing seeks a measurable social or environmental impact in addition to a financial return.","d":2,"t":"ESG investment approaches","c":"ESG implementation approaches: negative screening (exclusions), positive/best-in-class screening, ESG integration (ESG factors in fundamental analysis), thematic investing, engagement/active ownership, and impact investing (measurable social or environmental impact plus financial return)."},{"r":4,"q":"A $1,000,000 portfolio has a strategic allocation of 60% equities and 40% bonds, with a rebalancing corridor of ±5 percentage points for equities. Over the following year equities return 25% and bonds return −3%. The manager should most likely:","o":["take no action, because the equity weight of about 64.0% is inside the corridor","sell equities and buy bonds, because the equity weight of about 65.9% is outside the corridor","buy equities, because bonds have underperformed the target allocation"],"a":1,"e":"Equities = 600,000 × 1.25 = 750,000; bonds = 400,000 × 0.97 = 388,000; total = 1,138,000. Equity weight = 750,000 / 1,138,000 = 65.9%, above the 65% limit: the manager must sell equities and buy bonds. Buying equities would move the portfolio even further from its target.","d":3,"t":"Rebalancing corridors","c":"Rebalancing brings the portfolio back toward its strategic weights; under a corridor approach, rebalancing is triggered when an asset class weight moves outside its tolerance band (target ± corridor). It means selling assets that have outperformed and buying those that have lagged."},{"r":4,"q":"When specifying asset classes for strategic asset allocation, a manager should most appropriately ensure that:","o":["each asset class contains assets with low correlations to one another","asset classes overlap so that each security can belong to more than one class","assets within each class are relatively homogeneous and the classes have relatively low correlations with each other"],"a":2,"e":"A well-defined asset class groups homogeneous assets (highly correlated with each other); classes should be mutually exclusive and have low correlation with one another to provide diversification. Weakly correlated assets within the same class or overlapping classes would make the allocation inefficient and confusing.","d":3,"t":"Specifying asset classes","c":"Criteria for specifying asset classes: assets within a class should be similar (high internal correlation), classes should be mutually exclusive, and correlations between classes should be relatively low so that each adds diversification."},{"r":5,"q":"Which of the following is best classified as an emotional bias?","o":["Loss aversion","Anchoring and adjustment","Mental accounting"],"a":0,"e":"Loss aversion is an emotional bias (based on feelings). Anchoring and mental accounting are cognitive errors of information processing.","d":1,"t":"Cognitive vs emotional biases","c":"Behavioral biases are either cognitive errors (belief perseverance: conservatism, confirmation, representativeness, illusion of control, hindsight; processing errors: anchoring, mental accounting, framing, availability) or emotional biases (loss aversion, overconfidence, self-control, status quo, endowment, regret aversion)."},{"r":5,"q":"An investor refuses to sell a stock that has fallen 40% since purchase, saying he will sell \"once it gets back to what I paid for it.\" This behavior is most consistent with:","o":["confirmation bias","availability bias","loss aversion"],"a":2,"e":"Holding on to a losing stock to avoid realizing a loss (the disposition effect) is a typical manifestation of loss aversion. Confirmation bias means seeking information that supports an existing view; availability bias overweights easily recalled information.","d":1,"t":"Loss aversion","c":"Loss aversion: losses are felt more strongly than equivalent gains, which leads investors to hold losers too long and sell winners too early (disposition effect) and to take excess risk to avoid realizing losses."},{"r":5,"q":"After a company announces a major new contract, an analyst revises her earnings forecast only slightly, placing more weight on her original estimate than on the new information. This is most likely an example of:","o":["conservatism bias","representativeness bias","hindsight bias"],"a":0,"e":"Conservatism bias means sticking to an initial view and underreacting to new information. Representativeness, on the contrary, leads to overreacting by classifying information according to stereotypes; hindsight bias is believing after the fact that an event was predictable.","d":2,"t":"Conservatism bias","c":"Conservatism bias is a belief-perseverance cognitive error: people maintain prior views or forecasts and insufficiently update them in response to new information, leading to slow reactions to news."},{"r":5,"q":"An investor keeps his salary in a conservative \"safe\" account but invests his annual bonus in highly speculative stocks, describing the bonus as \"free money.\" This behavior is best described as:","o":["framing bias","mental accounting bias","illusion of control bias"],"a":1,"e":"Mental accounting means treating money differently depending on its source or intended use, instead of reasoning on the overall portfolio. Framing depends on how a question is presented, and the illusion of control is believing one can influence uncontrollable events.","d":2,"t":"Mental accounting","c":"Mental accounting is a cognitive (information-processing) error in which money is placed in separate mental buckets by source or purpose, leading to portfolios built in layers that ignore correlations and overall risk."},{"r":5,"q":"Compared with emotional biases, cognitive errors are generally:","o":["easier to correct through better information, education, and advice","harder to correct and therefore usually accommodated","based on feelings and impulses rather than faulty reasoning"],"a":0,"e":"Cognitive errors stem from faulty statistical reasoning, information processing or memory: they can often be corrected through information and education (they are moderated). Emotional biases, based on feelings, are harder to correct and are rather accommodated.","d":2,"t":"Correcting biases","c":"Cognitive errors arise from faulty reasoning and are generally easier to correct through education and better information (moderate them); emotional biases stem from feelings and impulses, are harder to correct and are often accommodated in the portfolio."},{"r":5,"q":"A client inherited shares of a utility company from her father. She states that she would not buy those shares at today's price, yet she would demand a substantially higher price than the current market value before agreeing to sell them. This is most consistent with:","o":["status quo bias","endowment bias","regret-aversion bias"],"a":1,"e":"Endowment bias leads people to value an asset they own more than if they did not own it: the selling price demanded exceeds the price they would be willing to pay. Status quo bias reflects simple inertia, without a gap between buying and selling prices; regret aversion concerns the fear of making a decision that turns out badly.","d":3,"t":"Endowment bias","c":"Endowment bias (emotional): people place a higher value on an asset they own than they would pay to acquire it, often for inherited or familiar holdings, leading to failure to sell inappropriate assets."},{"r":5,"q":"An investor attributes the gains in her portfolio to her own stock-picking skill but blames her losses on bad luck and unexpected market events. This behavior is best described as:","o":["illusion of control bias","hindsight bias","self-attribution bias"],"a":2,"e":"Self-attribution bias (a form of overconfidence) means taking credit for successes and blaming failures on external factors. The illusion of control concerns the belief that one can influence outcomes, and hindsight bias the feeling of having 'always known' what would happen.","d":2,"t":"Self-attribution bias","c":"Overconfidence (emotional) includes illusion of knowledge (overestimating one's abilities and information) and self-attribution bias (crediting oneself for successes and blaming others or luck for failures). It leads to under-diversification and excessive trading."},{"r":5,"q":"A client chooses Strategy 1 when told it has \"an 80% probability of meeting your retirement goal\" but rejects the identical strategy when told it has \"a 20% probability of falling short.\" The client is exhibiting:","o":["framing bias, which is an emotional bias","framing bias, which is a cognitive error","anchoring bias, which is a cognitive error"],"a":1,"e":"The decision changes depending on how identical information is presented (gain or loss): this is framing bias, classified by the curriculum among cognitive information-processing errors. Classifying it as emotional is a category error, and anchoring concerns attachment to an initial reference value.","d":3,"t":"Framing bias","c":"Framing bias is a cognitive information-processing error: decisions depend on how a question is posed (e.g., as a gain or a loss, narrow or broad frame) rather than on its substance."},{"r":6,"q":"Risk governance is best described as:","o":["the day-to-day measurement of portfolio risk by the trading desk","the purchase of insurance and derivatives to eliminate all risks","the top-down process and guidance that directs risk management activities, set by the board"],"a":2,"e":"Risk governance is the top-down framework set by the board of directors (risk appetite and tolerance, oversight) that guides all risk management. Day-to-day measurement belongs to execution, and risk management does not aim to eliminate all risks.","d":1,"t":"Risk governance","c":"Risk governance is the top-down process and guidance, led by the board, that sets the organization's risk tolerance and oversees the risk management framework (policies, risk infrastructure, identification, measurement, monitoring and reporting)."},{"r":6,"q":"Which of the following is best classified as a financial risk?","o":["Liquidity risk","Model risk","Operational risk"],"a":0,"e":"Financial risks arise from financial markets: market, credit and liquidity risk. Model risk and operational risk are classified as non-financial risks.","d":1,"t":"Financial vs non-financial risk","c":"Financial risks: market risk (prices, rates, FX, commodities), credit risk and liquidity risk. Non-financial risks: operational, model, settlement, legal, compliance/regulatory, tax, accounting, solvency and others."},{"r":6,"q":"A pension fund buys put options on an equity index to limit losses on its equity holdings. This risk modification method is best described as:","o":["risk transfer","risk acceptance","risk shifting"],"a":2,"e":"Using derivatives to modify the distribution of outcomes is risk shifting. Risk transfer corresponds to insurance (passing the risk to a third party in exchange for a premium); acceptance means retaining the risk (self-insurance, diversification).","d":2,"t":"Risk modification methods","c":"Risk modification methods: risk prevention and avoidance, risk acceptance (self-insurance, diversification), risk transfer (insurance, surety) and risk shifting (derivatives such as options, forwards and swaps that reshape the distribution of outcomes)."},{"r":6,"q":"A company sets aside reserves to cover potential property losses instead of buying an insurance policy. This approach is best described as:","o":["self-insurance, a form of risk acceptance","risk transfer","risk prevention and avoidance"],"a":0,"e":"Building up reserves to absorb losses oneself is self-insurance, which falls under risk acceptance. Risk transfer would require an insurance policy, and avoidance would mean giving up the risk-generating activity.","d":2,"t":"Self-insurance","c":"Self-insurance (setting aside reserves to cover losses internally) is a form of risk acceptance; it is cost-effective when losses are small and predictable, whereas insurance (risk transfer) suits large, low-probability losses."},{"r":6,"q":"A bond portfolio worth $20 million has a modified duration of 6.5. If yields rise by 40 basis points, the approximate change in the portfolio's value is closest to:","o":["−$1,300,000","−$520,000","−$260,000"],"a":1,"e":"ΔV ≈ −Dmod × Δy × V = −6.5 × 0.0040 × 20,000,000 = −$520,000. $1,300,000 uses a 100 bp increase instead of 40 bp, and $260,000 wrongly divides the result by two.","d":2,"t":"Duration as a risk measure","c":"Duration measures interest rate sensitivity: %ΔPrice ≈ −modified duration × Δyield, so ΔValue ≈ −Dmod × Δy × Value. It is a first-order (linear) approximation; convexity improves it for large yield changes."},{"r":6,"q":"A trader holds 5,000 call options, each on one share. The option delta is 0.60. If the underlying share price rises by $2.00, the approximate change in the value of the option position is closest to:","o":["+$6,000","+$10,000","+$4,000"],"a":0,"e":"Change ≈ delta × ΔS × number of options = 0.60 × 2.00 × 5,000 = $6,000. $10,000 ignores delta (assumes a one-for-one change), and $4,000 uses (1 − delta).","d":2,"t":"Delta as a risk measure","c":"Delta measures an option's (or derivative's) sensitivity to the underlying price: ΔOption value ≈ delta × ΔS. Call deltas range from 0 to 1, put deltas from −1 to 0; gamma measures how delta changes."},{"r":6,"q":"A portfolio has a one-day 5% value at risk (VaR) of $2 million. Which interpretation is most accurate?","o":["The expected loss on the worst 5% of trading days is $2 million","Losses are expected to exceed $2 million on about 5% of trading days, but VaR does not indicate how large those losses could be","Losses will be no greater than $2 million on about 5% of trading days"],"a":1,"e":"A one-day 5% VaR of $2 million means that on about 5% of days the loss should be at least $2 million; it says nothing about the size of losses in the tail of the distribution. The average loss on the worst 5% of days is the CVaR (expected shortfall), and the statement 'no greater than' inverts the probability.","d":3,"t":"Value at risk","c":"Value at risk is the minimum loss expected with a given probability over a given horizon (e.g., 5% one-day VaR = loss exceeded on 5% of days). It does not measure losses beyond that threshold; conditional VaR (expected shortfall) is the average loss in the tail."},{"r":6,"q":"Which of the following statements about risk management is most accurate?","o":["The primary goal of risk management is to minimize the organization's total risk","An organization's risk tolerance should be set by the risk management function rather than by its governing body","Effective risk management means taking the right risks to achieve objectives, not necessarily minimizing risk"],"a":2,"e":"Risk management aims to take the 'right' risks, consistent with the organization's objectives and tolerance, not to minimize risk (which would sacrifice return). Risk tolerance is set by the governing body (board), and the risk function implements it.","d":3,"t":"Risk management principles","c":"Risk management is the process of identifying the organization's risk tolerance, measuring and monitoring its risks, and modifying exposures so that the risks taken are those it intends to take, in line with its goals; it is not about minimizing or eliminating risk."}]},{"subject":10,"questions":[{"r":1,"q":"Which of the following statements best describes ethics?","o":["A set of moral principles and rules of conduct that guide behavior, particularly when actions affect others","The body of laws and regulations that a society enforces through penalties","A collection of personal preferences that vary freely and cannot be evaluated by others"],"a":0,"e":"Ethics refers to a set of moral principles and rules of conduct that guide behavior, especially when our actions affect others. It is not the same as law (B), which is often a minimum floor, and it is not reducible to mere personal preferences that cannot be evaluated (C).","d":1,"t":"Definition of ethics","c":"Ethics is a set of moral principles and rules of conduct that guide behavior, particularly when our decisions affect others. It goes beyond simple compliance with the law."},{"r":1,"q":"Which of the following is least likely to be considered a challenge to ethical behavior?","o":["Overconfidence in one's own moral character","Situational influences such as pressure from a manager to meet a sales target","A strong orientation toward the long-term interests of clients"],"a":2,"e":"The curriculum identifies overconfidence bias (A), situational influences (B) and a focus on the short term as obstacles to ethical behavior. An orientation toward clients' long-term interests, by contrast, promotes ethical conduct.","d":1,"t":"Challenges to ethical behavior","c":"The main challenges to ethical behavior are overconfidence in one's own morality, situational influences (pressure from peer
