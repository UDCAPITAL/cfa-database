<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>CFA L1 QCM Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail (nav + sync state) beside a single working column; rail becomes a top strip on phones. */
:root{
  --bg:#f6f3ec; --surface:#fffdf8; --surface-2:#efe9dc; --line:#e2d9c6;
  --ink:#0f1f3d; --ink-2:#3e4a64; --ink-3:#76809a;
  --accent:#15295a; --accent-ink:#f3dc9a; --accent-soft:#e5e9f3;
  --ok:#0a7d34; --ok-bg:#e3f4e8; --ko:#b3261e; --ko-bg:#fbe7e5;
  --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b; --st-none:#c2bba9;
  --q0:#efe9dc; --q1:#f3e6c2; --q2:#e6cb84; --q3:#cfa84f; --q4:#4a6296; --q5:#15295a;
  --navy:#0f1f3d; --navy-deep:#091530; --navy-line:#1c3160; --gold:#c9a24a; --gold-2:#e8c977; --gold-ink:#9a7624;
  --shadow:0 1px 2px rgba(15,31,61,.06),0 6px 18px rgba(15,31,61,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1427; --surface:#0f1d37; --surface-2:#172a4c; --line:#24395f;
  --ink:#f1ece0; --ink-2:#c3c8d4; --ink-3:#8b95ab;
  --accent:#d6b25e; --accent-ink:#0a1427; --accent-soft:#2c3240;
  --ok:#5fd18a; --ok-bg:#12301f; --ko:#ff8a80; --ko-bg:#3a1a19;
  --st-none:#3a4a66;
  --q0:#172a4c; --q1:#3b3d3a; --q2:#6c5f35; --q3:#9d8238; --q4:#c9a24a; --q5:#ecd08a;
  --navy:#08122a; --navy-deep:#050c1d; --navy-line:#1a2c50; --gold:#c9a24a; --gold-2:#e8c977; --gold-ink:#d6b25e;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1427; --surface:#0f1d37; --surface-2:#172a4c; --line:#24395f;
  --ink:#f1ece0; --ink-2:#c3c8d4; --ink-3:#8b95ab;
  --accent:#d6b25e; --accent-ink:#0a1427; --accent-soft:#2c3240;
  --ok:#5fd18a; --ok-bg:#12301f; --ko:#ff8a80; --ko-bg:#3a1a19;
  --st-none:#3a4a66;
  --q0:#172a4c; --q1:#3b3d3a; --q2:#6c5f35; --q3:#9d8238; --q4:#c9a24a; --q5:#ecd08a;
  --navy:#08122a; --navy-deep:#050c1d; --navy-line:#1a2c50; --gold:#c9a24a; --gold-2:#e8c977; --gold-ink:#d6b25e;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:1rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px;font-weight:600}
.muted{color:var(--ink-3)}
.small{font-size:.85rem}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 .8rem var(--f-mono)}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.1}
.brand span{font-size:.75rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{font:500 .72rem var(--f-mono);background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:1px 7px}
.nav a.on .badge{background:var(--surface);color:var(--accent)}
.sync{margin-top:auto;font-size:.78rem;color:var(--ink-3);padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--st-none);margin-top:6px;flex:none}
.sync.cloud i{background:var(--st-good)}
.sync.err i{background:var(--st-crit)}

main{padding-block:28px 64px;padding-inline:clamp(16px,3.2vw,40px);min-width:0;max-width:1240px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;text-decoration:none;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--ko);border-color:var(--ko)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font:500 1.9rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.95rem;color:var(--ink-3)}
.kpi .l{font-size:.82rem;color:var(--ink-2)}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .l,.kpi.hero .v small,.kpi.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}

.countdown{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:12px 16px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem;color:var(--ink-2)}
.countdown b{font:500 1.05rem var(--f-mono);color:var(--ink)}

/* subject score rows */
.srow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 64px 70px;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.srow:first-child{border-top:0}
.srow:hover .sname{color:var(--accent)}
.sname{font-weight:500;line-height:1.25}
.sname small{display:block;font-size:.75rem;color:var(--ink-3);font-weight:400}
.bar{position:relative;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar.cov{height:4px;margin-top:5px}
.bar.cov>i{background:var(--ink-3)}
.bar .mps{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.score{font:500 1rem var(--f-mono);text-align:right}
.score small{color:var(--ink-3);font-size:.75rem}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 9px 2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--st-none)}
.chip.good i{background:var(--st-good)} .chip.warn i{background:var(--st-warn)} .chip.crit i{background:var(--st-crit)}

/* heatmap */
.heat{display:grid;grid-template-columns:44px minmax(0,1fr);gap:5px 8px;align-items:center}
.heat .lab{font:500 .75rem var(--f-mono);color:var(--ink-2)}
.cells{display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:3px}
.cell{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--q0);border:0;padding:0;cursor:pointer}
.cell:hover{outline:2px solid var(--ink);outline-offset:1px}
.cell.n{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--ink-3);flex-wrap:wrap;margin-top:12px}
.legend .sw{width:14px;height:14px;border-radius:3px;display:inline-block}

.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.cal .d{width:14px;height:14px;border-radius:3px;background:var(--q0)}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{min-width:0}
.li .t b{font-weight:500;display:block;line-height:1.3}
.li .t span{font-size:.8rem;color:var(--ink-3)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);text-align:left;font-size:.92rem}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

/* subject cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .code{font:500 .75rem var(--f-mono);color:var(--ink-3)}
.card .big{font:500 1.6rem var(--f-mono)}
.card .big small{font-size:.85rem;color:var(--ink-3)}

/* builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:16px}
.tree details{border-top:1px solid var(--line)}
.tree details:first-of-type{border-top:0}
.tree summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 4px;cursor:pointer}
.tree summary::-webkit-details-marker{display:none}
.tree summary .caret{width:16px;color:var(--ink-3);transition:transform .15s;flex:none}
.tree details[open] summary .caret{transform:rotate(90deg)}
.tree summary .sn{flex:1;min-width:0;font-weight:500}
.tree summary .cnt{font:.78rem var(--f-mono);color:var(--ink-3)}
.rl{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 4px 7px 30px;border-radius:6px;cursor:pointer}
.rl:hover{background:var(--surface-2)}
.rl .rn{font-size:.9rem;line-height:1.3}
.rl .rn em{font-style:normal;font:.75rem var(--f-mono);color:var(--ink-3);margin-right:6px}
.rl .q{font:.75rem var(--f-mono);color:var(--ink-3);white-space:nowrap}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:.85rem;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:.78rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{font:.8rem var(--f-mono);min-height:120px}
input[type=range]{width:100%;accent-color:var(--accent)}
.avail{font:500 2rem var(--f-mono)}
.quick{display:flex;gap:6px;flex-wrap:wrap}

/* player */
.player{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ptop .lbl{font-size:.85rem;color:var(--ink-2);min-width:0}
.timer{font:500 1.05rem var(--f-mono);padding:4px 12px;border-radius:8px;background:var(--surface-2)}
.timer.low{color:var(--ko)}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-3)}
.qmeta b{font-family:var(--f-mono);color:var(--ink-2);font-weight:500}
.dots{letter-spacing:2px;color:var(--ink-2)}
.stem{font-size:1.05rem;line-height:1.6;white-space:pre-line;max-width:72ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.45}
.opt .k{width:30px;height:30px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font:600 .85rem var(--f-mono);color:var(--ink-2)}
.opt:hover:not([disabled]){border-color:var(--ink-3)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .k{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--ko);background:var(--ko-bg)}
.opt.bad .k{background:var(--ko);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt .mk{font-size:.78rem;font-weight:600}
.opt.good .mk{color:var(--ok)} .opt.bad .mk{color:var(--ko)}
.expl{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 10px 10px 0;white-space:pre-line;line-height:1.6;font-size:.95rem}
.expl b{display:block;margin-bottom:4px}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.pact{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.navgrid button{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:.8rem var(--f-mono);cursor:pointer}
.navgrid button.a{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.navgrid button.f{box-shadow:inset 0 -3px 0 var(--st-warn)}
.kbd{font:.72rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2)}
.flag.on{color:var(--st-warn);border-color:var(--st-warn)}

/* results */
.res-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.ring{width:150px;height:150px}
.res-hero .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.res-hero .facts div{display:flex;flex-direction:column}
.res-hero .facts b{font:500 1.3rem var(--f-mono)}
.res-hero .facts span{font-size:.8rem;color:var(--ink-3)}
details.rv{border-top:1px solid var(--line)}
details.rv summary{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:11px 2px;cursor:pointer;list-style:none;align-items:center}
details.rv summary::-webkit-details-marker{display:none}
details.rv .body{padding:4px 2px 18px 32px;display:flex;flex-direction:column;gap:12px}
.mark{font-weight:700;font-family:var(--f-mono)}
.mark.ok{color:var(--ok)} .mark.ko{color:var(--ko)} .mark.na{color:var(--ink-3)}
.ro{display:flex;gap:10px;padding:6px 10px;border-radius:8px;font-size:.92rem}
.ro.good{background:var(--ok-bg)} .ro.bad{background:var(--ko-bg)}

.spark{width:100%;height:120px;display:block}
.spark text{fill:var(--ink-3);font:11px var(--f-mono)}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.35;box-shadow:var(--shadow)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:60}

.apgrid{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px minmax(0,170px) auto;gap:8px 10px;align-items:center}
.apgrid .h{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.apgrid .rn{font-size:.88rem;line-height:1.3}
.apgrid .rn em{font-style:normal;font:.75rem var(--f-mono);color:var(--ink-3);margin-right:6px}

/* notes */
.note-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.note{padding:clamp(18px,3vw,34px);line-height:1.7}
.note .lead{font-size:1.08rem;color:var(--ink-2);margin:0 0 6px;max-width:68ch}
.note h2{margin:26px 0 8px;font-size:1.2rem}
.note p,.note ul{max-width:68ch;margin:0 0 12px}
.note ul{padding-left:20px}
.note li{margin:3px 0}
.formula{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.formula:first-of-type{border-top:0;padding-top:0}
.formula code{font:500 .9rem/1.5 var(--f-mono);background:var(--surface-2);padding:6px 9px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.pit{margin:0;padding-left:18px;font-size:.92rem;line-height:1.5}
.pit li{margin:4px 0}
.recall{border:1px solid var(--line);background:var(--surface-2);padding:12px 16px;border-radius:10px;line-height:1.6;font-size:.94rem}
.recall b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:4px}
.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sim button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.sim button:hover{border-color:var(--accent)}
.sim button b{font:500 1.3rem var(--f-mono)}
.sim button span{font-size:.75rem;color:var(--ink-3)}

<script>
const CURR=[
{id:1,code:'QM',name:'Quantitative Methods',w:[6,9],ap:1,r:['Returns of Financial Assets and Instruments','Types of Financial Returns','Benchmarking Returns','The Time Value of Money in Finance','Statistical Characteristics of Asset Returns','Statistical Distributions for Financial Asset Prices and Returns','Estimation and Hypothesis Testing','The Return and Risk of a Financial Portfolio','Simulation of Financial Asset Prices and Returns','Applications of Simple Linear Regression in Finance','Introduction to Financial Data Science']},
{id:2,code:'ECO',name:'Economics',w:[6,9],ap:2,r:['Firm & Market Structures','Understanding Business Cycles','Fiscal Policy','Monetary Policy','Introduction to Geopolitics','International Trade','Capital Flows and the FX Market','Exchange Rate Calculations']},
{id:3,code:'CF',name:'Corporate Issuers',w:[6,9],ap:4,r:['Organization Forms, Corporate Issuer Features and Ownership','Investors and other Stakeholders','Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits','Working Capital & Liquidity','Capital Investments and Capital Allocation','Capital Structure','Business Models']},
{id:4,code:'FSA',name:'Financial Statement Analysis',w:[11,14],ap:3,r:['Introduction to Financial Statement Analysis','Analyzing Income Statements','Analyzing Balance Sheets','Analyzing Statements of Cash Flows I','Analyzing Statements of Cash Flows II','Analysis of Inventories','Analysis of Long-Term Assets','Topics in Long-Term Liabilities and Equity','Analysis of Income Taxes','Financial Reporting Quality','Financial Analysis Techniques','Introduction to Financial Statement Modeling']},
{id:5,code:'EQ',name:'Equity Investments',w:[11,14],ap:5,r:['Equity Instrument Features','Equity Jurisdictions, Classes, and the Voting Process','Equity Issuance and Trading','Sources of Equity Returns','Introduction to Equity Valuation','Discounted Cash Flow (DCF) and Growth Models','Relative Value Equity Valuation Approaches','Financial Statement Forecasting in Equity Valuation','Industry and Competitive Analysis','Company Analysis: Past, Present, and Future','Equity Analyst Research Reports','The CAPM, Market Model, and Other Factor-Based Equity Models']},
{id:6,code:'FI',name:'Fixed Income',w:[11,14],ap:6,r:['Fixed Income Instrument Features','Fixed Income Cash Flows and Types','Fixed Income Issuance and Trading','Fixed Income Market for Corporate Issuers','Fixed Income Market for Government Issuers','Bond Valuation: Prices and Yields','Yield and Spread Measures for Fixed-Rate Bonds','Yield and Spread Measures for Floating-Rate Instruments','The Term Structure: Spot, Par and Forward Curves','Interest Rate Risk and Return','Yield-Based Bond Duration Measures and Properties','Yield-Based Bond Convexity and Portfolio Properties','Curve-Based and Empirical Fixed-Income Risk Measures','Credit Risk','Credit Analysis for Government Issuers','Credit Analysis for Corporate Issuers','Fixed Income Securitization','ABS Instrument and Market Features','MBS Instrument and Market Features']},
{id:7,code:'DER',name:'Derivatives',w:[5,8],ap:7,r:['Derivative Instrument and Market Features','Forward Commitment and Contingent Claim Features','Derivative Benefits, Risks, and Uses','Arbitrage, Replication, and the Cost of Carry','Pricing and Valuation of Forward Contracts','Pricing and Valuation of Futures Contracts','Pricing and Valuation of Interest Rate and Other Swaps','Pricing and Valuation of Options','Option Replication Using Put–Call Parity','Valuing a Derivative Using a One-Period Binomial Model']},
{id:8,code:'ALT',name:'Alternative Investments',w:[7,10],ap:8,r:['Alternative Investment Features, Methods and Structures','Alternative Investment Performance and Returns','Investments in Private Capital: Equity and Debt','Real Estate and Infrastructure','Natural Resources','Hedge Funds','Introduction to Digital Assets']},
{id:9,code:'PM',name:'Portfolio Management',w:[8,12],ap:9,r:['Portfolio Risk & Return: Part I','Portfolio Risk & Return: Part II','Portfolio Management: An Overview','Basics of Portfolio Planning & Construction','The Behavioral Biases of Individuals','Introduction to Risk Management']},
{id:10,code:'ETH',name:'Ethical & Professional Standards',w:[15,20],ap:10,r:['Ethics and Trust in the Investment Profession','Code of Ethics and Standards of Professional Conduct','Standard I: Professionalism','Standard II: Integrity of Capital Markets','Standard III: Duties to Clients','Standard IV: Duties to Employers','Standard V: Investment Analysis, Recommendations, and Actions','Standard VI: Conflicts of Interest','Standard VII: Responsibilities as a Member or Candidate','Application of the Code and Standards']}
];
const RAW=[{"subject":1,"questions":[{"r":1,"q":"An investor buys a share for EUR 40.00, receives a dividend of EUR 1.20 during the year, and sells the share at year-end for EUR 43.50. The holding period return is:","o":["11.75%","8.75%","3.00%"],"a":0,"e":"HPR = (P1 − P0 + D)/P0 = (43.50 − 40 + 1.20)/40 = 11.75%. 8.75% keeps only the capital gain and forgets the dividend; 3.00% is just the dividend yield.","d":1,"t":"Holding period return","c":"The holding period return includes both the capital gain and the income received: HPR = (P1 − P0 + D1) / P0."},{"r":1,"q":"A fund reports annual returns of 8%, −5%, and 12% over three consecutive years. The fund's cumulative three-year holding period return is:","o":["15.00%","14.91%","5.00%"],"a":1,"e":"Returns compound: 1.08 × 0.95 × 1.12 − 1 = 14.91%. 15.00% simply adds the returns (ignores compounding); 5.00% is the arithmetic mean annual return, not a cumulative return.","d":1,"t":"Multi-period holding period return","c":"Multi-period returns compound multiplicatively: cumulative HPR = (1 + R1) × (1 + R2) × … × (1 + Rn) − 1. They are not added."},{"r":1,"q":"A stock returned 15%, −10%, and 6% in three successive years. Its geometric mean annual return is:","o":["3.67%","9.71%","3.14%"],"a":2,"e":"Geometric mean = (1.15 × 0.90 × 1.06)^(1/3) − 1 = 3.14%. 3.67% is the arithmetic mean, which overstates the compound return; 9.71% is the cumulative three-year return, not annualized.","d":2,"t":"Geometric mean return","c":"The geometric mean return is [(1 + R1) × (1 + R2) × … × (1 + Rn)]^(1/n) − 1; it is the constant compound rate that reproduces the ending wealth."},{"r":1,"q":"Which of the following statements about the arithmetic and geometric mean returns of the same return series is most accurate?","o":["The geometric mean is less than or equal to the arithmetic mean, with equality only if all returns are identical","The geometric mean exceeds the arithmetic mean whenever the series contains a negative return","The arithmetic mean is the better measure of the compound annual growth rate actually achieved over the period"],"a":0,"e":"The geometric mean is always less than or equal to the arithmetic mean; the gap widens with volatility and disappears if all returns are equal. A negative return does not reverse this relationship. It is the geometric mean (not the arithmetic mean) that measures the compound growth rate actually achieved.","d":1,"t":"Arithmetic vs geometric mean","c":"For the same series, arithmetic mean ≥ geometric mean ≥ harmonic mean; equality holds only if all returns are identical, and the gap grows with volatility. The geometric mean measures compounded past performance; the arithmetic mean is the estimator for a single future period."},{"r":1,"q":"An investor invests EUR 1,000 in a fund at the start of each of three months, at unit prices of EUR 20, EUR 25, and EUR 40. The average cost per unit is:","o":["EUR 28.33","EUR 26.09","EUR 27.14"],"a":1,"e":"With a fixed amount invested on each date (cost averaging), the average cost is the harmonic mean: 3/(1/20 + 1/25 + 1/40) = 26.09. The arithmetic mean (28.33) and the geometric mean (27.14) overstate the cost because more shares are bought when the price is low.","d":2,"t":"Harmonic mean","c":"When a fixed amount is invested each period (cost averaging), the average cost per share is the harmonic mean of the prices: n / Σ(1/Pi), always less than or equal to the arithmetic mean of the prices."},{"r":1,"q":"A portfolio earned 2.5% over a three-month period. Assuming the return can be repeated, its annualized return is:","o":["10.00%","0.62%","10.38%"],"a":2,"e":"Annualizing: (1.025)^(12/3) − 1 = 1.025^4 − 1 = 10.38%. 10.00% simply multiplies by 4 without compounding; 0.62% applies the exponent the wrong way (de-annualizing).","d":1,"t":"Annualizing returns","c":"Annualizing a periodic return: R_annual = (1 + R_period)^c − 1, where c is the number of periods in a year (4 for a quarter, 12 for a month, 365/days in general)."},{"r":1,"q":"A pension plan's external manager has no control over the timing or size of client contributions and withdrawals. To evaluate the manager's performance, the most appropriate measure is the:","o":["time-weighted rate of return","money-weighted rate of return","arithmetic mean of the end-of-period portfolio values"],"a":0,"e":"The time-weighted return (TWR) removes the effect of external cash flows, which the manager does not control; it is the standard for evaluating a manager. The money-weighted return (MWR, an IRR) is affected by the size and timing of cash flows. An average of portfolio values is not a return measure.","d":2,"t":"Time-weighted vs money-weighted return","c":"The time-weighted return neutralizes the effect of the amount and timing of external cash flows, so it is the right measure for judging a manager who does not control those flows. The money-weighted return (IRR) instead reflects the investor's cash-flow decisions."},{"r":1,"q":"An investor buys one share at EUR 100 at t = 0 and a second share at EUR 110 at t = 1. No dividends are paid, and both shares are sold at EUR 120 at t = 2. The investor's annual money-weighted rate of return is:","o":["9.54%","9.39%","14.29%"],"a":1,"e":"Cash flows: −100 at t0, −110 at t1, +240 at t2. The MWR is the IRR solving −100 − 110/(1+r) + 240/(1+r)² = 0, i.e., r = 9.39%. 9.54% is the time-weighted return (√(1.10 × 1.0909) − 1); 14.29% is the total gain on capital invested, not annualized.","d":3,"t":"Money-weighted return (IRR)","c":"The money-weighted return is the IRR: the rate r that sets the sum of discounted cash flows to zero, Σ CFt / (1 + r)^t = 0, treating contributions as outflows and withdrawals/ending value as inflows."},{"r":2,"q":"A stock's price rises from EUR 50 to EUR 56 over one year with no dividends. Its continuously compounded return is:","o":["12.00%","10.71%","11.33%"],"a":2,"e":"Continuously compounded return = ln(56/50) = ln(1.12) = 11.33%. 12.00% is the discrete holding period return, which is higher than the continuous return; 10.71% divides the gain by the ending price instead of the beginning price.","d":1,"t":"Continuously compounded return","c":"The continuously compounded return is r = ln(P1 / P0) = ln(1 + HPR); for a positive HPR it is always smaller than the corresponding HPR."},{"r":2,"q":"An asset has a continuously compounded annual return of 8%. The equivalent annual holding period return is:","o":["8.33%","8.00%","7.70%"],"a":0,"e":"HPR = e^0.08 − 1 = 8.33%. 8.00% confuses the continuous and discrete returns; 7.70% = ln(1.08) applies the conversion in the wrong direction.","d":1,"t":"Continuous to discrete return","c":"Converting a continuously compounded return to a discrete return: HPR = e^r − 1."},{"r":2,"q":"An investment earns a nominal return of 7.0% when inflation is 2.5%. The real return is:","o":["4.50%","4.39%","9.67%"],"a":1,"e":"Real return = (1 + nominal)/(1 + inflation) − 1 = 1.07/1.025 − 1 = 4.39%. 4.50% is the simple-subtraction approximation; 9.67% multiplies instead of dividing.","d":2,"t":"Real return","c":"Exact Fisher relation: (1 + nominal return) = (1 + real return) × (1 + inflation), so r_real = (1 + r_nominal) / (1 + π) − 1. The approximation r_nominal − π is less precise."},{"r":2,"q":"An investor holds a EUR 1,000,000 portfolio financed with EUR 600,000 of equity and EUR 400,000 borrowed at 5%. The portfolio earns 12% over the year. The return on the investor's equity is:","o":["12.00%","20.00%","16.67%"],"a":2,"e":"Leveraged return = (0.12 × 1,000,000 − 0.05 × 400,000)/600,000 = (120,000 − 20,000)/600,000 = 16.67%. 12.00% ignores leverage; 20.00% forgets to deduct the cost of borrowing.","d":2,"t":"Leveraged return","c":"Leveraged return: R_L = R + (Vb / Ve) × (R − rd), where Vb is debt, Ve equity and rd the cost of debt. Leverage magnifies gains and losses alike."},{"r":2,"q":"A portfolio's gross return is best described as the return earned:","o":["after trading expenses but before management and administrative fees","before trading expenses, management fees and administrative fees","after all fees and expenses, but before taxes"],"a":0,"e":"The gross return is calculated after deducting trading expenses (which are incurred to generate the return) but before management and administrative fees. It is therefore not a return before all fees. The return after all fees is the net return.","d":2,"t":"Gross vs net return","c":"The gross return is measured before management and administrative fees but after trading costs; the net return is after deducting all fees. The gross return is used to evaluate the manager's skill."},{"r":2,"q":"A taxable investor earns a 9% total return composed of a 2% dividend yield and a 7% realized capital gain. Dividends are taxed at 30% and capital gains at 15%. The after-tax return is:","o":["6.30%","7.35%","7.65%"],"a":1,"e":"After-tax = 2% × (1 − 0.30) + 7% × (1 − 0.15) = 1.40% + 5.95% = 7.35%. 6.30% taxes everything at the dividend rate; 7.65% taxes everything at the capital gains rate.","d":2,"t":"After-tax return","c":"The after-tax return applies each component's own tax rate: R_after-tax = Σ component × (1 − tax rate on that component)."},{"r":2,"q":"Which of the following is a key advantage of continuously compounded returns in multi-period analysis?","o":["The continuously compounded return is always larger than the corresponding holding period return","Continuously compounded returns cannot be lower than −100%, which makes them additive","The multi-period continuously compounded return equals the sum of the single-period continuously compounded returns"],"a":2,"e":"Continuously compounded returns are additive over time: ln(PT/P0) = sum of ln(Pt/Pt−1), which simplifies multi-period analysis. They are lower (not higher) than positive discrete returns. A continuous return can be below −100% (it tends to −∞ as the price tends to 0); that is not the source of additivity.","d":1,"t":"Additivity of log returns","c":"Continuously compounded returns are additive over time: the multi-period continuous return is the sum of the single-period continuous returns, which simplifies multi-period calculations."},{"r":2,"q":"A stock's continuously compounded returns over three consecutive years are 6%, −4%, and 9%. The three-year holding period return is:","o":["11.63%","11.00%","3.67%"],"a":0,"e":"Continuous returns add up: 6 − 4 + 9 = 11%; HPR = e^0.11 − 1 = 11.63%. 11.00% forgets to convert the continuous return back into a discrete return; 3.67% is an annual average, not a three-year return.","d":3,"t":"Multi-period log returns","c":"Multi-period continuously compounded return: r(0,T) = r1 + r2 + … + rT; the corresponding HPR is e^(Σ r) − 1."},{"r":3,"q":"A portfolio holds 60% equities returning 10% and 40% bonds returning 3%. Its benchmark holds 50% in an equity index returning 8% and 50% in a bond index returning 3.5%. The portfolio's active return is:","o":["2.00%","1.45%","1.00%"],"a":1,"e":"Rp = 0.6 × 10% + 0.4 × 3% = 7.20%; Rb = 0.5 × 8% + 0.5 × 3.5% = 5.75%; active return = 1.45%. 2.00% compares only the equity sleeve; 1.00% computes the benchmark with the portfolio weights (60/40) instead of its own (50/50): that is actually the selection effect alone.","d":2,"t":"Active return","c":"Active return is the difference between the portfolio return and the benchmark return: R_A = Σ wP,i × RP,i − Σ wB,i × RB,i."},{"r":3,"q":"Using the same data (portfolio: 60% equities at 10%, 40% bonds at 3%; benchmark: 50% equity index at 8%, 50% bond index at 3.5%), the security selection effect is:","o":["0.45%","1.45%","1.00%"],"a":2,"e":"Selection = Σ wp,i × (Rp,i − Rb,i) = 0.6 × 2% + 0.4 × (−0.5%) = 1.00%. 0.45% is the allocation effect, Σ (wp,i − wb,i) × Rb,i = 0.1 × 8% − 0.1 × 3.5%; 1.45% is the total active return (allocation + selection).","d":3,"t":"Return attribution","c":"Active return decomposes into an asset allocation effect Σ (wP,i − wB,i) × RB,i and a security selection effect Σ wP,i × (RP,i − RB,i)."},{"r":3,"q":"A manager's annual active returns over five years are 1.2%, −0.4%, 0.8%, 2.1%, and −0.7%. Using the sample standard deviation, the tracking error is:","o":["1.16%","1.03%","0.60%"],"a":0,"e":"Mean = 0.60%; sum of squared deviations = 5.34; sample variance = 5.34/4; tracking error = 1.16%. 1.03% divides by n = 5 (population standard deviation); 0.60% is the mean active return, not its volatility.","d":2,"t":"Tracking error","c":"Tracking error is the standard deviation of active returns (R_P − R_B); with a sample, divide the sum of squared deviations from the mean by (n − 1)."},{"r":3,"q":"A portfolio returned 9.3% versus 7.5% for its benchmark. The risk-free rate is 3.0%, the portfolio's standard deviation is 15%, and its tracking error is 4.5%. The information ratio is:","o":["1.40","0.40","0.12"],"a":1,"e":"IR = active return / tracking error = (9.3% − 7.5%)/4.5% = 0.40. 1.40 uses the excess over the risk-free rate instead of the active return; 0.12 divides by the total standard deviation instead of the tracking error.","d":2,"t":"Information ratio","c":"Information ratio = (R_P − R_B) / tracking error; it measures active return per unit of active risk. The Sharpe ratio instead uses (R_P − Rf) / σ_P."},{"r":3,"q":"Which of the following is least likely a desirable property of a valid investment benchmark?","o":["It is specified in advance and known to the manager","It is investable, so the manager could hold it passively","It is constructed at the end of the evaluation period to reflect the manager's actual holdings"],"a":2,"e":"A valid benchmark must be specified in advance, investable, measurable, appropriate to the manager's style and unambiguous. An index built after the fact from the actual holdings is not defined in advance and cannot measure value added. The other two characteristics are among the expected properties.","d":1,"t":"Benchmark properties","c":"A valid benchmark must be unambiguous, investable, measurable, appropriate to the manager's style, reflective of current investment opinions, specified in advance and accepted by the manager (SAMURAI criteria)."},{"r":3,"q":"A fund has an expected return of 11%, a standard deviation of 16%, and the risk-free rate is 3%. The fund's Sharpe ratio is:","o":["0.50","0.69","0.08"],"a":0,"e":"Sharpe = (11% − 3%)/16% = 0.50. 0.69 forgets to subtract the risk-free rate; 0.08 is the excess return not scaled by risk.","d":1,"t":"Sharpe ratio","c":"Sharpe ratio = (E(R_P) − Rf) / σ_P: risk premium per unit of total risk."},{"r":3,"q":"A key weakness of using the median manager of a peer group as a performance benchmark is that it:","o":["is always easier to beat than a broad market index","is not investable and its composition is not known in advance","cannot be used for managers with an active investment style"],"a":1,"e":"The median of a manager universe is only known ex post and cannot be held passively; it also suffers from survivorship bias. Nothing guarantees it is easier to beat than an index. On the contrary, it is often used for active managers.","d":2,"t":"Peer group benchmark","c":"A peer group median benchmark is not investable, is known only ex post and suffers from survivorship bias; it therefore does not satisfy the properties of a valid benchmark."},{"r":3,"q":"Over the last year, a portfolio had a positive Sharpe ratio but a negative information ratio. This most likely indicates that the portfolio:","o":["underperformed the risk-free asset but outperformed its benchmark","had a tracking error greater than its total standard deviation","outperformed the risk-free asset but underperformed its benchmark"],"a":2,"e":"A positive Sharpe ratio means a return above the risk-free rate; a negative information ratio means a negative active return, i.e., underperformance versus the benchmark. The second statement reverses both conclusions. The signs of the ratios say nothing about the relative size of tracking error and standard deviation.","d":2,"t":"Sharpe vs information ratio","c":"The Sharpe ratio compares return with the risk-free rate per unit of total risk; the information ratio compares with the benchmark per unit of tracking error. A positive Sharpe and a negative IR mean beating the risk-free rate but underperforming the benchmark."},{"r":4,"q":"EUR 10,000 is invested for five years at a stated annual rate of 6%, compounded monthly. The future value is:","o":["EUR 13,488.50","EUR 13,382.26","EUR 13,000.00"],"a":0,"e":"FV = 10,000 × (1 + 0.06/12)^60 = 13,488.50. 13,382.26 assumes annual compounding; 13,000 corresponds to simple interest.","d":1,"t":"Future value with periodic compounding","c":"Periodic compounding: FV = PV × (1 + rs/m)^(m × N), where rs is the stated annual rate and m the number of compounding periods per year."},{"r":4,"q":"An investor will receive EUR 5,000 at the end of each year for 10 years. At a 7% discount rate, the present value of these payments is:","o":["EUR 37,576.16","EUR 35,117.91","EUR 25,417.46"],"a":1,"e":"PV of an ordinary annuity = 5,000 × [1 − 1.07^(−10)]/0.07 = 35,117.91. 37,576.16 treats the cash flows as an annuity due (beginning of period); 25,417.46 discounts the total sum as a single cash flow in year 10.","d":2,"t":"Present value of an annuity","c":"Present value of an ordinary (end-of-period) annuity: PV = A × [1 − (1 + r)^(−N)] / r."},{"r":4,"q":"A five-year bond with a face value of EUR 1,000 pays a 4% annual coupon. If the bond's yield to maturity is 5%, its price is:","o":["EUR 1,044.52","EUR 1,000.00","EUR 956.71"],"a":2,"e":"Price = Σ 40/1.05^t (t = 1 to 5) + 1,000/1.05^5 = 956.71. 1,044.52 swaps the coupon and the yield; 1,000 (par) only holds if coupon = yield. Here coupon < yield, so the bond trades below par.","d":2,"t":"Bond pricing","c":"Bond price = present value of the coupons + present value of the face value, discounted at the yield to maturity (YTM): P = Σ C/(1 + r)^t + F/(1 + r)^N."},{"r":4,"q":"A company just paid an annual dividend of EUR 2.00. Dividends are expected to grow at 4% per year indefinitely, and the required return is 9%. The value of the share today is:","o":["EUR 41.60","EUR 40.00","EUR 23.11"],"a":0,"e":"V0 = D0 × (1 + g)/(r − g) = 2.00 × 1.04/(0.09 − 0.04) = 41.60. 40.00 uses D0 instead of D1; 23.11 forgets to subtract growth in the denominator.","d":2,"t":"Gordon growth model","c":"Gordon (constant growth) dividend discount model: V0 = D1 / (r − g) = D0 × (1 + g) / (r − g), valid only if r > g. Be careful to use next period's dividend D1."},{"r":4,"q":"A zero-coupon bond is purchased for EUR 783.53 and will pay EUR 1,000 in five years. The implied annual return is:","o":["5.53%","5.00%","27.63%"],"a":1,"e":"r = (1,000/783.53)^(1/5) − 1 = 5.00%. 5.53% divides the total gain by 5 without compounding; 27.63% is the total five-year return, not annualized.","d":2,"t":"Implied return","c":"Implied return of a zero-coupon instrument: r = (FV / PV)^(1/N) − 1."},{"r":4,"q":"A bond's coupon rate is lower than its yield to maturity. All else equal, the bond:","o":["trades at a premium to par value","trades at par because the coupon is fixed","trades at a discount to par value"],"a":2,"e":"When the coupon rate is below the market's required yield, the present value of the cash flows is below face value: the bond trades at a discount. A premium arises only if coupon > yield. A fixed coupon does not imply trading at par.","d":1,"t":"Coupon vs yield and price","c":"When the coupon rate is below the YTM, the bond trades below par (discount); equal, at par; above, above par (premium). Price and yield move in opposite directions."},{"r":4,"q":"A preferred share pays a fixed annual dividend of EUR 4.50 in perpetuity. If the required return is 6%, its value is:","o":["EUR 75.00","EUR 7.50","EUR 79.50"],"a":0,"e":"Perpetuity: V = D/r = 4.50/0.06 = 75.00. 7.50 is a decimal error (r = 60%); 79.50 wrongly applies 6% growth to the fixed dividend.","d":1,"t":"Perpetuity valuation","c":"Value of a perpetuity (fixed-dividend preferred share): V0 = D / r."},{"r":4,"q":"Which of the following deposit offers provides the highest effective annual rate?","o":["8.10% compounded annually","7.95% compounded monthly","7.90% compounded continuously"],"a":1,"e":"EAR: 8.10% annual = 8.10%; 7.95% monthly = (1 + 0.0795/12)^12 − 1 = 8.25%; 7.90% continuous = e^0.079 − 1 = 8.22%. Monthly compounding gives the highest effective rate; the highest stated rate (8.10%) is not the best once compounding frequency is taken into account.","d":3,"t":"Effective annual rate","c":"Effective annual rate (EAR) = (1 + rs/m)^m − 1; with continuous compounding, EAR = e^rs − 1. The higher the compounding frequency, the higher the EAR for the same stated rate."},{"r":5,"q":"A fund's annual returns over five years are 4%, −2%, 7%, 3%, and 8%. The sample standard deviation of returns is:","o":["3.52%","15.50%","3.94%"],"a":2,"e":"Mean = 4%; sum of squared deviations = 62; sample variance = 62/4 = 15.50; standard deviation = 3.94%. 3.52% divides by n (population) instead of n − 1; 15.50 is the variance (in %²), not the standard deviation.","d":2,"t":"Sample standard deviation","c":"Sample standard deviation: s = √[Σ (Xi − X̄)² / (n − 1)]; dividing by n − 1 (not n) gives an unbiased estimator of the variance."},{"r":5,"q":"Asset X has a mean return of 8% and a standard deviation of 20%. Its coefficient of variation is:","o":["2.50","0.40","0.12"],"a":0,"e":"CV = standard deviation / mean = 20%/8% = 2.50, i.e., 2.5 units of risk per unit of return. 0.40 inverts the ratio (mean/standard deviation); 0.12 is the difference between the two.","d":1,"t":"Coefficient of variation","c":"Coefficient of variation (CV) = σ / mean: risk per unit of return; the lower it is, the better the risk/return trade-off."},{"r":5,"q":"For a unimodal return distribution that is positively skewed, the most likely relationship among the measures of central tendency is:","o":["mode > median > mean","mean > median > mode","mean = median = mode"],"a":1,"e":"Positive skewness (right tail) pulls the mean up: mean > median > mode. The reverse order characterizes negative skewness. Equality of the three measures corresponds to a symmetric distribution.","d":1,"t":"Skewness","c":"Positively skewed distribution: long right tail and mode < median < mean. With negative skew the order is reversed: mean < median < mode."},{"r":5,"q":"A return distribution has an excess kurtosis of 2.1. Compared with a normal distribution, this distribution:","o":["is platykurtic, with thinner tails","is necessarily negatively skewed","is leptokurtic, with fatter tails and a greater probability of extreme returns"],"a":2,"e":"Positive excess kurtosis (kurtosis > 3) indicates a leptokurtic distribution: fatter tails and more extreme returns than the normal distribution. Platykurtic corresponds to negative excess kurtosis. Kurtosis gives no information about the direction of skewness.","d":2,"t":"Kurtosis","c":"Excess kurtosis = kurtosis − 3. Positive excess: leptokurtic distribution, fatter tails and a higher peak than the normal, hence more extreme events."},{"r":5,"q":"A portfolio's annual returns over five years are 5%, −3%, 8%, −6%, and 2%. Using a target return of 0% and the sample formula, the target downside deviation is:","o":["3.35%","4.74%","5.72%"],"a":0,"e":"Only returns below the target count: (−3)² + (−6)² = 45; divided by n − 1 = 4 → 11.25; square root = 3.35%. 4.74% divides by the number of observations below the target (2) instead of n − 1; 5.72% is the standard deviation of all observations.","d":3,"t":"Target downside deviation","c":"Target downside deviation: √[Σ_{Xi<B} (Xi − B)² / (n − 1)], keeping only observations below target B but dividing by n − 1 for the whole sample."},{"r":5,"q":"The covariance between the returns of two assets is 0.0048. Their standard deviations are 12% and 10%, respectively. The correlation coefficient is:","o":["0.0048","0.40","0.04"],"a":1,"e":"ρ = Cov/(σ1 × σ2) = 0.0048/(0.12 × 0.10) = 0.0048/0.012 = 0.40. 0.0048 is the covariance itself, not standardized; 0.04 comes from a decimal error in the product of the standard deviations.","d":1,"t":"Correlation","c":"Correlation coefficient: ρ = Cov(X,Y) / (σX × σY), bounded between −1 and +1."},{"r":5,"q":"An analyst finds that the correlation between the returns of two assets is zero. The most appropriate conclusion is that:","o":["the returns are statistically independent","combining the two assets provides no diversification benefit","there is no linear relationship between the returns, although a nonlinear relationship may exist"],"a":2,"e":"A zero correlation only means there is no linear relationship; a nonlinear relationship is still possible, so independence cannot be concluded. On the contrary, a zero correlation (below +1) does provide a diversification benefit.","d":2,"t":"Interpretation of correlation","c":"Correlation measures only linear association: a zero correlation does not rule out a nonlinear relationship. Also, correlation does not imply causation and can be distorted by outliers or be spurious."},{"r":5,"q":"Eleven monthly returns sorted in ascending order are (in %): −5, −2, 0, 1, 3, 4, 6, 7, 9, 12, 15. Using the formula Ly = (n + 1) × y/100 with linear interpolation, the 30th percentile is:","o":["0.60%","0.00%","1.00%"],"a":0,"e":"Position L = (11 + 1) × 0.30 = 3.6. Interpolate between the 3rd value (0%) and the 4th (1%): 0 + 0.6 × (1 − 0) = 0.60%. 0.00% truncates the position to 3; 1.00% rounds it to 4 without interpolating.","d":2,"t":"Percentiles","c":"Position of a quantile: Ly = (n + 1) × y / 100 in the sorted data; if Ly is not an integer, interpolate linearly between the two surrounding observations."},{"r":6,"q":"Annual portfolio returns are normally distributed with a mean of 8% and a standard deviation of 16%. The probability that the return in a given year is negative is:","o":["19.15%","30.85%","69.15%"],"a":1,"e":"z = (0 − 8)/16 = −0.50; P(Z < −0.50) = 30.85%. 19.15% is the probability between the mean and zero; 69.15% is the probability of a positive return.","d":1,"t":"Normal distribution probability","c":"For a normal variable, standardize with Z = (X − μ) / σ and then read the probability from the standard normal table."},{"r":6,"q":"Annual returns on an index are normally distributed with a mean of 10% and a standard deviation of 15%. The interval expected to contain approximately 95% of annual returns is:","o":["-14.7% to 34.7%","-28.7% to 48.7%","-19.4% to 39.4%"],"a":2,"e":"95% interval = μ ± 1.96σ = 10% ± 29.4% → -19.4% to 39.4%. The first distractor uses 1.645 (90% interval); the other uses 2.58 (99% interval).","d":2,"t":"Confidence interval for returns","c":"For a normal distribution, about 68% of observations lie within ±1σ of the mean, 90% within ±1.65σ, 95% within ±1.96σ and 99% within ±2.58σ."},{"r":6,"q":"Which statement best explains why asset prices are commonly modeled with a lognormal distribution?","o":["A lognormal variable is bounded below by zero and right-skewed, consistent with limited liability","A lognormal variable is symmetric, so prices are equally likely to rise or fall by the same amount","If prices are lognormal, then simple holding period returns are normally distributed"],"a":0,"e":"If continuously compounded returns are normal, prices follow a lognormal distribution: they cannot become negative and the distribution is right-skewed. The lognormal distribution is not symmetric. It is the continuous (log) returns, not the simple returns, that are normal.","d":2,"t":"Lognormal distribution","c":"If continuously compounded returns are normal, the price P_T = P0 × e^r is lognormally distributed: bounded below by zero and right-skewed, which suits asset prices that cannot be negative."},{"r":6,"q":"Each month, a trading strategy has a 30% probability of beating its benchmark, independently of other months. The probability that it beats the benchmark in exactly 2 of the next 5 months is:","o":["0.0309","0.3087","0.8369"],"a":1,"e":"Binomial distribution: P(X = 2) = C(5,2) × 0.3² × 0.7³ = 10 × 0.09 × 0.343 = 0.3087. 0.0309 forgets the number of combinations; 0.8369 is the cumulative probability P(X ≤ 2).","d":2,"t":"Binomial distribution","c":"Binomial distribution: P(X = x) = C(n, x) × p^x × (1 − p)^(n − x), with C(n, x) = n! / [x! (n − x)!], for n independent trials with success probability p."},{"r":6,"q":"Compared with the standard normal distribution, a Student's t-distribution with 10 degrees of freedom:","o":["has thinner tails, and diverges from the normal as degrees of freedom increase","is positively skewed and bounded below by zero","has fatter tails, and converges to the standard normal as degrees of freedom increase"],"a":2,"e":"Student's t-distribution is symmetric with fatter tails than the normal distribution, which widens confidence intervals; it approaches the normal as degrees of freedom increase. It does not have thinner tails. The distributions bounded at zero and skewed are the chi-square and the F-distribution.","d":1,"t":"Student's t-distribution","c":"Student's t-distribution is symmetric with fatter tails than the normal; as degrees of freedom increase, it converges to the normal distribution."},{"r":6,"q":"An investor's shortfall threshold is 3%. Portfolio A has an expected return of 9% and a standard deviation of 12%; Portfolio B: 11% and 18%; Portfolio C: 7.5% and 8%. Using Roy's safety-first criterion, the investor should choose:","o":["Portfolio C","Portfolio A","Portfolio B"],"a":0,"e":"SFRatio = (E(R) − threshold)/σ: A = 6/12 = 0.500; B = 8/18 = 0.444; C = 4.5/8 = 0.562. C maximizes the ratio, so it minimizes the probability of falling below 3%. B has the highest return but the lowest ratio; A is in between.","d":3,"t":"Roy's safety-first ratio","c":"Roy's safety-first ratio: SFRatio = (E(R_P) − R_L) / σ_P, where R_L is the minimum acceptable return; choose the portfolio with the highest ratio, which minimizes P(R_P < R_L)."},{"r":6,"q":"An analyst models the number of profitable trades out of 20 independent trades, each with a 40% probability of being profitable. The variance of the number of profitable trades is:","o":["8.00","4.80","2.19"],"a":1,"e":"Binomial variance = n × p × (1 − p) = 20 × 0.4 × 0.6 = 4.80. 8.00 is the expected value (n × p); 2.19 is the standard deviation.","d":1,"t":"Binomial mean and variance","c":"For a binomial distribution: expected value = n × p and variance = n × p × (1 − p)."},{"r":6,"q":"A stock currently priced at EUR 100 has a one-year continuously compounded return that is normally distributed with a mean of 5% and a standard deviation of 20%. The expected stock price in one year is:","o":["EUR 105.13","EUR 103.05","EUR 107.25"],"a":2,"e":"The price is lognormal: E(S1) = S0 × e^(μ + σ²/2) = 100 × e^(0.05 + 0.02) = 107.25. 105.13 omits the σ²/2 term (that is the median); 103.05 subtracts σ²/2 instead of adding it.","d":3,"t":"Mean of a lognormal variable","c":"If ln(P_T/P0) ~ N(μ, σ²), the mean of the lognormal variable is E(P_T) = P0 × e^(μ + σ²/2), which is higher than P0 × e^μ."},{"r":7,"q":"A sample of 36 monthly returns has a standard deviation of 18%. The standard error of the sample mean is:","o":["3.00%","0.50%","18.00%"],"a":0,"e":"Standard error = s/√n = 18%/√36 = 18/6 = 3.00%. 0.50% divides by n instead of √n; 18.00% is the sample standard deviation, not that of the mean.","d":1,"t":"Standard error of the mean","c":"Standard error of the sample mean: s_X̄ = s / √n."},{"r":7,"q":"A sample of 25 monthly returns has a mean of 6.2% and a standard deviation of 10%. The population variance is unknown. Given t(0.025, 24) = 2.064, the 95% confidence interval for the population mean is:","o":["2.28% to 10.12%","2.07% to 10.33%","-14.44% to 26.84%"],"a":1,"e":"Standard error = 10/√25 = 2%; CI = 6.2% ± 2.064 × 2% = 6.2% ± 4.128% → 2.07% to 10.33%. The second interval uses z = 1.96 although the variance is unknown and the sample small; the third uses the standard deviation instead of the standard error.","d":2,"t":"Confidence interval for the mean","c":"Confidence interval for the mean when the population variance is unknown: X̄ ± t(α/2, n−1) × s / √n."},{"r":7,"q":"A Type I error in hypothesis testing occurs when the analyst:","o":["fails to reject a null hypothesis that is actually false","rejects a null hypothesis that is actually false","rejects a null hypothesis that is actually true"],"a":2,"e":"A Type I error is rejecting H0 when it is true; its probability is the significance level α. Failing to reject a false H0 is a Type II error. Rejecting a false H0 is a correct decision.","d":1,"t":"Type I error","c":"Type I error: rejecting H0 when it is true (probability = significance level α). Type II error: failing to reject H0 when it is false (probability β; power = 1 − β)."},{"r":7,"q":"An analyst tests whether a strategy's mean monthly return differs from zero. A sample of 49 months has a mean of 1.2% and a standard deviation of 4.0%. The two-tailed critical value at the 5% level is 2.01. The test statistic and decision are:","o":["t = 2.10; reject the null hypothesis","t = 0.30; fail to reject the null hypothesis","t = 2.10; fail to reject the null hypothesis"],"a":0,"e":"t = (1.2 − 0)/(4.0/√49) = 1.2/0.5714 = 2.10 > 2.01: reject H0. 0.30 divides by the standard deviation instead of the standard error; with t = 2.10 above the critical value, failing to reject H0 would be a decision error.","d":2,"t":"t-test of a mean","c":"t-statistic for a test of the mean: t = (X̄ − μ0) / (s / √n), with n − 1 degrees of freedom; reject H0 if |t| exceeds the critical value."},{"r":7,"q":"A hypothesis test produces a p-value of 0.03. Which conclusion is most appropriate?","o":["The probability that the null hypothesis is true is 3%","The null hypothesis can be rejected at the 5% significance level but not at the 1% level","The null hypothesis can be rejected at the 1% significance level"],"a":1,"e":"The p-value is the smallest significance level at which H0 can be rejected: 0.03 < 0.05 (reject) but 0.03 > 0.01 (do not reject). It is not the probability that H0 is true. Rejection at the 1% level would require a p-value below 0.01.","d":2,"t":"p-value","c":"The p-value is the smallest significance level at which H0 can be rejected: reject if p-value < α."},{"r":7,"q":"An analyst tests whether a fund's return variance exceeds that of a target standard deviation of 15%. A sample of 20 annual returns has a standard deviation of 18%. The chi-square test statistic is:","o":["28.80","1.44","27.36"],"a":2,"e":"χ² = (n − 1) × s²/σ0² = 19 × 0.0324/0.0225 = 27.36. 28.80 uses n instead of n − 1; 1.44 is the simple ratio of variances (an F-type statistic).","d":3,"t":"Chi-square test of variance","c":"Chi-square test of a single variance: χ² = (n − 1) × s² / σ0², with n − 1 degrees of freedom."},{"r":7,"q":"Holding the significance level constant, which action will most likely increase the power of a hypothesis test?","o":["Increasing the sample size","Decreasing the sample size","Using a two-tailed test instead of a one-tailed test when the direction of the effect is known"],"a":0,"e":"Power (1 − probability of a Type II error) increases with sample size, which reduces the standard error. Reducing the sample does the opposite. Switching to a two-tailed test splits α over two tails and reduces power when the direction of the effect is known.","d":2,"t":"Power of a test","c":"Holding α constant, the power of a test (1 − β) is increased mainly by increasing the sample size; lowering α instead reduces power."},{"r":7,"q":"The sample correlation between two return series over 30 observations is 0.35. Given a two-tailed critical t-value of 2.048 at the 5% level (28 degrees of freedom), the test of whether the population correlation equals zero results in:","o":["t = 1.98; reject the null hypothesis","t = 1.98; fail to reject the null hypothesis","t = 1.85; fail to reject the null hypothesis"],"a":1,"e":"t = r√(n − 2)/√(1 − r²) = 0.35 × √28/√(1 − 0.1225) = 1.98 < 2.048: do not reject H0. Rejecting H0 would be wrong since |t| < critical value; 1.85 forgets the √(1 − r²) denominator.","d":3,"t":"Test of correlation","c":"Test of significance of a correlation: t = r × √(n − 2) / √(1 − r²), with n − 2 degrees of freedom; reject H0: ρ = 0 if |t| > critical value."},{"r":8,"q":"A portfolio invests 60% in Asset A, with an expected return of 10%, and 40% in Asset B, with an expected return of 6%. The portfolio's expected return is:","o":["8.00%","7.60%","8.40%"],"a":2,"e":"E(Rp) = 0.6 × 10% + 0.4 × 6% = 6.0% + 2.4% = 8.40%. 8.00% is the unweighted average; 7.60% swaps the weights (0.4 × 10% + 0.6 × 6%).","d":1,"t":"Portfolio expected return","c":"Portfolio expected return: E(R_P) = Σ wi × E(Ri), the weighted average of the expected returns."},{"r":8,"q":"A portfolio is 60% invested in Asset A (standard deviation 20%) and 40% in Asset B (standard deviation 10%). The correlation between the two assets is 0.3. The portfolio standard deviation is:","o":["13.74%","16.00%","12.65%"],"a":0,"e":"σp² = 0.6² × 0.04 + 0.4² × 0.01 + 2 × 0.6 × 0.4 × 0.3 × 0.20 × 0.10 = 0.01888; σp = 13.74%. 16.00% is the weighted average of the standard deviations (correlation of +1); 12.65% ignores the covariance term (zero correlation).","d":2,"t":"Two-asset portfolio risk","c":"Variance of a two-asset portfolio: σP² = w1²σ1² + w2²σ2² + 2 w1 w2 ρ12 σ1 σ2."},{"r":8,"q":"For a two-asset portfolio with fixed weights and fixed individual standard deviations, the portfolio standard deviation is lowest when the correlation between the assets is:","o":["0.0","−1.0","+1.0"],"a":1,"e":"The covariance term falls as correlation falls; at −1, risk can even be eliminated with the appropriate combination of weights. Zero correlation provides only partial diversification. At +1, there is no diversification benefit.","d":1,"t":"Correlation and diversification","c":"The diversification benefit grows as correlation falls; for given weights and volatilities, σP is lowest at ρ = −1 and equals the weighted average of the σ's at ρ = +1."},{"r":8,"q":"The risk-free rate is 3%, the market risk premium is 6%, and a stock's beta is 1.2. Using the CAPM, the stock's required return is:","o":["6.60%","7.20%","10.20%"],"a":2,"e":"E(R) = Rf + β × risk premium = 3% + 1.2 × 6% = 10.20%. 6.60% treats 6% as the market return (3% + 1.2 × 3%); 7.20% forgets to add the risk-free rate.","d":1,"t":"CAPM","c":"CAPM: E(Ri) = Rf + βi × [E(Rm) − Rf]."},{"r":8,"q":"The covariance between a stock's returns and the market's returns is 0.018, and the market's standard deviation is 15%. The stock's beta is:","o":["0.80","0.12","1.25"],"a":0,"e":"β = Cov(i,m)/σm² = 0.018/0.0225 = 0.80. 0.12 divides by the standard deviation instead of the variance; 1.25 is the inverse of the correct beta.","d":2,"t":"Beta calculation","c":"Beta: βi = Cov(Ri, Rm) / σm² = ρi,m × σi / σm."},{"r":8,"q":"According to capital market theory, the risk for which investors should expect to be compensated is:","o":["total risk, because investors care about the full variability of their returns","systematic risk, because unsystematic risk can be eliminated through diversification","unsystematic risk, because it is specific to each company"],"a":1,"e":"Specific risk can be diversified away at no cost, so the market rewards only systematic risk, measured by beta. Total risk includes an unrewarded diversifiable part. Specific risk, precisely because it is diversifiable, is not rewarded.","d":2,"t":"Systematic vs unsystematic risk","c":"Only systematic risk (non-diversifiable, measured by beta) is rewarded; specific (idiosyncratic) risk can be eliminated through diversification and earns no premium."},{"r":8,"q":"An investor allocates 70% to the market portfolio (expected return 10%, standard deviation 18%) and 30% to the risk-free asset yielding 3%. The expected return and standard deviation of the combined portfolio are:","o":["7.90%; 18.00%","7.00%; 12.60%","7.90%; 12.60%"],"a":2,"e":"E(R) = 0.3 × 3% + 0.7 × 10% = 7.90%; since the risk-free asset has zero volatility and zero covariance, σ = 0.7 × 18% = 12.60%. The second choice ignores the risk reduction; the third forgets the return on the risk-free asset.","d":2,"t":"Capital market line","c":"Combining the risk-free asset with the market portfolio (CAL/CML): E(R_P) = w × E(Rm) + (1 − w) × Rf and σP = w × σm, because the risk-free asset has zero variance."},{"r":8,"q":"As the number of assets in an equally weighted portfolio becomes very large, the portfolio variance approaches:","o":["the average covariance between the assets","zero","the average variance of the individual assets"],"a":0,"e":"With large n, the individual-variance term (weighted by 1/n) vanishes and portfolio variance converges to the average covariance: systematic risk remains. It only tends to zero if the average covariance is zero. The average asset variance would be the limit without diversification.","d":3,"t":"Diversification with many assets","c":"In an equally weighted portfolio of n assets, σP² = σ̄²/n + [(n − 1)/n] × average covariance; as n grows, the variance tends to the average covariance between assets."},{"r":9,"q":"Which sequence best describes the core steps of a Monte Carlo simulation used to value a portfolio?","o":["Collect historical returns, sort them, and select the median as the forecast","Specify the probability distributions of the risk factors, generate random draws, compute the portfolio value for each trial, and analyze the distribution of outcomes","Estimate a regression on past returns and use the fitted value as the single forecast"],"a":1,"e":"Monte Carlo simulation specifies distributions for the risk variables, draws random values, recomputes the value for each trial and studies the distribution of outcomes over a large number of trials. Sorting historical data or fitting a regression produces a point estimate, not a simulated distribution.","d":1,"t":"Monte Carlo process","c":"Steps of a Monte Carlo simulation: specify the variables and their distributions, generate random values, compute the outcome (e.g., portfolio value) for each draw, repeat many times, then analyze the distribution of outcomes (mean, standard deviation, quantiles)."},{"r":9,"q":"In a simulation, a stock priced at EUR 50 receives a randomly generated continuously compounded return of −8% for the next period. The simulated price at the end of the period is:","o":["EUR 46.00","EUR 54.16","EUR 46.16"],"a":2,"e":"With a continuously compounded return: S1 = S0 × e^r = 50 × e^(−0.08) = 46.16. 46.00 treats −8% as a discrete return; 54.16 applies the wrong sign.","d":2,"t":"Simulating lognormal prices","c":"With a continuously compounded return r, the simulated price is P1 = P0 × e^r."},{"r":9,"q":"A simulation draws a uniform random number of 0.9772. Using the inverse transformation method, this maps to a standard normal value of 2.00. If monthly returns are modeled as normal with a mean of 1% and a standard deviation of 5%, the simulated return is:","o":["11.00%","10.00%","3.00%"],"a":0,"e":"R = μ + z × σ = 1% + 2.00 × 5% = 11.00%. 10.00% forgets the mean; 3.00% adds z and the mean without multiplying by the standard deviation.","d":2,"t":"Inverse transformation method","c":"Inverse transformation method: a uniform random number U is converted into a quantile Z = F⁻¹(U); the simulated variable is then X = μ + Z × σ."},{"r":9,"q":"Bootstrap resampling of historical returns differs from Monte Carlo simulation mainly because bootstrapping:","o":["requires the analyst to specify a parametric distribution for each variable","draws repeatedly with replacement from the observed sample rather than from an assumed theoretical distribution","draws without replacement, so each historical observation can be used only once"],"a":1,"e":"Bootstrapping resamples with replacement from the observed data and imposes no theoretical distribution. Specifying a parametric distribution is specific to Monte Carlo. Draws are made with replacement, so an observation can appear several times.","d":2,"t":"Bootstrap resampling","c":"Bootstrapping resamples the observed historical data with replacement, without assuming a theoretical distribution; Monte Carlo draws from a parametric distribution specified by the analyst."},{"r":9,"q":"A key limitation of historical simulation compared with Monte Carlo simulation is that historical simulation:","o":["requires a strong assumption that returns are normally distributed","cannot capture correlations between risk factors","assumes the distribution of past outcomes is representative of the future and cannot easily address what-if scenarios outside the sample"],"a":2,"e":"Historical simulation relies on the actually observed past distribution: it cannot generate events absent from the history and does not easily allow testing of hypotheses. It precisely does not impose a normality assumption. It naturally preserves the historical correlations between factors.","d":2,"t":"Historical simulation","c":"Historical simulation assumes the past distribution will repeat and cannot generate events absent from the historical sample; it also does not allow what-if analysis."},{"r":9,"q":"A Monte Carlo simulation with 10,000 trials produces a standard error of the estimated mean portfolio value of EUR 0.12. To reduce the standard error to EUR 0.06, the number of trials required is:","o":["40,000","20,000","14,142"],"a":0,"e":"The standard error is proportional to 1/√n: to halve it, n must be multiplied by 2² = 4, i.e., 40,000 trials. 20,000 assumes a linear relationship; 14,142 (10,000 × √2) only reduces the error by a factor of √2.","d":3,"t":"Simulation standard error","c":"The standard error of a Monte Carlo estimate falls in proportion to 1/√n: to divide it by k, the number of trials must be multiplied by k²."},{"r":9,"q":"Daily continuously compounded returns are independent and identically distributed with a standard deviation of 1.2%. Assuming 250 trading days, the annual standard deviation of returns is:","o":["300.00%","18.97%","0.08%"],"a":1,"e":"Under the i.i.d. assumption, variances add up: annual σ = 1.2% × √250 = 18.97%. 300.00% multiplies the standard deviation by 250 (instead of the variance); 0.08% divides instead of multiplying.","d":2,"t":"Scaling volatility over time","c":"With i.i.d. continuously compounded returns, variance grows linearly with time: σ_T = σ_period × √T."},{"r":9,"q":"A simulated price path starts at EUR 100 and is generated using continuously compounded returns of 5%, −2%, and 3% over three periods. The final simulated price is:","o":["EUR 106.00","EUR 102.02","EUR 106.18"],"a":2,"e":"Continuous returns add up: 5 − 2 + 3 = 6%; S3 = 100 × e^0.06 = 106.18. 106.00 treats the sum as a discrete return; 102.02 uses the average return per period instead of the total.","d":3,"t":"Multi-period price simulation","c":"Continuously compounded returns add along a simulated path: P_T = P0 × e^(r1 + r2 + … + rT)."},{"r":10,"q":"In a regression of a stock's returns (Y) on market returns (X), the covariance between X and Y is 0.0024, the variance of X is 0.0016, the mean of Y is 8%, and the mean of X is 4%. The estimated intercept is:","o":["2.00%","4.00%","14.00%"],"a":0,"e":"Slope b1 = Cov(X,Y)/Var(X) = 0.0024/0.0016 = 1.50; intercept b0 = Ȳ − b1 × X̄ = 8% − 1.5 × 4% = 2.00%. 4.00% subtracts the means without the slope; 14.00% adds b1 × X̄ instead of subtracting it.","d":2,"t":"Regression intercept","c":"Ordinary least squares (OLS): slope b̂1 = Cov(X,Y) / Var(X) and intercept b̂0 = Ȳ − b̂1 × X̄ (the line passes through the point of means)."},{"r":10,"q":"A simple linear regression has a total sum of squares of 200 and a sum of squared errors of 50. The coefficient of determination (R²) is:","o":["0.25","0.75","0.33"],"a":1,"e":"R² = (SST − SSE)/SST = 150/200 = 0.75: 75% of the variation in Y is explained by X. 0.25 is the unexplained share (SSE/SST); 0.33 compares SSE with the explained sum of squares.","d":1,"t":"Coefficient of determination","c":"Coefficient of determination: R² = RSS / SST = 1 − SSE / SST, the share of the variation in Y explained by X."},{"r":10,"q":"The homoskedasticity assumption of simple linear regression states that:","o":["the residuals are uncorrelated with each other across observations","the independent variable is normally distributed","the variance of the residuals is constant across all observations"],"a":2,"e":"Homoskedasticity means the variance of the residuals is constant across observations. The absence of correlation between residuals is the independence assumption. Normality concerns the residuals, not the explanatory variable.","d":1,"t":"Regression assumptions","c":"Homoskedasticity: the variance of the residuals is constant for all observations. The other assumptions are linearity, independence and normality of the residuals."},{"r":10,"q":"A simple linear regression estimated with 32 observations has a regression sum of squares of 120 and a sum of squared errors of 180. The F-statistic is:","o":["20.00","21.33","0.67"],"a":0,"e":"F = MSR/MSE = (120/1)/(180/(32 − 2)) = 120/6 = 20.00. 21.33 divides SSE by n instead of n − 2; 0.67 compares the sums of squares without degrees of freedom.","d":2,"t":"F-statistic","c":"F-statistic in simple regression: F = MSR / MSE = (RSS / 1) / [SSE / (n − 2)], with 1 and n − 2 degrees of freedom."},{"r":10,"q":"A simple linear regression estimated with 32 observations has a sum of squared errors of 180. The standard error of the estimate is:","o":["2.37","2.45","6.00"],"a":1,"e":"SEE = √[SSE/(n − 2)] = √(180/30) = √6 = 2.45. 2.37 divides by n instead of n − 2; 6.00 is the MSE (the square of the SEE).","d":2,"t":"Standard error of the estimate","c":"Standard error of the estimate: SEE = √MSE = √[SSE / (n − 2)]."},{"r":10,"q":"An estimated regression is Ŷ = 0.5 + 1.2X. If X = 3, the predicted value of Y is:","o":["3.60","5.10","4.10"],"a":2,"e":"Ŷ = 0.5 + 1.2 × 3 = 0.5 + 3.6 = 4.10. 3.60 forgets the intercept; 5.10 is a calculation error from multiplying (0.5 + 1.2) × 3.","d":1,"t":"Regression prediction","c":"Point forecast: Ŷ = b̂0 + b̂1 × X, substituting the given value of X."},{"r":10,"q":"In a log-lin regression model, ln(Y) = b0 + b1X. The slope coefficient b1 is best interpreted as the:","o":["approximate relative (percentage) change in Y for a one-unit change in X","absolute change in Y for a one-unit change in X","change in Y for a 1% change in X"],"a":0,"e":"In a log-lin model, the dependent variable is in logarithms: b1 measures the relative change in Y (about b1 × 100%) for a one-unit increase in X. An absolute change corresponds to the linear model. A change in Y for a 1% change in X corresponds to the lin-log model.","d":3,"t":"Functional forms","c":"Functional forms: log-lin ln(Y) = b0 + b1X → b1 is the relative change in Y for a one-unit change in X; lin-log Y = b0 + b1 ln(X) → b1 is the absolute change in Y for a relative change in X; log-log → b1 is an elasticity."},{"r":10,"q":"A regression of a stock's excess returns on market excess returns gives a slope of 0.84 with a standard error of 0.30. The critical t-value at the 5% level is 2.05. Testing H0: b1 = 1 against Ha: b1 ≠ 1, the analyst should:","o":["reject H0 because t = 2.80","fail to reject H0 because t = -0.53","reject H0 because t = -0.53"],"a":1,"e":"t = (0.84 − 1)/0.30 = -0.53; |t| < 2.05: do not reject H0, beta is not significantly different from 1. 2.80 tests b1 = 0 rather than b1 = 1; rejecting H0 with t = -0.53 misreads the decision rule.","d":3,"t":"Hypothesis test of the slope","c":"Testing a slope coefficient against a hypothesized value: t = (b̂1 − B1) / s_b̂1, with n − 2 degrees of freedom; reject H0 if |t| > critical t."},{"r":11,"q":"Which characteristic of big data refers to the reliability and quality of the data, including noise and potential biases?","o":["Velocity","Variety","Veracity"],"a":2,"e":"Veracity refers to the reliability and quality of the data (errors, noise, bias). Velocity concerns the speed at which data are produced and processed. Variety refers to the diversity of formats (structured, semi-structured, unstructured).","d":1,"t":"Big data characteristics","c":"The Vs of big data: volume (quantity), velocity (speed of production), variety (diversity of formats) and veracity (reliability and quality of the data, noise and bias)."},{"r":11,"q":"An analyst collects transcripts of company earnings calls to measure management sentiment. These data are best classified as:","o":["unstructured data","structured data","time-series price data"],"a":0,"e":"The free text of conference calls does not follow a predefined tabular format: it is unstructured data, which requires processing (NLP) before analysis. Structured data are organized in rows and columns. It is not a price series.","d":1,"t":"Structured vs unstructured data","c":"Data are structured (row/column tables), semi-structured (e.g., HTML, JSON) or unstructured (text, images, audio); text and transcripts are unstructured, often alternative, data."},{"r":11,"q":"An analyst groups stocks into clusters based on the similarity of their return patterns, without using any pre-labeled categories. This approach is an example of:","o":["supervised learning","unsupervised learning","deep learning applied to labeled data"],"a":1,"e":"Without a labeled target variable, grouping (clustering) falls under unsupervised learning. Supervised learning requires labeled data to learn an input–output relationship. Deep learning on labeled data is a form of supervised learning.","d":1,"t":"Supervised vs unsupervised learning","c":"Supervised learning: labeled data (regression, classification). Unsupervised learning: no labels, searching for structure (clustering, dimension reduction). Deep learning: multi-layer neural networks."},{"r":11,"q":"A machine learning model achieves 98% accuracy on its training da
