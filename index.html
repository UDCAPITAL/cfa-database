 ABS are backed by amortizing loans: cash flows consist of interest, scheduled principal and prepayments. They commonly use subordination, reserve accounts, overcollateralization and excess spread as credit enhancement."},{"r":18,"q":"During the lockout (revolving) period of a credit card receivable ABS, principal repayments by cardholders are most likely:","o":["held in a reserve account until maturity.","passed through to the senior tranche.","used to purchase additional receivables."],"a":2,"e":"During the revolving period, principal repayments are used to buy new receivables: investors receive only interest and fees. Principal is distributed only after the lockout, or in an early amortization.","d":2,"t":"Credit card ABS","c":"Credit card ABS are backed by non-amortizing revolving receivables. During the lockout (revolving) period, principal collections buy new receivables and investors receive only interest and fees; principal is paid during the amortization period."},{"r":18,"q":"An early (rapid) amortization provision in a credit card ABS is most likely triggered by:","o":["a deterioration in the performance of the receivables.","the end of the scheduled amortization period.","a decline in market interest rates."],"a":0,"e":"Early amortization is triggered by adverse events (high losses, excess spread too low) in order to repay investors quickly. A fall in rates does not trigger it, and the end of the scheduled period corresponds to normal amortization.","d":2,"t":"Early amortization","c":"An early (rapid) amortization provision forces principal to be paid to investors before the scheduled date when performance triggers are breached (e.g., excess spread falls below a threshold), protecting credit card ABS holders."},{"r":18,"q":"A collateralized loan obligation (CLO) is best described as a structured security backed primarily by:","o":["a pool of leveraged (corporate) loans.","credit card receivables.","residential mortgage loans."],"a":0,"e":"A CLO is a CDO whose collateral is a pool of leveraged corporate loans, managed by a collateral manager. Residential mortgages back RMBS, and credit card receivables back credit card ABS.","d":1,"t":"CLO","c":"A CDO is a structured security backed by a diversified pool of debt obligations, actively managed by a collateral manager; a CLO is a CDO backed by leveraged bank loans. Equity investors earn the residual after paying the debt tranches."},{"r":18,"q":"A CDO holds collateral of 100 million yielding 8%. It issues a senior tranche of 70 million paying 5% and a mezzanine tranche of 20 million paying 7%; the remaining 10 million is equity. Ignoring fees and defaults, the annual return to the equity tranche is closest to:","o":["3.1%","8%","31%"],"a":2,"e":"Collateral income = 8m; interest paid = 70 × 5% + 20 × 7% = 3.5 + 1.4 = 4.9m; equity residual = 3.1m, i.e., 3.1/10 = 31%. 8% is the collateral yield, and 3.1% relates the residual to total collateral instead of the equity.","d":3,"t":"CDO equity return","c":"CDO equity return = (collateral income − interest paid to debt tranches − losses/fees) ÷ equity tranche size. Because the equity tranche is small, it is highly levered to the collateral spread and to losses."},{"r":18,"q":"A CDO holds collateral of 100 million yielding 8%. It issues a senior tranche of 70 million paying 5% and a mezzanine tranche of 20 million paying 7%; the remaining 10 million is equity. If credit losses reduce collateral income by 1.5 million in a year, the equity tranche return is closest to:","o":["29.5%","16%","31%"],"a":1,"e":"Residual = 8 − 4.9 − 1.5 = 1.6m, i.e., 1.6/10 = 16%. Since the debt tranches are paid first, the entire loss falls on the equity. 31% ignores the loss, and 29.5% wrongly allocates it pro rata (10%) to the equity.","d":3,"t":"CDO equity leverage","c":"In a CDO, collateral losses reduce the residual available to the equity tranche first, so equity returns are highly sensitive to defaults: equity return = (collateral income − debt interest − losses) ÷ equity."},{"r":18,"q":"A key reason many ABS tranches receive credit ratings higher than the rating of the originator is that:","o":["the originator guarantees all principal payments.","the collateral is isolated in an SPE and the structure includes credit enhancement.","ABS are always backed by government guarantees."],"a":1,"e":"The rating depends on the quality of the collateral isolated in the SPE and on credit enhancement (subordination, overcollateralization, excess spread), not on the originator's rating. The originator does not guarantee payments, and private ABS have no government guarantee.","d":2,"t":"ABS credit ratings","c":"ABS ratings reflect the collateral held by the bankruptcy-remote SPE and the deal's credit enhancement, so senior tranches can be rated above the originator. Ratings vary by tranche according to seniority."},{"r":19,"q":"When market interest rates fall significantly, holders of mortgage pass-through securities are most exposed to:","o":["extension risk.","a decrease in prepayments.","contraction risk."],"a":2,"e":"A fall in rates speeds up refinancing and therefore prepayments: the average life shortens and principal must be reinvested at lower rates (contraction risk). Extension risk arises when rates rise and prepayments slow.","d":1,"t":"Contraction risk","c":"Prepayment risk has two sides: contraction risk (rates fall, prepayments accelerate, shorter life, reinvestment at lower rates, negative convexity) and extension risk (rates rise, prepayments slow, longer life just as the security is worth less)."},{"r":19,"q":"A mortgage pool has a conditional prepayment rate (CPR) of 6%. The single monthly mortality rate (SMM) is closest to:","o":["0.4868%","0.5143%","0.5000%"],"a":1,"e":"SMM = 1 − (1 − CPR)^(1/12) = 1 − 0.94^(1/12) = 0.5143%. 0.5000% simply divides by 12, and 0.4868% wrongly applies compounding at 1.06.","d":2,"t":"CPR and SMM","c":"The conditional prepayment rate (CPR) is annual; the single monthly mortality rate is SMM = 1 − (1 − CPR)^(1/12). Conversely CPR = 1 − (1 − SMM)^12."},{"r":19,"q":"A mortgage pool has a beginning-of-month balance of 200 million and scheduled principal repayment of 0.8 million for the month. If the SMM is 0.6%, the prepayment for the month is closest to:","o":["1.2000 million","1.1952 million","2.0000 million"],"a":1,"e":"Prepayment = SMM × (beginning balance − scheduled principal) = 0.6% × 199.2 = 1.1952m. 1.2000m applies the SMM to the beginning balance without deducting scheduled principal, and 2.0000m additionally adds the scheduled principal.","d":3,"t":"Monthly prepayment","c":"Monthly prepayment = SMM × (beginning-of-month balance − scheduled principal payment for the month). Total principal received = scheduled principal + prepayment."},{"r":19,"q":"Under the PSA benchmark, CPR rises by 0.2% per month for the first 30 months and then stays at 6%. At 150 PSA, the CPR in month 10 and in month 40 are, respectively:","o":["3% and 9%","2% and 6%","3% and 6%"],"a":0,"e":"At 100 PSA, CPR = 0.2% × 10 = 2% in month 10 and 6% from month 30. At 150 PSA: 1.5 × 2% = 3% and 1.5 × 6% = 9%. The second answer corresponds to 100 PSA, and the third forgets to scale the 6% plateau.","d":2,"t":"PSA prepayment benchmark","c":"PSA benchmark (100 PSA): CPR = 0.2% × month for months 1-30, then 6% per year. A speed of x PSA multiplies the whole benchmark CPR path by x/100."},{"r":19,"q":"In a sequential-pay CMO with two tranches (A receives all principal first, then B), which statement is most accurate?","o":["Both tranches have the same exposure to prepayment risk as the underlying pass-through.","Tranche A is protected against contraction risk by Tranche B.","Tranche B is protected against contraction risk while Tranche A is outstanding."],"a":2,"e":"Until A is repaid, all principal (including prepayments) goes to it: B is protected against contraction, while A benefits from protection against extension. Sequential tranching redistributes prepayment risk; it is not shared identically.","d":3,"t":"Sequential-pay CMO","c":"Sequential-pay CMO: each tranche receives principal only after the previous one is retired. Short tranches bear more contraction risk but are protected against extension; longer tranches are protected against contraction but bear more extension risk."},{"r":19,"q":"In a CMO structure with a planned amortization class (PAC) tranche, the support tranche:","o":["has lower prepayment risk than the PAC tranche.","absorbs prepayment variability so that the PAC can follow its schedule.","receives principal only after the PAC tranche is fully retired."],"a":1,"e":"The support tranche receives excess prepayments or absorbs shortfalls so that the PAC meets its schedule within the specified PSA band; it therefore bears more prepayment risk. It may receive principal before the PAC is retired.","d":2,"t":"PAC and support tranches","c":"In a PAC/support CMO, the PAC tranche follows a scheduled principal path as long as prepayments stay within the PSA collar; support (companion) tranches absorb the excess or shortfall and thus carry greater contraction and extension risk."},{"r":19,"q":"A commercial property securing a CMBS loan has net operating income of 2.4 million and annual debt service of 2.0 million. The debt service coverage ratio is:","o":["1.20x","0.20x","0.83x"],"a":0,"e":"DSCR = NOI / debt service = 2.4/2.0 = 1.20x. 0.83x reverses the ratio, and 0.20x keeps only the surplus (2.4 − 2.0)/2.0. A DSCR above 1 indicates that the property's income covers debt service.","d":1,"t":"CMBS DSCR","c":"CMBS credit analysis focuses on each property's ability to service its loan: debt service coverage ratio = NOI ÷ debt service (higher is better) and loan-to-value = loan ÷ appraised value (lower is better)."}]},{"subject":7,"questions":[{"r":1,"q":"Which of the following best describes a derivative?","o":["A security that gives the holder a residual ownership claim on the issuer's net assets","A debt instrument whose coupon is reset periodically according to a market reference rate","A financial instrument whose value is determined by the performance of an underlying asset, rate, index, or other variable"],"a":2,"e":"A derivative derives its value from an underlying (asset, rate, index, credit event). The second option describes a share (an ownership claim) and the third a floating-rate bond; both are cash market instruments, not derivatives.","d":1,"t":"Derivative definition","c":"A derivative is an instrument whose value depends on the performance of an underlying: an asset, rate, index, currency, commodity or credit event. Stocks and bonds are cash market instruments, not derivatives."},{"r":1,"q":"Compared with over-the-counter (OTC) derivatives, exchange-traded derivatives are most likely characterized by:","o":["standardized contract terms and a clearinghouse that guarantees performance.","contract terms tailored to the specific needs of each end user.","lower transparency because trades are privately negotiated."],"a":0,"e":"Exchange-traded derivatives have standardized terms (size, maturity, quality) and the clearinghouse guarantees performance, with margin calls. Customization and lack of transparency are instead characteristics of over-the-counter (OTC) derivatives.","d":1,"t":"Exchange-traded vs OTC","c":"Exchange-traded derivatives (ETDs) are standardized, transparent, liquid and cleared by a central counterparty (CCP) with margin, so counterparty risk is nearly zero. OTC derivatives are customizable but less transparent and more exposed to counterparty risk."},{"r":1,"q":"When a central counterparty (CCP) clears a derivative trade between two parties, the CCP most likely:","o":["acts only as a broker that matches orders, leaving counterparty credit risk with the original parties.","becomes the buyer to every seller and the seller to every buyer, assuming the counterparty credit risk of each side.","eliminates market risk for both parties by guaranteeing each of them a profit."],"a":1,"e":"Through novation, the CCP steps in between the two parties and becomes the counterparty to each; it therefore bears counterparty risk, which it manages through margin. It does not merely match orders, and it does not eliminate market risk: each party remains exposed to changes in the underlying.","d":2,"t":"Central counterparty","c":"A central counterparty (CCP) interposes itself between the two parties through novation: it becomes the buyer to every seller and the seller to every buyer, and guarantees performance through margin and its own financial resources."},{"r":1,"q":"A credit derivative most likely has as its underlying:","o":["the level of a broad equity market index.","the credit risk of a reference entity, such as the risk of default by a bond issuer.","the spot price of a physical commodity such as crude oil."],"a":1,"e":"The underlying of a credit derivative (e.g., a CDS) is the credit risk of a reference entity: default, bankruptcy or restructuring. Equity indexes and commodities are underlyings of other categories of derivatives (equity, commodity).","d":1,"t":"Underlying types","c":"A credit derivative has as its underlying the credit risk of a reference borrower, i.e., a credit event (default, bankruptcy, restructuring); the typical example is the credit default swap (CDS)."},{"r":1,"q":"Following the regulatory reforms introduced after the 2008 global financial crisis, standardized OTC derivatives transacted between dealers are most likely:","o":["converted into exchange-traded futures contracts.","exempted from margin requirements because they are privately negotiated.","required to be cleared through a central counterparty and reported to trade repositories."],"a":2,"e":"Post-2008 reforms (Dodd-Frank, EMIR) require central clearing of standardized OTC derivatives and reporting to trade repositories, with margin requirements. They remain OTC contracts (not converted into futures) and are not exempt from margin; quite the opposite.","d":2,"t":"OTC market regulation","c":"Since the post-2008 reforms (Dodd-Frank, EMIR), standardized OTC derivatives between dealers must be centrally cleared through a CCP and reported to trade repositories, which brings OTC markets closer to how exchange markets operate."},{"r":1,"q":"An investor buys 5 equity index futures contracts. The index level is 4,000 and the contract multiplier is 250. The notional amount of the position is closest to:","o":["1,000,000","20,000","5,000,000"],"a":2,"e":"Notional = index level × multiplier × number of contracts = 4,000 × 250 × 5 = 5,000,000. 1,000,000 corresponds to a single contract; 20,000 forgets the multiplier.","d":1,"t":"Contract notional","c":"The notional amount of an index futures position = index level × contract multiplier × number of contracts. Notional measures exposure, not the value of the contract or the amount paid."},{"r":1,"q":"Regarding the size of derivative markets, which statement is most accurate?","o":["Market value is always larger than notional because it includes leverage.","Notional amounts greatly overstate the economic exposure, since the market value of outstanding contracts is typically a small fraction of notional.","Notional amount is the best measure of the amount of money that changes hands between counterparties."],"a":1,"e":"Notional is the basis for computing cash flows but is generally not exchanged (e.g., an interest rate swap); the market value of outstanding contracts is only a small fraction of notional. Market value is not greater than notional, and notional does not measure the amounts actually exchanged.","d":2,"t":"Notional vs market value","c":"The size of derivative markets is measured by notional amount, which greatly overstates economic exposure, and by gross market value, which is much smaller. Interest rate derivatives account for the vast majority of amounts outstanding."},{"r":1,"q":"A contract creates an obligation for both parties to transact at a pre-agreed price on a future date, requires no payment at initiation, and has a payoff that moves one-for-one with the underlying price. This contract is best classified as a:","o":["contingent claim.","forward commitment.","hybrid instrument with an embedded option."],"a":1,"e":"A firm commitment (forward, futures, swap) obligates both parties, generally requires no initial payment and has a linear payoff profile. A contingent claim (option) gives a right to only one party, requires a premium and has a nonlinear profile; a hybrid with an embedded option would also have a nonlinear component.","d":3,"t":"Forward commitment vs contingent claim","c":"A firm commitment obligates both parties to perform: forwards, futures and swaps. There is no premium at initiation (zero value) and the payoff is linear (symmetric), unlike contingent claims such as options."},{"r":2,"q":"An investor enters a long forward contract on 1,000 units of an asset at a forward price of 50. At expiration the spot price is 46. The investor's payoff is:","o":["a loss of 4,000.","a gain of 4,000.","zero, because the forward required no initial payment."],"a":0,"e":"Long forward payoff at expiration = (S_T − F0) × quantity = (46 − 50) × 1,000 = −4,000. A gain of 4,000 would be the short position's payoff; the absence of an initial payment does not prevent a gain or loss at expiration.","d":1,"t":"Forward payoff","c":"Forward payoff at expiration: long = S_T − F_0(T), short = F_0(T) − S_T, multiplied by the quantity. A forward is a zero-sum game: one party's gain is the other's loss."},{"r":2,"q":"The key feature that distinguishes a futures contract from a forward contract is that a futures contract:","o":["obligates only the buyer, not the seller, to transact at expiration.","is marked to market daily, with gains and losses settled through margin accounts.","requires the buyer to pay a premium at initiation."],"a":1,"e":"Futures are revalued every day (mark-to-market) and gains/losses are settled daily through margin accounts, on an organized exchange. Both parties remain obligated and no premium is paid: those features describe an option.","d":1,"t":"Futures vs forwards","c":"A futures contract is standardized, exchange-traded, cleared by a CCP and subject to daily settlement of gains and losses (mark-to-market) through a margin account; a forward is a customized OTC contract settled only at maturity."},{"r":2,"q":"A plain vanilla interest rate swap is best described as:","o":["a series of forward commitments to exchange fixed and floating interest payments on a notional amount.","a single forward contract on a fixed-rate bond.","a portfolio of call options on a market reference rate."],"a":0,"e":"A swap is equivalent to a series of successive forwards (FRAs) exchanging a fixed cash flow for a floating cash flow on a notional amount. It is not a single forward, nor a portfolio of options: a swap is a firm commitment, with no premium and no right to walk away.","d":2,"t":"Swap as series of forwards","c":"A plain vanilla interest rate swap periodically exchanges fixed-rate payments for floating-rate payments (MRR) on the same notional amount in the same currency; the notional is not exchanged and only the net payment is made."},{"r":2,"q":"An investor buys a call option with an exercise price of 40 for a premium of 3. At expiration the underlying price is 45. The investor's profit per share is:","o":["5.","−3.","2."],"a":2,"e":"Payoff = max(0, 45 − 40) = 5; profit = 5 − 3 = 2. The figure 5 is the payoff before deducting the premium; −3 would correspond to an unexercised option (loss limited to the premium).","d":1,"t":"Call profit","c":"Call buyer: payoff = max(0, S_T − X); profit = payoff − premium c_0. Maximum loss = premium; potential gain is unlimited."},{"r":2,"q":"An investor writes a put option with an exercise price of 60 and receives a premium of 4. At expiration the underlying is at 53. The writer's profit is:","o":["−7.","−3.","4."],"a":1,"e":"Put writer's payoff = −max(0, 60 − 53) = −7; profit = −7 + 4 = −3. −7 ignores the premium received; 4 wrongly assumes the option expires worthless when it is in the money.","d":2,"t":"Short put profit","c":"Put writer (short put): payoff = −max(0, X − S_T); profit = premium p_0 − max(0, X − S_T). Maximum gain = premium; maximum loss = X − p_0 (if S_T = 0)."},{"r":2,"q":"In a credit default swap (CDS), the protection buyer most likely:","o":["receives periodic payments and compensates the seller if a credit event occurs.","receives the full face value of the reference bond at maturity regardless of whether a credit event occurs.","makes periodic payments and receives a payment from the protection seller if a credit event occurs on the reference entity."],"a":2,"e":"The protection buyer pays a periodic premium (spread) and is compensated by the seller if a credit event occurs. The second option reverses the roles; the third ignores the contingent nature of the payment, which occurs only upon a credit event.","d":2,"t":"Credit default swap","c":"In a credit default swap (CDS), the protection buyer pays periodic premiums (CDS spread) to the seller and, upon a credit event, receives compensation equal to the loss (notional × (1 − recovery rate)). Economically, it is insurance against default."},{"r":2,"q":"A put option has an exercise price of 80 and costs 5. The breakeven underlying price at expiration for the put buyer is:","o":["85.","80.","75."],"a":2,"e":"The put buyer's breakeven is X − p = 80 − 5 = 75: below it, the payoff exceeds the premium. 85 (X + premium) is a call's breakeven; 80 ignores the cost of the premium.","d":1,"t":"Put breakeven","c":"Breakeven at expiration: call = X + c_0; put = X − p_0. Above (call) or below (put) this level, the buyer makes a profit."},{"r":2,"q":"A trader buys one futures contract on 100 units at a price of 100. Initial margin is 2,000 and maintenance margin is 1,500. The settlement price is 96 at the end of day 1 and 94 at the end of day 2. The variation margin the trader must deposit at the end of day 2 is:","o":["100","600","0"],"a":1,"e":"Day 1: loss (96 − 100) × 100 = −400, balance 1,600 ≥ 1,500, no call. Day 2: loss (94 − 96) × 100 = −200, balance 1,400 < 1,500: the account must be restored to initial margin, i.e., 2,000 − 1,400 = 600. 100 only brings the account back to maintenance margin (a classic error); 0 ignores the drop below maintenance margin.","d":3,"t":"Futures margin call","c":"Futures: daily variation margin = (today's settlement price − previous day's) × contract size. If the account balance falls below the maintenance margin, a margin call requires restoring the account to the initial margin, not to the maintenance margin."},{"r":3,"q":"Which of the following is most likely a benefit of derivatives to the financial markets?","o":["They facilitate price discovery and allow risk to be transferred at lower transaction costs than in the cash market.","They eliminate counterparty credit risk for all market participants.","They reduce leverage in the financial system."],"a":0,"e":"Derivatives promote price discovery, liquidity and low-cost risk transfer. They do not eliminate counterparty risk (especially OTC), and they tend to increase leverage, which is one of their risks.","d":1,"t":"Derivative benefits","c":"Benefits of derivatives to markets: efficient risk transfer and management, price discovery, low transaction costs, leverage, liquidity, and easier short selling than in the cash market."},{"r":3,"q":"A jet fuel buyer hedges its future purchases using crude oil futures. The risk that the prices of jet fuel and crude oil do not move together is best described as:","o":["counterparty credit risk.","liquidity risk.","basis risk."],"a":2,"e":"Basis risk arises from the mismatch between the hedged exposure (jet fuel) and the derivative's underlying (crude oil), whose prices can diverge. Counterparty risk concerns the other party's default; liquidity risk concerns difficulty funding margin calls or unwinding the position.","d":2,"t":"Basis risk","c":"Basis risk arises when the underlying of the hedging derivative differs from the hedged exposure (or maturities differ): the two prices do not move perfectly together, so the hedge is imperfect."},{"r":3,"q":"A company has issued fixed-rate bonds and enters into a receive-fixed, pay-floating interest rate swap to offset changes in the bonds' fair value due to interest rate movements. Under hedge accounting, this is most likely designated as a:","o":["fair value hedge.","cash flow hedge.","net investment hedge."],"a":0,"e":"Fixed-rate debt has a fair value that changes with interest rates; the receive-fixed swap offsets these changes: this is a fair value hedge. A cash flow hedge targets variable cash flows (e.g., floating-rate debt hedged with a pay-fixed swap); a net investment hedge relates to a foreign subsidiary.","d":3,"t":"Fair value hedge","c":"Fair value hedge: the derivative offsets changes in the value of a balance sheet asset or liability (e.g., fixed-rate debt hedged with a receive-fixed/pay-floating swap). Gains and losses on both the derivative and the hedged item go through profit or loss."},{"r":3,"q":"A firm with floating-rate debt enters into a pay-fixed interest rate swap to stabilize its future interest payments. This is best described as a:","o":["cash flow hedge.","fair value hedge.","net investment hedge."],"a":0,"e":"The pay-fixed swap converts variable interest payments into fixed payments, reducing the variability of future cash flows: this is a cash flow hedge. A fair value hedge applies to an item whose value varies (fixed-rate debt); a net investment hedge concerns currency risk on a foreign subsidiary.","d":2,"t":"Cash flow hedge","c":"Cash flow hedge: the derivative stabilizes variable future cash flows (e.g., floating-rate debt + pay-fixed swap). The effective portion of changes in the derivative's fair value is recorded in OCI and later reclassified to profit or loss."},{"r":3,"q":"A US parent company sells euros forward to offset currency risk on the equity of its eurozone subsidiary. Under hedge accounting, this is most likely a:","o":["fair value hedge.","net investment hedge.","cash flow hedge."],"a":1,"e":"Hedging currency risk on the equity of a foreign subsidiary is a net investment hedge in a foreign operation. It is neither a hedge of the fair value of a recognized asset/liability nor of specific future cash flows.","d":2,"t":"Net investment hedge","c":"Net investment hedge: the derivative (often a currency forward or foreign-currency debt) hedges currency risk on the equity of a foreign subsidiary; changes are recorded in OCI (currency translation adjustment)."},{"r":3,"q":"A portfolio manager wants to quickly increase the equity exposure of a balanced fund for a few weeks. Compared with buying the underlying stocks, using equity index futures is most likely advantageous because futures:","o":["offer lower transaction costs and greater liquidity, with a small capital outlay.","remove all market risk from the portfolio.","eliminate the need for any margin deposit."],"a":0,"e":"Index futures allow exposure to be adjusted quickly with low transaction costs, high liquidity and little capital committed (margin). They add market risk rather than eliminating it, and initial margin is still required.","d":1,"t":"Investor use of futures","c":"Investors use derivatives to modify an exposure quickly and cheaply (tactical allocation, hedging, leverage) without buying or selling the underlying securities: lower transaction costs, liquidity and a smaller cash outlay."},{"r":3,"q":"Which of the following is most likely a risk that derivatives pose to the broader financial system?","o":["Excessive speculation and interconnectedness among counterparties can contribute to systemic risk.","Derivatives prevent investors from expressing views on asset prices.","Derivatives always reduce the volatility of the underlying cash market."],"a":0,"e":"Leverage, excessive speculation and interconnectedness among counterparties can spread defaults and create systemic risk (e.g., the 2008 crisis). Derivatives actually make it easier to express views on prices, and they do not always reduce volatility in cash markets.","d":2,"t":"Systemic risk","c":"Systemic risks of derivatives: excessive leverage, interconnected counterparty risk, contagion (systemic risk) in periods of stress, OTC opacity and speculative use; margin requirements and central clearing aim to reduce them."},{"r":3,"q":"An investor holds 10,000 units of an asset currently priced at 50 and sells forward 8,000 units at a forward price of 50. At expiration the asset price is 45. The combined gain or loss on the asset and the forward position is closest to:","o":["0","-10,000","-50,000"],"a":1,"e":"Loss on the asset: 10,000 × (45 − 50) = −50,000. Gain on the short forward: 8,000 × (50 − 45) = +40,000. Total = −10,000: only 2,000 units remain unhedged. 0 assumes a full hedge; −50,000 ignores the forward.","d":2,"t":"Partial hedge","c":"A short forward hedge locks in the price of the hedged quantity; only the unhedged portion remains exposed to price changes. Total result = change in value of the spot position + short forward payoff (F_0 − S_T) × quantity sold forward."},{"r":4,"q":"An asset with no income or carrying costs trades at 100. The annually compounded risk-free rate is 5%. The no-arbitrage price of a one-year forward contract on the asset is closest to:","o":["95.24","105.00","100.00"],"a":1,"e":"F0 = S0 × (1 + r)^T = 100 × 1.05 = 105.00. 95.24 discounts instead of compounding; 100.00 ignores the financing (carry) cost.","d":1,"t":"No-arbitrage forward price","c":"No-arbitrage forward price of an asset with no income or costs: F_0(T) = S_0 × (1 + r)^T (discrete compounding) or S_0 × e^(rT) (continuous)."},{"r":4,"q":"An asset with no income or carrying costs trades at 100, and the one-year risk-free rate is 5% (annual compounding). A dealer quotes a one-year forward price of 108. An arbitrageur would most likely:","o":["borrow 100, buy the asset, and sell the forward, earning 3 at expiration.","short the asset, lend the proceeds, and buy the forward, earning 3 at expiration.","borrow 100, buy the asset, and sell the forward, earning 8 at expiration."],"a":0,"e":"Equilibrium price = 100 × 1.05 = 105 < 108: the forward is overpriced. Cash-and-carry: borrow 100, buy the asset, sell the forward at 108; at expiration, deliver the asset for 108 and repay 105, for a gain of 3. The reverse strategy would lose money; 8 ignores the borrowing cost.","d":2,"t":"Cash-and-carry arbitrage","c":"If F_market > S_0(1 + r)^T: cash-and-carry (borrow, buy the underlying, sell forward). If F_market < S_0(1 + r)^T: reverse cash-and-carry (short the underlying, lend, buy forward). The arbitrage profit at expiration = difference between the quoted and theoretical prices."},{"r":4,"q":"A stock trades at 100 and will pay a dividend of 3 in three months. The risk-free rate is 4% (annual compounding). The no-arbitrage price of a one-year forward on the stock is closest to:","o":["101.00","100.91","107.09"],"a":1,"e":"F0 = S0(1 + r)^T − FV(dividend) = 100 × 1.04 − 3 × 1.04^0.75 = 104 − 3.09 = 100.91. 101.00 does not compound the dividend over the remaining 9 months; 107.09 adds the dividend, whereas income reduces the forward price.","d":2,"t":"Forward with dividend","c":"With income (dividend, coupon): F_0(T) = (S_0 − PV(I)) × (1 + r)^T; the income, received by the holder of the underlying but not by the forward holder, reduces the forward price."},{"r":4,"q":"A commodity trades at 50. The present value of storage costs over the next year is 1.5, and the risk-free rate is 3% (annual compounding). Assuming no convenience yield, the one-year forward price is closest to:","o":["51.50","53.05","49.95"],"a":1,"e":"Storage costs increase the cost of carry: F0 = (S0 + PV costs) × (1 + r)^T = 51.5 × 1.03 = 53.05. 51.50 ignores storage; 49.95 wrongly treats the cost as income.","d":2,"t":"Cost of carry - storage","c":"With carrying (storage) costs: F_0(T) = (S_0 + PV(C)) × (1 + r)^T; costs borne by the holder of the underlying increase the forward price. General formula: F_0 = (S_0 − PV(I) + PV(C)) × (1 + r)^T."},{"r":4,"q":"Buying an asset and simultaneously selling a forward contract on that asset (with no income or costs) replicates:","o":["a risk-free asset earning the risk-free rate.","a long call option on the asset.","a leveraged long position in the asset."],"a":0,"e":"Long asset + short forward guarantees a known sale price F0: the position is risk-free and must earn the risk-free rate, otherwise there is arbitrage. It does not have a call's asymmetric profile, and the short forward removes exposure rather than amplifying it.","d":1,"t":"Replication","c":"Replication: long underlying + short forward = risk-free asset (certain amount F_0 received at expiration), which therefore earns the risk-free rate; symmetrically, underlying = risk-free asset + long forward."},{"r":4,"q":"An equity index is at 1,200, the continuously compounded risk-free rate is 3%, and the continuously compounded dividend yield is 1.5%. The no-arbitrage price of a six-month forward on the index is closest to:","o":["1,209.03","1,227.31","1,218.14"],"a":0,"e":"F0 = S0 × e^((r − q)T) = 1,200 × e^(0.015 × 0.5) = 1,209.03. 1,227.31 adds the dividend yield instead of subtracting it; 1,218.14 ignores the dividend.","d":2,"t":"Continuous compounding forward","c":"Continuous compounding with dividend yield q: F_0(T) = S_0 × e^((r − q)T). With a carrying cost c: F_0(T) = S_0 × e^((r + c − q)T)."},{"r":4,"q":"Holding all else equal, an increase in the convenience yield of a physical commodity will most likely:","o":["increase the forward price relative to the spot price.","decrease the forward price relative to the spot price.","have no effect on the forward price, since it is a non-monetary benefit."],"a":1,"e":"The convenience yield is a benefit of holding the physical asset: like income, it reduces the net cost of carry and therefore the forward price, possibly leading to backwardation. Although non-monetary, it is reflected in the forward price.","d":3,"t":"Convenience yield","c":"The convenience yield is the non-monetary benefit of physically holding the commodity; it acts like income and reduces the forward price: F_0 = S_0 × e^((r + c − y)T). A high convenience yield can produce backwardation."},{"r":4,"q":"An asset with no income or costs trades at 80, and the risk-free rate is 6% (annual compounding). A six-month forward is quoted at 81. The arbitrage strategy and its profit at expiration are best described as:","o":["Short the asset, lend the proceeds, and buy the forward; profit of about 1.37","Borrow, buy the asset, and sell the forward; profit of about 1.37","Short the asset, lend the proceeds, and buy the forward; profit of about 1.00"],"a":0,"e":"Equilibrium price = 80 × 1.06^0.5 = 82.37 > 81: the forward is underpriced. Reverse cash-and-carry: short the asset, invest 80, buy the forward; at expiration, receive 82.37 and buy back the asset at 81, for 1.37. Cash-and-carry would lose money here; 1.00 ignores the interest on the investment.","d":3,"t":"Reverse cash-and-carry","c":"Forward arbitrage: compare the quoted price with the theoretical price S_0(1 + r)^T. Forward too expensive → sell it and buy the underlying financed by borrowing; forward too cheap → buy it and short the underlying, investing the proceeds."},{"r":5,"q":"Six months ago, an investor entered a long one-year forward at a forward price of 105 on an asset with no income or costs. The asset now trades at 103, and the risk-free rate is 5% (annual compounding). The value of the long forward today is closest to:","o":["-2.00","3.00","0.53"],"a":2,"e":"Vt = St − F0/(1 + r)^(T−t) = 103 − 105/1.05^0.5 = 103 − 102.47 = 0.53. −2.00 forgets to discount the forward price; 3.00 discounts over one year instead of the remaining six months.","d":2,"t":"Forward valuation during life","c":"Value of a long forward during its life (no income or costs): V_t = S_t − F_0(T) / (1 + r)^(T − t). The value to the short is the opposite."},{"r":5,"q":"At initiation, the value of a forward contract priced at the no-arbitrage forward price is:","o":["positive to the long and negative to the short.","equal to the spot price of the underlying.","zero to both parties."],"a":2,"e":"At initiation, the forward price is set so that neither party pays anything: the contract's value is zero to both. The forward price (a future transaction price) must not be confused with the contract's value.","d":1,"t":"Forward value at initiation","c":"At initiation, a forward entered at the no-arbitrage price has zero value to both parties (V_0 = 0): no money changes hands."},{"r":5,"q":"A forward contract was entered at a forward price of 102. At expiration the spot price is 98. The value of the contract to the short position is:","o":["−4.","98.","4."],"a":2,"e":"At expiration, the value to the seller is F0 − S_T = 102 − 98 = 4: the seller sells at 102 an asset worth 98. −4 is the value to the buyer; 98 confuses the contract's value with the spot price.","d":1,"t":"Forward value at expiration","c":"Value of a forward at expiration: long V_T = S_T − F_0(T); short V_T = F_0(T) − S_T."},{"r":5,"q":"The one-year spot rate is 3% and the two-year spot rate is 4%, both annually compounded. The one-year forward rate one year from now (1y1y) is closest to:","o":["0.97%","5.01%","3.50%"],"a":1,"e":"(1 + 0.04)² = (1 + 0.03)(1 + f) ⇒ f = 1.0816/1.03 − 1 = 5.01%. 3.50% is an average that does not respect no-arbitrage; 0.97% omits squaring the two-year rate.","d":2,"t":"Implied forward rate","c":"Implied forward rate from spot rates: (1 + z_B)^B = (1 + z_A)^A × (1 + IFR_(A,B−A))^(B−A). For 1y1y: (1 + z_2)² / (1 + z_1) − 1."},{"r":5,"q":"A company expects to borrow at a floating rate in three months and wants to lock in its borrowing cost. The company should most likely:","o":["take a short position in a forward rate agreement (FRA).","buy a fixed-rate bond forward.","take a long position in a forward rate agreement (FRA)."],"a":2,"e":"A long FRA receives (MRR − fixed rate) when rates rise, offsetting the higher borrowing cost: it locks in the borrowing cost. A short FRA benefits from falling rates (lender); buying a bond forward creates a loss if rates rise, so it worsens the exposure.","d":2,"t":"FRA hedging","c":"A forward rate agreement (FRA) locks in a future interest rate. The long FRA pays the fixed rate and receives MRR: it is used by a future borrower who fears rising rates; a future lender takes the short position."},{"r":5,"q":"A company is long a 3×9 FRA with a notional of 10,000,000 and a fixed rate of 4.0%. At FRA expiration, 6-month MRR is 4.6% (30/360 day count, 180-day period). If settlement is made at FRA expiration (advanced set, advanced settle), the payment the long receives is closest to:","o":["30,000.00","60,000.00","29,325.51"],"a":2,"e":"Interest differential paid at the end of the period: (4.6% − 4.0%) × 180/360 × 10M = 30,000. Settled at FRA expiration, it is discounted at MRR: 30,000/(1 + 0.046 × 0.5) = 29,325.51. 30,000 is not discounted; 60,000 is not prorated over 6 months.","d":3,"t":"FRA settlement","c":"FRA settlement: gross amount = notional × (MRR − fixed rate) × (days/360), paid to the long if MRR > fixed rate. With advanced set, advanced settle, this amount is discounted by 1 + MRR × (days/360)."},{"r":5,"q":"The spot exchange rate is 1.10 USD/EUR. The one-year risk-free rates are 4% in USD and 2% in EUR (annual compounding). The no-arbitrage one-year forward rate in USD/EUR is closest to:","o":["1.0788","1.1440","1.1216"],"a":2,"e":"Covered interest rate parity: F = S × (1 + r_USD)/(1 + r_EUR) = 1.10 × 1.04/1.02 = 1.1216. The price currency (USD) has the higher rate, so the EUR trades at a forward premium. 1.0788 inverts the rates; 1.1440 ignores the EUR rate.","d":2,"t":"Covered interest parity","c":"Covered interest rate parity: F = S × (1 + r_price currency)^T / (1 + r_base currency)^T, for a \"price/base\" quote (e.g., USD/EUR = USD per EUR). The currency with the higher interest rate trades at a forward discount."},{"r":5,"q":"An investor holds a long forward on a stock entered at a forward price of 50. The contract expires in six months. The stock now trades at 52 and will pay a dividend of 1 in three months. The risk-free rate is 4% (annual compounding). The value of the long forward today is closest to:","o":["2.97","1.98","1.00"],"a":1,"e":"Vt = St − PV(remaining dividends) − F0/(1 + r)^(T−t) = 52 − 1/1.04^0.25 − 50/1.04^0.5 = 52 − 0.99 − 49.03 = 1.98. 2.97 ignores the dividend (which the forward holder does not receive); 1.00 discounts nothing.","d":3,"t":"Forward value with dividend","c":"Value of a long forward during its life with income: V_t = S_t − PV_t(remaining income) − F_0(T) / (1 + r)^(T − t)."},{"r":6,"q":"If futures prices are positively correlated with interest rates, futures prices will most likely be:","o":["lower than otherwise identical forward prices.","equal to otherwise identical forward prices.","higher than otherwise identical forward prices."],"a":2,"e":"With positive correlation, the long futures receives daily gains when rates are high (reinvested at high rates) and pays when rates are low (financed cheaply): the futures is more attractive and its price exceeds the forward's. Equality holds only if rates are uncorrelated (or constant).","d":3,"t":"Futures vs forward pricing","c":"If futures prices are positively correlated with interest rates, the long futures benefits from daily settlement (gains reinvested at high rates, losses financed at low rates): futures > forward. Negative correlation: futures < forward. Constant or uncorrelated rates: equal."},{"r":6,"q":"Immediately after daily settlement, the value of a futures contract is:","o":["zero.","equal to the futures price times the contract size.","equal to the cumulative gains since initiation."],"a":0,"e":"Daily mark-to-market settles gains and losses and resets the reference price to the settlement price: the contract's value returns to zero. Cumulative gains have already been paid into the margin account, and notional is not a value.","d":1,"t":"Futures value after settlement","c":"Immediately after daily settlement (mark-to-market), the value of a futures contract is reset to zero, because gains and losses have been credited or debited to the margin account."},{"r":6,"q":"A trader is long one index futures contract with a multiplier of 50. Yesterday's settlement price was 1,250. Intraday today, the futures price is 1,262. The value of the trader's position at this moment is closest to:","o":["600","0","63,100"],"a":0,"e":"Between two settlements, the value of a futures = (current price − last settlement price) × multiplier = (1,262 − 1,250) × 50 = 600. The value is zero only immediately after settlement; 63,100 is the notional.","d":2,"t":"Futures value intraday","c":"Intraday value of a futures contract = (current price − last settlement price) × multiplier × number of contracts; it resets to zero after daily settlement."},{"r":6,"q":"A trader is long 3 futures contracts, each on 1,000 units. The settlement price falls from 2.45 to 2.38. The change in the trader's margin account is closest to:","o":["−70","+210","−210"],"a":2,"e":"Change = (2.38 − 2.45) × 1,000 × 3 = −210: the buyer's account is debited. −70 accounts for only one contract; +210 would be the change for a seller.","d":1,"t":"Daily settlement","c":"Change in margin account = (new settlement price − old) × contract size × number of contracts; positive for a long if the price rises, negative if it falls."},{"r":6,"q":"A three-month MRR futures contract is quoted at 96.25. The implied annualized three-month rate is closest to:","o":["96.25%.","0.94%.","3.75%."],"a":2,"e":"The interest rate futures price = 100 − annualized rate, so implied rate = 100 − 96.25 = 3.75%. 96.25% confuses price and rate; 0.94% is the quarterly rate (3.75%/4), not the annualized rate.","d":1,"t":"Interest rate futures quote","c":"An MRR futures contract is quoted as 100 − annualized rate (in %): implied rate = 100 − quoted price. A long futures position gains when rates fall."},{"r":6,"q":"A three-month MRR futures contract has a notional of 1,000,000. The change in the contract's value for a one-basis-point change in the implied rate is closest to:","o":["25.00","100.00","2.50"],"a":0,"e":"Basis point value = notional × 0.0001 × (90/360) = 1,000,000 × 0.0001 × 0.25 = 25.00. 100 forgets the quarterly fraction; 2.50 shifts the decimal point by one place.","d":2,"t":"Basis point value","c":"Basis point value (BPV) of an interest rate futures = notional × 0.0001 × (days in the period / 360). For a 3-month contract: notional × 0.0001 × 0.25."},{"r":6,"q":"As a futures contract approaches expiration, the futures price will most likely:","o":["diverge from the spot price as the cost of carry increases.","converge to the original futures price at initiation.","converge to the spot price of the underlying."],"a":2,"e":"At expiration, the futures becomes a spot contract, so its price converges to the spot price (otherwise there is arbitrage). The cost of carry decreases with the time remaining rather than increasing, and the initial price plays no anchoring role.","d":1,"t":"Convergence","c":"Convergence: as expiration approaches, the futures price converges to the spot price (the basis tends to zero); at expiration F_T = S_T."},{"r":6,"q":"Assume that interest rates are negatively correlated with futures prices. Compared with an otherwise identical forward contract, a long futures position is:","o":["more attractive, so the futures price will be higher than the forward price.","less attractive, so the futures price will be lower than the forward price.","equally attractive, because daily settlement has no economic effect."],"a":1,"e":"Negative correlation: the long futures collects its gains when rates are low (reinvested at low rates) and pays its losses when rates are high (costly financing); the futures is less attractive and its price is below the forward's. Daily settlement has an economic effect whenever rates are stochastic and correlated.","d":2,"t":"Futures vs forward pricing","c":"Negative correlation between interest rates and futures prices: daily settlement disadvantages the long (gains reinvested at low rates, losses financed at high rates), so the futures is worth less than the equivalent forward and the long prefers the forward."},{"r":7,"q":"An interest rate swap can be replicated most directly by a series of:","o":["off-market forward rate agreements (FRAs) with the same fixed rate.","at-market FRAs, each with a value of zero at initiation.","long call options on the market reference rate."],"a":0,"e":"The swap applies a single fixed rate to all periods; each implied FRA therefore has a fixed rate different from its period's forward rate (off-market FRAs), with nonzero values that offset overall. At-market FRAs would each have a different fixed rate; options would introduce an asymmetry that the swap does not have.","d":2,"t":"Swap replication","c":"An interest rate swap can be replicated by a series of FRAs (each at its own forward rate), or by a long fixed-rate bond and a short floating-rate bond (or vice versa)."},{"r":7,"q":"The discount factors for 1, 2, and 3 years are 0.98, 0.95, and 0.91, respectively. The fixed rate on a three-year interest rate swap with annual payments is closest to:","o":["3.00%","5.33%","3.17%"],"a":2,"e":"Swap rate = (1 − DF3)/(DF1 + DF2 + DF3) = 0.09/2.84 = 3.17%. 3.00% divides by the number of periods instead of the sum of the discount factors; 5.33% averages the (1 − DF) values, with no no-arbitrage logic.","d":2,"t":"Swap fixed rate","c":"Swap fixed rate (par swap rate): s_N = (1 − DF_N) / Σ DF_i, for i = 1..N; it equates the present values of the fixed and floating legs at initiation."},{"r":7,"q":"The one-year spot rate is 1% and the two-year spot rate is 4% (annual compounding). The fixed rate on a two-year swap with annual payments is closest to:","o":["2.50%","4.00%","3.94%"],"a":2,"e":"DF1 = 1/1.01 = 0.9901; DF2 = 1/1.04² = 0.9246. Swap rate = (1 − 0.9246)/(0.9901 + 0.9246) = 3.94%. 2.50% is a simple average of the spot rates; 4.00% ignores the first cash flow, discounted at the low one-year rate.","d":2,"t":"Swap rate from spot rates","c":"Swap rate from spot rates: compute discount factors DF_i = 1 / (1 + z_i)^i, then s_N = (1 − DF_N) / Σ DF_i. The swap rate is a weighted average of the implied forward rates."},{"r":7,"q":"A company is the fixed-rate payer in an interest rate swap with a notional of 50,000,000 and a fixed rate of 3.0%. Two annual payments remain. The current swap rate for the remaining tenor is 3.5%, and the discount factors are 0.970 and 0.935. The value of the swap to the company is closest to:","o":["−476,250","+500,000","+476,250"],"a":2,"e":"Value to the fixed-rate payer = (current swap rate − fixed rate) × sum of DFs × notional = (3.5% − 3.0%) × (0.970 + 0.935) × 50M = 476,250. Rising rates benefit the fixed payer, hence the positive sign; 500,000 omits discounting.","d":3,"t":"Swap valuation","c":"Value of a swap to the fixed-rate payer = (current swap rate − contract fixed rate) × notional × Σ DF of remaining payments; the opposite for the fixed-rate receiver. The fixed payer gains when swap rates rise."},{"r":7,"q":"In an interest rate swap with a notional of 20,000,000 and semiannual payments (180/360), the fixed rate is 2.8% and the MRR set at the beginning of the period is 3.4%. At the end of the period, the fixed-rate payer most likely:","o":["makes a net payment of 60,000.","receives a net payment of 60,000.","receives a net payment of 120,000."],"a":1,"e":"Net payment = (MRR − fixed) × 180/360 × notional = (3.4% − 2.8%) × 0.5 × 20M = 60,000. Since MRR exceeds the fixed rate, the fixed-rate payer receives the differential. 120,000 forgets the semiannual fraction.","d":1,"t":"Swap net settlement","c":"Net swap payment to the fixed-rate payer = notional × (floating rate set at the start of the period − fixed rate) × (days/360); only the net amount is exchanged, at the end of the period (set in advance, settled in arrears). Positive = received, negative = paid."},{"r":7,"q":"A receive-fixed, pay-floating interest rate swap was entered at market rates. If swap rates for the remaining tenor subsequently rise, the value of the swap to the fixed-rate receiver will most likely:","o":["become positive.","remain zero until the next settlement date.","become negative."],"a":2,"e":"The fixed-rate receiver now receives a rate below the market rate: the position resembles a long fixed-rate bond, whose value falls when rates rise. A positive value would apply to the fixed-rate payer; a swap's value changes continuously and is not locked at zero.","d":2,"t":"Swap value and rate changes","c":"The fixed-rate receiver in a swap is economically long a fixed-rate bond: if swap rates rise, the swap's value to the receiver falls (becomes negative); the fixed-rate payer gains."},{"r":7,"q":"Compared with a plain vanilla interest rate swap, a currency swap most likely:","o":["never involves fixed interest payments.","involves the exchange of notional principal amounts in two currencies.","is settled on a net basis in a single currency."],"a":1,"e":"A currency swap generally involves exchanging the notional amounts in both currencies at the start and at the end, since the cash flows are denominated in different currencies. Its legs can be fixed or floating, and payments cannot be netted because they are in different currencies.","d":2,"t":"Currency swap","c":"A currency swap exchanges interest payments in two different currencies and generally exchanges the notional amounts at the start and end, unlike a plain vanilla interest rate swap, where the notional is never exchanged."},{"r":7,"q":"An investor receives the return on an equity index and pays a fixed rate of 4% (annual, paid quarterly) on a notional of 10,000,000. Over the quarter, the index return is −2.5%. At the quarterly settlement, the investor most likely:","o":["pays 350,000.","pays 150,000.","receives 150,000."],"a":0,"e":"The index receiver owes the negative return (2.5%) in addition to the quarterly fixed rate (4%/4 = 1%): it pays (2.5% + 1%) × 10M = 350,000. 150,000 wrongly nets the loss against the fixed rate; receiving 150,000 reverses the direction of a negative return.","d":3,"t":"Equity swap settlement","c":"Equity swap: the equity leg pays the index return (which can be negative) on the notional; net payment to the equity receiver = notional × (index return − fixed rate × year fraction). If the index falls, the receiver pays both the decline and the fixed rate."},{"r":8,"q":"A put option with an exercise price of 50 trades at 7.20 when the underlying stock is at 44. The put's exercise value is:","o":["1.20.","7.20.","6.00."],"a":2,"e":"The put's exercise (intrinsic) value = max(0, X − S) = max(0, 50 − 44) = 6.00. 1.20 is the time value (7.20 − 6.00); 7.20 is the total premium.","d":1,"t":"Exercise value","c":"Exercise value (intrinsic value): call = max(0, S_0 − X); put = max(0, X − S_0)."},{"r":8,"q":"A call option with an exercise price of 58 trades at 7.50 when the underlying is at 62. The option's time value is:","o":["4.00.","3.50.","7.50."],"a":1,"e":"Intrinsic value = max(0, 62 − 58) = 4.00; time value = premium − intrinsic value = 7.50 − 4.00 = 3.50. 4.00 is the intrinsic value; 7.50 is the total premium.","d":1,"t":"Time value","c":"Option price = exercise value + time value. Time value = premium − exercise value; it decays toward zero at expiration (time decay)."},{"r":8,"q":"Holding all else constant, an increase in the volatility of the underlying will most likely:","o":["increase the value of calls and decrease the value of puts.","increase the value of both calls and puts.","decrease the value of both calls and puts."],"a":1,"e":"Because of the asymmetric payoff (loss limited to the premium), higher volatility increases the probability of large gains without increasing the maximum loss: both calls and puts gain value. The other options ignore this shared convexity.","d":1,"t":"Volatility effect","c":"An increase in the volatility of the underlying increases the value of both calls AND puts: the asymmetric payoff benefits from favorable extreme outcomes, while the loss is limited to the premium."},{"r":8,"q":"Holding all else constant, an increase in the risk-free interest rate will most likely:","o":["increase call values and decrease put values.","decrease call values and increase put values.","increase both call and put values."],"a":0,"e":"A higher rate reduces the present value of the exercise price: the call (which will pay X later) gains value, and the put (which will receive X later) loses value. The other options reverse or equalize this effect.","d":2,"t":"Interest rate effect","c":"An increase in the risk-free rate increases the value of a call (PV(X) decreases) and decreases the value of a put. Income on the underlying (dividends) has the opposite effect: it lowers the call and raises the put."},{"r":8,"q":"A European call on a non-dividend-paying stock has an exercise price of 55 and one year to expiration. The stock price is 60 and the risk-free rate is 5% (annual compounding). The lower bound for the call value is closest to:","o":["5.00","4.76","7.62"],"a":2,"e":"Lower bound of the European call = max(0, S − X/(1 + r)^T) = 60 − 55/1.05 = 60 − 52.38 = 7.62. 5.00 does not discount the exercise price; 4.76 discounts S − X instead of only X.","d":2,"t":"Call lower bound","c":"Lower bound of a European call on a non-dividend-paying stock: c_0 ≥ max(0, S_0 − X / (1 + r)^T). Upper bound: c_0 ≤ S_0."},{"r":8,"q":"A European put has an exercise price of 100 and six months to expiration. The underlying is at 90 and the risk-free rate is 4% (annual compounding). The lower bound for the put value is closest to:","o":["10.00","8.06","6.15"],"a":1,"e":"Lower bound of the European put = max(0, X/(1 + r)^T − S) = 100/1.04^0.5 − 90 = 98.06 − 90 = 8.06. 10.00 is the bound for an American put (immediate exercise); 6.15 discounts over one year instead of six months.","d":2,"t":"Put lower bound","c":"Lower bound of a European put: p_0 ≥ max(0, X / (1 + r)^T − S_0). Upper bound: p_0 ≤ X / (1 + r)^T."},{"r":8,"q":"Which statement about American and European options on a non-dividend-paying stock is most accurate?","o":["An American call is worth the same as a European call, but an American put may be worth more than a European put.","An American put is worth the same as a European put, but an American call may be worth more than a European call.","American calls and puts are always worth exactly the same as their European counterparts."],"a":0,"e":"Without dividends, early exercise of a call is never optimal (it forfeits time value and interest on X): American call = European call. A deep in-the-money put can justify early exercise to receive X immediately, so the American put can be worth more.","d":3,"t":"Early exercise","c":"An American call on a non-dividend-paying stock is never exercised early, so C_0 = c_0. An American put can be worth more than a European put, because early exercise can be optimal when it is deep in the money."},{"r":8,"q":"Holding all else constant, which of the following can decrease the value of a European put option?","o":["A decrease in the price of the underlying.","An increase in the time to expiration.","An increase in the volatility of the underlying."],"a":1,"e":"For a European put, a longer horizon adds time value but delays receipt of X (lower present value): for a deep in-the-money put, the net effect can be negative. A decline in the underlying and an increase in volatility always increase the put's value.","d":3,"t":"Time to expiration effect","c":"Value drivers of a European put: it increases with X, volatility and income on the underlying; it decreases with S_0 and the risk-free rate. The effect of time to expiration is ambiguous for a European put (more time, but lower PV(X))."},{"r":9,"q":"According to put-call parity for European options, a fiduciary call has the same payoff as a:","o":["protective put.","covered call.","synthetic short forward."],"a":0,"e":"Parity: c + X/(1 + r)^T (fiduciary call) = S + p (protective put); both pay max(S_T, X) at expiration. The covered call (S − c) caps the gain; a short forward has an inverse linear profile.","d":1,"t":"Put-call parity","c":"Put-call parity: S_0 + p_0 = c_0 + X / (1 + r)^T. Fiduciary call = call + zero-coupon bond with face value X; protective put = underlying + put; both have the same payoff max(S_T, X)."},{"r":9,"q":"A non-dividend-paying stock trades at 50. A one-year European put with an exercise price of 50 trades at 3.20, and the risk-free rate is 4% (annual compounding). Using put-call parity, the price of the corresponding European call is closest to:","o":["3.20","5.12","1.28"],"a":1,"e":"c = S + p − X/(1 + r)^T = 50 + 3.20 − 50/1.04 = 53.20 − 48.08 = 5.12. 3.20 forgets to discount X; 1.28 subtracts the S − PV(X) difference instead of adding it.","d":2,"t":"Call from put-call parity","c":"Put-call parity: c_0 = S_0 + p_0 − X / (1 + r)^T. The unknown instrument is isolated using the other three."},{"r":9,"q":"A stock trades at 75. A six-month European call with an exercise price of 80 trades at 4.10, and the risk-free rate is 3% (annual compounding). Using put-call parity, the price of the European put is closest to:","o":["9.10","0.27","7.93"],"a":2,"e":"p = c + X/(1 + r)^T − S = 4.10 + 80/1.03^0.5 − 75 = 4.10 + 78.83 − 75 = 7.93. 9.10 does not discount X; 0.27 reverses the signs of S and PV(X).","d":2,"t":"Put from put-call parity","c":"Put-call parity: p_0 = c_0 − S_0 + X / (1 + r)^T. A synthetic put = long call + short underlying + long risk-free bond with face value X."},{"r":9,"q":"Using put-call parity, a synthetic European put can be created by:","o":["buying a call, short selling the stock, and buying a risk-free bond paying the exercise price.","buying a call, buying the stock, and borrowing the present value of the exercise price.","selling a call, buying the stock, and buying a risk-free bond paying the exercise price."],"a":0,"e":"From S + p = c + PV(X), we get p = c − S + PV(X): long call, short sale of the stock, purchase of a zero-coupon bond with face value X. The other combinations do not respect the signs of the relationship.","d":2,"t":"Synthetic put","c":"Synthetics from parity: put = c − S + PV(X); call = S + p − PV(X); underlying = c − p + PV(X); risk-free bond = S + p − c. A + sign means a long position, − a short position."},{"r":9,"q":"A non-dividend-paying stock trades at 40. One-year European options with an exercise price of 40 are priced at 4.50 (call) and 2.00 (put). The risk-free rate is 5% (annual compounding). An arbitrageur would most likely:","o":["sell the call, buy the put, buy the stock, and borrow the present value of 40, earning about 0.60 today.","buy the call, sell the put, short the stock, and lend the present value of 40, earning about 0.60 today.","sell the call, buy the put, buy the stock, and borrow the present value of 40, earning about 2.50 today."],"a":0,"e":"By parity, c = 40 + 2.00 − 40/1.05 = 3.90: the call at 4.50 is overpriced by 0.60. Sell the call and buy the synthetic call (put + stock − borrowing PV(X)), collecting 0.60 today. The reverse strategy buys the overpriced asset; 2.50 ignores parity (simple call-put difference).","d":3,"t":"Put-call parity arbitrage","c":"Parity arbitrage: compare S_0 + p_0 with c_0 + X / (1 + r)^T. Buy the underpriced side and sell the overpriced side; the initial profit is the difference, with no risk at expiration."},{"r":9,"q":"A one-year forward on an asset is priced at 105. A one-year European call on the asset with an exercise price of 100 trades at 6.50, and the risk-free rate is 5% (annual compounding). Using put-call forward parity, the price of the corresponding European put is closest to:","o":["1.50","1.74","11.26"],"a":1,"e":"Put-call-forward parity: F0/(1 + r)^T + p = c + X/(1 + r)^T ⇒ p = c − (F0 − X)/(1 + r)^T = 6.50 − 5/1.05 = 1.74. 1.50 does not discount the F0 − X difference; 11.26 adds the difference instead of subtracting it.","d":3,"t":"Put-call forward parity","c":"Put-call-forward parity: F_0(T) / (1 + r)^T + p_0 = c_0 + X / (1 + r)^T, i.e., p_0 = c_0 − (F_0(T) − X) / (1 + r)^T. The discounted forward replaces the underlying."},{"r":9,"q":"Applying option concepts to a firm's capital structure, the value of the firm's risky debt is equivalent to:","o":["the value of a call option on the firm's assets with an exercise price equal to the face value of debt.","the value of risk-free debt plus the value of a put option on the firm's assets.","the value of risk-free debt minus the value of a put option on the firm's assets with an exercise price equal to the face value of debt."],"a":2,"e":"Creditors receive min(V_T, D) = D − max(0, D − V_T): risk-free debt minus a put sold to the shareholders. The call on the assets with exercise price D represents equity; adding the put would reverse the direction of default risk.","d":2,"t":"Firm value and options","c":"Option view of capital structure: equity = call on the firm's assets with exercise price equal to the face value of debt D; risky debt = risk-free debt PV(D) − put on the assets with exercise price D (put sold by the creditors)."},{"r":9,"q":"Which combination produces a payoff at expiration equal to the greater of the stock price or the exercise price?","o":["A long stock position plus a long put option.","A long stock position plus a short call option.","A long call option plus a short put option."],"a":0,"e":"Protective put (S + p): at expiration it yields max(S_T, X). The covered call (S − c) gives min(S_T, X); long call + short put gives S_T − X, i.e., a synthetic forward.","d":1,"t":"Protective put payoff","c":"The payoff max(S_T, X) is obtained by a protective put (S + p) or a fiduciary call (c + zero-coupon bond with face value X); these two portfolios therefore have the same value under put-call parity."},{"r":10,"q":"In a one-period binomial model, the up factor is 1.20, the down factor is 0.85, and the risk-free rate is 4% per period. The risk-neutral probability of an up move is closest to:","o":["0.46","0.54","0.50"],"a":1,"e":"π = (1 + r − d)/(u − d) = (1.04 − 0.85)/(1.20 − 0.85) = 0.19/0.35 = 0.5429. 0.46 is the probability of a down move; 0.50 wrongly assumes equal probabilities.","d":1,"t":"Risk-neutral probability","c":"Risk-neutral probability in the binomial model: π = (1 + r − d) / (u − d), with d < 1 + r < u for no arbitrage."},{"r":10,"q":"A stock trades at 50. In one period it will either rise by 20% or fall by 15%. The risk-free rate is 4% per period. Using a one-period binomial model, the value of a European call with an exercise price of 52 is closest to:","o":["4.18","4.34","3.52"],"a":0,"e":"Su = 60, Sd = 42.5; cu = 8, cd = 0. π = 0.19/0.35 = 0.5429. c = (π × 8 + (1 − π) × 0)/1.04 = 4.18. 4.34 does not discount the expected value; 3.52 applies the down probability to the up scenario.","d":2,"t":"Binomial call value","c":"Value of a call in a one-period binomial model: c_0 = [π × c_u + (1 − π) × c_d] / (1 + r), with c_u = max(0, uS_0 − X) and c_d = max(0, dS_0 − X)."},{"r":10,"q":"A stock trades at 50. In one period it will either rise by 20% or fall by 15%. The risk-free rate is 4% per period. Using a one-period binomial model, the value of a European put with an exercise price of 55 is closest to:","o":["5.71","6.52","5.49"],"a":2,"e":"Su = 60, Sd = 42.5; pu = 0, pd = 12.5. π = 0.5429, 1 − π = 0.4571. p = (0.4571 × 12.5)/1.04 = 5.49. 5.71 does not discount; 6.52 applies π (the up probability) to the down scenario.","d":2,"t":"Binomial put value","c":"Value of a binomial put: p_0 = [π × p_u + (1 − π) × p_d] / (1 + r), with p_u = max(0, X − uS_0), p_d = max(0, X − dS_0) and π = (1 + r − d) / (u − d)."},{"r":10,"q":"A stock trades at 50 and will be worth either 60 or 42.50 in one period. A call with an exercise price of 52 will be worth either 8 or 0. The hedge ratio (number of shares per call) needed to replicate the call is closest to:","o":["0.46","0.54","2.19"],"a":0,"e":"h = (cu − cd)/(Su − Sd) = (8 − 0)/(60 − 42.5) = 8/17.5 = 0.4571. 0.54 is the risk-neutral probability, not the hedge ratio; 2.19 inverts the ratio.","d":2,"t":"Hedge ratio","c":"Hedge ratio: h = (c_u − c_d) / (S_u − S_d); a portfolio long h shares and short 1 call is risk-free and earns the risk-free rate."},{"r":10,"q":"In the one-period binomial option pricing model, the value of an option is most accurately described as:","o":["independent of investors' risk preferences and of the actual probabilities of up and down moves.","dependent on the actual probability of an up move estimated by investors.","the expected payoff discounted at the expected return on the underlying stock."],"a":0,"e":"The option is valued by replication/arbitrage: the risk-neutral probabilities follow from u, d and r, and the expected value is discounted at the risk-free rate. Actual probabilities and risk aversion play no role; discounting at the stock's expected return would be incorrect.","d":1,"t":"Risk neutrality","c":"In the binomial model, an option's value is the expected value of its payoffs under risk-neutral probabilities, discounted at the risk-free rate; it depends neither on actual probabilities nor on investors' risk aversion."},{"r":10,"q":"A stock trades at 50 and will be worth either 60 or 42.50 in one period; the risk-free rate is 4% per period. To replicate a call with an exercise price of 52, an investor buys the hedge-ratio number of shares and borrows at the risk-free rate. The amount borrowed today is closest to:","o":["19.43","18.68","22.86"],"a":1,"e":"h = 8/17.5 = 0.4571. Borrowing = PV(h × Sd − cd) = (0.4571 × 42.5 − 0)/1.04 = 19.43/1.04 = 18.68. Check: c = h × S − B = 22.86 − 18.68 = 4.18. 19.43 is not discounted; 22.86 is the cost of the shares purchased.","d":3,"t":"Replicating portfolio","c":"Replicating a call: buy h = (c_u − c_d) / (S_u − S_d) shares and borrow at the risk-free rate the present value of (h × S_d − c_d), i.e., (h × S_d − c_d) / (1 + r). Call value = h × S_0 − amount borrowed."},{"r":10,"q":"Using a one-period binomial model, a European call on a stock trading at 50 (up to 60, down to 42.50; risk-free rate 4% per period; exercise price 52) has a model value of about 4.18. If the call trades at 5.00, an arbitrageur would most likely:","o":["sell the call, buy about 0.46 shares per call, and borrow the balance, earning about 0.82 today.","buy the call, short about 0.46 shares per call, and lend the proceeds, earning about 0.82 today.","sell the call and invest the premium at the risk-free rate, earning a riskless return."],"a":0,"e":"The call is overpriced (5.00 > 4.18). Sell it and replicate it: buy h = 0.4571 shares per call financed by borrowing 18.68; the hedged portfolio yields a risk-free gain of about 5.00 − 4.18 = 0.82. Buying the overpriced call loses money; selling the call unhedged leaves market risk.","d":3,"t":"Binomial arbitrage","c":"If an option's market price differs from its binomial value: overpriced option → sell it and buy the replicating portfolio (h shares financed by borrowing); underpriced option → buy it and sell the replicating portfolio. The immediate profit is the price difference."},{"r":10,"q":"A stock currently at 40 will be either 46 or 36 at the end of one period. The risk-free rate is 3% per period. The risk-neutral probability of an up move is closest to:","o":["0.48","0.52","0.60"],"a":1,"e":"u = 46/40 = 1.15; d = 36/40 = 0.90. π = (1.03 − 0.90)/(1.15 − 0.90) = 0.13/0.25 = 0.52. 0.48 is the down probability; 0.60 ignores the risk-free rate (equivalent to r = 0).","d":1,"t":"Risk-neutral probability","c":"Binomial factors: u = S_u / S_0 and d = S_d / S_0, then π = (1 + r − d) / (u − d). Actual probabilities are not used for valuation."}]},{"subject":8,"questions":[{"r":1,"q":"Compared with fund investing, direct investing in alternative assets by a large institutional investor most likely offers:","o":["higher fees but greater diversification across managers.","lower fees but requires greater in-house expertise and resources.","lower fees and lower due diligence requirements."],"a":1,"e":"Direct investing avoids the double layer of fees (management + performance) charged by a fund manager, but requires in-house teams able to source, evaluate and monitor the assets. Fund investing is, on the contrary, the most expensive option and offers diversification across managers. Direct investing does not lighten due diligence at all: it makes it heavier.","d":1,"t":"Direct vs fund investing","c":"Three ways to invest in alternatives: fund investing (pay GP fees, get diversification and expertise, least control), co-investing (invest alongside the fund with lower fees and more control), and direct investing (no external fees, full control, but requires substantial in-house expertise and concentrates risk)."},{"r":1,"q":"A limited partner is offered the opportunity to co-invest alongside a private equity fund in one of the fund's portfolio companies. The most likely disadvantage of accepting is:","o":["adverse selection, because the GP may offer the less attractive deals for co-investment.","the payment of a full management and incentive fee on the co-investment.","the loss of the ability to learn from the GP's investment process."],"a":0,"e":"Co-investment is generally offered with reduced or even zero fees, and it actually allows the LP to learn the GP's process. Its main drawback is adverse selection risk: the GP may offer the least attractive or riskiest deals for co-investment. The LP also loses part of the diversification of a fund.","d":2,"t":"Co-investing","c":"Co-investing lets an LP invest directly in a portfolio company alongside the GP, typically with lower or no fees and more control, but it requires the LP's own due diligence capacity and exposes it to adverse selection (the GP may share its less attractive deals)."},{"r":1,"q":"A private equity fund has USD 400 million of committed capital, of which USD 150 million has been called. The annual management fee is 1.75% of committed capital. The management fee for the year is closest to:","o":["USD 7.000 million.","USD 2.625 million.","USD 4.375 million."],"a":0,"e":"The fee is calculated on committed capital: 1.75% × 400 million = USD 7.0 million. 2.625 million wrongly uses called capital (1.75% × 150 million), and 4.375 million uses uncalled capital (1.75% × 250 million). In private equity, fees are often charged on commitments during the investment period.","d":2,"t":"Management fee on committed capital","c":"Private equity management fees (typically 1%-2%) are usually charged on committed capital during the investment period, not just on capital called or invested; hedge fund management fees are charged on assets under management."},{"r":1,"q":"A fund earns a return of 15% for the year, net of management fees. The incentive fee is 20% subject to an 8% hard hurdle rate. The incentive fee, as a percentage of beginning capital, is closest to:","o":["3.0%.","1.4%.","1.6%."],"a":1,"e":"With a hard hurdle, the fee applies only to the return above the hurdle: 20% × (15% − 8%) = 1.4%. 3.0% (20% × 15%) corresponds to a soft hurdle, where the fee applies to the entire return once the hurdle is cleared. 1.6% (20% × 8%) wrongly applies the rate to the hurdle itself.","d":3,"t":"Hard vs soft hurdle","c":"A hurdle rate is the minimum return before the manager earns an incentive fee. With a hard hurdle, the fee applies only to returns in excess of the hurdle; with a soft hurdle, once the hurdle is exceeded the fee applies to the full return."},{"r":1,"q":"In a limited partnership structure used by many alternative investment funds, the general partner (GP) typically:","o":["manages the fund and has unlimited liability for the fund's debts.","provides most of the capital and has liability limited to its investment.","has no role in investment decisions but receives the carried interest."],"a":0,"e":"The GP manages the fund, makes investment decisions and bears unlimited liability. It is the LPs who provide most of the capital, with liability limited to their contribution. The GP earns the carried interest precisely because it actively manages the fund.","d":1,"t":"LP vs GP liability","c":"In a limited partnership, the general partner manages the fund, makes investment decisions and has unlimited liability; limited partners are passive investors who provide most of the capital and whose liability is limited to their investment. Terms are set in the limited partnership agreement (LPA)."},{"r":1,"q":"An agreement between a fund's general partner and a specific limited partner that grants that LP terms in addition to, or different from, those in the limited partnership agreement is best described as a:","o":["clawback provision.","subscription agreement.","side letter."],"a":2,"e":"A side letter grants a particular investor specific terms (reduced fees, enhanced reporting, most-favored-nation clause, etc.). A clawback lets LPs recover carried interest overpaid to the GP. The subscription agreement simply formalizes the investor's commitment on the standard terms of the LPA.","d":2,"t":"Side letters","c":"Fund documentation: the limited partnership agreement (LPA) sets the general terms; side letters are side agreements granting individual LPs additional or different terms (fees, reporting, MFN rights); the subscription agreement records each investor's commitment."},{"r":1,"q":"A private equity GP received carried interest on early profitable exits, but later investments in the fund generated losses so that, over the fund's life, the GP received more than its agreed share of total profits. The provision that requires the GP to return the excess is the:","o":["clawback provision.","high-water mark.","catch-up clause."],"a":0,"e":"The clawback clause requires the GP to return to the LPs any excess carried interest calculated over the full life of the fund. A high-water mark (used mostly by hedge funds) prevents charging twice for performance on the same value. A catch-up clause, on the contrary, lets the GP receive a larger share of profits just after the hurdle.","d":2,"t":"Clawback provision","c":"Investor protection clauses: clawback (GP returns carried interest previously received if later losses mean it was overpaid over the fund's life), high-water mark (incentive fee only on value above the previous peak), and catch-up (GP receives a disproportionate share of profits above the hurdle until it reaches its agreed share)."},{"r":1,"q":"Compared with traditional investments, alternative investments most likely exhibit:","o":["lower liquidity, less transparency, and higher fees.","higher liquidity, more regulation, and lower fees.","returns that are normally distributed and easily benchmarked."],"a":0,"e":"Alternative investments are characterized by lower liquidity, less transparency and regulation, high fees and limited return histories. Their returns are often non-normal (skewness, fat tails) and hard to compare with a benchmark. The other two statements rather describe traditional assets.","d":1,"t":"Characteristics of alternatives","c":"Typical features of alternative investments: illiquidity, specialized manager expertise, low correlation with traditional assets, less regulation and transparency, high fees, limited and appraisal-based return data, and non-normal return distributions."},{"r":2,"q":"A hedge fund charges a 2% management fee based on beginning-of-year assets and a 20% incentive fee calculated on gains net of the management fee. Assets grow from USD 100 million to USD 115 million before fees. The investor's net return is closest to:","o":["10.0%.","10.4%.","12.0%."],"a":1,"e":"Management fee = 2% × 100 = 2 million; incentive fee = 20% × (115 − 100 − 2) = 2.6 million. Net value = 115 − 2 − 2.6 = 110.4 million, i.e., a return of 10.4%. 10.0% calculates the incentive fee on the gross gain (20% × 15 = 3) without deducting management fees; 12.0% forgets the management fee (115 − 100 − 20% × 15 = 12).","d":2,"t":"Hedge fund fee calculation","c":"To compute a net-of-fee return: calculate the management fee on the stated base (beginning or ending assets), then the incentive fee on the gain defined by the terms (gross, or net of management fees, above any hurdle or high-water mark); net return = (ending value − all fees − beginning value) / beginning value."},{"r":2,"q":"A fund starts the year with USD 200 million and ends at USD 230 million before fees. It charges a 1.5% management fee on end-of-year assets and a 20% incentive fee on gains net of the management fee, above an 8% hard hurdle. The investor's net return is closest to:","o":["12.22%.","10.62%.","12.40%."],"a":0,"e":"Management fee = 1.5% × 230 = 3.45 million; net gain = 230 − 3.45 − 200 = 26.55 million; hurdle = 8% × 200 = 16 million; incentive fee = 20% × (26.55 − 16) = 2.11 million. Net value = 230 − 3.45 − 2.11 = 224.44 million, i.e., 12.22%. 10.62% applies a soft hurdle (20% × 26.55), and 12.40% wrongly computes the management fee on beginning-of-year assets.","d":3,"t":"Hard hurdle with end-of-year fee","c":"Fee waterfall order matters: management fee first (on the specified asset base), then compare the return net of that fee with the hurdle; with a hard hurdle, the incentive fee is charged only on the excess over the hurdle amount."},{"r":2,"q":"A hedge fund with a high-water mark provision charges a 20% incentive fee (ignore management fees). An investor's capital accou
