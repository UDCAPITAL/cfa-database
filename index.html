es, letters of credit, surety bonds)."},{"r":1,"q":"A Japanese company issues bonds denominated in US dollars that are sold to investors in the United States and are regulated by US authorities. These bonds are best classified as:","o":["Eurobonds.","global bonds.","foreign bonds."],"a":2,"e":"A foreign bond is issued by a non-resident issuer in a domestic market, in that market's currency (here a Yankee bond). A Eurobond is issued outside the jurisdiction of its currency, and a global bond is placed simultaneously in the Eurobond market and at least one domestic market.","d":2,"t":"Foreign bond vs Eurobond","c":"Domestic bonds: domestic issuer, domestic market and currency. Foreign bonds: foreign issuer in a domestic market and currency (Yankee, Samurai, Panda). Eurobonds: issued outside the jurisdiction of the currency of denomination; global bonds trade in both the Eurobond and a domestic market."},{"r":1,"q":"A bond was issued seven years ago with an original maturity of 12 years. Its tenor today is:","o":["5 years.","7 years.","12 years."],"a":0,"e":"Tenor (remaining maturity) is the time left until maturity: 12 − 7 = 5 years. 12 years is the original maturity and 7 years is the time elapsed since issuance.","d":1,"t":"Maturity and tenor","c":"Maturity is the date on which principal is repaid; tenor is the time remaining until that date. Bonds with original maturity of one year or less are money market securities; longer ones are capital market securities."},{"r":2,"q":"A company takes out a 100,000 five-year fully amortizing loan at 6% with equal annual payments. The annual payment is closest to:","o":["21,200.00","23,739.64","26,000.00"],"a":1,"e":"Payment = 100,000 × 0.06 / (1 − 1.06^−5) = 23,739.64. 26,000 is the first payment of a straight-line (equal principal) amortization (20,000 + 6,000 of interest), and 21,200 wrongly divides one year of compounded principal by 5.","d":2,"t":"Fully amortizing loan","c":"A fully amortizing loan with level payments is an annuity: A = r × Principal / [1 − (1 + r)^−N]. Each payment covers interest on the outstanding balance plus a growing portion of principal."},{"r":2,"q":"For the 100,000 five-year, 6% fully amortizing loan with equal annual payments of approximately 23,739.64, the principal repaid in Year 2 is closest to:","o":["17,739.64","18,804.02","4,935.62"],"a":1,"e":"Balance after year 1 = 100,000 × 1.06 − 23,739.64 = 82,260.36; year-2 interest = 82,260.36 × 6% = 4,935.62; principal repaid = 23,739.64 − 4,935.62 = 18,804.02. 17,739.64 is the year-1 principal, and 4,935.62 is the year-2 interest portion.","d":3,"t":"Amortization schedule","c":"In an amortization schedule, interest = rate × beginning balance, principal repaid = payment − interest, and ending balance = beginning balance − principal repaid. With level payments, the interest share falls and the principal share rises over time."},{"r":2,"q":"From the bondholder's perspective, the main disadvantage of a sinking fund provision is that:","o":["it lengthens the expected life of the bond issue.","bonds may be retired at the sinking fund price when market rates have fallen, creating reinvestment risk.","it increases the credit risk of the issue over time."],"a":1,"e":"If rates fall, the issuer retires bonds at the sinking fund price (often par) even though they are worth more, and the investor must reinvest at lower rates. A sinking fund, by contrast, reduces credit risk and shortens the average life of the issue.","d":2,"t":"Sinking fund","c":"A sinking fund requires the issuer to retire part of the issue periodically (by calling at the sinking fund price or buying in the market). It lowers credit risk but exposes bondholders to reinvestment risk when bonds are retired after rates have fallen."},{"r":2,"q":"A floating-rate note with a par value of 1,000,000 pays quarterly coupons equal to the market reference rate (MRR) plus a quoted margin of 85 bp. If the MRR at the last reset was 3.20%, the next coupon payment is closest to:","o":["40,500.00","10,125.00","8,000.00"],"a":1,"e":"Coupon = 1,000,000 × (3.20% + 0.85%) / 4 = 10,125.00. 40,500 is the annualized amount (the division by 4 is forgotten) and 8,000 omits the quoted margin.","d":1,"t":"Floating-rate note coupon","c":"An FRN coupon resets each period: coupon = par × (MRR + quoted margin) × (period fraction of a year). The quoted margin is fixed at issuance; only the reference rate changes."},{"r":2,"q":"An investor buys a capital-indexed inflation-linked bond with a par value of 1,000 and a 2% real coupon paid annually. Inflation over the first year is 4%. The first coupon payment is closest to:","o":["20.80","60.00","20.00"],"a":0,"e":"For a capital-indexed bond, the principal is adjusted: 1,000 × 1.04 = 1,040, then the real coupon rate is applied to the indexed principal: 2% × 1,040 = 20.80. 20.00 ignores indexation and 60.00 wrongly adds inflation and the real coupon (the structure of an interest-indexed bond).","d":2,"t":"Inflation-linked bonds","c":"Capital-indexed bonds (e.g., TIPS) keep a fixed real coupon rate and adjust the principal for inflation, so coupon = real rate × inflation-adjusted principal. Interest-indexed bonds adjust only the coupon rate; zero-coupon-indexed and indexed-annuity structures also exist."},{"r":2,"q":"A convertible bond with a par value of 1,000 has a conversion ratio of 25 and trades at 1,180. The underlying share price is 44. The market conversion premium per share is closest to:","o":["80.00","7.20","3.20"],"a":2,"e":"Market conversion price = 1,180 / 25 = 47.20; conversion premium per share = 47.20 − 44 = 3.20. 7.20 uses the conversion price at issuance (1,000 / 25 = 40) instead of the share price, and 80.00 is the total premium (1,180 − 1,100), not per share.","d":3,"t":"Convertible bond premium","c":"Conversion value = conversion ratio × share price. Market conversion premium per share = (convertible price ÷ conversion ratio) − share price; total conversion premium = convertible price − conversion value."},{"r":2,"q":"Compared with an otherwise identical option-free bond, a putable bond will most likely have a:","o":["lower price and a higher yield.","higher price and a lower yield.","higher price and a higher yield."],"a":1,"e":"The put option belongs to the bondholder, who pays for it: the price is higher and the yield lower than for the option-free bond. A lower price with a higher yield characterizes a callable bond; price and yield cannot move in the same direction.","d":1,"t":"Putable bond","c":"Value of putable bond = straight bond value + put option value (option held by the investor), so it trades at a higher price/lower yield. Value of callable bond = straight bond value − call option value (option held by the issuer), so higher yield."},{"r":3,"q":"In an underwritten bond offering, the risk of being unable to sell the entire issue at the offering price is borne primarily by the:","o":["issuer.","investment bank.","bond trustee."],"a":1,"e":"In an underwritten offering, the bank buys the whole issue and bears the placement risk. In a best-efforts offering this risk stays with the issuer; the trustee only represents the bondholders.","d":1,"t":"Underwritten offering","c":"Underwritten (firm commitment) offering: the investment bank buys the entire issue and resells it, bearing the risk of not placing it. Best-efforts offering: the bank acts only as broker and the issuer keeps the placement risk."},{"r":3,"q":"A shelf registration allows an issuer to:","o":["auction bonds to the public at a single clearing yield.","sell bonds only to a small group of qualified investors without registration.","file a single offering document and issue bonds in tranches over a period of time."],"a":2,"e":"Shelf registration lets the issuer file a single document and then issue over time without a new full document. Selling to a small group of investors without registration is a private placement, and the single-price auction is a sovereign issuance method.","d":1,"t":"Shelf registration","c":"Shelf registration: one master offering document is filed and bonds are issued in tranches over time, each with only a short supplement. Private placements are sold to a few qualified investors without public registration."},{"r":3,"q":"Which of the following statements about secondary bond markets is most accurate?","o":["Most bonds trade in over-the-counter dealer markets rather than on exchanges.","Most corporate bonds trade on organized exchanges with central limit order books.","Bid-ask spreads are typically wider for on-the-run government bonds than for high-yield corporate bonds."],"a":0,"e":"The vast majority of bonds trade over the counter through dealers (market makers). Organized exchanges play a marginal role, and bid-ask spreads are tighter on liquid on-the-run government bonds than on high yield.","d":1,"t":"Secondary bond markets","c":"Secondary bond trading is mostly OTC in dealer markets. Liquidity, and therefore narrow bid-ask spreads, is highest for on-the-run sovereign bonds and lowest for small, high-yield or seasoned issues."},{"r":3,"q":"Compared with a public offering, a private placement of bonds is most likely to be:","o":["less liquid and more customized to the needs of the buyers.","more liquid because it is sold to sophisticated investors.","subject to the same registration requirements as a public offering."],"a":0,"e":"A private placement is sold directly to a few qualified investors without full registration; the securities are rarely resold, so they are illiquid, and terms are often negotiated to suit the buyers. The buyers' sophistication does not create liquidity, and exemption from registration is precisely what defines a private placement.","d":2,"t":"Private placement","c":"Private placements are non-underwritten, unregistered offerings sold to a small group of qualified investors. They are typically less liquid than public issues but have more customized terms and covenants."},{"r":3,"q":"A government sells 100 million of bonds through a single-price auction. Non-competitive bids total 10 million. Competitive bids are: 30 million at 3.10%, 40 million at 3.12%, 50 million at 3.15%, and 20 million at 3.18%. The yield paid to all successful bidders is:","o":["3.18%","3.10%","3.15%"],"a":2,"e":"Non-competitive bids (10m) are filled first, leaving 90m. Cumulating competitive bids by increasing yield: 30m (3.10%), 70m (3.12%), then 120m at 3.15% exceeds 90m, so the clearing yield is 3.15%, paid to everyone in a single-price auction. 3.10% is the most aggressive bid and 3.18% lies outside the amount issued.","d":2,"t":"Single-price auction","c":"In a single-price (Dutch) auction, non-competitive bids are filled first; competitive bids are then accepted from lowest yield upward until the issue is filled. All successful bidders receive the highest accepted (clearing) yield."},{"r":3,"q":"A government sells 100 million of bonds through a single-price auction. Non-competitive bids total 10 million. Competitive bids are: 30 million at 3.10%, 40 million at 3.12%, 50 million at 3.15%, and 20 million at 3.18%. The amount allocated to the bidders at 3.15% is closest to:","o":["50 million","20 million","30 million"],"a":1,"e":"After 10m of non-competitive bids and 70m filled at 3.10% and 3.12%, 100 − 10 − 70 = 20m remains for the bids at 3.15%. 50m ignores the issue size limit, and 30m forgets to fill non-competitive bids first.","d":3,"t":"Auction allocation","c":"Auction allocation order: non-competitive bids in full, then competitive bids from the lowest yield up. Bids at the clearing yield receive only the remaining amount (pro rata if needed); bids above it receive nothing."},{"r":3,"q":"A dealer quotes a corporate bond at 98.45 bid and 98.60 offer (per 100 of par). An investor who buys 2 million par value from the dealer will pay closest to (ignoring accrued interest):","o":["1,969,000","1,972,000","1,970,500"],"a":1,"e":"The investor buys at the dealer's offer (ask) price: 98.60% × 2,000,000 = 1,972,000. 1,969,000 corresponds to the bid price (the price at which the dealer buys) and 1,970,500 to the mid price.","d":1,"t":"Bid-ask quotes","c":"Dealers buy at the bid and sell at the offer (ask); the bid-ask spread is the dealer's compensation and a measure of liquidity. Investors buy at the ask and sell at the bid; price = quote (% of par) × par amount."},{"r":4,"q":"Issuers of commercial paper most often maintain backup lines of credit with banks primarily to mitigate:","o":["interest rate risk.","currency risk.","rollover risk."],"a":2,"e":"Because CP is very short term, the issuer must keep rolling it over; backup lines cover the risk of being unable to refinance (rollover risk). They protect neither against rate changes nor against currency risk.","d":1,"t":"Commercial paper","c":"Commercial paper is short-term unsecured debt that issuers continually roll over; rollover risk is the risk of being unable to refinance maturing CP. Backup lines of credit from banks mitigate this risk and support credit ratings."},{"r":4,"q":"A company issues 90-day commercial paper with a face value of 1,000,000 at a discount rate of 4.80% (360-day year). The proceeds received by the issuer are closest to:","o":["988,000","988,142","952,000"],"a":0,"e":"Price = 1,000,000 × (1 − 0.048 × 90/360) = 988,000. 988,142 wrongly treats 4.80% as an add-on rate, and 952,000 applies the annual rate without prorating it over 90 days.","d":2,"t":"Discount basis pricing","c":"For a discount-basis instrument: PV = FV × (1 − Days/Year × DR). The discount rate is quoted on face value, not on the price paid."},{"r":4,"q":"A 90-day commercial paper issue with face value 1,000,000 sells for 988,000. Its add-on (money market) yield on a 360-day basis is closest to:","o":["4.926%","4.800%","4.858%"],"a":2,"e":"Add-on yield = (1,000,000 / 988,000 − 1) × 360/90 = 4.858%. 4.800% is the discount rate (computed on face value rather than price paid), and 4.926% uses a 365-day basis.","d":3,"t":"Add-on yield","c":"Add-on (money market) yield: AOR = (Year/Days) × (FV − PV)/PV. It is computed on the amount invested, so for the same instrument it exceeds the discount rate."},{"r":4,"q":"A bank enters a 30-day repurchase agreement using government bonds with a market value of 10 million as collateral. The repo margin (haircut) is 2% and the repo rate is 3.60% (360-day basis). The repurchase price is closest to:","o":["9,800,000","9,829,400","10,030,000"],"a":1,"e":"Amount lent = 10m × (1 − 2%) = 9,800,000; repurchase price = 9,800,000 × (1 + 3.60% × 30/360) = 9,829,400. 10,030,000 ignores the haircut, and 9,800,000 forgets the repo interest.","d":2,"t":"Repurchase agreement","c":"In a repo, the cash lent = collateral value × (1 − haircut); repurchase price = cash lent × (1 + repo rate × days/360). The repo is economically a collateralized short-term loan."},{"r":4,"q":"All else equal, the repo margin (haircut) on a repurchase agreement is most likely to be higher when the:","o":["collateral is in limited supply and in high demand.","collateral is less liquid and of lower credit quality.","repo term is shorter."],"a":1,"e":"The haircut protects the lender; it increases with collateral risk (low liquidity, weaker credit) and with the repo term. A shorter repo or scarce, in-demand (special) collateral leads instead to a lower haircut or repo rate.","d":2,"t":"Repo margin","c":"Repo rates and haircuts rise with longer repo terms, lower collateral quality and liquidity, weaker counterparty credit and higher interest rates. Collateral in high demand (\"special\") commands a lower repo rate."},{"r":4,"q":"Medium-term notes (MTNs) are best described as debt securities that are:","o":["short-term unsecured promissory notes with maturities under 270 days.","offered continuously by an issuer through agents, with a range of maturities.","always issued with maturities between one and three years."],"a":1,"e":"MTNs are issued continuously through agents, with very varied maturities (from a few months to over 30 years); the name is therefore misleading. The under-270-day definition applies to US commercial paper.","d":1,"t":"Medium-term notes","c":"Medium-term notes are offered continuously by an issuer through agents, with a wide range of maturities (9 months to 30+ years) and often customized structures. US commercial paper, by contrast, has maturities of 270 days or less."},{"r":4,"q":"Which of the following is a source of wholesale funding for a commercial bank?","o":["Demand deposits","Retail savings accounts","Negotiable certificates of deposit"],"a":2,"e":"Large negotiable CDs are part of wholesale funding, along with interbank and central bank funds. Demand deposits and savings accounts are retail deposits.","d":1,"t":"Bank wholesale funding","c":"Banks fund themselves with retail deposits (demand, savings, small time deposits) and wholesale funding (interbank and central bank funds, large negotiable CDs, repos, CP). Wholesale funding is more price-sensitive and less stable."},{"r":5,"q":"Sovereign bonds issued in the government's own currency typically have lower default risk than its foreign-currency bonds primarily because the government:","o":["is protected by supranational guarantees.","can raise taxes and create money to service local-currency debt.","pays lower coupons on local-currency debt."],"a":1,"e":"A government can levy taxes and, through its central bank, create money to repay local-currency debt, which it cannot do for foreign-currency debt. There is no general supranational guarantee, and the coupon level does not determine default risk.","d":1,"t":"Sovereign local vs foreign currency","c":"Sovereigns have the power to tax and to print their own currency, so local-currency sovereign debt has lower default risk than foreign-currency debt, which must be serviced from foreign-exchange earnings or reserves."},{"r":5,"q":"Bonds issued by the International Bank for Reconstruction and Development (World Bank) are best classified as:","o":["agency bonds.","supranational bonds.","sovereign bonds."],"a":1,"e":"The IBRD is an international organization owned by several member countries: its bonds are supranational. A sovereign bond is issued by a national government, and an agency bond by a quasi-government entity of a single country.","d":1,"t":"Supranational issuers","c":"Non-sovereign government issuers include agencies (quasi-government entities of one country), local governments (municipals) and supranationals (multilateral bodies such as the World Bank, IMF or regional development banks)."},{"r":5,"q":"Compared with a general obligation bond of the same municipality, a revenue bond is most likely to:","o":["be guaranteed by the national government.","have lower credit risk because it is backed by the full taxing power of the issuer.","have higher credit risk because it is repaid only from the revenues of a specific project."],"a":2,"e":"A revenue bond is repaid only from the revenues of the financed project (toll road, airport…), so it is riskier than a GO bond backed by the municipality's taxing power. The taxing power guarantee describes the GO bond, and no central government guarantee is implied.","d":2,"t":"Municipal bonds","c":"General obligation (GO) bonds are backed by the issuing government's taxing power. Revenue bonds are serviced only from the cash flows of a specific project, so they carry higher credit risk and usually higher yields."},{"r":5,"q":"Compared with an off-the-run government bond of similar maturity, the most recently issued (on-the-run) bond most likely has:","o":["lower liquidity and a slightly higher yield.","greater liquidity and a slightly higher yield.","greater liquidity and a slightly lower yield."],"a":2,"e":"The on-the-run bond is the most traded and serves as the benchmark; its superior liquidity translates into a higher price and therefore a slightly lower yield. The other two answers reverse the link between liquidity and yield.","d":2,"t":"On-the-run vs off-the-run","c":"On-the-run bonds are the most recently issued sovereign bonds of a given maturity; they are the most liquid and trade at slightly lower yields than off-the-run (seasoned) bonds. They are used as benchmarks for pricing other bonds."},{"r":5,"q":"A 182-day Treasury bill is quoted at a discount rate of 4.20% on an actual/360 basis. Its price per 100 of face value is closest to:","o":["97.9208","97.8767","97.9058"],"a":1,"e":"Price = 100 × (1 − 0.042 × 182/360) = 97.8767. 97.9058 uses a 365-day basis, and 97.9205 wrongly treats 4.20% as an add-on rate.","d":2,"t":"T-bill discount pricing","c":"T-bills are quoted on a discount basis: Price = FV × (1 − DR × Days/360). The discount is based on face value and an actual/360 convention."},{"r":5,"q":"A 182-day Treasury bill priced at 97.8767 per 100 of face value has a bond equivalent yield (add-on, 365-day basis) closest to:","o":["4.291%","4.200%","4.351%"],"a":2,"e":"BEY = (100 / 97.8767 − 1) × 365/182 = 4.351%. 4.200% is the discount rate (360-day basis, relative to face value) and 4.291% is the add-on yield on a 360-day basis.","d":3,"t":"Bond equivalent yield","c":"Bond equivalent yield (BEY) of a money market instrument is an add-on yield on a 365-day basis: BEY = (FV/PV − 1) × 365/Days. It allows comparison with yields on coupon bonds."},{"r":5,"q":"Bonds issued by a government-sponsored enterprise that is not directly backed by the full faith and credit of the national government are best described as:","o":["agency (quasi-government) bonds.","supranational bonds.","sovereign bonds."],"a":0,"e":"Government-sponsored entities (such as housing finance agencies) issue agency or quasi-government bonds, often with an implicit but not formal guarantee. Sovereign bonds are issued by the state itself and supranational bonds by multilateral organizations.","d":1,"t":"Agency bonds","c":"Agency (quasi-government) bonds are issued by entities sponsored or owned by a national government; they may carry an explicit or only implicit government guarantee, so they usually yield slightly more than sovereign bonds."},{"r":6,"q":"A 5-year bond with a 4% annual coupon has a yield to maturity of 5%. Its price per 100 of par is closest to:","o":["104.45","95.67","95.00"],"a":1,"e":"Price = 4/1.05 + 4/1.05² + … + 104/1.05⁵ = 95.67. The bond trades below par because the coupon is below the yield. 104.45 reverses coupon and yield, and 95.00 is a crude linear approximation (100 − 5 years × 1%) that ignores discounting.","d":1,"t":"Bond pricing","c":"Bond price = Σ PMT/(1 + r)^t + FV/(1 + r)^N, discounting every cash flow at the market discount rate (YTM). Coupon < yield → discount; coupon = yield → par; coupon > yield → premium."},{"r":6,"q":"A 10-year bond pays a 6% coupon semiannually. If its yield to maturity is 5.00% (stated on a semiannual bond basis), its price per 100 of par is closest to:","o":["104.38","107.79","75.08"],"a":1,"e":"With 20 semiannual periods, coupon 3 and rate 2.5%: Price = Σ 3/1.025^t + 100/1.025²⁰ = 107.79. 75.08 discounts the semiannual coupons of 3 at the full 5% annual rate per period, and 104.38 uses only 10 semiannual periods instead of 20.","d":2,"t":"Semiannual bond pricing","c":"For semiannual bonds, use periodic values: coupon = annual coupon ÷ 2, rate = stated annual yield ÷ 2, N = years × 2. Mixing annual and periodic inputs is the most common pricing error."},{"r":6,"q":"A 3-year bond with a 5% annual coupon is priced at 97.25 per 100 of par. Its yield to maturity is closest to:","o":["6.03%","5.14%","7.75%"],"a":0,"e":"Solve 97.25 = 5/(1+r) + 5/(1+r)² + 105/(1+r)³, giving r ≈ 6.03%. 5.14% is the current yield, which ignores the capital gain, and 7.75% puts the whole discount into a single year.","d":2,"t":"Yield to maturity","c":"Yield to maturity is the internal rate of return that equates the bond's price to the present value of its cash flows; it is solved by trial and error or a calculator. YTM assumes the bond is held to maturity, no default, and coupons reinvested at the YTM."},{"r":6,"q":"A bond with a 6% coupon paid semiannually has exactly six coupons remaining. Settlement occurs 60 days into the 180-day coupon period (30/360 day count), and the yield to maturity is 5.00% (semiannual bond basis). The flat price per 100 of par is closest to:","o":["102.603","103.603","102.754"],"a":0,"e":"Value at the last coupon date (6 periods, coupon 3, rate 2.5%) = 102.754; full price = 102.754 × 1.025^(60/180) = 103.603; accrued interest = 3 × 60/180 = 1.000; flat price = 102.603. 103.603 is the full price and 102.754 omits the date adjustment.","d":3,"t":"Full and flat price","c":"Full (dirty) price = PV at last coupon date × (1 + r)^(t/T). Accrued interest = coupon × t/T. Flat (clean, quoted) price = full price − accrued interest."},{"r":6,"q":"A bond is priced at a discount to par. If its yield to maturity remains unchanged, as the bond approaches maturity its price will most likely:","o":["decrease further below par value.","increase toward par value.","remain unchanged."],"a":1,"e":"At a constant yield, a discount bond's price converges to par at maturity (the \"pull to par\" effect). It neither falls nor stays constant, because the discount must be amortized until redemption at 100.","d":1,"t":"Constant-yield price trajectory","c":"If the yield is unchanged, a bond's price follows its constant-yield trajectory toward par: discount bonds rise toward par and premium bonds fall toward par as maturity approaches."},{"r":6,"q":"An analyst uses matrix pricing to estimate the yield of an illiquid 4-year corporate bond. Comparable bonds with the same credit quality have yields of 3.20% (3-year) and 3.80% (5-year). The estimated yield for the 4-year bond is closest to:","o":["3.20%","3.80%","3.50%"],"a":2,"e":"Linear interpolation: 3.20% + (4 − 3)/(5 − 3) × (3.80% − 3.20%) = 3.50%. Choosing 3.80% or 3.20% amounts to using a single comparable maturity instead of interpolating.","d":2,"t":"Matrix pricing","c":"Matrix pricing estimates the yield (or price) of an illiquid or unissued bond from comparable bonds with similar credit quality, coupon and maturity, typically by linear interpolation between neighboring maturities."},{"r":6,"q":"Spot rates are 3% (1-year), 4% (2-year), and 5% (3-year). The price of a 3-year bond with a 5% annual coupon is closest to:","o":["105.66","100.00","100.18"],"a":2,"e":"Price = 5/1.03 + 5/1.04² + 105/1.05³ = 100.18. 100.00 would discount all cash flows at 5% (the 3-year rate), and 105.66 would use the 1-year rate for every cash flow.","d":2,"t":"Pricing with spot rates","c":"With spot rates, each cash flow is discounted at the spot rate for its own maturity: Price = Σ CF_t / (1 + Z_t)^t. This is the no-arbitrage price."},{"r":7,"q":"A bond has a yield to maturity of 5.00% stated on a semiannual bond basis. The equivalent annual (effective) yield is closest to:","o":["5.0625%","5.0000%","4.9390%"],"a":0,"e":"Annual yield = (1 + 0.05/2)² − 1 = 5.0625%. 5.0000% ignores semiannual compounding, and 4.9390% performs the reverse conversion (annual to semiannual).","d":1,"t":"Periodicity conversion","c":"To convert between periodicities, equate effective returns: (1 + APR_m/m)^m = (1 + APR_n/n)^n. More frequent compounding means a lower stated rate for the same effective yield."},{"r":7,"q":"A Eurobond has an annual-pay yield to maturity of 6.00%. For comparison with a semiannual-pay bond, its yield on a semiannual bond basis is closest to:","o":["6.0000%","6.0900%","5.9126%"],"a":2,"e":"Semiannual-equivalent rate = 2 × [(1.06)^0.5 − 1] = 5.9126%. A more frequent periodicity gives a lower stated rate. 6.0000% makes no conversion, and 6.0900% converts in the wrong direction.","d":2,"t":"Semiannual bond basis","c":"A semiannual bond basis yield is the yield per semiannual period × 2. To compare an annual-pay yield with semiannual bonds: (1 + APR_2/2)² = 1 + APR_1."},{"r":7,"q":"A bond with a 7% annual coupon is priced at 104.50 per 100 of par. Its current yield is closest to:","o":["11.00%","7.00%","6.70%"],"a":2,"e":"Current yield = annual coupon / price = 7 / 104.50 = 6.70%. 7.00% is the coupon rate, and the third answer wrongly adds the premium as if it were a gain.","d":1,"t":"Current yield","c":"Current yield = annual coupon ÷ flat price. It ignores reinvestment income and the gain or loss to maturity, so for a premium bond current yield > YTM and for a discount bond current yield < YTM."},{"r":7,"q":"A 5-year corporate bond yields 5.85%. Government bond yields are 3.90% for 4 years and 4.30% for 6 years. Using linear interpolation, the G-spread of the corporate bond is closest to:","o":["175 bp","155 bp","195 bp"],"a":0,"e":"Interpolated 5-year government yield = (3.90% + 4.30%)/2 = 4.10%; G-spread = 5.85% − 4.10% = 1.75% = 175 bp. 195 bp uses the 4-year rate and 155 bp the 6-year rate without interpolation.","d":2,"t":"G-spread","c":"G-spread = bond YTM − government benchmark yield of the same maturity (interpolated if no exact benchmark). It measures compensation for credit, liquidity and other risks relative to sovereigns."},{"r":7,"q":"The I-spread of a corporate bond is measured relative to:","o":["the government bond yield of the same maturity.","the entire government spot curve.","the swap rate of the same maturity."],"a":2,"e":"The I-spread (interpolated spread) is the difference between the bond's yield and the swap rate of the same maturity. The spread over the government yield is the G-spread, and the constant spread over the whole zero curve is the Z-spread.","d":1,"t":"I-spread","c":"Yield spread measures: G-spread over government yields, I-spread over swap rates of the same maturity, Z-spread as the constant spread added to each spot rate so that discounted cash flows equal the price."},{"r":7,"q":"Spot rates on government bonds are 3.0% (1-year), 3.5% (2-year), and 4.0% (3-year). A 3-year corporate bond with a 6% annual coupon is priced at 100.50. The bond's Z-spread is closest to:","o":["185 bp","281 bp","200 bp"],"a":0,"e":"Find z such that 100.50 = 6/(1.03+z) + 6/(1.035+z)² + 106/(1.04+z)³, giving z ≈ 185 bp. 281 bp wrongly compares the YTM (5.81%) with the 1-year spot rate, and 200 bp wrongly compares the coupon with a spot rate.","d":3,"t":"Z-spread","c":"The Z-spread is the constant spread added to every government spot rate such that the PV of the bond's cash flows equals its price: Price = Σ CF_t / (1 + Z_t + z)^t. Unlike the G-spread it uses the whole spot curve."},{"r":7,"q":"A 5-year bond with a 6% annual coupon is priced at 105.00. It is callable in 2 years at 102 and in 3 years at 101. The bond's yield to worst is closest to:","o":["4.32%","4.85%","4.50%"],"a":0,"e":"YTM (5 years, redemption at 100) = 4.85%; yield to the 2-year call (102) = 4.32%; to the 3-year call (101) = 4.50%. The yield to worst is the lowest of the three, 4.32%; the other two values are not the worst case for the investor.","d":3,"t":"Yield to worst","c":"For a callable bond, compute the yield to each call date (using the call price as redemption value) and the YTM; the yield to worst is the lowest of these yields. It is most relevant for bonds trading at a premium."},{"r":8,"q":"A floating-rate note trades below par value. Compared with its quoted margin, its discount margin is most likely:","o":["higher.","equal.","lower."],"a":0,"e":"An FRN trades below par when the margin required by the market (discount margin) exceeds the quoted margin set at issuance. A lower discount margin would make it trade above par, and an equal margin would make it trade at par on a reset date.","d":1,"t":"Discount margin vs quoted margin","c":"The quoted margin is fixed in the FRN contract; the discount (required) margin reflects current market credit risk. Discount margin > quoted margin → below par; equal → par at reset; lower → premium."},{"r":8,"q":"A 2-year floating-rate note pays quarterly coupons of MRR + 0.80%. The MRR is 3.00% and is assumed constant; the required discount margin is 1.00%. The price of the FRN per 100 of par is closest to:","o":["99.62","100.00","100.38"],"a":0,"e":"Quarterly coupon = (3.00% + 0.80%)/4 × 100 = 0.95; quarterly discount rate = (3.00% + 1.00%)/4 = 1.00%; over 8 periods, Price = Σ 0.95/1.01^t + 100/1.01⁸ = 99.62. 100.38 swaps the quoted margin and the discount margin, and 100.00 wrongly assumes the required margin equals the quoted margin.","d":2,"t":"FRN pricing","c":"Simplified FRN pricing: coupon per period = (MRR + QM)/m × FV, discount rate per period = (MRR + DM)/m, with MRR assumed constant; then price as a fixed-rate bond over N = years × m periods."},{"r":8,"q":"An investor places 1,000,000 in a 180-day certificate of deposit with an add-on rate of 4.50% quoted on a 365-day basis. The amount received at maturity is closest to:","o":["1,022,191.78","1,022,695.43","1,022,500.00"],"a":0,"e":"For an add-on rate, interest is added to principal: 1,000,000 × (1 + 4.50% × 180/365) = 1,022,191.78. 1,022,500.00 uses a 360-day basis, and 1,022,695.43 treats the rate as a discount rate.","d":2,"t":"Add-on rate","c":"Add-on rate instruments (CDs, repos, interbank deposits): FV = PV × (1 + AOR × Days/Year). Interest is computed on the principal and paid on top of it at maturity."},{"r":8,"q":"An investor compares three 90-day money market instruments: Instrument X is quoted at a discount rate of 4.80% (360-day basis); Instrument Y at an add-on rate of 4.85% (360-day basis); Instrument Z at an add-on rate of 4.90% (365-day basis). Which instrument offers the highest return?","o":["Instrument Y","Instrument Z","Instrument X"],"a":2,"e":"Convert everything to a 365-day add-on yield: X = [1/(1 − 0.048 × 90/360) − 1] × 365/90 = 4.926%; Y = 4.85% × 365/360 = 4.917%; Z = 4.900%. X offers the highest yield: a discount rate understates the true yield because it is based on face value, and Z only looks high because its basis is already 365.","d":3,"t":"Money market yield comparison","c":"To compare money market instruments, restate all quotes on the same basis, typically an add-on yield on a 365-day year (bond equivalent yield). Discount rates understate yields and 360-day bases understate 365-day equivalents."},{"r":8,"q":"Shortly after issuance, the credit quality of an FRN issuer deteriorates while the market reference rate is unchanged. On the next reset date, the FRN will most likely trade:","o":["at par, because the coupon resets to the market reference rate.","below par, because the required margin exceeds the quoted margin.","above par, because the coupon resets higher."],"a":1,"e":"The reset applies only to the reference rate; the quoted margin stays fixed. If credit risk rises, the required margin exceeds the quoted margin and the FRN trades below par even on the reset date. The coupon does not rise with credit deterioration.","d":2,"t":"FRN credit risk","c":"FRNs have low interest-rate risk because the reference rate resets, but they retain credit-spread risk: the quoted margin is fixed, so a rise in the required margin lowers the price below par even at reset dates."},{"r":8,"q":"Assuming no change in the issuer's credit risk, the price of a floating-rate note on its coupon reset dates will most likely be:","o":["close to par value.","well above par if market rates have risen.","well below par if market rates have risen."],"a":0,"e":"If the required margin stays equal to the quoted margin, the coupon resets to the market level at each reset and the price returns to par. Sensitivity to the reference rate is therefore very low, unlike a fixed-rate bond.","d":1,"t":"FRN price at reset","c":"On reset dates, an FRN whose required margin equals its quoted margin is priced at (or very near) par. Its interest-rate duration is roughly the time to the next reset."},{"r":8,"q":"A 3-year floating-rate note pays quarterly coupons of MRR + 1.00% and is priced at 98.80. Assuming the MRR remains constant at 2.50%, the discount margin is closest to:","o":["393 bp","100 bp","143 bp"],"a":2,"e":"Solve 98.80 = Σ (3.50/4)/(1 + (2.50% + DM)/4)^t + 100/(1 + (2.50% + DM)/4)¹² over 12 quarters, giving DM ≈ 143 bp. 100 bp is the quoted margin, valid only at par, and 393 bp is the total discount rate (MRR + DM), not the margin.","d":3,"t":"Discount margin","c":"The discount margin is the spread over the MRR that makes the PV of the FRN's projected cash flows (MRR + QM) equal to its price, discounting at (MRR + DM)/m per period. It is solved by trial and error or a calculator."},{"r":9,"q":"The 1-year spot rate is 3.00% and the 2-year spot rate is 4.00%. The 1-year forward rate one year from now (1y1y) is closest to:","o":["5.01%","3.50%","4.00%"],"a":0,"e":"1y1y = 1.04²/1.03 − 1 = 5.01%. 4.00% is the 2-year spot rate and 3.50% is the average of the spot rates, which ignores the compounding no-arbitrage relationship.","d":1,"t":"Forward rates","c":"Implied forward rates come from no-arbitrage: (1 + Z_A)^A × (1 + IFR_{A,B−A})^(B−A) = (1 + Z_B)^B. For example 1y1y = (1 + Z_2)²/(1 + Z_1) − 1."},{"r":9,"q":"The 1-year spot rate is 3.00% and the 3-year spot rate is 4.50%. The 2-year forward rate one year from now (1y2y) is closest to:","o":["3.75%","5.26%","10.79%"],"a":1,"e":"(1 + 1y2y)² = 1.045³/1.03, so 1y2y = (1.045³/1.03)^0.5 − 1 = 5.26%. 10.79% forgets the square root (the cumulative 2-year rate), and 3.75% is the simple average of the two spot rates.","d":2,"t":"Forward rates","c":"For a multi-year forward rate, solve (1 + Z_A)^A × (1 + f)^(B−A) = (1 + Z_B)^B and annualize with the (B−A)th root: f = [(1 + Z_B)^B / (1 + Z_A)^A]^(1/(B−A)) − 1."},{"r":9,"q":"The 1-year and 2-year par rates (annual coupon) are 2.00% and 3.00%, respectively. The 2-year spot rate is closest to:","o":["4.010%","3.000%","3.015%"],"a":2,"e":"Bootstrapping: 100 = 3/1.02 + 103/(1+z₂)², so (1+z₂)² = 103/(100 − 2.9412), z₂ = 3.015%. 3.000% is the par rate, which is below the spot rate when the curve slopes upward, and 4.010% confuses it with a forward rate.","d":2,"t":"Bootstrapping spot rates","c":"Bootstrapping: each par bond is priced at 100 using the spot rates already known for earlier cash flows, and the equation is solved for the final spot rate: 100 = Σ PMT/(1 + Z_t)^t + (PMT + 100)/(1 + Z_N)^N."},{"r":9,"q":"One-year forward rates are 2.00% (0y1y), 3.00% (1y1y), and 4.00% (2y1y). The price of a 3-year bond with a 4% annual coupon is closest to:","o":["102.83","102.91","100.00"],"a":1,"e":"Price = 4/1.02 + 4/(1.02 × 1.03) + 104/(1.02 × 1.03 × 1.04) = 102.91. 102.83 discounts everything at the average of the forwards (3%), and 100.00 uses the last forward (4%) for all cash flows.","d":2,"t":"Pricing with forward rates","c":"Using forward rates, each cash flow is discounted by the product of the one-period forward rates up to its date: DF_t = 1/[(1 + f_0)(1 + f_1)…(1 + f_{t−1})]. This gives the same price as the spot curve."},{"r":9,"q":"When the spot curve is upward sloping, which of the following relationships is most likely correct?","o":["Par curve above spot curve, and forward curve below spot curve","Forward curve above spot curve, and par curve below spot curve","Forward, spot and par curves coincide"],"a":1,"e":"With an upward-sloping spot curve, the marginal forward rates exceed the spot rates (which are averages), and the par curve, which discounts coupons at lower rates, lies below the spot curve. The three curves coincide only when the curve is flat.","d":2,"t":"Spot, par and forward curves","c":"Upward-sloping spot curve: forward curve above spot curve, par curve below spot curve. Downward-sloping: the order reverses. Flat: all three coincide."},{"r":9,"q":"Under the liquidity preference theory, forward rates are best described as:","o":["unrelated to expected future spot rates because each maturity segment is independent.","upward-biased estimates of expected future spot rates.","unbiased estimates of expected future spot rates."],"a":1,"e":"The liquidity preference theory adds a liquidity premium that increases with maturity: forward rates overstate expected future spot rates. The unbiased estimate corresponds to pure expectations, and independent segments to market segmentation theory.","d":3,"t":"Term structure theories","c":"Pure expectations: forward rates are unbiased predictors of future spot rates. Liquidity preference: forwards include a term premium rising with maturity (upward bias). Segmented markets/preferred habitat: supply and demand within maturity segments drive yields."},{"r":9,"q":"Par rates (annual coupon) are 2.00% (1-year), 3.00% (2-year), and 3.80% (3-year). The 3-year spot rate is closest to:","o":["3.844%","3.015%","3.800%"],"a":0,"e":"z₂ = 3.015% (bootstrapping at 2 years), then 100 = 3.8/1.02 + 3.8/(1+z₂)² + 103.8/(1+z₃)³, giving z₃ = 3.844%. 3.800% is the 3-year par rate, and 3.015% is the 2-year spot rate.","d":3,"t":"Bootstrapping spot rates","c":"Bootstrapping proceeds sequentially: solve the 1-year spot, then the 2-year using it, then the 3-year using both, each time pricing the par bond at 100 with known spot rates for earlier coupons."},{"r":10,"q":"An investor's horizon equals the Macaulay duration of her bond. If yields change immediately after purchase, the investor is most likely:","o":["fully exposed to market price risk.","approximately protected, because coupon reinvestment and price effects offset.","fully exposed to coupon reinvestment risk."],"a":1,"e":"When the horizon equals the Macaulay duration, the coupon reinvestment effect and the price effect approximately offset each other (immunization). The investor is therefore not dominated by either risk.","d":1,"t":"Duration and investment horizon","c":"If the investment horizon equals the Macaulay duration, coupon reinvestment risk and market price risk offset for a one-time parallel yield change, so the realized return is approximately the original YTM."},{"r":10,"q":"An investor buys a 3-year, 5% annual-coupon bond at par. Immediately after purchase, yields rise to 6% and remain there. If the bond is held to maturity and coupons are reinvested at 6%, the investor's horizon yield is closest to:","o":["5.05%","6.00%","5.00%"],"a":0,"e":"Future value = 5 × 1.06² + 5 × 1.06 + 105 = 115.918; realized return = (115.918/100)^(1/3) − 1 = 5.05%. 5.00% ignores reinvestment at 6%, and 6.00% assumes all capital is reinvested at the new rate.","d":2,"t":"Horizon yield","c":"Horizon yield = (total horizon value ÷ purchase price)^(1/T) − 1, where total horizon value = reinvested coupons + sale price (or principal at maturity). Held to maturity, a rise in rates raises the realized return through reinvestment."},{"r":10,"q":"An investor buys a 3-year, 5% annual-coupon bond at par. Immediately after purchase, yields rise to 6%. If the investor sells the bond after one year (just after receiving the first coupon), the holding-period return is closest to:","o":["2.33%","3.17%","5.00%"],"a":1,"e":"Sale price (2-year bond at 6%) = 98.1666; return = (5 + 98.1666)/100 − 1 = 3.17%. 5.00% ignores the capital loss, and 2.33% wrongly values the bond with 3 years remaining.","d":3,"t":"Holding-period return","c":"Holding-period return = (coupons + reinvestment income + sale price − purchase price) ÷ purchase price. For a short horizon, the price effect of a rate rise dominates the reinvestment effect."},{"r":10,"q":"A bond has a Macaulay duration of 7.2 and the investor's horizon is 4 years. The investor is most exposed to the risk of:","o":["falling interest rates, because the duration gap is positive.","rising interest rates, because the duration gap is negative.","rising interest rates, because the duration gap is positive."],"a":2,"e":"Duration gap = Macaulay duration − horizon = 7.2 − 4 = +3.2. A positive gap means price risk dominates: a rise in rates reduces the sale value more than it increases coupon reinvestment. Falling rates hurt mainly when the gap is negative (reinvestment risk).","d":2,"t":"Duration gap","c":"Duration gap = Macaulay duration − investment horizon. Positive gap: market price risk dominates, so the investor loses when rates rise. Negative gap: reinvestment risk dominates, so the investor loses when rates fall."},{"r":10,"q":"For an investor with a very short investment horizon who holds a long-term fixed-rate bond, the dominant source of interest rate risk is:","o":["market price risk.","default risk.","coupon reinvestment risk."],"a":0,"e":"With a short horizon (shorter than duration), the bond's sale value dominates: this is price risk. Reinvestment risk dominates for a long horizon, and default risk is not an interest rate risk.","d":1,"t":"Market price vs reinvestment risk","c":"Short horizon relative to Macaulay duration → market price risk dominates (rising rates hurt). Long horizon → coupon reinvestment risk dominates (falling rates hurt)."},{"r":10,"q":"A 5-year bond with a 3% annual coupon is purchased at a yield to maturity of 4%. If the yield remains 4%, the one-year holding-period return is closest to:","o":["3.14%","3.00%","4.00%"],"a":2,"e":"P0 = 95.5482 and P1 (4 years at 4%) = 96.3701; return = (3 + 96.3701)/95.5482 − 1 = 4.00%, i.e., the YTM, because the amortization of the discount adds to the coupon. 3.00% is the coupon and 3.14% the current yield, both of which ignore the amortization gain.","d":2,"t":"Rolling to maturity at constant yield","c":"If yields are unchanged, a bond's one-period return equals its YTM: coupon income plus the gain (discount bond) or loss (premium bond) from moving along the constant-yield price trajectory toward par."},{"r":10,"q":"An investor buys a 3-year, 5% annual-coupon bond priced at par. The investment horizon at which coupon reinvestment risk and market price risk approximately offset is closest to:","o":["2.72 years","3.00 years","2.86 years"],"a":2,"e":"Macaulay duration = (1 × 5/1.05 + 2 × 5/1.05² + 3 × 105/1.05³)/100 = 2.8594 years, the immunization horizon. 3.00 years is the maturity, and 2.72 is the modified duration, which measures sensitivity rather than a horizon.","d":2,"t":"Macaulay duration as horizon","c":"Macaulay duration is the weighted average time to receipt of cash flows, weights = PV of each cash flow ÷ price. It is the horizon at which price risk and reinvestment risk offset."},{"r":11,"q":"A 4-year bond with a 6% annual coupon has a yield to maturity of 7%. Its Macaulay duration is closest to:","o":["3.427","3.667","4.000"],"a":1,"e":"Price = 96.6128; Macaulay duration = Σ t × PV(CF_t) / Price = 3.667. 3.427 is the modified duration, and 4.000 is the maturity (valid only for a zero-coupon bond).","d":2,"t":"Macaulay duration","c":"MacDur = Σ [t × PV(CF_t)] / Price. It is less than maturity for a coupon bond and equal to maturity for a zero-coupon bond."},{"r":11,"q":"A bond with a Macaulay duration of 8.00 has a yield to maturity of 6.00% stated on a semiannual bond basis. Its modified duration is closest to:","o":["8.000","7.547","7.767"],"a":2,"e":"Modified duration = MacDur / (1 + r/2) = 8.00/1.03 = 7.767. 7.547 divides by the annual rate instead of the periodic rate, and 8.000 makes no adjustment.","d":1,"t":"Modified duration","c":"ModDur = MacDur / (1 + r), where r is the yield per period. %ΔP ≈ −ModDur × Δyield."},{"r":11,"q":"A bond is priced at 98.50. If its yield falls by 10 bp, the price rises to 99.25; if its yield rises by 10 bp, the price falls to 97.76. The approximate modified duration is closest to:","o":["1.51","7.56","15.13"],"a":1,"e":"AnnModDur = (PV₋ − PV₊)/(2 × Δy × PV₀) = (99.25 − 97.76)/(2 × 0.001 × 98.50) = 7.56. 15.13 forgets the factor of 2 in the denominator, and 1.51 mixes up the unit of the yield change.","d":2,"t":"Approximate modified duration","c":"Approximate modified duration = (PV₋ − PV₊) / (2 × Δyield × PV₀), using prices after equal yield decreases and increases. Δyield must be in decimals (10 bp = 0.001)."},{"r":11,"q":"A portfolio manager holds 5 million par value of a bond with a full price of 102.35 per 100 of par and an annual modified duration of 6.40. The price value of a basis point (PVBP) of the position is closest to:","o":["327,520","3,200","3,275"],"a":2,"e":"Position value = 5,000,000 × 1.0235 = 5,117,500; PVBP = 6.40 × 5,117,500 × 0.0001 = 3,275. 3,200 uses par value instead of the full price, and 327,520 corresponds to a 1% change rather than 1 bp.","d":2,"t":"PVBP / money duration","c":"Money duration = AnnModDur × full price (position value). PVBP (price value of a basis point) = money duration × 0.0001, the price change for a 1 bp yield change."},{"r":11,"q":"All bonds below are option-free, pay annual coupons and have a yield to maturity of 5%. Which bond has the highest Macaulay duration?","o":["10-year bond with a 6% coupon","8-year bond with a 2% coupon","10-year bond with a 2% coupon"],"a":2,"e":"Duration increases with maturity and decreases with coupon: 10-year 2% = 9.01, 10-year 6% = 7.89, 8-year 2% = 7.40. A higher coupon shifts weight to earlier cash flows, and a shorter maturity reduces duration.","d":2,"t":"Properties of duration","c":"All else equal, duration is higher for longer maturity, lower coupon and lower yield. (Exception: some long-dated deep-discount bonds, where duration may fall slightly with maturity.)"},{"r":11,"q":"A perpetual bond pays a fixed annual coupon and has a yield to maturity of 5%. Its Macaulay duration is closest to:","o":["21.00","19.05","20.00"],"a":0,"e":"Macaulay duration of a perpetuity = (1 + r)/r = 1.05/0.05 = 21.00. 20.00 is its modified duration (1/r), and 19.05 wrongly divides the modified duration by 1.05 a second time.","d":3,"t":"Duration of a perpetuity","c":"For a perpetuity, MacDur = (1 + r)/r and ModDur = 1/r. This is the upper limit of duration as maturity becomes infinite for a bond priced at par."},{"r":11,"q":"For which of the following bonds is effective duration, rather than modified duration, the more appropriate measure of interest rate risk?","o":["A zero-coupon government bond","A callable corporate bond","An option-free government bond"],"a":1,"e":"The cash flows of a callable bond depend on the level of rates (exercise of the call); only effective duration, computed from shifts in the benchmark curve, captures this. For an option-free bond or a zero-coupon bond, modified and effective duration are practically identical.","d":1,"t":"Effective duration","c":"Effective duration measures price sensitivity to a parallel shift in the benchmark yield curve and is required for bonds with embedded options or uncertain cash flows (callables, MBS). Yield-based modified duration assumes fixed cash flows."},{"r":12,"q":"A bond has an annual modified duration of 7.20 and annual convexity of 65. If its yield increases by 100 bp, the estimated percentage price change is closest to:","o":["-7.200%","-7.525%","-6.875%"],"a":2,"e":"%ΔP ≈ −7.20 × 0.01 + ½ × 65 × 0.01² = −7.200% + 0.325% = −6.875%. −7.200% ignores convexity, and −7.525% wrongly subtracts the convexity adjustment, which is always positive for positive convexity.","d":2,"t":"Duration and convexity adjustment","c":"%ΔP ≈ (−AnnModDur × ΔYield) + (½ × AnnConvexity × ΔYield²). With positive convexity the second term is always added, whatever the direction of the yield change."},{"r":12,"q":"A bond has an annual modified duration of 7.20 and annual convexity of 65. If its yield decreases by 100 bp, the estimated percentage price change is closest to:","o":["+7.525%","+6.875%","+7.200%"],"a":0,"e":"%ΔP ≈ −7.20 × (−0.01) + ½ × 65 × (−0.01)² = 7.200% + 0.325% = +7.525%. +7.200% ignores convexity and +6.875% subtracts it instead of adding it.","d":1,"t":"Duration and convexity adjustment","c":"%ΔP ≈ −ModDur × ΔY + ½ × Convexity × (ΔY)². Because ΔY is squared, the convexity term has the same sign for rate increases and decreases, so price gains exceed price losses for a positively convex bond."},{"r":12,"q":"A bond is priced at 100.00. If its yield falls by 50 bp the price rises to 104.10, and if its yield rises by 50 bp the price falls to 96.10. The approximate convexity is closest to:","o":["80.0","40.0","0.4"],"a":0,"e":"ApproxCon = (PV₋ + PV₊ − 2 × PV₀)/(Δy² × PV₀) = (104.10 + 96.10 − 200)/(0.005² × 100) = 80.0. 40.0 wrongly divides by 2, and 0.4 uses Δy instead of Δy² in the denominator.","d":2,"t":"Approximate convexity","c":"Approximate convexity = (PV₋ + PV₊ − 2 × PV₀) / (Δyield² × PV₀). Note the squared yield change in the denominator and no factor of 2."},{"r":12,"q":"A portfolio contains two bonds: Bond 1 has a market value of 4 million and a modified duration of 3.0; Bond 2 has a market value of 6 million and a modified duration of 8.0. The portfolio's modified duration is closest to:","o":["5.0","6.0","5.5"],"a":1,"e":"Portfolio duration = market-value-weighted average = 0.4 × 3.0 + 0.6 × 8.0 = 6.0. 5.5 is the simple unweighted average and 5.0 reverses the weights.","d":1,"t":"Portfolio duration","c":"Portfolio duration ≈ Σ w_i × D_i, with w_i = market value of bond i ÷ portfolio market value. This weighted-average approach implicitly assumes a parallel shift in yields."},{"r":12,"q":"Two option-free bonds have the same price, yield and modified duration, but Bond A has greater convexity than Bond B. For a large change in yield in either direction, Bond A will most likely:","o":["outperform Bond B.","perform the same as Bond B.","underperform Bond B."],"a":0,"e":"Higher positive convexity means a price that rises more when rates fall and falls less when they rise: A outperforms B in both cases. With equal duration, the difference comes solely from the convexity term.","d":1,"t":"Value of convexity","c":"For the same duration, a bond with greater positive convexity gains more when yields fall and loses less when they rise. Investors therefore value convexity, which usually costs some yield."},{"r":12,"q":"When interest rates fall to low levels, a callable bond is most likely to exhibit:","o":["negative effective convexity, because its price appreciation is capped near the call price.","higher positive convexity than an otherwise identical option-free bond.","a higher effective duration than an otherwise identical option-free bond."],"a":0,"e":"When rates fall, the probability of the call being exercised increases and the price is capped near the call price: effective convexity becomes negative. Its effective convexity and duration are thus lower than those of the option-free bond.","d":2,"t":"Negative convexity","c":"Callable bonds exhibit negative effective convexity at low yields because price appreciation is capped near the call price (price compression). Putable bonds have greater positive convexity than option-free bonds."},{"r":12,"q":"A bond position has a full market value of 1,050,000, an annual modified duration of 5.20, and annual convexity of 40. If yields fall by 50 bp, the estimated change in the position's value is closest to:","o":["+26,775","+27,300","+27,825"],"a":2,"e":"ΔV ≈ [−5.20 × (−0.005) + ½ × 40 × 0.005²] × 1,050,000 = (2.60% + 0.05%) × 1,050,000 = +27,825. +27,300 ignores convexity, and +26,775 wrongly subtracts the convexity adjustment.","d":3,"t":"Money duration and convexity","c":"ΔV ≈ [−AnnModDur × ΔY + ½ × AnnConvexity × ΔY²] × full value of the position, or equivalently −MoneyDur × ΔY + ½ × MoneyCon × ΔY²."},{"r":13,"q":"A bond is priced at 100.70. A 20 bp parallel downward shift in the benchmark curve raises its price to 102.48, and a 20 bp upward shift lowers it to 98.90. The bond's effective convexity is closest to:","o":["8.9","-49.7","49.7"],"a":1,"e":"EffCon = (PV₋ + PV₊ − 2 × PV₀)/(ΔCurve² × PV₀) = (102.48 + 98.90 − 201.40)/(0.002² × 100.70) = −49.7. Negative convexity is typical of a callable bond. 49.7 reverses the sign, and 8.9 is the effective duration, not the convexity.","d":3,"t":"Effective convexity","c":"Effective convexity = (PV₋ + PV₊ − 2 × PV₀) / (ΔCurve² × PV₀), where prices come from shifting the benchmark curve. A negative result means the bond is negatively convex (e.g., callable bond near the call price)."},{"r":13,"q":"The sum of a bond's key rate durations is best described as equal to its:","o":["effective duration.","Macaulay duration.","effective convexity."],"a":0,"e":"Key rate durations decompose effective duration by points along the curve; their sum equals effective duration (parallel shift). Macaulay duration is a yield-based measure of the bond itself, and convexity is a second-order measure.","d":2,"t":"Key rate duration","c":"Key rate (partial) duration measures sensitivity to a change in one benchmark maturity, holding others constant; it captures shaping risk. The sum of key rate durations equals effective duration."},{"r":13,"q":"A portfolio has key rate durations of 0.5 (2-year), 1.8 (5-year), and 2.4 (10-year). If only the 10-year benchmark rate rises by 20 bp, the portfolio value will change by approximately:","o":["-0.48%","-0.94%","-0.36%"],"a":0,"e":"Only the 10-year point moves: %ΔV ≈ −2.4 × 0.0020 = −0.48%. −0.94% applies the total effective duration (4.7) as if the curve shifted in parallel, and −0.36% uses the 5-year key rate duration.","d":2,"t":"Key rate duration","c":"%ΔV from a single key rate shift ≈ −KeyRateDur_k × Δr_k. For a non-parallel shift, sum the effects across the key rates that move."},{"r":13,"q":"For high-yield corporate bonds, empirical duration is typically lower than analytical duration primarily because:","o":["credit spreads tend to narrow when government benchmark yields rise.","analytical duration ignores the coupon rate.","high-yield bonds have longer maturities than investment-grade bonds."],"a":0,"e":"When government yields rise (often in a strong economy), high-yield credit spreads tend to narrow, cushioning the rate effect: empirical duration is lower. Maturity does not explain this gap, and analytical duration does incorporate the coupon.","d":3,"t":"Empirical duration","c":"Empirical duration is estimated statistically from observed price/yield data and captures the tendency of credit spreads to move opposite to benchmark yields. For high-yield bonds it is typically below analytical duration; for government bonds the two are close."},{"r":13,"q":"Effective duration is computed using changes in:","o":["the bond's coupon rate.","the benchmark yield curve.","the bond's own yield to maturity."],"a":1,"e":"Effective duration measures price sensitivity to a parallel shift in the benchmark curve; it suits securities whose cash flows depend on rates. Modified duration, by contrast, relies on the change in the bond's own YTM; the coupon is a fixed feature.","d":1,"t":"Effective duration","c":"EffDur = (PV₋ − PV₊) / (2 × ΔCurve × PV₀), where prices are computed for shifts in the benchmark yield curve, not the bond's own YTM."},{"r":13,"q":"Compared with an otherwise identical option-free bond, a callable bond most likely has an effective duration that is:","o":["always negative.","higher.","lower or equal."],"a":2,"e":"The call limits price appreciation when rates fall and shortens the expected life: the effective duration of a callable is lower than or equal to that of the option-free bond. It is neither higher nor negative.","d":2,"t":"Callable bond duration","c":"Effective duration: callable bond ≤ option-free bond; putable bond ≤ option-free bond. Embedded options shorten effective duration, especially when the option is near the money."},{"r":13,"q":"The effective duration of a floating-rate note with quarterly coupon resets and no change in credit risk is approximately equal to the:","o":["time remaining until maturity.","Macaulay duration of a fixed-rate bond with the same maturity.","time remaining until the next coupon reset."],"a":2,"e":"An FRN's coupon adjusts to the market rate at each reset; only the coupon already set is exposed to rates, hence a duration close to the time remaining until the next reset (at most 0.25 years). It is unrelated to final maturity.","d":1,"t":"FRN duration","c":"Floating-rate notes have effective (interest rate) duration of roughly the time to the next reset, but their credit spread duration is linked to maturity because the quoted margin is fixed."},{"r":14,"q":"A bond position has an exposure at default of 10 million, a probability of default of 2%, and a recovery rate of 40%. The expected loss is closest to:","o":["120,000","200,000","80,000"],"a":0,"e":"Expected loss = PD × LGD = 2% × (1 − 40%) × 10,000,000 = 120,000. 80,000 uses the recovery rate instead of LGD, and 200,000 ignores any recovery.","d":1,"t":"Expected loss","c":"Expected loss = probability of default × loss given default, with LGD = exposure × (1 − recovery rate). Credit risk depends on both components."},{"r":14,"q":"A bond has an annual probability of default of 1.5% and an expected recovery rate of 35%. The approximate yield spread required to compensate for expected loss is closest to:","o":["0.975%","1.500%","0.525%"],"a":0,"e":"Spread ≈ PD × LGD = 1.5% × (1 − 35%) = 0.975%. 0.525% applies the recovery rate instead of LGD, and 1.500% assumes zero recovery.","d":2,"t":"Credit spread approximation","c":"To a first approximation, the credit spread compensates for expected loss: yield spread ≈ POD × LGD (in % terms), with LGD = 1 − recovery rate."},{"r":14,"q":"Rating agencies typically assign a lower rating to an issuer's subordinated bonds than to its senior unsecured bonds. This practice is called:","o":["structural subordination.","notching.","credit migration."],"a":1,"e":"Notching means adjusting an issue's rating relative to the issuer rating according to its seniority and recovery prospects. Credit migration refers to a rating change over time, and structural subordination concerns holding-company debt.","d":2,"t":"Notching","c":"Issuer ratings usually apply to senior unsecured debt; issue ratings are notched up for secured debt and down for subordinated debt, reflecting differences in priority of claims and expected recovery. Notching is wider for lower-rated (high-yield) issuers."},{"r":14,"q":"In credit analysis, the borrower's ability to generate sufficient cash flow to make debt payments on time is best described as:","o":["collateral.","covenants.","capacity."],"a":2,"e":"Capacity measures the borrower's ability to generate enough cash flow to service its debt. Collateral concerns the value of pledged assets, and covenants concern contractual terms.","d":1,"t":"Cs of credit analysis","c":"The four Cs of credit analysis: Capacity (ability to repay from cash flows), Capital (resources beyond operating cash flow), Collateral (value of pledged assets) and Character (management quality and integrity). Covenants (terms) and conditions are sometimes added."},{"r":14,"q":"A corporate bond has a modified duration of 6.5 and convexity of 52. If its credit spread widens by 75 bp while benchmark yields are unchanged, the estimated percentage price change is closest to:","o":["-5.021%","-4.729%","-4.875%"],"a":1,"e":"%ΔP ≈ −6.5 × 0.0075 + ½ × 52 × 0.0075² = −4.875% + 0.146% = −4.729%. −4.875% ignores convexity, and −5.021% subtracts the convexity term instead of adding it.","d":3,"t":"Spread change price impact","c":"Price impact of a spread change: %ΔP ≈ −(ModDur × ΔSpread) + ½ × Convexity × (ΔSpread)². Spread duration and convexity work exactly like their yield counterparts."},{"r":14,"q":"The risk that a bond's price falls because the issuer's credit rating is lowered is best described as:","o":["credit migration (downgrade) risk.","default risk.","market liquidity risk."],"a":0,"e":"Credit migration risk is the risk of a downgrade leading to wider spreads and a lower price. Market liquidity risk comes from difficulty selling (wide bid-ask), and default risk concerns actual non-payment.","d":2,"t":"Spread risk","c":"Credit spread risk includes credit migration (downgrade) risk, where a lower rating widens the spread, and market liquidity risk, where wider bid-ask spreads reduce the price an investor can realize."},{"r":14,"q":"The lowest rating that is still considered investment grade by Moody's and S&P, respectively, is:","o":["Ba1 and BB+","A3 and A-","Baa3 and BBB-"],"a":2,"e":"Investment grade ends at Baa3 (Moody's) and BBB− (S&P/Fitch). Ba1/BB+ is the first speculative (high-yield) rating, and A3/A− is well above the threshold.","d":1,"t":"Credit ratings","c":"Investment grade: Baa3 or above (Moody's), BBB− or above (S&P, Fitch). Ratings below are non-investment grade (high yield, speculative); D indicates default."},{"r":15,"q":"A sovereign's ratio of government debt to GDP is most relevant to the assessment of its:","o":["fiscal flexibility.","institutional framework.","external status."],"a":0,"e":"The debt-to-GDP ratio measures the burden of public debt and belongs to the fiscal assessment. The institutional assessment covers governance, rule of law and corruption, and the external position covers the current account, reserves and external debt.","d":1,"t":"Sovereign fiscal assessment","c":"Sovereign credit analysis considers qualitative factors (institutional, fiscal policy, monetary policy) and quantitative factors (fiscal strength: debt/GDP, interest/revenue; economic growth; external stability: reserves, current account, external debt)."},{"r":15,"q":"A country has a government debt-to-GDP ratio of 80%. The average nominal interest rate on its debt is 4% and nominal GDP grows at 3%. If the government runs a primary deficit equal to 1% of GDP, the debt-to-GDP ratio after one year is closest to:","o":["81.0%","81.8%","80.8%"],"a":1,"e":"Next ratio = 80% × 1.04/1.03 + 1% = 80.78% + 1% = 81.8%. 81.0% ignores the gap between the interest rate and growth, and 80.8% forgets the primary deficit.","d":3,"t":"Sovereign debt dynamics","c":"Debt dynamics: debt/GDP rises when the interest rate on debt exceeds nominal GDP growth (r > g) and when the government runs a primary deficit. Next debt/GDP ≈ current ratio × (1 + r)/(1 + g) + primary deficit/GDP."},{"r":15,"q":"For the same sovereign, ratings on foreign-currency debt are typically:","o":["identical to ratings on local-currency debt by regulation.","higher than ratings on local-currency debt.","lower than ratings on local-currency debt."],"a":2,"e":"The state cannot create foreign currency to repay: foreign-currency debt is riskier and its rating is generally lower. No rule requires identical ratings.","d":2,"t":"Local vs foreign currency ratings","c":"Rating agencies typically rate a sovereign's local-currency debt higher than its foreign-currency debt, because the government can tax and print its own currency but must earn or borrow foreign exchange."},{"r":15,"q":"A municipal toll-road revenue bond has annual net revenues of 15 million and annual debt service of 12 million. Its debt service coverage ratio is closest to:","o":["5.00x","1.25x","0.80x"],"a":1,"e":"DSCR = net revenues / debt service = 15/12 = 1.25x. 0.80x reverses the ratio, and 5.00x wrongly divides revenues by the surplus (15 − 12); a DSCR above 1 indicates that revenues cover debt service.","d":2,"t":"Debt service coverage ratio","c":"Revenue bonds are analyzed like corporate project debt: debt service coverage ratio = net revenues (after operating expenses) ÷ annual debt service (interest + principal). Higher DSCR means lower credit risk."},{"r":15,"q":"Which of the following is most relevant to a sovereign's institutional assessment?","o":["Rule of law and control of corruption","Foreign exchange reserves relative to imports","The central bank's inflation track record"],"a":0,"e":"The institutional assessment covers the effectiveness of institutions, rule of law, corruption and political stability. FX reserves belong to the external position, and anti-inflation credibility to monetary flexibility.","d":1,"t":"Sovereign institutional assessment","c":"Sovereign institutional and economic assessment looks at government effectiveness, rule of law, corruption, checks and balances, political stability and the commitment to honor debts, as well as GDP per capita and growth."},{"r":15,"q":"Which of the following most likely indicates a stronger external position for a sovereign issuer?","o":["A high ratio of external debt to current account receipts","A large and persistent current account deficit","High foreign exchange reserves relative to short-term external debt"],"a":2,"e":"High FX reserves relative to short-term external debt strengthen the ability to meet foreign-currency obligations. A persistent current account deficit and a high external debt/current account receipts ratio are, by contrast, signs of weakness.","d":2,"t":"Sovereign external position","c":"A strong external position shows adequate FX reserves (relative to short-term external debt and imports), a sustainable current account, moderate external debt, and/or a reserve currency status."},{"r":15,"q":"Compared with a country that has its own freely floating currency, a country whose currency is tightly pegged to another currency most likely has:","o":["the same monetary flexibility.","more monetary flexibility.","less monetary flexibility."],"a":2,"e":"Under a hard peg, monetary policy must defend the parity and cannot be used to stabilize the economy or support debt: monetary flexibility is reduced. A floating exchange rate regime offers more room for manoeuvre.","d":2,"t":"Sovereign monetary flexibility","c":"Monetary flexibility is greatest for sovereigns with an independent, credible central bank, a floating exchange rate and a reserve currency; pegged or dollarized regimes constrain monetary policy and weaken this factor."},{"r":16,"q":"A company reports EBITDA of 450 million and interest expense of 90 million. Its EBITDA interest coverage ratio is closest to:","o":["5.0x","0.2x","4.0x"],"a":0,"e":"EBITDA coverage = 450/90 = 5.0x. 0.2x reverses the ratio, and 4.0x wrongly subtracts interest from EBITDA before dividing ((450 − 90)/90).","d":1,"t":"Interest coverage","c":"Coverage ratios: EBITDA/interest expense or EBIT/interest expense. Higher coverage means a greater ability to pay interest and lower credit risk."},{"r":16,"q":"A company has funds from operations (FFO) of 300 million and total debt of 1,500 million. Its FFO-to-debt ratio is closest to:","o":["20%","25%","500%"],"a":0,"e":"FFO/debt = 300/1,500 = 20%. 500% reverses the ratio (debt/FFO = 5x), and 25% wrongly divides by debt minus FFO (300/1,200). A higher FFO/debt ratio signals lower credit risk.","d":2,"t":"FFO to debt","c":"Leverage ratios: debt/capital, debt/EBITDA (lower is better), FFO/debt and RCF/debt (higher is better). FFO = net income from continuing operations + D&A + deferred taxes + other non-cash items."},{"r":16,"q":"All else equal, which of the following changes most likely indicates higher credit risk for a corporate issuer?","o":["An increase in EBITDA/interest expense","An increase in FFO/debt","An increase in debt/EBITDA"],"a":2,"e":"A rise in debt/EBITDA means more leverage for the same earnings: credit risk increases. A rise in interest coverage or in FFO/debt indicates, on the contrary, a better repayment capacity.","d":1,"t":"Leverage ratios","c":"Credit risk rises when leverage ratios (debt/EBITDA, debt/capital) rise or when coverage and cash-flow-to-debt ratios (EBIT/interest, FFO/debt) fall."},{"r":16,"q":"Bonds issued by a holding company that owns operating subsidiaries with their own debt are most likely to be:","o":["pari passu with the subsidiaries' debt.","senior to the subsidiaries' debt.","structurally subordinated to the subsidiaries' debt."],"a":2,"e":"Subsidiaries' cash flows serve their own creditors first; the holding company receives only residual dividends. Its creditors are therefore structurally subordinated, even if their securities are \"senior\" at the holding level.","d":3,"t":"Structural subordination","c":"Structural subordination: holding-company debt ranks behind the debt of operating subsidiaries because subsidiary cash flows and assets go to subsidiary creditors first. Analysts should assess cash flow available at the parent level."},{"r":16,"q":"In a corporate bankruptcy, which of the following claims would most likely have the highest expected recovery rate?","o":["Senior unsecured debt","Subordinated debt","Senior secured debt"],"a":2,"e":"Senior secured debt has a priority claim on pledged assets: its recovery rate is the highest. Senior unsecured debt comes next, then subordinated debt.","d":1,"t":"Seniority ranking","c":"Priority of claims: secured debt (first lien before second lien), then senior unsecured, senior subordinated, subordinated, junior subordinated, then equity. Recovery rates generally follow this ranking, although bankruptcy outcomes can deviate from strict priority."},{"r":16,"q":"Issuer X has EBIT of 200, interest expense of 40, debt of 800 and EBITDA of 260. Issuer Y has EBIT of 300, interest expense of 75, debt of 1,500 and EBITDA of 400. Based on EBIT/interest and debt/EBITDA, which statement is most accurate?","o":["The two measures give conflicting conclusions.","Issuer X has lower credit risk on both measures.","Issuer Y has lower credit risk on both measures."],"a":1,"e":"X: EBIT/interest = 200/40 = 5.0x and debt/EBITDA = 800/260 = 3.08x. Y: 300/75 = 4.0x and 1,500/400 = 3.75x. X has better coverage and lower leverage: both measures agree; Y's larger size is not enough to offset this.","d":2,"t":"Credit ratio comparison","c":"Compare issuers with ratios rather than absolute amounts: higher EBIT/interest and lower debt/EBITDA both indicate lower credit risk. Size can matter qualitatively but does not override weaker ratios."},{"r":16,"q":"A covenant that allows bondholders to sell their bonds back to the issuer at a specified price if the issuer is acquired is called a:","o":["change of control put.","negative pledge.","make-whole call."],"a":0,"e":"The change of control put protects bondholders against an acquisition (an LBO, for example) that could weaken credit quality. A negative pledge prohibits granting security to other lenders, and a make-whole call is an issuer option.","d":2,"t":"Change of control put","c":"Corporate bond covenants protect lenders: negative covenants (negative pledge, debt and distribution limits), maintenance or incurrence tests, and event-risk protection such as a change of control put allowing holders to sell back at a set price (often 101)."},{"r":17,"q":"In a securitization, the special purpose entity (SPE) is structured to be bankruptcy remote primarily so that:","o":["investors' claims on the collateral are protected if the originator goes bankrupt.","the originator can retain control of the collateral cash flows.","the SPE can issue bonds without any credit enhancement."],"a":0,"e":"The assets are sold to the special purpose entity, which is legally separate: the originator's bankruptcy does not affect investors' rights to the collateral. The originator does not keep control of the cash flows, and legal separation does not remove the need for credit enhancement.","d":1,"t":"Special purpose entity","c":"In a securitization, the originator sells assets in a true sale to a bankruptcy-remote SPE that issues the securities. Investors' claims depend on the collateral, not on the originator's credit."},{"r":17,"q":"Which of the following is a benefit of securitization for the originating bank?","o":["It frees up capital that can be used to originate new loans.","It increases the bank's balance sheet leverage.","It eliminates the need for loan servicing."],"a":0,"e":"By selling loans, the bank frees up capital and liquidity to make new loans. It is not seeking to increase leverage, and loan servicing (collecting payments) is still required.","d":1,"t":"Benefits of securitization","c":"Benefits of securitization: frees originators' capital to lend more, improves liquidity and risk sharing, offers investors tailored risk/return exposures, and can lower funding costs. Servicing of the loans continues after the sale."},{"r":17,"q":"A securitization has three tranches: senior (70 million), mezzanine (20 million) and equity (10 million). If collateral losses total 15 million, the loss absorbed by the mezzanine tranche is:","o":["5 million","15 million","0"],"a":0,"e":"Losses are absorbed from the bottom up: the equity tranche absorbs its 10m, then the mezzanine absorbs the remaining 5m; the senior is untouched. 15m charges all losses to the mezzanine, and 0 ignores that the equity is fully wiped out.","d":2,"t":"Credit tranching","c":"Credit tranching (waterfall): losses are allocated first to the most junior (equity/residual) tranche, then mezzanine, then senior, each only after the tranche below is exhausted."},{"r":17,"q":"In a senior/subordinated structure, the subordinated tranches mainly provide:","o":["credit protection to the senior tranches by absorbing losses first.","prepayment protection to the senior tranches.","a guarantee from a third-party insurer."],"a":0,"e":"Subordination is an internal enhancement: junior tranches absorb the first losses, which protects senior tranches. It does not redistribute prepayment risk (the role of time tranching) and involves no third-party guarantor.","d":2,"t":"Subordination","c":"Senior/subordinated structures redistribute credit risk: subordinated tranches absorb losses first, providing internal credit enhancement to senior tranches. Time tranching (sequential, PAC/support) redistributes prepayment risk instead."},{"r":17,"q":"Compared with asset-backed securities, covered bonds most likely:","o":["remain on the issuer's balance sheet and give investors dual recourse.","have a static cover pool that cannot be replaced.","are issued by a bankruptcy-remote SPE."],"a":0,"e":"A covered bond stays on the issuing bank's balance sheet; the investor has recourse to the issuer and to the cover pool (dual recourse), and non-performing assets must be replaced (dynamic pool). Issuance through an SPE characterizes ABS.","d":2,"t":"Covered bonds","c":"Covered bonds are senior debt of a bank backed by a segregated, dynamic cover pool that remains on the balance sheet; investors have dual recourse. ABS are issued by a bankruptcy-remote SPE with a static or revolving pool and recourse only to the collateral."},{"r":17,"q":"A securitization is backed by collateral with a par value of 520 million and issues bonds with a total par value of 500 million. The overcollateralization as a percentage of bonds issued is:","o":["104.0%","3.8%","4.0%"],"a":2,"e":"Overcollateralization = (520 − 500)/500 = 4.0%. 3.8% relates the excess to the collateral instead of the bonds, and 104.0% is the collateral/bonds ratio, not the excess.","d":1,"t":"Overcollateralization","c":"Overcollateralization is collateral par value in excess of the par value of securities issued; it is a first-loss internal credit enhancement. OC % = (collateral − bonds) ÷ bonds."},{"r":17,"q":"A securitized pool generates a yield of 7.5%. The weighted average coupon paid to the tranches is 5.2% and servicing and administrative fees are 0.5%. The excess spread is closest to:","o":["0.5%","1.8%","2.3%"],"a":1,"e":"Excess spread = collateral yield − average coupon paid − fees = 7.5% − 5.2% − 0.5% = 1.8%. 2.3% forgets the servicing fees, and 0.5% confuses the fees with excess spread.","d":3,"t":"Excess spread","c":"Excess spread = interest earned on the collateral − coupons paid to securities − servicing and other fees. It can be retained in a reserve account to absorb losses, acting as internal credit enhancement."},{"r":18,"q":"The cash flows of an auto loan ABS most likely consist of:","o":["a single bullet principal payment at maturity.","interest, scheduled principal repayments, and prepayments.","interest only during a lockout period."],"a":1,"e":"Auto loans are amortizing: cash flows comprise interest, scheduled principal and prepayments. A lockout with interest-only payments characterizes credit card ABS, and a bullet repayment does not fit an amortizing loan.","d":1,"t":"Auto loan ABS","c":"Auto loan
