00, $500, and $200 at the end of years 1 through 4, respectively. If the required rate of return is 10%, the project's NPV is closest to:","o":["$14.15","$115.57","$400.00"],"a":1,"e":"NPV = −1,000 + 300/1.1 + 400/1.1² + 500/1.1³ + 200/1.1⁴ = −1,000 + 272.73 + 330.58 + 375.66 + 136.60 = $115.57. $400 is the undiscounted sum of net cash flows, and $14.15 discounts each cash flow one period too many.","d":1,"t":"Net present value","c":"NPV = Σ CF_t / (1 + r)^t − initial investment; accept an independent project if NPV > 0."},{"r":5,"q":"A project costs $1,000 today and will generate $400 at the end of each of the next three years. The project's IRR is closest to:","o":["6.67%","9.70%","40.00%"],"a":1,"e":"The IRR sets NPV to zero: 400 × annuity factor(3 years, IRR) = 1,000, i.e., a factor of 2.5, reached at IRR ≈ 9.70%. 40% simply divides one annual cash flow by the investment, and 6.67% divides the total undiscounted gain (200) by 3 and by 1,000, ignoring the time value of money.","d":2,"t":"Internal rate of return","c":"The IRR is the rate that makes NPV zero: Σ CF_t / (1 + IRR)^t − CF_0 = 0. For level cash flows, IRR = the rate of the annuity whose present value equals the investment."},{"r":5,"q":"Two mutually exclusive projects are ranked differently by NPV and IRR. The company should most likely choose the project with the:","o":["higher IRR.","shorter payback period.","higher NPV."],"a":2,"e":"When NPV and IRR conflict for mutually exclusive projects, NPV prevails because it directly measures value creation for shareholders and assumes reinvestment at the cost of capital, which is more realistic than reinvestment at the IRR. The payback period ignores cash flows beyond the cutoff and the time value of money.","d":1,"t":"NPV vs IRR ranking conflict","c":"When NPV and IRR conflict for mutually exclusive projects (different scale or timing of cash flows), use NPV, because it directly measures value creation and assumes reinvestment at the cost of capital."},{"r":5,"q":"A company replaces a worn-out machine with an identical model to continue its current operations. This capital investment is best classified as a:","o":["going concern project.","expansion project.","regulatory/compliance project."],"a":0,"e":"Replacing a machine like-for-like to maintain existing operations is a going concern project. An expansion project increases the size of the business, and a regulatory project is imposed by an authority or a standard.","d":1,"t":"Types of capital projects","c":"Project categories: going concern (maintenance/replacement), expansion of existing business, new products/markets, mandatory (regulatory/safety/environmental) projects, and other projects."},{"r":5,"q":"In evaluating a new factory, which of the following should be included in the project's cash flows?","o":["Market research costs incurred last year to study the project","The after-tax market value of land the company already owns that will be used for the factory","Interest expense on the debt used to finance the factory"],"a":1,"e":"Land already owned has an opportunity cost (its after-tax sale value) that must be included in the project's cash flows. Studies already performed are sunk costs, and financing costs are already captured in the discount rate: including them would double count.","d":2,"t":"Incremental cash flows","c":"Relevant cash flows are incremental and after tax: include opportunity costs, externalities (cannibalization) and changes in working capital; exclude sunk costs and financing costs (already in the discount rate)."},{"r":5,"q":"A company reports EBIT of $200 million, has a tax rate of 25%, and has average invested capital of $1,250 million. Its cost of capital is 10%. The company's ROIC and the implication for value creation are:","o":["16.0%, and the company is creating value.","12.0%, and the company is destroying value.","12.0%, and the company is creating value."],"a":2,"e":"NOPAT = 200 × (1 − 0.25) = $150 million; ROIC = 150 / 1,250 = 12.0% > 10% cost of capital, so value is created. 16% uses pre-tax EBIT, and concluding value is destroyed is wrong since ROIC exceeds the cost of capital.","d":2,"t":"Return on invested capital","c":"ROIC = NOPAT / average invested capital, with NOPAT = EBIT × (1 − t). Value is created if ROIC > cost of capital."},{"r":5,"q":"A project has a standard NPV of −$20 million. However, it gives the company the right to expand production later, and this expansion option is valued at $35 million. The company should most likely:","o":["reject the project, because its standard NPV is negative.","accept the project, because its NPV including the option is $15 million.","accept the project, because its NPV including the option is $55 million."],"a":1,"e":"Overall NPV = standard NPV + option value = −20 + 35 = +$15 million > 0, so the project should be accepted. Rejecting the project ignores the value of the real expansion option, and $55 million wrongly adds the absolute value of the negative NPV.","d":2,"t":"Real options","c":"Overall NPV = standard NPV (without options) + value of real options (expansion, abandonment, timing, flexibility) − cost of the option; a negative-NPV project can be accepted if the options make it positive."},{"r":5,"q":"A project has cash flows of −$100 at time 0, +$230 at time 1, and −$132 at time 2. The company's cost of capital is 15%. Which statement is most accurate?","o":["The project has IRRs of 10% and 20%, and its NPV at 15% is positive.","The project has a single IRR of 15%, so its NPV at 15% is zero.","The project has IRRs of 10% and 20%, and its NPV at 15% is negative."],"a":0,"e":"Cash flows change sign twice, hence two IRRs: at 10%, −100 + 209.09 − 109.09 = 0 and at 20%, −100 + 191.67 − 91.67 = 0. At 15%: −100 + 200 − 99.81 = +0.19 > 0, so NPV is positive between the two IRRs. The IRR rule is ambiguous here and NPV must be used.","d":3,"t":"Multiple IRRs","c":"With non-conventional cash flows (several sign changes), a project may have multiple IRRs or none; NPV at the cost of capital remains the reliable decision criterion."},{"r":6,"q":"A company's target capital structure is 60% equity and 40% debt. Its cost of equity is 12%, its pre-tax cost of debt is 6%, and its marginal tax rate is 25%. Its WACC is closest to:","o":["8.4%","9.0%","9.6%"],"a":1,"e":"WACC = 0.60 × 12% + 0.40 × 6% × (1 − 0.25) = 7.2% + 1.8% = 9.0%. 9.6% ignores the debt tax shield, and 8.4% wrongly applies the tax factor to the whole result (9.6% × 0.875).","d":1,"t":"WACC","c":"WACC = w_d × r_d × (1 − t) + w_p × r_p + w_e × r_e, using target (or market value) weights."},{"r":6,"q":"Under Modigliani–Miller Proposition II without taxes, a company has an unlevered cost of capital of 10%, a cost of debt of 5%, and a debt-to-equity ratio of 0.5. Its cost of equity is closest to:","o":["10.0%","12.5%","15.0%"],"a":1,"e":"r_e = r_0 + (r_0 − r_d) × D/E = 10% + (10% − 5%) × 0.5 = 12.5%. 10% ignores the higher financial risk borne by shareholders, and 15% wrongly adds the cost of debt to the unlevered cost of capital (10% + 5%) without weighting by D/E.","d":2,"t":"MM Proposition II without taxes","c":"MM Proposition II without taxes: r_e = r_0 + (r_0 − r_d) × D/E; the cost of equity rises linearly with leverage while WACC stays constant."},{"r":6,"q":"An unlevered company is valued at $500 million. It issues $200 million of perpetual debt and uses the proceeds to repurchase shares. The corporate tax rate is 25%. According to Modigliani–Miller with corporate taxes, the value of the levered company is closest to:","o":["$500 million","$550 million","$700 million"],"a":1,"e":"MM with taxes: V_L = V_U + t × D = 500 + 0.25 × 200 = $550 million. $500 million is MM without taxes (capital structure irrelevance), and $700 million wrongly adds the full amount of debt instead of only the value of the tax shield.","d":2,"t":"MM Proposition I with taxes","c":"MM Proposition I with taxes: V_L = V_U + t × D (value of the tax shield on perpetual debt)."},{"r":6,"q":"Under Modigliani–Miller with corporate taxes, a company has an unlevered cost of capital of 10%, a pre-tax cost of debt of 6%, a debt-to-equity ratio of 1.0, and a tax rate of 30%. Its cost of equity is closest to:","o":["11.2%","12.8%","14.0%"],"a":1,"e":"r_e = r_0 + (r_0 − r_d) × (1 − t) × D/E = 10% + 4% × 0.7 × 1 = 12.8%. 14.0% applies the no-tax formula, and 11.2% wrongly multiplies the spread by t (4% × 0.3) instead of (1 − t).","d":3,"t":"MM Proposition II with taxes","c":"MM Proposition II with taxes: r_e = r_0 + (r_0 − r_d) × (1 − t) × D/E; WACC falls as leverage rises."},{"r":6,"q":"According to the static trade-off theory, a company's optimal capital structure is reached when:","o":["the company is financed entirely with debt.","the cost of equity is minimized.","the marginal benefit of the debt tax shield equals the marginal expected cost of financial distress."],"a":2,"e":"Static trade-off theory balances the tax benefit of debt against expected financial distress costs: the optimum is reached where their marginal effects are equal, which maximizes value and minimizes WACC. 100% debt financing is the conclusion of MM with taxes and no distress costs, and it is WACC, not the cost of equity, that is minimized.","d":2,"t":"Static trade-off theory","c":"Static trade-off theory: the optimal capital structure is reached where the marginal benefit of the debt tax shield equals the marginal expected cost of financial distress; WACC is minimized and firm value maximized there."},{"r":6,"q":"According to the pecking order theory, managers prefer to finance new investments in which order?","o":["Internal funds, then debt, then new equity","New equity, then debt, then internal funds","Debt, then internal funds, then new equity"],"a":0,"e":"Because of information asymmetry, issuing equity is seen as a negative signal (overvalued shares): managers prefer internal funds, then debt, and new equity only as a last resort. The other orderings do not follow this hierarchy based on signaling costs.","d":1,"t":"Pecking order theory","c":"Pecking order theory, based on information asymmetry: internal funds first, then debt, then new equity as a last resort."},{"r":6,"q":"Compared with a mature company with stable cash flows, a start-up company most likely relies:","o":["more on debt financing, because debt is cheaper than equity.","more on equity financing, because its cash flows are uncertain and it has few tangible assets.","more on secured bank loans, because lenders favor high-growth firms."],"a":1,"e":"A start-up has negative or uncertain cash flows and few tangible assets to pledge as collateral: its debt capacity is low and it relies mainly on equity. Debt, although cheaper, suits mature firms with stable cash flows; lenders do not favor risky firms.","d":1,"t":"Capital structure and life cycle","c":"Life cycle: start-ups (negative cash flows, few tangible assets) finance mainly with equity; mature firms with stable, predictable cash flows can carry more debt."},{"r":6,"q":"A company has bonds with a book value of $400 million that trade at 95% of par, and 50 million shares outstanding trading at $12 per share (book value of equity is $300 million). Its debt weight for WACC purposes is closest to:","o":["38.8%","57.1%","63.3%"],"a":0,"e":"Market values must be used: debt = 400 × 0.95 = $380 million; equity = 50 × 12 = $600 million; w_d = 380 / 980 = 38.8%. 57.1% uses book values (400 / 700), and 63.3% is the debt-to-equity ratio (380 / 600), not the debt weight.","d":3,"t":"Market-value capital weights","c":"WACC weights should be based on (target) market values: w_d = D_market / (D_market + E_market), with E_market = shares outstanding × share price."},{"r":7,"q":"In a business model, the value proposition most accurately refers to:","o":["the company's mix of debt and equity financing.","the expected NPV of the company's capital projects.","the product or service attributes that make customers choose the company's offering."],"a":2,"e":"The value proposition describes why target customers buy: product features, price, service and convenience relative to alternatives. Financing structure and project NPV belong to corporate finance, not to the definition of the business model.","d":1,"t":"Value proposition","c":"The value proposition describes what product or service is offered, to which target customers, and why they prefer it over alternatives."},{"r":7,"q":"A software firm sets its price based on the cost savings its product generates for customers rather than on its own production costs. This pricing approach is best described as:","o":["cost-plus pricing.","value-based pricing.","penetration pricing."],"a":1,"e":"Value-based pricing sets the price according to the value perceived by, or created for, the customer. Cost-plus pricing starts from the company's own costs, and penetration pricing sets a low price to gain market share quickly.","d":1,"t":"Value-based pricing","c":"Pricing approaches: cost-based (cost plus margin) vs value-based (price based on value perceived by the customer); other approaches include freemium, tiered pricing, bundling, razor-and-blades and dynamic pricing."},{"r":7,"q":"A music streaming service offers a basic version with advertising at no charge and a premium ad-free version for a monthly fee. This is an example of a:","o":["freemium model.","razor-and-blades model.","franchise model."],"a":0,"e":"The freemium model offers a basic version for free to attract users and monetizes a paid premium version. The razor-and-blades model sells a cheap base product and then high-margin consumables, and franchising licenses a brand in exchange for royalties.","d":1,"t":"Freemium","c":"Freemium: a free basic version (often ad-funded) attracts a large user base, and a paid premium version monetizes part of it."},{"r":7,"q":"A ride-hailing platform becomes more valuable to riders as more drivers join, and more valuable to drivers as more riders join. This is best described as:","o":["economies of scale in production.","vertical integration.","a two-sided network effect."],"a":2,"e":"On a two-sided platform, the value to each user group grows with the size of the other group: this is an indirect (two-sided) network effect, a potential source of competitive advantage. Economies of scale concern lower unit production costs, and vertical integration means controlling successive stages of the value chain.","d":2,"t":"Network effects","c":"Network effects: a product's value grows with the number of users; they are indirect/cross-side (two-sided) when one user group values the size of another group, as on a platform."},{"r":7,"q":"A subscription business earns a contribution margin of $20 per customer per month and has a monthly churn rate of 5%. Customer acquisition cost is $150. Ignoring discounting, the ratio of customer lifetime value to acquisition cost (LTV/CAC) is closest to:","o":["0.13","1.60","2.67"],"a":2,"e":"Average lifetime = 1 / 5% = 20 months; LTV = $20 × 20 = $400; LTV/CAC = 400 / 150 = 2.67. 1.60 uses only one year of margin ($240), and 0.13 divides a single month's margin by the acquisition cost.","d":2,"t":"Unit economics (LTV/CAC)","c":"Customer lifetime value (LTV) without discounting ≈ contribution margin per period / churn rate per period; compare it with customer acquisition cost (CAC) through the LTV/CAC ratio."},{"r":7,"q":"A company has fixed costs of $600,000, sells its product at $40 per unit, and has variable costs of $25 per unit. Its breakeven quantity is:","o":["15,000 units","24,000 units","40,000 units"],"a":2,"e":"Breakeven quantity = fixed costs / unit contribution margin = 600,000 / (40 − 25) = 40,000 units. 15,000 divides by the price and 24,000 by the variable cost, instead of by the unit contribution margin.","d":1,"t":"Breakeven quantity","c":"Breakeven quantity = fixed costs / (unit price − unit variable cost) = fixed costs / unit contribution margin."},{"r":7,"q":"Compared with a hotel company that owns its properties, a hotel company that operates mainly through franchising most likely has:","o":["lower capital intensity and a higher return on invested capital.","higher capital intensity and greater control over service quality.","higher fixed costs and greater operating leverage."],"a":0,"e":"The franchisor earns fees without owning the properties: its asset-light model ties up little capital, hence a higher ROIC and lower fixed costs. It does, however, have less control over quality, and it is the owner of the hotels that bears high capital intensity and operating leverage.","d":2,"t":"Asset-light business model","c":"An asset-light model (franchising, outsourcing) ties up few fixed assets: less invested capital and operating leverage, often a higher ROIC, but lower revenue per unit (fees)."},{"r":7,"q":"A company sells 100,000 units at $40 per unit, with variable costs of $25 per unit and fixed operating costs of $600,000. If unit sales increase by 10%, operating income will most likely increase by approximately:","o":["10.0%","16.7%","25.0%"],"a":1,"e":"Contribution margin = 100,000 × 15 = $1,500,000; EBIT = 1,500,000 − 600,000 = $900,000; DOL = 1,500,000 / 900,000 = 1.67. EBIT increase = 1.67 × 10% ≈ 16.7% (check: margin 1,650,000 − 600,000 = 1,050,000, i.e., +16.7%). 10% ignores operating leverage, and 25% wrongly multiplies by the ratio 1.5M/0.6M.","d":3,"t":"Degree of operating leverage","c":"Degree of operating leverage: DOL = Q × (P − V) / [Q × (P − V) − F] = contribution margin / operating income; %Δ operating income ≈ DOL × %Δ sales."}]},{"subject":4,"questions":[{"r":1,"q":"Which financial statement reports a company's financial position at a specific point in time?","o":["Statement of comprehensive income","Statement of cash flows","Statement of financial position (balance sheet)"],"a":2,"e":"The balance sheet (statement of financial position) presents assets, liabilities and equity at a specific date. The statement of comprehensive income and the statement of cash flows cover a period of time, not a single point in time.","d":1,"t":"Balance sheet purpose","c":"The balance sheet (statement of financial position) is a snapshot at a given date: Assets = Liabilities + Equity. The income statement, OCI and the cash flow statement cover a period."},{"r":1,"q":"An unmodified (unqualified) audit opinion most likely indicates that the financial statements:","o":["present fairly, in all material respects, the company's financial position and results","are guaranteed to be free of any fraud","contain no errors of any size"],"a":0,"e":"An unmodified opinion means the financial statements present fairly, in all material respects, the company's position and results. An audit provides reasonable, not absolute, assurance: it guarantees neither the absence of fraud nor the absence of every error, even immaterial ones.","d":1,"t":"Audit opinion","c":"An unmodified (unqualified) opinion states that the financial statements present fairly, in all material respects, the company's position in accordance with the applicable framework. It is not a guarantee against error or fraud (reasonable assurance only)."},{"r":1,"q":"Which of the following is NOT a required component of a complete set of financial statements under IFRS?","o":["Statement of changes in equity","Management commentary","Notes to the financial statements"],"a":1,"e":"Under IAS 1, a complete set of financial statements comprises the balance sheet, the statement of comprehensive income, the statement of changes in equity, the cash flow statement and the notes. Management commentary (MD&A) accompanies the statements but is not part of them and is not audited.","d":2,"t":"Components of financial statements","c":"A complete IFRS set: balance sheet, statement of comprehensive income, statement of changes in equity, statement of cash flows, notes (including accounting policies) and comparative information. The MD&A and the auditor's report are not part of it."},{"r":1,"q":"In the financial statement analysis framework, which step immediately follows collecting input data?","o":["Processing the data (e.g., adjusting statements, computing ratios)","Analyzing and interpreting the processed data","Developing and communicating conclusions"],"a":0,"e":"The steps are: define the purpose, collect data, process data, analyze/interpret, communicate conclusions, then follow up. Processing (adjustments, ratios, common-size statements) therefore comes right after data collection; interpretation and communication come later.","d":2,"t":"FSA framework","c":"Six-step analysis framework: 1) purpose and context, 2) data collection, 3) data processing (adjustments, ratios), 4) analysis and interpretation, 5) conclusions and recommendations, 6) follow-up."},{"r":1,"q":"In the auditor's report of a US public company, matters communicated to the audit committee that involved especially challenging auditor judgment are referred to as:","o":["Critical audit matters","Key audit matters","Material weaknesses"],"a":0,"e":"Under PCAOB (US) standards, these matters are called critical audit matters. Key audit matters is the term used under International Standards on Auditing (ISA); a material weakness is a serious deficiency in internal control, a different concept.","d":2,"t":"Critical audit matters (US)","c":"In the US (PCAOB), the auditor's report describes critical audit matters (CAMs); under ISA they are called key audit matters (KAMs). These are matters communicated to the audit committee that required especially challenging, subjective or complex auditor judgment."},{"r":1,"q":"Which statement about interim financial reports is most accurate?","o":["They are audited with the same scope as annual reports","They are typically issued semiannually or quarterly and are generally not audited","They are not required for companies listed in the United States"],"a":1,"e":"Interim reports (quarterly or semiannual) are issued more frequently and are generally not audited (at most a limited review). US-listed companies must file quarterly 10-Q reports, so they are indeed required.","d":1,"t":"Interim reports","c":"Interim reports (quarterly/semiannual) provide condensed financial statements and partial notes; they are generally not audited (at most a limited review)."},{"r":1,"q":"An auditor concludes that a company's financial statements contain material misstatements that are pervasive. The auditor will most likely issue:","o":["A qualified opinion","A disclaimer of opinion","An adverse opinion"],"a":2,"e":"A material and pervasive misstatement leads to an adverse opinion. A qualified opinion applies to a misstatement that is material but not pervasive; a disclaimer of opinion results from a scope limitation (inability to obtain sufficient evidence), not from an identified misstatement.","d":3,"t":"Types of audit opinion","c":"Types of opinion: unmodified (clean), qualified (material but not pervasive misstatement), adverse (material and pervasive misstatements), disclaimer of opinion (insufficient appropriate audit evidence)."},{"r":1,"q":"Where would an analyst most likely find management's discussion of known trends, uncertainties and significant events affecting a company?","o":["The auditor's report","Management's discussion and analysis (MD&A)","The statement of changes in equity"],"a":1,"e":"The MD&A presents management's analysis of trends, uncertainties, liquidity and results. The auditor's report expresses the auditor's opinion, and the statement of changes in equity contains only numerical movements.","d":1,"t":"MD&A","c":"The MD&A (management commentary) presents management's analysis of results, liquidity, capital resources, known trends, uncertainties, unusual events and critical accounting estimates. It is not audited."},{"r":2,"q":"A company signs a fixed-price contract for $10,000,000, with total estimated costs of $8,000,000. Revenue is recognized over time using the cost-to-cost input method. In Year 1, costs incurred are $2,400,000. Year 1 revenue is closest to:","o":["$2,400,000","$3,000,000","$600,000"],"a":1,"e":"Percentage of completion = 2,400,000 / 8,000,000 = 30%; revenue = 30% x 10,000,000 = $3,000,000. $2,400,000 is the cost incurred and $600,000 is the gross profit, not revenue.","d":2,"t":"Revenue over time (cost-to-cost)","c":"Revenue recognized over time with the cost-to-cost input method: % complete = cumulative costs / total estimated costs; cumulative revenue = % x contract price, less revenue already recognized in prior years."},{"r":2,"q":"A company reports net income of $5,000,000 and declares preferred dividends of $500,000. It had 1,000,000 common shares outstanding on 1 January and issued 300,000 new shares on 1 April. Basic EPS is closest to:","o":["$3.46","$3.67","$4.08"],"a":1,"e":"Weighted average shares = 1,000,000 + 300,000 x 9/12 = 1,225,000; basic EPS = (5,000,000 - 500,000) / 1,225,000 = $3.67. $3.46 ignores the time-weighting of the new shares, and $4.08 fails to deduct preferred dividends.","d":2,"t":"Basic EPS","c":"Basic EPS = (net income - preferred dividends) / weighted average number of common shares outstanding. Common dividends are not deducted."},{"r":2,"q":"A company has net income of $10,000,000, preferred dividends of $1,000,000 on convertible preferred shares, and 4,000,000 weighted average common shares. The preferred shares are convertible into 500,000 common shares. Diluted EPS is closest to:","o":["$2.25","$2.22","$2.00"],"a":1,"e":"Basic EPS = 9,000,000 / 4,000,000 = $2.25. If-converted method: add back preferred dividends and add the conversion shares, giving 10,000,000 / 4,500,000 = $2.22 < $2.25, so the preferred is dilutive. $2.00 adds the shares without adding back the preferred dividends.","d":3,"t":"Diluted EPS (if-converted)","c":"If-converted method: for convertible preferred, add back preferred dividends to the numerator and the conversion shares to the denominator; for convertible bonds, add back after-tax interest. A security is included only if dilutive (diluted EPS <= basic EPS)."},{"r":2,"q":"A company has net income of $2,400,000 and 1,000,000 weighted average shares. It has 100,000 options outstanding with an exercise price of $20; the average market price during the year was $25. Using the treasury stock method, diluted EPS is closest to:","o":["$2.18","$2.40","$2.35"],"a":2,"e":"Exercise proceeds = 100,000 x 20 = $2,000,000, which repurchase 2,000,000 / 25 = 80,000 shares; net new shares = 20,000. Diluted EPS = 2,400,000 / 1,020,000 = $2.35. $2.18 adds all option shares without any repurchase, and $2.40 is basic EPS.","d":3,"t":"Diluted EPS (treasury stock)","c":"Treasury stock method: incremental shares = n - (n x exercise price / average market price). Options are dilutive only if the average market price exceeds the exercise price; the numerator is unchanged."},{"r":2,"q":"Which statement about the presentation of expenses on the income statement is most accurate?","o":["US GAAP requires extraordinary items to be presented separately, net of tax","IFRS requires operating expenses to be classified by function only","IFRS permits operating expenses to be classified either by nature or by function"],"a":2,"e":"IFRS permits expenses to be presented by nature (wages, depreciation...) or by function (cost of sales, selling expenses...), with additional disclosure by nature if function is chosen. Extraordinary items were eliminated under US GAAP (2015) and are prohibited under IFRS.","d":2,"t":"Expense classification IFRS","c":"Expenses may be presented by nature (materials, wages, depreciation) or by function (cost of sales, selling expenses...). IFRS: free choice, but a by-function presentation requires a breakdown by nature in the notes; US GAAP (SEC): by function in practice."},{"r":2,"q":"A travel agent sells airline tickets for $1,000 on behalf of an airline and keeps a commission of $80. The agent does not control the service before it is transferred. The revenue the agent should report is:","o":["$1,000","$80","$920"],"a":1,"e":"The agent never obtains control of the service: it acts as an agent and recognizes revenue on a net basis, i.e., the $80 commission. $1,000 would be the gross presentation of a principal; $920 is the amount remitted to the airline.","d":1,"t":"Principal vs agent","c":"Principal vs. agent: the principal controls the good/service before transfer and recognizes revenue gross; the agent merely arranges the sale and recognizes only its commission (net revenue)."},{"r":2,"q":"Income from discontinued operations is most likely reported on the income statement:","o":["Within operating income, before tax","Separately, net of tax, after income from continuing operations","Only in other comprehensive income"],"a":1,"e":"Discontinued operations are presented separately, net of tax, below income from continuing operations, so the analyst can exclude them from forecasts. They are neither included in operating income nor reported in OCI.","d":1,"t":"Discontinued operations","c":"Discontinued operations are reported separately, net of tax, after income from continuing operations; they are excluded from forecasts of recurring earnings."},{"r":2,"q":"During the year a company reports net income of $500 million, an unrealized gain of $40 million on debt securities measured at fair value through OCI, a foreign currency translation loss of $25 million, and pays dividends of $100 million. Total comprehensive income is closest to:","o":["$415 million","$565 million","$515 million"],"a":2,"e":"Comprehensive income = 500 + 40 - 25 = $515 million. Dividends are a transaction with shareholders and are not part of comprehensive income (so $415 million is wrong); $565 million treats the translation loss as a gain.","d":2,"t":"Comprehensive income","c":"Comprehensive income = net income + other comprehensive income (OCI). OCI includes translation adjustments, unrealized gains/losses on FVOCI debt securities, the effective portion of cash flow hedges and pension remeasurements; dividends paid are never part of it."},{"r":3,"q":"Which of the following is most likely classified as a current liability?","o":["Bonds payable maturing in five years","Unearned revenue for services to be delivered in six months","Deferred tax liabilities"],"a":1,"e":"Unearned revenue for a service to be delivered within six months is a current liability. Five-year bonds are non-current, and deferred taxes are always classified as non-current under both IFRS and US GAAP.","d":1,"t":"Current liabilities","c":"A liability is current if it must be settled within 12 months (or the operating cycle if longer): accounts payable, short-term debt, current portion of long-term debt, accrued liabilities, unearned revenue."},{"r":3,"q":"A company reports cash of 50, accounts receivable of 120, inventory of 180, prepaid expenses of 10, accounts payable of 150, accrued liabilities of 40, current portion of long-term debt of 30, and long-term debt of 300. Its quick ratio is closest to:","o":["1.64","0.77","0.82"],"a":1,"e":"Current liabilities = 150 + 40 + 30 = 220 (long-term debt excluding the current portion is excluded). Quick ratio = (50 + 120) / 220 = 0.77. 1.64 is the current ratio and 0.82 wrongly includes prepaid expenses.","d":2,"t":"Quick ratio","c":"Quick ratio = (cash + short-term marketable securities + receivables) / current liabilities. Inventory and prepaid expenses are excluded."},{"r":3,"q":"Which statement about the measurement of property, plant and equipment is most accurate?","o":["IFRS permits the revaluation model, whereas US GAAP requires the cost model","Both IFRS and US GAAP permit the revaluation model","US GAAP permits the revaluation model, whereas IFRS requires the cost model"],"a":0,"e":"IFRS (IAS 16) permits either the cost model or the revaluation model by asset class; US GAAP requires the cost model (historical cost less depreciation and impairment). The other two options reverse or wrongly generalize this difference.","d":2,"t":"PP&E revaluation IFRS vs GAAP","c":"PP&E: IFRS permits the cost model or the revaluation model; US GAAP requires the cost model (historical cost - accumulated depreciation - impairment), with no upward revaluation."},{"r":3,"q":"Under IFRS 9, a company makes the irrevocable election at initial recognition for an equity investment that is not held for trading. Subsequent unrealized gains on this investment are recognized in:","o":["Other comprehensive income","Profit or loss","Neither, because the investment is carried at cost"],"a":0,"e":"With the irrevocable FVOCI election for an equity instrument not held for trading, fair value changes go to OCI and are never recycled to profit or loss. Without the election they would go to profit or loss (FVPL); cost is not a basic option under IFRS 9.","d":2,"t":"FVOCI equity election","c":"IFRS 9: irrevocable FVOCI election for an equity investment not held for trading; fair value changes go to OCI with no recycling to profit or loss on disposal, while dividends go to net income."},{"r":3,"q":"Company P acquires 100% of Company T for $800 million. T's identifiable assets have a fair value of $1,000 million and its liabilities a fair value of $400 million; the book value of T's net assets is $450 million. Goodwill recognized is closest to:","o":["$350 million","$400 million","$200 million"],"a":2,"e":"Goodwill = price paid - fair value of identifiable net assets = 800 - (1,000 - 400) = $200 million. $350 million wrongly uses the book value of net assets; $400 million considers only the liabilities.","d":2,"t":"Goodwill measurement","c":"Goodwill = acquisition price - fair value of identifiable net assets (assets - liabilities at fair value). If negative (bargain purchase), the gain is recognized immediately in profit or loss."},{"r":3,"q":"A company reports inventory of 240, total assets of 1,600 and total liabilities of 900. On a vertical common-size balance sheet, inventory is closest to:","o":["15.0%","26.7%","34.3%"],"a":0,"e":"A common-size balance sheet expresses each item as a % of total assets: 240 / 1,600 = 15.0%. 26.7% divides by total liabilities and 34.3% by equity (700).","d":1,"t":"Common-size balance sheet","c":"Vertical common-size balance sheet: each item is expressed as a % of total assets. Equity = total assets - total liabilities."},{"r":3,"q":"Under both IFRS and US GAAP, noncontrolling interests in consolidated subsidiaries are presented on the consolidated balance sheet:","o":["Within equity, separately from the parent shareholders' equity","As a non-current liability","Between liabilities and equity (mezzanine section)"],"a":0,"e":"Noncontrolling interests are presented within equity, separately from equity attributable to the parent, under both frameworks. They are not liabilities, and the mezzanine section mainly concerns certain redeemable shares under SEC rules.","d":2,"t":"Noncontrolling interest","c":"Noncontrolling interests represent the portion of consolidated subsidiaries not owned by the parent; they are presented within equity, separately from equity attributable to the parent's shareholders."},{"r":3,"q":"Which of the following intangible assets is NOT amortized but instead tested for impairment at least annually?","o":["Goodwill","A patent with a 15-year legal life","A customer list with a finite useful life"],"a":0,"e":"Goodwill (and indefinite-lived intangibles) is not amortized but tested for impairment at least annually. A patent and a customer list have finite useful lives and are amortized.","d":1,"t":"Intangibles amortization","c":"Finite-lived intangibles are amortized; indefinite-lived ones (goodwill, certain brands or indefinitely renewable licenses) are not amortized but tested for impairment at least annually."},{"r":4,"q":"Under IFRS, dividends paid by a company may be classified in the statement of cash flows as:","o":["Either operating or financing activities","Financing activities only","Investing activities only"],"a":0,"e":"IFRS allows dividends paid to be classified in either operating or financing activities (applied consistently). US GAAP requires financing; investing is never an option for dividends paid.","d":1,"t":"Dividends paid classification","c":"IFRS: interest and dividends received in CFO or CFI; interest and dividends paid in CFO or CFF. US GAAP: interest paid/received and dividends received in CFO, dividends paid in CFF."},{"r":4,"q":"A company reports net income of 200, depreciation of 50, an increase in accounts receivable of 30, a decrease in inventory of 20, an increase in accounts payable of 15, and a gain on sale of equipment of 10. Cash flow from operating activities (indirect method) is closest to:","o":["265","245","235"],"a":1,"e":"CFO = 200 + 50 - 30 + 20 + 15 - 10 = 245. The gain on sale is subtracted (the proceeds are classified as investing); 265 wrongly adds it and 235 reverses the signs of the working capital changes.","d":2,"t":"CFO indirect method","c":"CFO, indirect method = net income + noncash charges (depreciation) - gains / + losses on disposals - increases in current operating assets + decreases in those assets + increases in current operating liabilities - decreases in those liabilities."},{"r":4,"q":"A company reports revenue of 1,000. Accounts receivable increased from 120 to 150, and unearned revenue increased by 10. Cash collected from customers is closest to:","o":["980","1040","970"],"a":0,"e":"Cash collected from customers = 1,000 - 30 (increase in receivables) + 10 (increase in unearned revenue) = 980. 1,040 adds the increase in receivables instead of subtracting it; 970 ignores unearned revenue.","d":2,"t":"Cash collected from customers","c":"Cash collected from customers = revenue - increase in accounts receivable (+ decrease) + increase in unearned revenue."},{"r":4,"q":"A company reports cost of goods sold of 600. During the year, inventory increased by 40 and accounts payable increased by 25. Cash paid to suppliers is closest to:","o":["585","665","615"],"a":2,"e":"Purchases = COGS + increase in inventory = 640; cash paid = 640 - increase in payables of 25 = 615. 585 reverses both adjustments; 665 adds the increase in payables even though it reduces cash paid.","d":2,"t":"Cash paid to suppliers","c":"Cash paid to suppliers = COGS + increase in inventory (- decrease) - increase in accounts payable (+ decrease). Purchases are first derived from COGS and the inventory change, then adjusted for the change in payables."},{"r":4,"q":"Gross PP&E rose from 1,000 to 1,100 and accumulated depreciation rose from 400 to 430. During the year, capital expenditures were 250, depreciation expense was 80, and a gain of 15 was recognized on the sale of equipment. Cash proceeds from the sale are closest to:","o":["100","165","115"],"a":2,"e":"Historical cost of assets sold = 1,000 + 250 - 1,100 = 150; accumulated depreciation on assets sold = 400 + 80 - 430 = 50; book value = 100. Proceeds = book value + gain = 115. 100 ignores the gain and 165 ignores the accumulated depreciation on the asset sold.","d":3,"t":"Proceeds from asset sale","c":"Reconstructing a disposal: historical cost sold = beginning gross PP&E + capex - ending gross PP&E; accumulated depreciation on assets sold = beginning AD + depreciation expense - ending AD; sale proceeds = book value sold + gain (or - loss)."},{"r":4,"q":"A company converts bonds payable into common shares. In the financial statements, this transaction is most likely:","o":["Reported as a financing cash outflow and a financing cash inflow","Disclosed as a noncash financing activity, not in the body of the cash flow statement","Reported as an operating cash flow"],"a":1,"e":"Converting bonds into shares involves no cash flow: it is disclosed in the notes (or in a note below the statement) as a noncash transaction. Presenting it as a financing outflow and inflow, or as an operating cash flow, would be wrong.","d":1,"t":"Noncash transactions","c":"Noncash transactions (conversion of bonds into shares, acquiring an asset by issuing debt, finance leases) do not appear in the body of the cash flow statement; they are disclosed in the notes or a supplementary schedule."},{"r":4,"q":"A company reporting under US GAAP presents operating cash flows using the direct method. It must also:","o":["Present a reconciliation of net income to operating cash flow","Classify interest paid as a financing activity","Present nothing further, because the direct method is self-sufficient"],"a":0,"e":"Under US GAAP, a company using the direct method must also provide a reconciliation of net income to CFO (equivalent to the indirect method). Under US GAAP, interest paid is classified as operating, not financing.","d":2,"t":"Direct method reconciliation US GAAP","c":"US GAAP: if the direct method is used for CFO, a reconciliation of net income to CFO (indirect method) must also be provided. Both methods give the same total CFO."},{"r":4,"q":"A US GAAP company issued bonds for 300, repaid long-term debt of 120, paid dividends of 50, repurchased shares for 80, and paid interest of 30. Cash flow from financing activities is closest to:","o":["50","20","100"],"a":0,"e":"CFF = 300 - 120 - 50 - 80 = 50. Under US GAAP, interest paid is an operating activity, so 20 is wrong; dividends paid are financing, so 100 (excluding dividends) is wrong.","d":2,"t":"CFF under US GAAP","c":"CFF covers cash flows with creditors and shareholders: issuing/repaying debt, issuing/repurchasing shares, dividends paid (CFF under US GAAP). Interest paid is in CFO under US GAAP."},{"r":5,"q":"A US GAAP company reports cash flow from operations of 500, interest paid of 60, capital expenditures of 180, and a tax rate of 25%. Free cash flow to the firm (FCFF) is closest to:","o":["365","380","320"],"a":0,"e":"FCFF = CFO + interest x (1 - t) - capital expenditures = 500 + 60 x 0.75 - 180 = 365. 380 adds back pre-tax interest and 320 fails to add back interest (already deducted from CFO under US GAAP).","d":2,"t":"FCFF","c":"FCFF = CFO + interest paid x (1 - t) - FCInv (capex). Under IFRS, if interest paid is already classified in CFF, it is not added back."},{"r":5,"q":"A company reports cash flow from operations of 500, capital expenditures of 180, debt issued of 90 and debt repaid of 50. Free cash flow to equity (FCFE) is closest to:","o":["320","360","280"],"a":1,"e":"Net borrowing = 90 - 50 = 40. FCFE = 500 - 180 + 40 = 360. 320 ignores net borrowing and 280 subtracts it instead of adding it.","d":2,"t":"FCFE","c":"FCFE = CFO - FCInv + net borrowing (new debt - repayments). Equivalently: FCFE = FCFF - interest x (1 - t) + net borrowing."},{"r":5,"q":"When preparing a common-size statement of cash flows, an analyst most commonly expresses each line item as a percentage of:","o":["Total assets","Net revenue (or of total cash inflows/outflows)","Shareholders' equity"],"a":1,"e":"A common-size cash flow statement expresses each item as a % of revenue, or each inflow/outflow as a % of total inflows/outflows. Total assets is the base for the common-size balance sheet; equity is not a usual base.","d":1,"t":"Common-size cash flow statement","c":"Common-size cash flow statement: the most common approach expresses each cash flow as a % of revenue; the alternative expresses each inflow as a % of total inflows and each outflow as a % of total outflows."},{"r":5,"q":"A US GAAP company reports cash flow from operations of 400, interest paid of 50 and taxes paid of 100. Its interest coverage ratio based on cash flows is closest to:","o":["8.0x","11.0x","9.0x"],"a":1,"e":"Cash flow interest coverage = (CFO + interest paid + taxes paid) / interest paid = (400 + 50 + 100) / 50 = 11.0x. 8.0x adds nothing to CFO and 9.0x fails to add back taxes paid.","d":2,"t":"Cash flow interest coverage","c":"Cash flow interest coverage = (CFO + interest paid + taxes paid) / interest paid."},{"r":5,"q":"A company's operating cash flow rose sharply this year while net income was flat. The increase was driven almost entirely by a large increase in accounts payable. An analyst should most likely conclude that:","o":["The increase in operating cash flow may not be sustainable","Earnings quality has clearly improved","The company has become more profitable on a cash basis in a lasting way"],"a":0,"e":"Stretching payables temporarily inflates CFO, but suppliers will eventually demand payment, so the increase is probably not sustainable. It reflects neither improved profitability nor better earnings quality.","d":3,"t":"Sustainability of CFO","c":"The quality of CFO depends on its source: CFO driven by recurring earnings is sustainable; an increase from working capital reductions (faster collection of receivables, stretching payables, lower inventory) is one-off and not durable."},{"r":5,"q":"A company reports cash flow from operations of 300 and cash paid for long-term assets of 240. Its reinvestment ratio is closest to:","o":["0.80","0.25","1.25"],"a":2,"e":"Reinvestment ratio = CFO / cash paid for long-term assets = 300 / 240 = 1.25: the company can fund its investments from operating cash flows. 0.80 inverts the ratio and 0.25 uses the surplus as the numerator.","d":1,"t":"Reinvestment ratio","c":"Reinvestment ratio = CFO / cash paid for long-term assets. A ratio > 1 indicates that operations fund the investments."},{"r":5,"q":"An IFRS company classifies interest paid as a financing cash flow. To compare its operating cash flow with that of a US GAAP peer, an analyst should most likely:","o":["Add interest paid to the IFRS company's operating cash flow","Make no adjustment, since both standards classify interest paid identically","Subtract interest paid from the IFRS company's operating cash flow"],"a":2,"e":"Under US GAAP, interest paid reduces CFO. Because the IFRS company classifies it as financing, its CFO is overstated relative to the peer, so interest paid must be subtracted from its CFO. Adding it would widen the gap, and the two standards do not treat this item identically.","d":3,"t":"Comparability IFRS vs US GAAP","c":"To compare an IFRS CFO (interest paid in CFF) with a US GAAP CFO, subtract interest paid from the IFRS CFO (or add it back to the US GAAP CFO) so the classifications are consistent."},{"r":5,"q":"A company reports cash flow from operations of 180. Total assets were 1,400 at the beginning of the year and 1,600 at the end. Cash return on assets is closest to:","o":["11.2%","12.0%","12.9%"],"a":1,"e":"Cash return on assets = CFO / average total assets = 180 / 1,500 = 12.0%. 11.2% uses ending assets and 12.9% uses beginning assets instead of the average.","d":1,"t":"Cash return on assets","c":"Cash return on assets = CFO / average total assets."},{"r":6,"q":"A company begins the year with 100 units at $10. It purchases 200 units at $12 and then 150 units at $14, and sells 300 units. Using periodic LIFO, cost of goods sold is closest to:","o":["$3,900","$3,400","$3,667"],"a":0,"e":"LIFO: the 300 units sold come from the most recent purchases, 150 x 14 + 150 x 12 = $3,900. $3,400 is FIFO (100 x 10 + 200 x 12) and $3,667 is weighted average cost (5,500 / 450 x 300).","d":2,"t":"LIFO COGS","c":"LIFO (last in, first out): COGS is measured at the costs of the most recent purchases; ending inventory reflects the oldest costs."},{"r":6,"q":"Using the same data (beginning 100 units at $10; purchases of 200 units at $12 and 150 units at $14; 300 units sold), ending inventory under FIFO is closest to:","o":["$1,600","$1,833","$2,100"],"a":2,"e":"FIFO: the 150 remaining units are the most recent ones, 150 x 14 = $2,100. $1,600 is LIFO ending inventory (100 x 10 + 50 x 12) and $1,833 is weighted average cost ending inventory.","d":2,"t":"FIFO ending inventory","c":"FIFO (first in, first out): COGS reflects the oldest costs; ending inventory is measured at the costs of the most recent purchases. Ending units = beginning + purchases - units sold."},{"r":6,"q":"Which inventory cost formula is permitted under US GAAP but prohibited under IFRS?","o":["FIFO","Weighted average cost","LIFO"],"a":2,"e":"IAS 2 prohibits LIFO; US GAAP permits it. FIFO and weighted average cost are allowed under both frameworks (as is specific identification).","d":1,"t":"LIFO under IFRS","c":"IFRS prohibits LIFO; permitted methods are specific identification, FIFO and weighted average cost. US GAAP also permits LIFO."},{"r":6,"q":"A company using LIFO reports cost of goods sold of $3,000 million. Its LIFO reserve increased from $120 million to $150 million during the year. COGS under FIFO is closest to:","o":["$2,970 million","$3,030 million","$2,850 million"],"a":0,"e":"FIFO COGS = LIFO COGS - change in LIFO reserve = 3,000 - (150 - 120) = $2,970 million. $3,030 million adds the change instead of subtracting it, and $2,850 million subtracts the full reserve (which adjusts inventory, not COGS).","d":3,"t":"LIFO reserve conversion","c":"LIFO to FIFO conversion: FIFO inventory = LIFO inventory + LIFO reserve; FIFO COGS = LIFO COGS - (ending LIFO reserve - beginning LIFO reserve). Pre-tax income increases by the change in the reserve."},{"r":6,"q":"Which statement about inventory write-downs is most accurate?","o":["IFRS permits reversal of a prior write-down, whereas US GAAP prohibits it","Both IFRS and US GAAP permit reversal of prior write-downs","US GAAP permits reversal of prior write-downs, whereas IFRS prohibits it"],"a":0,"e":"Under IFRS, an inventory write-down can be reversed (up to the amount originally written down) if net realizable value recovers. Under US GAAP, reversal is prohibited. The other two statements are therefore wrong.","d":2,"t":"Inventory write-down reversal","c":"Inventory write-downs: IFRS uses the lower of cost and net realizable value, with reversal allowed (limited to the original loss); US GAAP (non-LIFO/retail: lower of cost and NRV; LIFO/retail: lower of cost or market) prohibits reversal."},{"r":6,"q":"Under IFRS, inventory has a cost of $50,000. Its estimated selling price is $52,000, estimated costs to complete are $3,000 and estimated selling costs are $2,500. The required write-down is closest to:","o":["$1,000","$3,500","$0, because the selling price exceeds cost"],"a":1,"e":"NRV = 52,000 - 3,000 - 2,500 = $46,500; write-down = 50,000 - 46,500 = $3,500. $1,000 ignores selling costs, and comparing only the selling price to cost ignores the costs to complete and to sell.","d":2,"t":"Net realizable value","c":"Net realizable value (NRV) = estimated selling price - estimated costs to complete - estimated selling costs. Inventory is carried at the lower of cost and NRV; the difference is an expense of the period."},{"r":6,"q":"In a period of rising prices and stable or increasing inventory quantities, a company using LIFO rather than FIFO will most likely report:","o":["Higher cash flow from operations","A higher current ratio","A higher gross profit margin"],"a":0,"e":"With rising prices, LIFO assigns the recent (higher) costs to COGS: lower gross profit and lower taxes, hence higher CFO. Because LIFO inventory is lower, the current ratio is lower, and so is the gross margin.","d":2,"t":"LIFO vs FIFO effects","c":"With rising prices and stable or growing inventory, LIFO vs. FIFO gives: higher COGS, lower income and taxes, lower inventory, higher CFO (tax savings), lower margins and profitability ratios, and higher inventory turnover."},{"r":6,"q":"A LIFO company sells more units than it purchases during a period of rising prices, liquidating old inventory layers. The most likely effect is:","o":["An increase in cost of goods sold relative to current costs","A temporary increase in gross profit margin","An increase in the LIFO reserve"],"a":1,"e":"A LIFO liquidation runs old, low-cost layers through COGS: COGS is understated and gross margin (and taxes) are temporarily higher, on a non-recurring basis. The LIFO reserve decreases rather than increases.","d":3,"t":"LIFO liquidation","c":"LIFO liquidation: when sales exceed purchases, old low-cost inventory layers flow into COGS, temporarily inflating gross margin and earnings (a non-recurring gain); the warning sign is a decline in the LIFO reserve."},{"r":7,"q":"Equipment costs $120,000, has an estimated residual value of $20,000 and a 5-year useful life. Using the double-declining balance method, Year 2 depreciation is closest to:","o":["$28,800","$24,000","$20,000"],"a":0,"e":"Rate = 2/5 = 40%. Year 1: 40% x 120,000 = 48,000; Year 2: 40% x (120,000 - 48,000) = $28,800. Under double-declining balance, residual value is not deducted from the base (so $24,000 is wrong); $20,000 is straight-line depreciation.","d":2,"t":"Double-declining balance","c":"Double-declining balance (DDB): expense = 2 / useful life x beginning-of-year book value; residual value is ignored in the calculation, but book value cannot fall below it."},{"r":7,"q":"A machine costs $500,000, has a residual value of $50,000 and is expected to produce 900,000 units over its life. In Year 1 it produces 180,000 units. Depreciation under the units-of-production method is closest to:","o":["$100,000","$72,000","$90,000"],"a":2,"e":"Depreciation per unit = (500,000 - 50,000) / 900,000 = $0.50; Year 1 = 180,000 x 0.50 = $90,000. $100,000 ignores residual value; $72,000 is not based on actual production.","d":1,"t":"Units-of-production depreciation","c":"Units-of-production depreciation: expense = (cost - residual value) / total estimated production x units produced in the period."},{"r":7,"q":"Compared with expensing a cost, capitalizing it most likely results in, in the year the cost is incurred:","o":["Higher cash flow from operations","Lower total assets","Lower net income"],"a":0,"e":"Capitalizing classifies the outlay as an investing cash flow, which increases CFO in that year; it also increases assets and net income in that year (only the depreciation is expensed). The other two effects are reversed.","d":1,"t":"Capitalizing vs expensing","c":"Capitalizing rather than expensing: higher income and equity in the year of the outlay (lower later through depreciation), higher assets, higher CFO and lower CFI; smoother earnings over time."},{"r":7,"q":"Which statement about research and development costs is most accurate?","o":["Both IFRS and US GAAP require all R&D costs to be expensed","IFRS requires development costs to be capitalized once specified criteria are met, whereas US GAAP generally expenses R&D","US GAAP requires development costs to be capitalized, whereas IFRS expenses all R&D"],"a":1,"e":"Under IAS 38, research is expensed and development is capitalized once the criteria (technical feasibility, intent, resources...) are met. US GAAP generally expenses R&D, with exceptions such as certain software. The other statements are wrong.","d":2,"t":"R&D IFRS vs US GAAP","c":"R&D: IFRS expenses research but capitalizes development once technical feasibility and other criteria are demonstrated; US GAAP generally expenses all R&D (exception: software for sale after technical feasibility)."},{"r":7,"q":"Under IFRS, an asset has a carrying amount of $900 million. Its fair value less costs to sell is $700 million and its value in use is $750 million. The impairment loss is closest to:","o":["$200 million","$150 million","$50 million"],"a":1,"e":"Recoverable amount = max(700, 750) = $750 million; impairment = 900 - 750 = $150 million. $200 million wrongly uses the lower of the two values and $50 million compares the two measures with each other.","d":3,"t":"Impairment under IFRS","c":"IFRS: an asset is impaired if carrying amount > recoverable amount, where recoverable amount = max(fair value less costs to sell, value in use). Loss = carrying amount - recoverable amount; reversal is allowed."},{"r":7,"q":"Under US GAAP, a long-lived asset held for use has a carrying amount of $900 million, undiscounted expected future cash flows of $950 million and a fair value of $700 million. The impairment loss is:","o":["$200 million","$250 million","$0"],"a":2,"e":"Under US GAAP, recoverability is tested first: undiscounted cash flows of $950 million > carrying amount of $900 million, so the asset is recoverable and no impairment is recognized. $200 million (900 - 700) would be recognized only if the test failed; $250 million compares cash flows with fair value.","d":3,"t":"Impairment under US GAAP","c":"US GAAP (assets held for use): the asset fails the recoverability test if carrying amount > undiscounted future cash flows; loss = carrying amount - fair value (or discounted cash flows). No subsequent reversal."},{"r":7,"q":"During construction of a plant, a company's average accumulated expenditures are $10 million. It has a specific construction loan of $8 million at 6%, and its other borrowings carry a 7% rate. Interest capitalized for the year is closest to:","o":["$620,000","$600,000","$700,000"],"a":0,"e":"Capitalized interest = 8M x 6% + (10M - 8M) x 7% = 480,000 + 140,000 = $620,000. $600,000 applies 6% to the whole amount and $700,000 applies 7% to the whole amount, whereas the specific loan must be used first.","d":2,"t":"Capitalized interest","c":"Capitalized interest: apply the specific construction loan rate to the portion it finances, then the average rate on other borrowings to the remaining expenditures; capped at interest actually incurred. It is depreciated with the asset."},{"r":7,"q":"A company reports gross PP&E of 600, accumulated depreciation of 240 and annual depreciation expense of 60 (straight-line, no residual value). The estimated average age of its PP&E is closest to:","o":["4.0 years","6.0 years","10.0 years"],"a":0,"e":"Average age = accumulated depreciation / depreciation expense = 240 / 60 = 4.0 years. 6.0 years is the remaining useful life (net PP&E 360 / 60) and 10.0 years the total useful life (600 / 60).","d":2,"t":"Average age of PP&E","c":"Average age = accumulated depreciation / annual depreciation expense; total useful life = gross PP&E / depreciation expense; remaining useful life = net PP&E / depreciation expense."},{"r":8,"q":"A lessee enters a 5-year lease with annual payments of $50,000 made at the end of each year. The interest rate implicit in the lease is 6%. The initial lease liability is closest to:","o":["$210,618","$250,000","$223,255"],"a":0,"e":"Lease liability = PV of a 5-year annuity of 50,000 at 6% = $210,618. $250,000 is the undiscounted sum and $223,255 assumes payments at the start of each period (annuity due).","d":2,"t":"Lease liability measurement","c":"Lease liability = present value of future lease payments discounted at the rate implicit in the lease (or the incremental borrowing rate). The right-of-use (ROU) asset initially equals this liability (+ initial direct costs)."},{"r":8,"q":"Using the same lease (5 years, $50,000 annual payments in arrears, 6% rate), the lessee reports under IFRS 16 with straight-line depreciation of the right-of-use asset. Total lease-related expense in Year 1 is closest to:","o":["$50,000","$12,637","$54,761"],"a":2,"e":"Asset = liability = $210,618. Year 1 interest = 210,618 x 6% = 12,637; depreciation = 210,618 / 5 = 42,124; total = $54,761. $50,000 is the straight-line expense of an operating lease under US GAAP, and $12,637 counts only the interest.","d":3,"t":"IFRS 16 lessee expense","c":"IFRS 16 (lessee): single model; expenses = straight-line depreciation of the right-of-use asset + interest (rate x beginning lease liability). Total expense declines over time (front-loaded)."},{"r":8,"q":"Which statement about the cash flow classification of a lessee's lease payments is most accurate?","o":["Under US GAAP, the principal portion of an operating lease payment is classified as a financing cash outflow","Under IFRS 16, the principal portion is classified as a financing cash outflow","Under IFRS 16, the entire lease payment is classified as an operating cash outflow"],"a":1,"e":"Under IFRS 16, the principal portion is financing (interest is operating or financing by choice). Under US GAAP, operating lease payments are entirely operating cash flows; classifying the full payment as operating under IFRS is therefore wrong.","d":2,"t":"Lease cash flow classification","c":"Lessee lease cash flows: IFRS 16 - principal in CFF, interest in CFO or CFF; US GAAP finance lease - principal in CFF, interest in CFO; US GAAP operating lease - entire payment in CFO."},{"r":8,"q":"A defined benefit pension plan has a present value of the defined benefit obligation of $1,200 million and plan assets with a fair value of $1,050 million. The amount reported on the balance sheet is:","o":["A net pension asset of $150 million","A net pension liability of $150 million","A pension liability of $1,200 million"],"a":1,"e":"Funded status = plan assets - obligation = 1,050 - 1,200 = -$150 million: the plan is underfunded, so a net liability of $150 million is reported. It is not an asset, and the net amount is reported, not the gross obligation.","d":1,"t":"Funded status","c":"Funded status = fair value of plan assets - present value of the defined benefit obligation (DBO). Deficit -> net liability; surplus -> net asset (subject to an asset ceiling under IFRS)."},{"r":8,"q":"Which statement about remeasurements (actuarial gains and losses) of a defined benefit plan is most accurate?","o":["Under both IFRS and US GAAP they are recognized immediately in profit or loss","Under IFRS they are amortized into profit or loss over the employees' remaining service period","Under IFRS they are recognized in OCI and never reclassified to profit or loss, whereas under US GAAP they are recognized in OCI and may later be amortized into profit or loss"],"a":2,"e":"Under IAS 19, remeasurements go to OCI with no subsequent recycling. Under US GAAP, they go to OCI and may then be amortized into profit or loss (corridor approach). Immediate recognition in profit or loss is not required, and amortization into profit or loss is specific to US GAAP.","d":3,"t":"Pension remeasurements IFRS vs GAAP","c":"Remeasurements (actuarial gains/losses, actual vs. expected return on assets): IFRS - OCI with no subsequent recycling; US GAAP - OCI, then gradual amortization into profit or loss (corridor approach)."},{"r":8,"q":"On 1 January a company grants 100,000 stock options to employees with a grant-date fair value of $6 per option. The options cliff-vest after 4 years of service. Assuming no forfeitures, compensation expense in Year 1 is closest to:","o":["$600,000","$150,000","$0, because the options are not yet vested"],"a":1,"e":"Total cost = 100,000 x 6 = $600,000, spread over the 4-year vesting period: $150,000 per year. Expensing everything at grant is wrong, and the absence of vesting does not prevent recognizing the expense as service is rendered.","d":2,"t":"Share-based compensation","c":"Share-based compensation: cost = fair value at the grant date, spread on a straight-line basis over the vesting period; expense in profit or loss, with the offset in equity."},{"r":8,"q":"A company issues a 5-year bond with a face value of $1,000,000 and a 5% annual coupon when the market rate is 6%. Using the effective interest method, interest expense in Year 1 is closest to:","o":["$57,473","$50,000","$60,000"],"a":0,"e":"Issue price = PV of the 50,000 coupons and the face value at 6% = $957,876 (issued at a discount). Interest expense = 957,876 x 6% = $57,473. $50,000 is the coupon paid and $60,000 applies the market rate to face value instead of carrying amount.","d":2,"t":"Effective interest method","c":"Effective interest method: interest expense = market rate at issuance x beginning carrying amount; coupon paid = coupon rate x face value; the difference amortizes the discount (premium) - if issued at a discount, the carrying amount rises toward face value."},{"r":8,"q":"Under IFRS, a company's defined benefit plan has a beginning obligation of $1,000 million, beginning plan assets of $900 million, current service cost of $80 million and a discount rate of 5%. The actual return on plan assets was $70 million. Pension expense recognized in profit or loss is closest to:","o":["$85 million","$60 million","$130 million"],"a":0,"e":"Under IFRS, expense in profit or loss = service cost + net interest = 80 + 5% x (1,000 - 900) = $85 million. The difference between the actual return (70) and the return at the discount rate (45) is a remeasurement in OCI, so $60 million is wrong; $130 million ignores plan assets.","d":3,"t":"Pension expense IFRS","c":"IFRS: pension cost in profit or loss = service cost + net interest (discount rate x beginning net deficit); remeasurements go to OCI."},{"r":9,"q":"A company uses accelerated depreciation for tax purposes and straight-line depreciation for financial reporting. This most likely creates:","o":["A deferred tax asset","A deferred tax liability","A permanent difference"],"a":1,"e":"Accelerated tax depreciation makes the asset's tax base lower than its carrying amount: taxable income is lower now and higher later, hence a deferred tax liability. The difference is temporary (it reverses), not permanent.","d":1,"t":"Deferred tax liability origin","c":"A deferred tax liability (DTL) arises when taxable income is temporarily lower than accounting profit (e.g., accelerated tax depreciation): carrying amount of the asset > tax base."},{"r":9,"q":"An asset costing $100,000 is depreciated by $25,000 in Year 1 for financial reporting and by $40,000 for tax purposes. The tax rate is 25%. The deferred tax liability at the end of Year 1 is closest to:","o":["$15,000","$6,250","$3,750"],"a":2,"e":"Carrying amount = 75,000; tax base = 60,000; temporary difference = 15,000. DTL = 15,000 x 25% = $3,750. $15,000 fails to apply the tax rate and $6,250 applies the rate to book depreciation.","d":2,"t":"DTL calculation","c":"DTL (or DTA) = tax rate x cumulative temporary difference between the carrying amount and the tax base of the asset or liability."},{"r":9,"q":"A company reports income taxes payable of $400 million. During the year, its deferred tax liabilities increased by $30 million and its deferred tax assets increased by $10 million. Income tax expense is closest to:","o":["$440 million","$420 million","$380 million"],"a":1,"e":"Income tax expense = taxes payable + change in DTL - change in DTA = 400 + 30 - 10 = $420 million. $440 million adds the increase in DTA instead of subtracting it, and $380 million reverses both signs.","d":2,"t":"Income tax expense","c":"Income tax expense = taxes payable + change in DTL - change in DTA."},{"r":9,"q":"A company has a deferred tax liability of $1,000,000 measured at a 25% tax rate. The enacted tax rate is reduced to 20%. The effect of the rate change is most likely:","o":["A $200,000 decrease in income tax expense","A $200,000 increase in income tax expense","No effect until the temporary difference reverses"],"a":0,"e":"Temporary difference = 1,000,000 / 25% = 4,000,000; new DTL = 4,000,000 x 20% = 800,000. The $200,000 decrease in the liability reduces income tax expense for the period. Deferred taxes are remeasured as soon as the new rate is enacted, without waiting for reversal.","d":3,"t":"Tax rate change on DTL","c":"Liability method: DTL and DTA are remeasured at the newly enacted rate; the change flows through income tax expense for the period (lower rate -> lower DTL -> lower tax expense)."},{"r":9,"q":"Under US GAAP, an increase in the valuation allowance for deferred tax assets most likely:","o":["Increases net income","Has no effect on net income because it is recorded directly in equity","Reduces net income"],"a":2,"e":"The valuation allowance reduces the DTA when it is more likely than not that it will not be realized; an increase raises income tax expense and reduces net income. It goes through profit or loss, not directly to equity.","d":2,"t":"Valuation allowance","c":"US GAAP: a valuation allowance is recorded if it is more likely than not (> 50%) that the deferred tax asset will not be realized; an increase reduces net DTA and raises tax expense (lower income). IFRS: a DTA is recognized only if realization is probable."},{"r":9,"q":"A company reports pretax income of $2,000 million, including $200 million of tax-exempt interest income. The statutory tax rate is 25% and there are no other differences. The effective tax rate is closest to:","o":["25.0%","27.8%","22.5%"],"a":2,"e":"Income tax expense = (2,000 - 200) x 25% = $450 million; effective tax rate = 450 / 2,000 = 22.5%. Tax-exempt interest is a permanent difference that lowers the effective rate below the 25% statutory rate; 27.8% uses the wrong denominator.","d":2,"t":"Effective tax rate","c":"Effective tax rate = income tax expense / pretax income. Permanent differences (e.g., tax-exempt income) cause the effective rate to differ from the statutory rate."},{"r":9,"q":"Which of the following most likely creates a permanent difference between taxable income and accounting profit?","o":["Warranty expenses accrued but deductible only when paid","Accelerated tax depreciation","Fines that are not deductible for tax purposes"],"a":2,"e":"Non-deductible fines will never be deductible: a permanent difference, with no deferred tax, that changes the effective tax rate. Warranty accruals and accelerated depreciation are temporary differences that create DTAs or DTLs.","d":1,"t":"Permanent differences","c":"Permanent difference: a gap between taxable income and accounting profit that will never reverse (tax-exempt income, non-deductible expenses such as certain fines); it creates no deferred tax but changes the effective tax rate."},{"r":9,"q":"An analyst determines that a company's deferred tax liability is not expected to reverse because the company keeps growing its capital expenditures. For analytical purposes, the analyst should most likely treat this DTL as:","o":["A liability","Equity","A reduction of total assets"],"a":1,"e":"If the DTL is not expected to reverse in the foreseeable future, it does not represent a future cash outflow, so the analyst reclassifies it as equity. If it were expected to reverse, it would be treated as a liability; deducting it from assets is not the approach used.","d":3,"t":"Analytical treatment of DTL","c":"If a DTL is not expected to reverse (e.g., continuing capital investment), the analyst treats it as equity; if it will reverse, as a liability (ideally at its present value)."},{"r":10,"q":"Which of the following lies at the lowest end of the financial reporting quality spectrum?","o":["Reporting fictitious transactions","Biased accounting choices within GAAP","GAAP-compliant reporting of earnings that are not sustainable"],"a":0,"e":"The bottom of the spectrum is fictitious transactions (fraud), below even non-compliant choices. Biased choices within the standards and compliant but unsustainable earnings are of higher quality.","d":1,"t":"Reporting quality spectrum","c":"Reporting quality spectrum (top to bottom): GAAP-compliant, decision-useful, sustainable earnings -> compliant but unsustainable earnings -> biased (aggressive/conservative) choices -> earnings management within the rules -> non-compliant -> fictitious/fraudulent."},{"r":10,"q":"Which accounting choice is most likely considered aggressive?","o":["Increasing the allowance for doubtful accounts","Shortening the estimated useful lives of assets","Capitalizing costs that would normally be expensed"],"a":2,"e":"Capitalizing costs that would normally be expensed inflates current earnings and assets: an aggressive choice. Increasing the allowance for doubtful accounts or shortening useful lives reduces earnings: conservative choices.","d":2,"t":"Aggressive accounting","c":"Aggressive accounting: choices that increase current-period earnings or assets (early revenue recognition, capitalizing expenses, lengthening depreciable lives, understated provisions)."},{"r":10,"q":"In the fraud triangle, weak internal controls and an ineffective board most likely represent:","o":["Motivation","Rationalization","Opportunity"],"a":2,"e":"The fraud triangle comprises motivation (pressure, incentives), opportunity (weak controls, poor governance) and rationalization (internal justification). Weak internal controls create opportunity.","d":2,"t":"Fraud triangle","c":"Fraud triangle: motivation/pressure, opportunity (weak internal controls, ineffective governance) and rationalization (self-justification by the perpetrator)."},{"r":10,"q":"A company's accounts receivable are growing much faster than revenue, and days sales outstanding have risen sharply near the end of each quarter. This is most likely a warning sign of:","o":["Conservative revenue recognition","Overstatement of inventory obsolescence","Aggressive revenue recognition such as channel stuffing"],"a":2,"e":"Receivables growing faster than revenue and DSO rising at quarter-end suggest accelerated or forced sales (channel stuffing). This is not a sign of conservatism, and it has nothing to do with inventory write-downs.","d":2,"t":"Revenue recognition red flag","c":"Revenue warning signs: receivables growing faster than sales, rising DSO, sales spikes at quarter-end, bill-and-hold sales or channel stuffing."},{"r":10,"q":"A company's net operating assets were 800 at the beginning of the year and 1,000 at the end. Its balance-sheet-based aggregate accruals ratio is closest to:","o":["20.0%","25.0%","22.2%"],"a":2,"e":"Balance-sheet accruals ratio = (ending NOA - beginning NOA) / average NOA = 200 / 900 = 22.2%. 20.0% divides by ending NOA and 25.0% by beginning NOA. A high ratio signals a large accrual component, hence lower quality.","d":3,"t":"Accruals ratio","c":"Balance-sheet aggregate accruals ratio = (ending NOA - beginning NOA) / ((ending NOA + beginning NOA) / 2), where NOA = net operating assets. The higher the ratio, the larger the accrual component and the lower the earnings quality."},{"r":10,"q":"When a US public company presents a non-GAAP financial measure, SEC rules require that the company:","o":["Have the non-GAAP measure audited","Reconcile it to the most directly comparable GAAP measure and present the GAAP measure with equal or greater prominence","Present only non-GAAP measures that increase reported earnings"],"a":1,"e":"The SEC requires the non-GAAP measure to be reconciled to the most directly comparable GAAP measure, with the GAAP measure presented at least as prominently. Non-GAAP measures are not audited, and no rule limits the direction of their effect.","d":2,"t":"Non-GAAP measures","c":"Non-GAAP measures (SEC): present the most directly comparable GAAP measure with equal or greater prominence and provide a reconciliation between the two. IFRS: MPMs/APMs with a similar reconciliation."},{"r":10,"q":"Which of the following changes would most likely increase a company's reported earnings in the current period?","o":["Lengthening the estimated useful lives of depreciable assets","Increasing the allowance for doubtful accounts","Switching from FIFO to LIFO when prices are rising"],"a":0,"e":"Lengthening useful lives reduces depreciation expense and increases earnings. Increasing the allowance for doubtful accounts reduces earnings, as does switching to LIFO when prices are rising (higher COGS).","d":3,"t":"Earnings management via estimates","c":"Changes in estimates that increase earnings: lengthening useful lives, raising residual values, lowering provisions (doubtful accounts, warranties), raising the expected return on pension plan assets (US GAAP)."},{"r":10,"q":"A company classifies certain recurring operating costs as capital expenditures. Compared with proper classification, its operating cash flow is most likely:","o":["Overstated","Understated","Unaffected"],"a":0,"e":"By capitalizing operating costs, the cash outflow moves from operating to investing cash flows: CFO is overstated. Total cash does not change, but the split between activities is distorted.","d":2,"t":"Cash flow manipulation","c":"Capitalizing operating costs shifts the cash outflow from CFO to CFI: CFO is inflated, true FCF is unchanged, and earnings are temporarily higher."},{"r":11,"q":"A company has a net profit margin of 8%, total asset turnover of 1.5 and a financial leverage (equity multiplier) of 2.0. Its return on equity is closest to:","o":["24.0%","12.0%","16.0%"],"a":0,"e":"DuPont: ROE = 8% x 1.5 x 2.0 = 24.0%. 12.0% is ROA (without leverage) and 16.0% omits asset turnover.","d":2,"t":"DuPont (3-step)","c":"Three-factor DuPont: ROE = net profit margin x total asset turnover x financial leverage (equity multiplier = average assets / average equity)."},{"r":11,"q":"A company has a tax burden of 0.75, an interest burden of 0.80, an EBIT margin of 12%, total asset turnover of 1.25 and financial leverage of 1.8. Its ROE is closest to:","o":["20.2%","9.0%","16.2%"],"a":2,"e":"ROE = 0.75 x 0.80 x 12% x 1.25 x 1.8 = 16.2%. 20.2% omits the interest burden and 9.0% omits financial leverage (it is ROA).","d":3,"t":"DuPont (5-step)","c":"Five-factor DuPont: ROE = tax burden (NI/EBT) x interest burden (EBT/EBIT) x EBIT margin x total asset turnover x financial leverage."},{"r":11,"q":"A company has days of sales outstanding of 45, days of inventory on hand of 60 and days of payables of 30. Its cash conversion cycle is closest to:","o":["135 days","75 days","15 days"],"a":1,"e":"Cash conversion cycle = DSO + DOH - DPO = 45 + 60 - 30 = 75 days. 135 days adds payables days instead of subtracting them, and 15 days does not correspond to any relevant formula.","d":2,"t":"Cash conversion cycle","c":"Cash conversion cycle = DSO + DOH - DPO."},{"r":11,"q":"A company has total debt of 400 and total shareholders' equity of 600. Its debt-to-capital ratio is closest to:","o":["66.7%","40.0%","60.0%"],"a":1,"e":"Debt-to-capital = 400 / (400 + 600) = 40.0%. 66.7% is the debt-to-equity ratio and 60.0% is equity's share of capital.","d":1,"t":"Debt-to-capital","c":"Debt-to-capital = total debt / (total debt + total shareholders' equity). Distinct from debt-to-equity."},{"r":11,"q":"Which of the following is classified as an activity ratio?","o":["Quick ratio","Interest coverage","Fixed asset turnover"],"a":2,"e":"Activity ratios measure how efficiently assets are used (inventory, receivables and fixed asset turnover). The quick ratio is a liquidity ratio and interest coverage is a solvency ratio.","d":1,"t":"Ratio categories","c":"Ratio categories: activity (turnover, DSO, DOH), liquidity (current, quick, cash), solvency (debt-to-capital, coverage), profitability (margins, ROA, ROE), valuation (P/E, P/B)."},{"r":11,"q":"A company reports revenue of 7,300. Accounts receivable were 900 at the beginning of the year and 1,100 at the end. Using a 365-day year, days of sales outstanding are closest to:","o":["50.0 days","55.0 days","45.0 days"],"a":0,"e":"Average receivables = 1,000; turnover = 7,300 / 1,000 = 7.3; DSO = 365 / 7.3 = 50.0 days. 55.0 days uses ending receivables and 45.0 days uses beginning receivables instead of the average.","d":2,"t":"Days sales outstanding","c":"Receivables turnover = revenue / average receivables; DSO = 365 / receivables turnover (or average receivables / daily sales)."},{"r":11,"q":"A company's ROE increased from 12% to 15%, while its net profit margin and total asset turnover were unchanged. The increase is most likely explained by:","o":["Improved operating efficiency","A lower effective tax rate","Higher financial leverage, for example a debt-financed share repurchase"],"a":2,"e":"Under DuPont, if net profit margin and asset turnover are unchanged, only a higher equity multiplier can raise ROE. Better efficiency would raise turnover, and a lower tax rate would raise the net profit margin.","d":3,"t":"DuPont interpretation","c":"DuPont: if net profit margin and asset turnover are stable, an increase in ROE comes from financial leverage (equity multiplier), and thus from higher financial risk.
