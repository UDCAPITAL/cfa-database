s, superiors, incentives) and a short-term focus. Situational influences are often underestimated."},{"r":1,"q":"Lena Marsh, a portfolio manager, is convinced she is more honest than most of her colleagues and therefore rarely questions her own trading decisions. A few weeks before year-end, she executes trades that push her fund just above its bonus threshold without considering whether they serve investors. Marsh's behavior is most likely explained by:","o":["the legal standard being stricter than the ethical standard","overconfidence bias combined with situational influences","the ethical decision-making framework applied correctly"],"a":1,"e":"Marsh overestimates her own moral character (overconfidence bias) and gives in to a situational influence (the year-end bonus threshold). Nothing suggests that the law is stricter than ethics (A), and she clearly did not apply the ethical decision-making framework (C), since she did not consider the investors' interests.","d":2,"t":"Overconfidence and situational influences","c":"Overconfidence in one's own integrity leads to no longer questioning one's decisions and to underestimating the weight of situational influences. Believing oneself more ethical than others is a risk factor, not a protection."},{"r":1,"q":"Which of the following is least likely a characteristic of a profession?","o":["Members commit to serving clients' interests and to a code of conduct","Members are guaranteed a minimum level of income by the professional body","Members are expected to maintain and develop specialized knowledge"],"a":1,"e":"A profession is characterized notably by a commitment to clients' interests, a code of conduct and the requirement to maintain specialized knowledge (A and C). A professional body in no way guarantees its members a minimum income.","d":1,"t":"Characteristics of a profession","c":"A profession is characterized by a specialized body of knowledge, admission criteria, standards of conduct and their enforcement, a commitment to serve clients beyond self-interest, and continuing education. Profit-seeking or the size of the industry are not criteria."},{"r":1,"q":"Which of the following statements about the relationship between law and ethics is most accurate?","o":["An action that is legal is, by definition, ethical","Laws always change faster than ethical expectations in financial markets","Ethical conduct may require more than the law requires, and some legal actions may be unethical"],"a":2,"e":"Law and ethics overlap but do not coincide: some legal acts are unethical, and ethics often requires more than the law. A is wrong for this reason; C is wrong because laws generally evolve reactively, often more slowly than ethical expectations.","d":2,"t":"Ethics vs. law","c":"Law and ethics do not fully overlap: a legal act can be unethical and an illegal act can be ethical. The law generally sets a minimum; ethics often requires more."},{"r":1,"q":"In the ethical decision-making framework presented in the curriculum, which phase comes first?","o":["Identify","Consider","Act"],"a":0,"e":"The ethical decision-making framework has four phases: Identify (facts, stakeholders, duties, conflicts), Consider, Act, then Reflect. The Consider phase (B) and the Act phase (C) come after identification.","d":1,"t":"Ethical decision-making framework","c":"The ethical decision-making framework follows four steps: identify (facts, stakeholders, duties, principles, conflicts), consider (situational influences, guidance, alternatives), act, then reflect on the decision made."},{"r":1,"q":"Rafael Ortiz faces a difficult situation involving a client and his firm. He has already listed the relevant facts and stakeholders. He now evaluates which situational influences may bias him and decides to seek advice from his firm's compliance officer and a trusted mentor. Within the ethical decision-making framework, these steps are most likely part of which phase?","o":["Identify","Consider","Reflect"],"a":1,"e":"The Consider phase includes analyzing situational influences, seeking additional guidance (compliance, mentor) and evaluating the options. Identification (A) covers the facts, stakeholders and duties, already done here; reflection (C) comes after the action, to evaluate its outcome.","d":3,"t":"Ethical decision-making framework","c":"After identifying the facts and stakeholders, one considers situational influences, seeks advice and evaluates possible actions before deciding and acting, then draws lessons from the decision."},{"r":1,"q":"Why is ethical conduct particularly important for trust in the investment profession?","o":["Clients usually have less information and expertise than investment professionals and must rely on them","Ethical conduct eliminates the need for regulation of financial markets","Investment professionals are legally required to guarantee client returns"],"a":0,"e":"The asymmetry of information and expertise between clients and professionals makes trust essential: clients must rely on professionals. Ethics does not eliminate the need for regulation (B), and no professional is required to guarantee returns (C).","d":2,"t":"Trust in the investment profession","c":"The financial industry rests on trust: clients entrust their assets to professionals whose work they cannot easily verify (information asymmetry). Ethical behavior supports market efficiency, investor participation and efficient capital allocation."},{"r":2,"q":"Which of the following is not one of the principles of the CFA Institute Code of Ethics?","o":["Act with integrity, competence, diligence, respect, and in an ethical manner","Achieve the highest possible returns for clients regardless of risk","Maintain and improve professional competence and strive to maintain and improve the competence of others"],"a":1,"e":"The Code requires, among other things, acting with integrity and competence (A) and maintaining and improving professional competence (C). It never requires maximizing returns regardless of risk, which would in fact contradict the duties of prudence and suitability.","d":1,"t":"Code of Ethics","c":"The Code of Ethics has six principles: act with integrity and competence; place the integrity of the profession and clients' interests above one's own; use reasonable care and independent judgment; act professionally and encourage others to do so; promote the integrity of capital markets; maintain and improve professional competence."},{"r":2,"q":"Which of the following is not one of the seven categories of the Standards of Professional Conduct?","o":["Duties to Employers","Conflicts of Interest","Duties to Regulators"],"a":2,"e":"The seven categories are: I Professionalism, II Integrity of Capital Markets, III Duties to Clients, IV Duties to Employers, V Investment Analysis, Recommendations, and Actions, VI Conflicts of Interest, VII Responsibilities as a CFA Institute Member or CFA Candidate. There is no Duties to Regulators category.","d":1,"t":"Standards of Professional Conduct structure","c":"The Standards of Professional Conduct are organized into seven categories: I Professionalism, II Integrity of Capital Markets, III Duties to Clients, IV Duties to Employers, V Investment Analysis, Recommendations, and Actions, VI Conflicts of Interest, VII Responsibilities as a CFA Institute Member or CFA Candidate."},{"r":2,"q":"According to the Code of Ethics, members and candidates must place which of the following above their own personal interests?","o":["The integrity of the investment profession and the interests of clients","The interests of their employer's shareholders","The recommendations of their regulators"],"a":0,"e":"The Code requires placing the integrity of the investment profession and the interests of clients above one's own personal interests. The employer's shareholders (B) and regulators (C) are not part of this principle.","d":1,"t":"Code of Ethics","c":"The Code of Ethics requires placing the integrity of the profession and the interests of clients above one's personal interests."},{"r":2,"q":"Which of the following is least likely to cause the CFA Institute Professional Conduct staff to open an inquiry into a member's conduct?","o":["A self-disclosure on the member's annual Professional Conduct Statement","A written complaint from a client","Below-benchmark performance of the member's managed portfolios"],"a":2,"e":"An investigation can be triggered by self-disclosure on the annual Professional Conduct Statement (A), a written complaint (B), public/media information or an exam proctor's report. Underperformance relative to the index is not in itself an ethical violation.","d":2,"t":"Professional Conduct Program","c":"The Professional Conduct Program may open an investigation based on self-disclosure on the annual Professional Conduct Statement, written complaints, public information (media) or a report by exam proctors. A mere difference of opinion is not grounds for one."},{"r":2,"q":"After an investigation, the CFA Institute Professional Conduct staff concludes that a member violated the Code and Standards and proposes a sanction. The member rejects the proposed sanction. The matter is most likely then:","o":["closed automatically without sanction","referred to a hearing panel of the Disciplinary Review Committee","referred directly to the member's national regulator for prosecution"],"a":1,"e":"If the member rejects the proposed sanction, the matter is referred to a hearing panel composed of members of the Disciplinary Review Committee, which decides whether a violation occurred and what sanction to apply. The case is not closed automatically (A), and CFA Institute does not prosecute through a regulator (C).","d":3,"t":"Professional Conduct Program","c":"When Professional Conduct staff propose a sanction, the member may accept or reject it; if rejected, the matter is referred to a hearing panel of the Disciplinary Review Committee."},{"r":2,"q":"Following an inquiry, CFA Institute Professional Conduct staff may least likely:","o":["conclude that no disciplinary sanction is appropriate","issue a cautionary letter","impose a fine and a prison sentence on the member"],"a":2,"e":"Following an investigation, staff may conclude that no disciplinary sanction is appropriate (A), issue a cautionary letter (B) or continue disciplinary proceedings (censure, suspension, revocation). CFA Institute has no criminal authority and cannot impose a prison sentence.","d":2,"t":"Professional Conduct Program","c":"Following an investigation, Professional Conduct staff may conclude that no sanction is warranted, issue a cautionary letter, or propose a sanction (censure, suspension, revocation). They cannot impose criminal fines or prison sentences."},{"r":2,"q":"Which of the following is a principle of the CFA Institute Code of Ethics?","o":["Promote the integrity and viability of the global capital markets for the ultimate benefit of society","Ensure that all clients receive identical investment returns","Avoid any investment that has generated a loss in the past"],"a":0,"e":"The Code requires promoting the integrity and viability of the global capital markets for the ultimate benefit of society. Guaranteeing identical returns (B) is impossible and not required (Standard III(B) requires fair, not identical, treatment); C has no basis.","d":2,"t":"Code of Ethics","c":"The principles of the Code of Ethics cover integrity, competence, diligence, respect, the primacy of clients' interests, independent judgment, the integrity of capital markets and the maintenance of professional competence."},{"r":2,"q":"Kenji Sato registered for the Level I CFA exam last month and has not yet sat for it. He works in client services at a brokerage firm. Is Sato required to comply with the CFA Institute Code and Standards?","o":["No, only CFA charterholders are bound by the Code and Standards","No, candidates are bound only after passing Level I","Yes, CFA candidates are required to comply with the Code and Standards"],"a":2,"e":"CFA Program candidates are required to comply with the Code and Standards as soon as they register for the exam. A is wrong because members and candidates (not only charterholders) are covered; B is wrong because no prior exam pass is required.","d":2,"t":"Applicability of the Code and Standards","c":"The Code and Standards apply to CFA Institute members and to CFA Program candidates from the moment they register for an exam, whether or not they have already sat it."},{"r":3,"q":"Amélie Kraus, CFA, works in Country X, whose securities laws are less strict than the CFA Institute Code and Standards. Her clients reside in Country Y, whose laws are also less strict than the Code and Standards. Under Standard I(A), Kraus should comply with:","o":["the laws of Country X","the Code and Standards","the laws of Country Y"],"a":1,"e":"Under Standard I(A) Knowledge of the Law, the member must follow the stricter of applicable law and the Code and Standards. Since both laws are less strict, the Code and Standards apply; A and C would lead to a lower standard.","d":1,"t":"I(A) Knowledge of the Law","c":"Standard I(A): follow the stricter of applicable law and the Code and Standards. If the law is less demanding, the Code and Standards prevail; if it is stricter, the law applies."},{"r":3,"q":"Darius Petrov, CFA, discovers that a colleague has been misrepresenting fees to clients. He reports it to his supervisor, who takes no action, and the practice continues. According to Standard I(A), which action is Petrov most clearly required to take?","o":["Report the colleague immediately to the national securities regulator","Report the colleague to CFA Institute","Dissociate from the activity, which may include refusing to participate and, if necessary, resigning"],"a":2,"e":"Standard I(A) requires not knowingly participating in a violation and dissociating from it if internal escalation fails (refusing to participate, or even resigning). Reporting to the regulator (A) or to CFA Institute (B) may be appropriate or encouraged but is not required by the Standard.","d":3,"t":"I(A) Knowledge of the Law - dissociation","c":"Standard I(A): a member must not knowingly participate or assist in a violation. If a violation is observed, the member reports it to a supervisor or compliance and, if it continues, must dissociate from it (if necessary by leaving the position); reporting to authorities is encouraged but not mandatory."},{"r":3,"q":"Sofia Lind, a CFA candidate and equity analyst, is invited by a mining company she covers to visit its remote mine. The company offers to pay for a first-class flight and a week at a luxury resort near the site, even though the site visit takes one day. Commercial flights to the region are available. Lind accepts. Did she most likely violate Standard I(B) Independence and Objectivity?","o":["Yes","No, because site visits are necessary for thorough research","No, as long as she discloses the trip in her report"],"a":0,"e":"Under Standard I(B), the analyst should generally pay for his or her own travel when commercial flights are available and decline lavish benefits that could compromise objectivity. The site visit may be legitimate (B) but not the luxury stay; mere disclosure (C) does not cure the impairment of independence.","d":2,"t":"I(B) Independence and Objectivity","c":"Standard I(B): avoid any gift or benefit that could compromise independence and objectivity. On issuer visits, the analyst should generally pay for his or her own travel and lodging (commercial flights), unless transportation is limited."},{"r":3,"q":"A research firm is hired by a small listed company to write issuer-paid research. Which compensation arrangement is most consistent with Standard I(B) Independence and Objectivity?","o":["A fee that increases if the report includes a buy recommendation","A flat fee agreed in advance, regardless of the report's conclusions, with the arrangement disclosed","Payment in shares of the issuer, received after the report is published"],"a":1,"e":"For issuer-paid research, Standard I(B) recommends a flat fee agreed in advance and independent of the conclusions, together with disclosure of the arrangement. Compensation tied to the recommendation (A) or paid in the issuer's shares (C) creates a conflict that compromises objectivity.","d":2,"t":"I(B) Issuer-paid research","c":"Standard I(B): for issuer-paid research, compensation must be a flat fee agreed in advance, not linked to the conclusion or recommendation, and this funding arrangement must be disclosed."},{"r":3,"q":"Which of the following actions by an analyst is least likely a violation of Standard I(C) Misrepresentation?","o":["Including in a report several paragraphs from another firm's research without attribution","Using GDP and inflation statistics from a recognized government statistical agency without citing the source","Presenting a colleague's valuation model as her own work"],"a":1,"e":"Standard I(C) prohibits plagiarism (A, C), but allows factual information published by recognized statistical sources to be used without citation. Reusing someone else's research or model without attribution is a misrepresentation.","d":3,"t":"I(C) Misrepresentation - plagiarism","c":"Standard I(C): misrepresentation and plagiarism are prohibited. Facts or statistics from recognized sources (e.g., government statistics) may be used without citation, but any work of others that is reused must be attributed to its author."},{"r":3,"q":"Tomasz Wolny, CFA, tells a prospective client that a high-yield bond fund will 'certainly return at least 6% per year, guaranteed.' The fund has no guarantee structure. Wolny has most likely violated:","o":["Standard I(C) Misrepresentation","Standard VI(A) Disclosure of Conflicts","Standard IV(A) Loyalty"],"a":0,"e":"Guaranteeing a return on an inherently risky investment with no guarantee mechanism is a misrepresentation under Standard I(C). No conflict of interest is involved (B), nor any breach of duty to the employer (C).","d":1,"t":"I(C) Misrepresentation - guarantees","c":"Standard I(C): it is prohibited to guarantee the performance of an investment that is inherently uncertain. Only instruments that are actually guaranteed (e.g., insured deposits, bonds with a contractual guarantee) may be presented as such."},{"r":3,"q":"Hannah Brooks, CFA, is arrested for disorderly conduct after a weekend party. The incident is unrelated to her work, and she has no history of such behavior. Has Brooks most likely violated Standard I(D) Misconduct?","o":["Yes, because any arrest violates Standard I(D)","No, because the conduct does not reflect adversely on her professional reputation, integrity, or competence","Yes, because she failed to report the arrest to her clients"],"a":1,"e":"Standard I(D) covers dishonesty, fraud, deceit or any act that reflects adversely on professional reputation, integrity or competence. An isolated incident of personal behavior unrelated to honesty generally does not constitute a violation; there is no obligation to inform clients.","d":2,"t":"I(D) Misconduct","c":"Standard I(D): any conduct involving dishonesty, fraud or deceit, or that reflects adversely on professional reputation, integrity or competence, is prohibited. An isolated lapse in personal behavior unrelated to honesty or work is generally not a violation."},{"r":3,"q":"Which situation most likely represents a violation of Standard I(D) Misconduct?","o":["A member declares personal bankruptcy after a business failure, without any fraud","A member regularly submits false expense claims to her employer for personal meals","A member publicly criticizes a government policy at a rally"],"a":1,"e":"Falsified expense reports involve dishonesty and fraud, covered by Standard I(D). A personal bankruptcy without fraud (A) is not in itself a violation, and expressing a political opinion (C) does not affect professional integrity.","d":1,"t":"I(D) Misconduct","c":"Standard I(D) Misconduct covers acts of dishonesty, fraud or deceit, as well as behavior that calls professional competence into question (e.g., regularly coming to work intoxicated), not private life unrelated to professional activity."},{"r":4,"q":"While waiting for an elevator, analyst Marco Bellini overhears the CFO of a listed company telling a colleague that the firm will announce a takeover of a competitor next week. Bellini buys shares of the competitor for his clients. Bellini has most likely violated:","o":["Standard II(B) Market Manipulation","Standard III(B) Fair Dealing","Standard II(A) Material Nonpublic Information"],"a":2,"e":"The information is material (likely to affect the price) and nonpublic; acting on it violates Standard II(A). This is not market manipulation (A), and the issue is not fairness among clients (B).","d":1,"t":"II(A) Material Nonpublic Information","c":"Standard II(A): anyone who possesses material nonpublic information must not act or cause others to act on it, regardless of how it was obtained (even if overheard by chance)."},{"r":4,"q":"Analyst Grace Okafor combines public financial statements, interviews with the company's suppliers (who share no confidential information), and her own channel checks. She concludes the company will miss earnings and issues a sell recommendation. Has Okafor violated Standard II(A)?","o":["No, her conclusion is based on the mosaic theory","Yes, because her conclusion is material and not yet public","Yes, unless she first discloses her conclusion to the company"],"a":0,"e":"Under the mosaic theory, combining public information and nonmaterial nonpublic information to reach a material conclusion does not violate Standard II(A). The analyst's conclusion is not inside information (B), and there is no obligation to communicate it to the company (C).","d":2,"t":"II(A) Mosaic theory","c":"Mosaic theory: an analyst may base a recommendation on a combination of public information and nonmaterial nonpublic information, even if the resulting conclusion would be material if disclosed."},{"r":4,"q":"A firm has both an investment banking department and a research department. Which measure is most appropriate to prevent the misuse of material nonpublic information?","o":["Allowing research analysts to attend investment banking deal meetings","Establishing information barriers (firewalls) between the departments","Requiring analysts to trade only after the banking department's approval"],"a":1,"e":"Information barriers (firewalls), supplemented by watch and restricted lists, are the recommended practice under Standard II(A). Having analysts attend deal meetings (A) would facilitate the flow of inside information, and approval by the investment banking department (C) is not adequate separation.","d":2,"t":"II(A) Information barriers","c":"Standard II(A): firms must establish information barriers (firewalls) between departments holding inside information (investment banking) and research/trading, with control of communications, watch lists and restricted lists."},{"r":4,"q":"Which of the following pieces of information is least likely to be considered material nonpublic information?","o":["An unverified rumor posted by an anonymous user on a social media forum","Advance knowledge of a company's unannounced dividend cut","A confidential draft of a regulatory decision rejecting a company's key drug"],"a":0,"e":"Information is material if it is likely to affect the price or if a reasonable investor would consider it important; the reliability of the source matters. An anonymous, unverifiable rumor is unlikely to be material, whereas B and C are specific, reliable, nonpublic and price-moving.","d":2,"t":"II(A) Materiality","c":"Information is material if its disclosure is likely to affect the price or if a reasonable investor would want to know it before deciding; it is nonpublic until it has been disseminated to the market. The more reliable the source and the more specific the information, the more material it is."},{"r":4,"q":"Portfolio manager Ivan Kohl holds a large position in a small-cap stock. He posts several false messages on investor forums claiming the company is about to win a major government contract, then sells his shares after the price rises. Kohl has most likely violated:","o":["Standard II(A) Material Nonpublic Information","Standard II(B) Market Manipulation","Standard III(C) Suitability"],"a":1,"e":"Spreading false information to push up a stock price and then selling (pump and dump) is information-based manipulation, covered by Standard II(B). He holds no actual inside information (A), and client suitability (C) is not at issue.","d":1,"t":"II(B) Market Manipulation","c":"Standard II(B): information-based manipulation (spreading rumors or false information to influence prices) is prohibited."},{"r":4,"q":"On the last trading day of each quarter, fund manager Clara Voss places large buy orders in thinly traded stocks already held by her fund in the final minutes of trading, to raise the closing prices used to value the fund. Voss has most likely:","o":["not violated the Standards, because she trades in her fund's best interest","violated Standard II(B) Market Manipulation","violated only Standard V(C) Record Retention"],"a":1,"e":"'Marking the close' aims to artificially distort prices and the fund's valuation, which is transaction-based manipulation (Standard II(B)). It does not serve investors' real interests (A) and has nothing to do with record retention (C).","d":2,"t":"II(B) Market Manipulation - transaction-based","c":"Standard II(B): transaction-based manipulation is prohibited, notably artificially creating volume or pushing up prices (e.g., 'marking the close' at period end to inflate portfolio value). Legitimate purposes (hedging, tax optimization) are not covered."},{"r":4,"q":"During a private call, the CFO of a company tells analyst Priya Nair that quarterly earnings will be well below consensus; the information has not been released. Which action by Nair is most appropriate under Standard II(A)?","o":["Trade immediately before other analysts learn the information","Share the information only with her firm's largest clients","Refrain from acting on the information and encourage the company to make it public"],"a":2,"e":"When faced with material nonpublic information, Standard II(A) requires not acting on it or passing it on, and recommends encouraging the issuer to disclose it publicly. Trading (A) or informing certain clients (B) would be violations, B also being a breach of the duty of fair dealing.","d":3,"t":"II(A) Selective disclosure","c":"Standard II(A): inside information selectively disclosed by an executive must not be used as a basis for trading. The analyst must refrain from acting and encourage the issuer to make the information public."},{"r":4,"q":"An independent analyst uses only public data and her own expertise to conclude that a company is a likely takeover target. She buys the stock for clients before any announcement. Which statement is most accurate?","o":["She has not violated Standard II(A), because her conclusion results from her own analysis","She has violated Standard II(A), because takeover information is always material","She has violated Standard II(B), because her purchases may move the price"],"a":0,"e":"A conclusion derived from one's own analysis of public information is not inside information; Standard II(A) is therefore not violated. Buyback information is covered only if it comes from a nonpublic source (B), and legitimate purchases that move prices are not manipulation (C).","d":3,"t":"II(A) Own analysis","c":"Standard II(A): a conclusion drawn solely from public information and one's own analysis is not inside information; one may act on it, even if it proves correct."},{"r":5,"q":"Portfolio manager Leo Fischer uses client brokerage commissions (soft dollars) to pay for his firm's office rent. Fischer has most likely violated:","o":["Standard III(A) Loyalty, Prudence, and Care","Standard III(D) Performance Presentation","Standard II(B) Market Manipulation"],"a":0,"e":"Brokerage commissions belong to the client and may only pay for goods or services (notably research) that benefit the client; paying the rent violates Standard III(A). This is neither a performance presentation issue (B) nor market manipulation (C).","d":1,"t":"III(A) Soft commissions","c":"Standard III(A): brokerage commissions belong to the client. Soft dollars may only pay for research services that directly benefit clients (client brokerage), not the firm's overhead such as rent."},{"r":5,"q":"Regarding proxy voting, which statement is most consistent with Standard III(A) Loyalty, Prudence, and Care?","o":["Managers must vote every proxy regardless of cost","Managers should always vote with company management","A cost-benefit analysis may show that not voting certain proxies is in the client's best interest"],"a":2,"e":"Proxy voting is part of the duty of loyalty, but a cost-benefit analysis may justify not voting on certain resolutions. It is not mandatory to vote on everything (A), nor to follow management (B): votes must serve clients' interests, and the proxy voting policy must be disclosed.","d":2,"t":"III(A) Proxy voting","c":"Standard III(A): voting rights attached to securities are a client asset; the manager must vote in clients' best interests, under written policies. A cost-benefit analysis may justify not voting on every issue."},{"r":5,"q":"Nadia Haddad, CFA, manages accounts for several clients, including a fee-paying account for her brother that is managed under the same strategy and fee schedule as other clients. Her firm receives a limited allocation of an oversubscribed IPO suitable for all these accounts. To avoid any appearance of favoritism, Haddad excludes her brother's account from the allocation. Has she most likely violated Standard III(B) Fair Dealing?","o":["No, excluding family accounts is required by Standard VI(B)","Yes, because the brother's account should be treated like any other client account","No, because family members are not considered clients"],"a":1,"e":"A family account charged the same fees as other clients must be treated like any regular client account; excluding it disadvantages it, contrary to Standard III(B). Standard VI(B) applies only to accounts in which the member has beneficial ownership (A), and the brother is indeed a client here (C).","d":3,"t":"III(B) Fair Dealing - family accounts","c":"Standard III(B): all clients must be treated fairly. Family accounts that are fee-paying clients like any others must be treated like other clients, neither favored nor disadvantaged."},{"r":5,"q":"An investment firm offers a premium service with more frequent portfolio reviews to clients who pay a higher fee. Is this consistent with Standard III(B) Fair Dealing?","o":["Yes, if the different service levels are disclosed and available to all clients willing to pay","No, all clients must receive identical service","No, because premium services discriminate against smaller clients"],"a":0,"e":"Standard III(B) requires fair, not identical, treatment: differentiated service levels are acceptable if they are disclosed and available to all, and do not disadvantage other clients. B and C confuse fairness with strict equality.","d":2,"t":"III(B) Fair Dealing - service levels","c":"Standard III(B): different (premium) service levels based on fees may be offered, provided they are disclosed and made available to all clients; what is prohibited is disadvantaging a client in the dissemination of recommendations or the allocation of trades."},{"r":5,"q":"Elena Rossi's conservative, income-oriented client calls and asks her to buy a speculative biotech stock. The purchase would represent about 25% of the portfolio and is clearly inconsistent with the IPS. Under Standard III(C) Suitability, Rossi should most appropriately:","o":["execute the trade without comment, because it was unsolicited","refuse to accept any further instructions from the client","discuss the inconsistency with the client and either update the IPS or obtain the client's acknowledgment before proceeding"],"a":2,"e":"For an unsolicited order with a significant impact on the portfolio, Standard III(C) requires explaining its inconsistency with the IPS; the IPS must then be updated or the client's acknowledgment obtained (possibly handling the account separately). Executing without comment (A) ignores the suitability duty, and refusing all instructions (B) is excessive.","d":3,"t":"III(C) Suitability - unsolicited trades","c":"Standard III(C): for an unsuitable unsolicited order, the adviser must first discuss it with the client. If the impact is minor, the adviser may execute it after obtaining written acknowledgment that it is unsuitable; if significant, the IPS must be updated or refusing the trade considered."},{"r":5,"q":"Under Standard III(C) Suitability, how often should a client's investment policy statement (IPS) be reviewed, at a minimum?","o":["Only when the client requests it","At least annually and when the client's circumstances change materially","Every five years"],"a":1,"e":"Standard III(C) recommends reviewing the IPS at least annually and whenever the client's circumstances change materially. Waiting for the client's request (A) or five years (C) does not ensure the ongoing suitability of investments.","d":1,"t":"III(C) Suitability - IPS review","c":"Standard III(C): the IPS must be reviewed at least annually and whenever the client's circumstances change materially."},{"r":5,"q":"In marketing materials, a manager shows the performance of only the three best-performing accounts in a strategy and labels it 'strategy performance.' The manager has most likely violated:","o":["Standard III(E) Preservation of Confidentiality","Standard V(C) Record Retention","Standard III(D) Performance Presentation"],"a":2,"e":"Presenting only the best accounts as the strategy's performance (cherry-picking) is misleading and violates Standard III(D), which requires a fair, accurate and complete presentation. No confidential information is disclosed (A), and record retention (B) is not at issue.","d":1,"t":"III(D) Performance Presentation","c":"Standard III(D): performance presentations must be fair, accurate and complete. Selecting only the best accounts (cherry-picking) and presenting them as a strategy's performance is misleading."},{"r":5,"q":"Owen Clarke, CFA, receives a request from the CFA Institute Professional Conduct Program for information about a client's account as part of an investigation. The client has not given consent. If Clarke provides the information, has he most likely violated Standard III(E) Preservation of Confidentiality?","o":["Yes, because the client did not consent","No, because cooperating with a CFA Institute Professional Conduct investigation is not a violation","Yes, unless the information concerns illegal activities"],"a":1,"e":"Standard III(E) permits disclosing confidential information to CFA Institute's Professional Conduct Program, which keeps it confidential. Client consent (A) is therefore not required in this case, and the exception is not limited to illegal activities (C).","d":2,"t":"III(E) Preservation of Confidentiality","c":"Standard III(E): client information must be kept confidential, unless it concerns illegal activity, disclosure is required by law, or the client consents. Providing information to CFA Institute's Professional Conduct Program in an investigation is not a violation."},{"r":6,"q":"Before resigning to join a competitor, portfolio manager Ana Duarte calls her largest clients to tell them she is leaving and invites them to move their accounts to her new firm. Duarte has most likely violated:","o":["Standard IV(A) Loyalty","Standard III(B) Fair Dealing","No standard, because clients are free to choose their manager"],"a":0,"e":"While still employed, the member may not solicit the employer's clients on behalf of a future competitor: this violates Standard IV(A). Fairness among clients is not the issue (B), and clients' freedom of choice does not excuse soliciting them before leaving (C).","d":1,"t":"IV(A) Loyalty - leaving an employer","c":"Standard IV(A): before actually leaving, an employee must not solicit the employer's clients for a future competing business or take firm records. The employee may prepare to leave without harming the employer."},{"r":6,"q":"After leaving her firm without taking any records, analyst Mei Tan contacts former clients whose names she remembers and whose contact details she finds in a public directory. She has no non-solicitation agreement. Has Tan most likely violated Standard IV(A)?","o":["Yes, because all client information belongs to the former employer","No, because she relied on memory and public sources after leaving","Yes, because former clients may not be contacted for at least one year"],"a":1,"e":"After leaving, and absent a non-solicitation agreement, the member may contact former clients using memory and public sources; only the use of the former employer's records is prohibited. No one-year waiting period exists in the Standards (C).","d":2,"t":"IV(A) Loyalty - post-employment","c":"Standard IV(A): absent a non-compete or non-solicitation agreement, a former employee may contact former clients using memory or public sources, provided no records or files of the former employer are taken."},{"r":6,"q":"Javier Montes, CFA, discovers that his employer is systematically overcharging clients. After internal escalation fails, he reports the practice to the regulator, sharing confidential firm documents relevant to the overcharging. Which statement is most accurate?","o":["Montes violated Standard IV(A) because he disclosed confidential employer information","Montes violated Standard III(E) because client information was involved","Montes did not violate Standard IV(A), because whistleblowing to protect clients or market integrity is permitted"],"a":2,"e":"Standard IV(A) provides that the duty of loyalty to the employer does not extend to concealing illegal or unethical acts; whistleblowing to protect clients or market integrity is not a violation. Standard III(E) also permits disclosure in the case of illegal activity.","d":3,"t":"IV(A) Whistleblowing","c":"Standard IV(A): the duty of loyalty to the employer does not permit concealing practices that harm clients or markets. A whistleblower acting to protect clients or the integrity of the markets does not violate this standard."},{"r":6,"q":"An employed analyst wants to provide paid financial planning services to a few friends in the evenings. Under Standard IV(A), which action is required before starting?","o":["Notify her employer of the services, expected duration, and compensation, and obtain the employer's consent","Inform CFA Institute of the arrangement","No action is needed if the work is done outside office hours"],"a":0,"e":"For a competing independent practice, Standard IV(A) requires informing the employer of the nature of the services, their duration and the compensation, then obtaining consent before starting. CFA Institute need not be informed (B), and operating outside office hours changes nothing (C).","d":2,"t":"IV(A) Independent practice","c":"Standard IV(A): independent practice that could compete with the employer requires notifying the employer in writing (nature, compensation, duration) and obtaining consent before starting."},{"r":6,"q":"A wealthy client offers portfolio manager Zoe Grant a vacation package if her account beats its benchmark by more than 3% this year. Under Standard IV(B) Additional Compensation Arrangements, Grant should:","o":["accept the offer, because it comes from a client rather than an issuer","obtain written consent from her employer before accepting the arrangement","disclose the offer to all her other clients"],"a":1,"e":"Additional compensation contingent on future performance that may create a conflict of interest requires the employer's written consent (Standard IV(B)). The fact that the offer comes from a client (A) does not waive this requirement, and disclosure to other clients (C) is not what the Standard requires.","d":1,"t":"IV(B) Additional Compensation Arrangements","c":"Standard IV(B): any compensation or benefit that could conflict with the employer's interest, notably one tied to future performance, requires written consent from all parties involved (the employer) before being accepted."},{"r":6,"q":"After a successful year, a long-time client sends portfolio manager Ali Hassan a valuable watch as a thank-you for past performance. Which action is most appropriate?","o":["Refuse the gift, as all client gifts are prohibited","Accept the gift without informing anyone, as it relates to past performance","Disclose the gift to his employer"],"a":2,"e":"A gift from a client for past performance is generally acceptable, but it must be disclosed to the employer (Standards I(B) and IV(B)), since it may influence the attention given to that client. Not all client gifts are prohibited (A), and accepting them without disclosure (B) is not appropriate.","d":2,"t":"IV(B) Client gifts","c":"Gifts from a client for past performance are less likely to impair independence (Standard I(B)) but must be disclosed to the employer; benefits contingent on future performance fall under Standard IV(B) and require the employer's written consent."},{"r":6,"q":"Sarah Kim, CFA, is promoted to head of trading. She finds that the firm has no adequate compliance procedures to prevent front-running. Under Standard IV(C) Responsibilities of Supervisors, she should most appropriately:","o":["accept the role and rely on employees to follow the law","decline in writing to accept supervisory responsibility until the firm adopts reasonable procedures","resign immediately from the firm"],"a":1,"e":"Standard IV(C) provides that if the compliance system is inadequate, the supervisor must decline supervisory responsibility in writing until reasonable procedures are adopted. Simply relying on employees (A) is insufficient; immediate resignation (C) is not required.","d":3,"t":"IV(C) Responsibilities of Supervisors","c":"Standard IV(C): a supervisor must make reasonable efforts to prevent and detect violations. Without adequate compliance procedures, the supervisor must decline supervisory responsibility in writing until they are adopted."},{"r":6,"q":"A supervisor learns that one of her analysts may have traded ahead of client orders. The analyst assures her it will not happen again. Under Standard IV(C), the supervisor's most appropriate response is to:","o":["accept the assurance and take no further action","report the matter to CFA Institute and take no internal action","promptly investigate and limit the analyst's activities or increase monitoring during the investigation"],"a":2,"e":"Standard IV(C) requires a prompt response: investigate and restrict the employee's activities or increase monitoring during the investigation. Relying on the employee's promise (A) is insufficient, and reporting to CFA Institute without internal action (B) does not fulfill the supervisory duty.","d":2,"t":"IV(C) Responsibilities of Supervisors","c":"Standard IV(C): when faced with a potential violation, the supervisor must investigate promptly and take action (restrict activities, increase monitoring); relying on the employee's mere promise is not enough."},{"r":7,"q":"An analyst's research report states: 'XYZ's earnings will grow 20% next year.' The figure is the analyst's forecast. The analyst has most likely violated:","o":["Standard V(B) Communication with Clients and Prospective Clients","Standard V(C) Record Retention","Standard I(D) Misconduct"],"a":0,"e":"Standard V(B) requires clearly distinguishing facts from opinions; a forecast presented as fact violates this Standard. Nothing relates to record retention (B), and there is no clear dishonesty (C).","d":1,"t":"V(B) Fact vs. opinion","c":"Standard V(B): in reports and communications, facts must be clearly distinguished from opinions (forecasts, estimates)."},{"r":7,"q":"In the absence of regulatory guidance, CFA Institute recommends that records supporting investment recommendations be maintained for at least:","o":["three years","seven years","ten years"],"a":1,"e":"Standard V(C) Record Retention recommends, absent regulatory requirements, retaining records for at least seven years. Three years (A) and ten years (C) do not match CFA Institute's recommendation; local regulation prevails if it exists.","d":1,"t":"V(C) Record Retention","c":"Standard V(C): records supporting investment recommendations and actions must be retained; absent local rules, CFA Institute recommends at least seven years. Records belong to the employer."},{"r":7,"q":"Analyst Paolo Greco is joining a new firm. He wants to continue covering the companies he covered at his former employer. Which action is most consistent with Standard V(C)?","o":["Bring copies of his previous research files, since he created them","Recreate the supporting records at the new firm using public information and the companies' own disclosures","Rely on his memory of past conclusions without documentation"],"a":1,"e":"Research records belong to the employer; the member may not take them without permission and must recreate the supporting documentation from public sources or directly from the companies. A also violates Standard IV(A), and C does not meet the documentation requirement.","d":2,"t":"V(C) Record Retention - changing firms","c":"Standard V(C): research files belong to the employer and may not be taken without permission. At a new firm, the analyst must recreate the files from public sources or the new firm's resources."},{"r":7,"q":"Mia Larsen, CFA, recommends a fund of third-party managers to clients. She reviews each manager's investment process, controls, and track record before recommending them. Larsen's review is most consistent with which standard?","o":["Standard III(D) Performance Presentation","Standard VI(A) Disclosure of Conflicts","Standard V(A) Diligence and Reasonable Basis"],"a":2,"e":"Standard V(A) requires reasonable diligence and a reasonable basis, including when selecting external managers or using third-party research. Performance presentation (A) and conflict disclosure (B) do not describe this due diligence process.","d":2,"t":"V(A) Diligence - external managers","c":"Standard V(A): a reasonable and adequate basis requires due diligence on external managers and third-party research (process, controls, compliance, track record), with periodic review."},{"r":7,"q":"Felix Moreau, CFA, is part of a research team that publishes a buy recommendation he disagrees with. He believes the team followed a sound process and that the analysis has a reasonable basis. Which action is most appropriate?","o":["He may allow his name to remain on the report","He must have his name removed from the report","He must publish a separate dissenting report to clients"],"a":0,"e":"Under Standard V(A), a member who disagrees with a group recommendation need not dissociate from it if the process is sound and the recommendation has a reasonable basis; the member may leave his or her name on it (and may document the disagreement). Removing the name is not mandatory (B), nor is a dissenting report (C).","d":3,"t":"V(A) Group research","c":"Standard V(A): in group work, a member who disagrees with the group's conclusion may keep his or her name on the report if the process followed was reasonable and well-founded; the member is not required to dissociate from it."},{"r":7,"q":"A quantitative analyst builds a mortgage-security valuation model calibrated only on a period of continuously rising house prices, without testing scenarios of falling prices. Has she most likely violated Standard V(A) Diligence and Reasonable Basis?","o":["No, because quantitative models are exempt from Standard V(A)","No, as long as she discloses that she used a quantitative model","Yes, because she failed to test the model's assumptions under a reasonable range of scenarios"],"a":2,"e":"Standard V(A) requires understanding the assumptions of quantitative models and testing them over a reasonable range of scenarios, including adverse ones. Quantitative models are not exempt (A), and merely mentioning their use (B) does not replace diligence.","d":3,"t":"V(A) Quantitative models","c":"Standard V(A): quantitative models require understanding their assumptions and testing adverse scenarios (stress tests); calibrating a model on an overly favorable period shows a lack of diligence."},{"r":7,"q":"A wealth manager changes the investment process of a strategy from fundamental stock picking to a purely quantitative model. Under Standard V(B), the manager should most appropriately:","o":["promptly inform clients and prospective clients of the significant change in the investment process","inform clients only if performance deteriorates","make no disclosure, because the process is proprietary"],"a":0,"e":"Standard V(B) requires promptly communicating to clients the basic format and general principles of the investment process, as well as any significant changes to it. Waiting for performance to decline (B) or invoking its proprietary nature (C) does not waive this obligation.","d":2,"t":"V(B) Communication - process changes","c":"Standard V(B): clients must be informed promptly of the basic characteristics of the investment process and of any significant change to that process."},{"r":7,"q":"When presenting a new structured note to clients, an advisor describes its potential upside in detail but does not mention its significant credit and liquidity risks. The advisor has most likely violated:","o":["Standard II(B) Market Manipulation","Standard V(B) Communication with Clients and Prospective Clients","Standard IV(A) Loyalty"],"a":1,"e":"Standard V(B) requires communicating the significant factors and the material risks and limitations associated with an investment. This is not market manipulation (A), nor a breach of duty to the employer (C).","d":2,"t":"V(B) Communication - risks","c":"Standard V(B): the significant factors of the analysis and the main risks and limitations of an investment must be communicated, not just its upside potential."},{"r":8,"q":"Research analyst Erik Nilsson owns a significant number of shares in a company he covers. Under Standard VI(A) Disclosure of Conflicts, Nilsson should:","o":["sell the shares before writing any report","disclose his ownership in his research reports","stop covering the company permanently"],"a":1,"e":"Standard VI(A) requires full and clear disclosure of conflicts, such as owning shares of a covered company. Selling the shares (A) or dropping coverage (C) is not required by the Standard, even though the employer may impose restrictions.","d":1,"t":"VI(A) Disclosure of Conflicts","c":"Standard VI(A): any matter that could impair independence and objectivity, such as owning covered securities, must be disclosed fully, fairly, clearly and prominently to the employer, clients and prospective clients."},{"r":8,"q":"Portfolio manager Lucia Ferraro has been invited to join the board of directors of a listed company. Which action is most consistent with Standard VI(A)?","o":["Accept without disclosure, because board service is a personal activity","Disclose the board position to her employer and to clients who might be affected, and follow any employer restrictions","Accept only if she does not receive board fees"],"a":1,"e":"Serving on the board of a listed company creates potential conflicts (information, loyalty) that must be disclosed to the employer and affected clients under Standard VI(A). It is not a purely personal activity (A), and the absence of director fees (C) does not eliminate the conflict.","d":2,"t":"VI(A) Board service","c":"Standard VI(A): serving on a company's board of directors creates a conflict of interest that must be disclosed to the employer (with its approval) and to clients; the firm must manage the risk of access to inside information."},{"r":8,"q":"Under Standard VI(B) Priority of Transactions, what is the correct order of priority for transactions?","o":["Employer, clients, personal","Clients, personal, employer","Clients, employer, personal"],"a":2,"e":"Standard VI(B) requires that client and employer transactions take priority over those in which the member is a beneficial owner; the order is clients, employer, then personal account. A and B wrongly place the employer or the personal account ahead of clients.","d":1,"t":"VI(B) Priority of Transactions","c":"Standard VI(B): the priority order for transactions is clients, then employer, then the member. Client transactions must come first."},{"r":8,"q":"Rita Gomes, CFA, manages her own account and her spouse's account, in both of which she has a beneficial interest. She also manages client accounts. When she decides to buy a stock for all accounts, she should most appropriately:","o":["execute client orders before the trades in her own and her spouse's accounts","allocate the shares to her spouse's account first because it is managed like a client account","execute all orders simultaneously and allocate pro rata including her personal accounts"],"a":0,"e":"Accounts in which the member has beneficial ownership (including a spouse's account) are treated as personal accounts under Standard VI(B); client orders must go first. B and C would give the member's personal accounts equal or priority treatment, which is prohibited.","d":3,"t":"VI(B) Beneficial ownership","c":"Standard VI(B): accounts in which the member has a beneficial interest (personal, spouse, family) must not take precedence over clients; a family account that is a fee-paying client is treated like any other client."},{"r":8,"q":"Which of the following is most appropriate as a firm procedure to support compliance with Standard VI(B)?","o":["Allowing employees to participate freely in equity IPOs","Requiring preclearance of personal trades and imposing blackout periods around client trades","Requiring disclosure of personal holdings only at the end of employment"],"a":1,"e":"Procedures recommended under Standard VI(B) include preclearance of personal trades, blackout periods and restrictions on participation in IPOs and private placements. Free participation in IPOs (A) and delayed disclosure of holdings (C) are contrary to these recommendations.","d":2,"t":"VI(B) Personal trading procedures","c":"Recommended procedures under VI(B): blackout periods, restrictions on IPOs and private placements, preclearance of personal trades, reporting of holdings and duplicate brokerage statements."},{"r":8,"q":"Financial advisor Noah Becker receives a fee from a tax attorney for each client he refers. Under Standard VI(C) Referral Fees, Becker must disclose the arrangement to:","o":["his employer, clients, and prospective clients, before entering into any formal agreement for services","his employer only","the tax attorney's clients"],"a":0,"e":"Standard VI(C) requires disclosing to the employer, clients and prospective clients any compensation or benefit received or paid for a referral, before entering into a service agreement. Disclosure to the employer alone (B) is not sufficient, and the lawyer's clients (C) are not the intended recipients.","d":1,"t":"VI(C) Referral Fees","c":"Standard VI(C): any compensation, consideration or benefit received or paid for referring clients must be disclosed to the employer, clients and prospective clients before the relationship begins, stating its nature and estimated value."},{"r":8,"q":"Two independent advisors, one an estate planner and one a portfolio manager, agree to refer clients to each other. No money changes hands. Which statement is most accurate under Standard VI(C)?","o":["No disclosure is required because no cash is exchanged","Disclosure is required only if a client asks","The arrangement must be disclosed, because the referral benefit is a form of consideration"],"a":2,"e":"Standard VI(C) covers any form of consideration, including an exchange of referrals between professionals; the arrangement must be disclosed to clients and prospective clients. The absence of money (A) does not waive disclosure, which must be proactive, not only upon request (B).","d":3,"t":"VI(C) Referral arrangements","c":"Standard VI(C): the disclosure requirement also applies to non-monetary consideration, such as a reciprocal client referral arrangement."},{"r":8,"q":"An analyst's bonus is partly linked to investment banking revenue generated from companies he covers. His firm mentions this in a small-print footnote on the final page of a 60-page report. Is this disclosure most likely adequate under Standard VI(A)?","o":["Yes, because the conflict is technically disclosed","No, because disclosures should be prominent, in plain language, and effectively communicate the conflict","Yes, because compensation structures are confidential and need not be disclosed"],"a":1,"e":"Standard VI(A) requires full, clear, plain-language and prominent disclosure that enables the reader to understand the conflict. A mention buried in fine print (A) is not effective, and compensation structures linked to investment banking are indeed a conflict that must be disclosed (C).","d":2,"t":"VI(A) Effective disclosure","c":"Standard VI(A): disclosure of conflicts must be prominent, clear and understandable; a mention in a fine-print footnote is insufficient."},{"r":9,"q":"After taking the Level I exam, candidate Lucas Meyer posts on a forum the specific formulas that appeared in several questions. Meyer has most likely violated:","o":["Standard VII(A) Conduct as Participants in CFA Institute Programs","Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program","Standard I(C) Misrepresentation"],"a":0,"e":"Disclosing specific exam content (topics, formulas, questions) compromises the integrity and confidentiality of the CFA Program, in violation of Standard VII(A). Standard VII(B) concerns references to the CFA designation (B), and there is no misrepresentation (C).","d":1,"t":"VII(A) Exam confidentiality","c":"Standard VII(A): candidates must not disclose confidential exam content (specific questions, topics or formulas tested) or cheat."},{"r":9,"q":"Which of the following comments made after the exam by a candidate is least likely a violation of Standard VII(A)?","o":["'The exam had three questions on duration of callable bonds.'","'Make sure you memorize the put-call parity formula; it was tested heavily.'","'I found the exam very difficult and long.'"],"a":2,"e":"Standard VII(A) allows expressing a general opinion about the exam's difficulty but prohibits revealing specific topics, formulas or questions. A and B disclose specific exam content and are therefore violations.","d":2,"t":"VII(A) Exam confidentiality","c":"Standard VII(A): general impressions of the exam (difficulty, length) may be shared, but not its precise content or the specific topics tested."},{"r":9,"q":"A CFA charterholder writes a blog post strongly criticizing the CFA Institute's policies on exam fees and the curriculum. Has she most likely violated Standard VII(A)?","o":["Yes, because members must support CFA Institute policies","Yes, because public criticism damages the reputation of the CFA designation","No, members are free to express disagreement with CFA Institute and its policies"],"a":2,"e":"Standard VII(A) does not prevent members and candidates from expressing disagreement with CFA Institute or its policies, as long as they do not compromise the integrity of the exams. A and B confuse legitimate criticism with conduct that compromises the program's reputation.","d":2,"t":"VII(A) Expressing opinions","c":"Standard VII(A) does not prevent expressing opinions, even critical ones, about CFA Institute, its policies or the CFA Program, as long as no confidential information is disclosed and the integrity of the exam is not compromised."},{"r":9,"q":"Which of the following references is most consistent with Standard VII(B)?","o":["'Jane Doe, a CFA, is our lead analyst.'","'Jane Doe, CFA, is our lead analyst.'","'Jane Doe is a Chartered Financial Analyst (CFA) expert.'"],"a":1,"e":"Standard VII(B) requires using 'CFA' as an adjective or after the name (Jane Doe, CFA), never as a noun (A). Creating a phrase like 'CFA expert' (C) alters the mark and is also inappropriate.","d":1,"t":"VII(B) Use of CFA marks","c":"Standard VII(B): the CFA mark is an adjective ('CFA charterholder', 'CFA designation'), never a noun; the meaning of the designation must not be overstated."},{"r":9,"q":"Which of the following statements on a résumé is most likely a violation of Standard VII(B)?","o":["'Passed Level II of the CFA Program on the first attempt'","'Level III candidate in the CFA Program'","'CFA Level II'"],"a":2,"e":"There is no partial designation: writing 'CFA Level II' wrongly suggests a partial designation and violates Standard VII(B). Stating an accurate fact such as having passed a level (A) or being a registered candidate (B) is permitted.","d":3,"t":"VII(B) Partial designation","c":"Standard VII(B): there is no partial designation ('CFA Level II', 'partial CFA'); one may only state having passed a level of the CFA Program."},{"r":9,"q":"A marketing brochure states: 'Our CFA charterholders achieve superior investment returns because of the rigor of the CFA Program.' This statement most likely:","o":["violates Standard VII(B), because it implies charterholders achieve superior performance","is acceptable, because the CFA Program is rigorous","violates Standard III(B) Fair Dealing"],"a":0,"e":"Standard VII(B) prohibits implying that the CFA designation guarantees superior performance. One may highlight the rigor of the program, but not attribute superior returns to it (B); fairness among clients (C) is not at issue.","d":2,"t":"VII(B) Overstating the designation","c":"Standard VII(B): one may state that the program is rigorous and that passing requires significant effort, but not that the designation guarantees or explains superior performance."},{"r":9,"q":"Ben Turner earned his charter several years ago but has not paid his CFA Institute membership dues or submitted his annual Professional Conduct Statement. He continues to use 'CFA' on his business cards. Turner has most likely violated:","o":["no standard, because the charter is awarded for life","Standard VII(B), because his right to use the designation is suspended while his membership is lapsed","Standard VII(A), because he did not retake the exam"],"a":1,"e":"The right to use the CFA designation requires being a member in good standing (dues paid and Professional Conduct Statement submitted); otherwise, its use violates Standard VII(B). The right is not acquired for life unconditionally (A), and no re-examination is required (C).","d":2,"t":"VII(B) Lapsed membership","c":"Standard VII(B): using the CFA designation requires being a member in good standing (dues paid and Professional Conduct Statement submitted). A member not in good standing may not present himself or herself as a CFA charterholder."},{"r":9,"q":"Chloé Martin passed Level I two years ago but has not registered for Level II. Her profile states: 'CFA Level II candidate.' Has she most likely violated Standard VII(B)?","o":["No, because she has passed Level I","No, because she intends to register at some point","Yes, because she is not currently registered for an exam or awaiting results"],"a":2,"e":"Under Standard VII(B), a person is a candidate only if registered for an exam or awaiting results; by presenting himself as such, Martin makes an inaccurate reference to the program. Having passed Level I (A) or intending to register (B) does not confer candidate status.","d":3,"t":"VII(B) Candidate status","c":"Standard VII(B): one is a 'candidate' in the CFA Program only if registered for an exam; otherwise, one may only mention the levels passed."},{"r":10,"q":"Two days before resigning, quantitative analyst Omar Said copies to a personal drive the trading model he developed for his employer, intending to use it at his new firm. Which standard has Said most likely violated?","o":["Standard V(C) Record Retention","Standard IV(A) Loyalty","Standard II(A) Material Nonpublic Information"],"a":1,"e":"Work performed for the employer, including models, belongs to the employer; copying it for future use without permission violates Standard IV(A). Standard V(C) concerns retention of supporting records (A), and the model is not material nonpublic information about an issuer (C).","d":2,"t":"IV(A) Loyalty - firm property","c":"Standard IV(A): work performed for the employer (models, research, client files) belongs to it; copying it for future use without written permission is a violation, even before leaving."},{"r":10,"q":"Portfolio manager Iris Novak places a block order for several accounts without a pre-allocation. After the execution, the stock rises sharply and she allocates most of the shares to her highest-fee accounts. Novak has most likely violated:","o":["Standard III(B) Fair Dealing","Standard VI(B) Priority of Transactions","Standard III(D) Performance Presentation"],"a":0,"e":"Allocating winning trades after execution to the highest-fee accounts disadvantages other clients and violates Standard III(B); orders must be pre-allocated and distributed fairly. No personal account is involved (B), and this is not a performance presentation issue (C).","d":2,"t":"III(B) Fair Dealing - trade allocation","c":"Standard III(B): block orders must be pre-allocated and distributed fairly (pro rata); allocating winning trades to certain accounts after the fact is prohibited."},{"r":10,"q":"Analyst Dev Patel downgrades a stock from buy to sell. Before releasing the report, he telephones his firm's five largest institutional clients to inform them of the change. Patel has most likely violated:","o":["Standard II(A) Material Nonpublic Information","Standard V(B) Communication with Clients","Standard III(B) Fair Dealing"],"a":2,"e":"Standard III(B) requires disseminating changes in recommendations fairly to all affected clients; informing the largest clients first favors them. The analyst's change in recommendation is not in itself inside information about the issuer (A), and V(B) concerns the content of communications, not fairness of dissemination.","d":3,"t":"III(B) Fair Dealing - recommendation changes","c":"Standard III(B): changes in recommendations must be disseminated simultaneously to all affected clients; notifying the largest clients first is a violation."},{"r":10,"q":"A 78-year-old retired client relies on her portfolio for living expenses and has a low risk tolerance stated in her IPS. Her advisor invests 40% of the portfolio in leveraged commodity futures, without being asked. The advisor has most likely violated:","o":["Standard III(C) Suitability","Standard III(E) Preservation of Confidentiality","Standard I(B) Independence and Objectivity"],"a":0,"e":"Investing the portfolio of a conservative, income-dependent client in leveraged products contradicts her IPS and violates Standard III(C) Suitability. No confidential information is disclosed (B), and nothing suggests an outside influence on objectivity (C).","d":1,"t":"III(C) Suitability","c":"Standard III(C): investments must be suitable for the client's objectives, risk tolerance and constraints (IPS), considering the portfolio as a whole."},{"r":10,"q":"A firm calculates the historical performance of its growth composite by excluding accounts that were terminated by clients after poor results. This practice most likely violates:","o":["Standard V(A) Diligence and Reasonable Basis","Standard III(D) Performance Presentation","Standard IV(C) Responsibilities of Supervisors"],"a":1,"e":"Excluding closed accounts creates survivorship bias and gives a misleading picture, violating Standard III(D), which requires a fair and complete presentation. V(A) concerns the basis for recommendations (A), and nothing indicates a supervisory failure (C).","d":1,"t":"III(D) Performance Presentation - survivorship","c":"Standard III(D): presenting performance that excludes closed accounts (survivorship bias) is misleading; composites must include terminated accounts for the period they were managed."},{"r":10,"q":"Trader Ruth Adler learns that her firm will buy a large block of a thinly traded stock for client accounts this afternoon. She buys the stock in her personal account in the morning. Adler has most likely violated:","o":["Standard II(B) Market Manipulation","Standard VI(A) Disclosure of Conflicts","Standard VI(B) Priority of Transactions"],"a":2,"e":"Buying for one's personal account ahead of executing client orders (front-running) violates Standard VI(B), which gives priority to clients and the employer. It is not a matter of distorting prices to deceive the market (A), and mere disclosure (B) would not permit this conduct.","d":2,"t":"VI(B) Front-running","c":"Standard VI(B): front-running (buying for one's own account ahead of client or firm orders) is prohibited; clients and the employer come before the member."},{"r":10,"q":"Analyst Kofi Mensah copies the industry outlook section from another bank's published report into his own report, changing only a few words and without citing the source. Mensah has most likely violated:","o":["Standard I(C) Misrepresentation","Standard V(C) Record Retention","Standard VII(B) Reference to the CFA Designation"],"a":0,"e":"Reusing someone else's analysis without citing the source is plagiarism, covered by Standard I(C). Record retention (B) and use of the CFA designation (C) are not at issue.","d":1,"t":"I(C) Misrepresentation - plagiarism","c":"Standard I(C): copying or substantially paraphrasing someone else's work without citing the source is plagiarism and constitutes misrepresentation."},{"r":10,"q":"Sven Holm, CFA, manages a fund whose prospectus prohibits investments in emerging markets. Believing the opportunity too good to miss, he invests 10% of the fund in emerging-market equities, which then perform well. Which statement is most accurate?","o":["Holm did not violate the Standards because the investment performed well","Holm violated Standard III(C) because he did not follow the fund's stated mandate","Holm violated Standard VI(A) because he failed to disclose a personal conflict"],"a":1,"e":"When managing a fund under a defined mandate or strategy, Standard III(C) requires investments to be consistent with the objectives and constraints stated in the prospectus. Good performance after the fact does not justify the violation (A), and no personal conflict of interest is described (C).","d":3,"t":"III(C) Suitability - fund mandate","c":"Standard III(C): for a fund, suitability is assessed against the mandate, strategy and constraints stated in the prospectus; deviating from them, even for a good opportunity, is a violation."}]}];
const NOTES_RAW=[];
const MPS=0.70; // indicative pass mark
const AP_BASE='https://app.analystprep.com/cfa1/2027/question-bank/chapter/';
const subj=id=>CURR[id-1];
/* ---------- Bonus: original practice questions, rebuilt with new numbers, names and wording at every draw ---------- */
const BONUS=[],BONUS_BY={};
function bx(id,s,r,t,f,fn){const T={id:'bx.'+id,s,r,t,f,fn};BONUS.push(T);BONUS_BY[T.id]=T}
function rngOf(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const BX_NAMES=['Amara','Lucas','Mei','Omar','Sofia','Kenji','Ines','Daniel','Priya','Mateo','Chloe','Ravi','Leila','Tomás','Hana','Felix','Zara','Noah','Elena','Yusuf'];
const BX_FIRMS=['Northwind','Bluepeak','Corvane','Halden','Marisol','Tessaro','Quillon','Veridia','Ostrava','Lumen','Arkwell','Silvane','Pembrook','Valtor','Ardent'];
const BX_CUR=['USD','EUR','GBP','CHF','CAD'];
function bxHelpers(R){
  const H={
    R,ri:(a,b)=>a+Math.floor(R()*(b-a+1)),
    rf:(a,b,st)=>{const n=Math.round((b-a)/st);return+(a+Math.floor(R()*(n+1))*st).toFixed(6)},
    pick:a=>a[Math.floor(R()*a.length)],
    sh:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
    chance:p=>R()<p,
    name:()=>H.pick(BX_NAMES),firm:()=>H.pick(BX_FIRMS),cur:()=>H.pick(BX_CUR),
    m:(x,c,d=2)=>(c?c+' ':'')+Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}),
    p:(x,d=2)=>(x*100).toFixed(d)+'%',
    n:(x,d=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}),
    say:(...v)=>H.pick(v)
  };return H;
}
const bxStep=(...lines)=>lines.map(l=>`<div class="bxs">${l}</div>`).join('');
function bonusInst(id){
  const[base,sd]=String(id).split('~'),T=BONUS_BY[base];if(!T||!sd)return undefined;
  const H=bxHelpers(rngOf(parseInt(sd,36)||1));let out=null;
  for(let i=0;i<8;i++){const o=T.fn(H);const all=[o.c,...o.w];if(new Set(all).size===3){out=o;break}out=o}
  const ord=H.sh([0,1,2]),opts=[out.c,...out.w];
  return{id,tpl:base,s:T.s,r:T.r,src:'bonus',d:0,h:1,t:'Bonus · '+T.t,q:out.q,o:ord.map(i=>opts[i]),a:ord.indexOf(0),e:out.e,los:''};
}
function newBonus(base){const id=base+'~'+Math.floor(Math.random()*2e9).toString(36);const q=bonusInst(id);if(q)QID[id]=q;return q}

/* ===== Quantitative Methods ===== */
bx('qm-hpr',1,1,'Holding period return','HPR = (P₁ − P₀ + D₁) / P₀',H=>{
  const c=H.cur(),P0=H.rf(20,150,0.5),P1=+(P0*(1+H.rf(-0.15,0.3,0.005))).toFixed(2),D=+(P0*H.rf(0.008,0.05,0.001)).toFixed(2),nm=H.name();
  const r=(P1-P0+D)/P0;
  return{q:H.say(`${nm} buys a share for ${H.m(P0,c)}, receives a dividend of ${H.m(D,c)} during the year and sells the share at year-end for ${H.m(P1,c)}. The holding period return is <i>closest to</i>:`,
    `A stock bought at ${H.m(P0,c)} pays a ${H.m(D,c)} dividend and is sold one year later at ${H.m(P1,c)}. What is the investor's holding period return?`),
    c:H.p(r),w:[H.p((P1-P0)/P0),H.p((P1-P0+D)/P1)],
    e:bxStep(`HPR = (P₁ − P₀ + D₁) / P₀ = (${P1} − ${P0} + ${D}) / ${P0} = <b>${H.p(r)}</b>`,`Trap: ${H.p((P1-P0)/P0)} is the price return only (dividend ignored); dividing by P₁ uses the wrong base.`)}});
bx('qm-geo',1,1,'Geometric mean return','R_G = [(1+R₁)(1+R₂)…(1+Rₙ)]^(1/n) − 1',H=>{
  const n=H.ri(3,5),rs=Array.from({length:n},()=>H.rf(-0.25,0.35,0.01));const prod=rs.reduce((a,x)=>a*(1+x),1);
  const g=Math.pow(prod,1/n)-1,am=rs.reduce((a,x)=>a+x,0)/n;
  return{q:`A fund earned the following annual returns: ${rs.map(x=>H.p(x,0)).join(', ')}. Its geometric mean annual return is <i>closest to</i>:`,
    c:H.p(g),w:[H.p(am),H.p(prod-1)],
    e:bxStep(`Product of growth factors = ${rs.map(x=>'('+(1+x).toFixed(2)+')').join('×')} = ${prod.toFixed(4)}`,`R_G = ${prod.toFixed(4)}^(1/${n}) − 1 = <b>${H.p(g)}</b>`,`The arithmetic mean (${H.p(am)}) is always ≥ the geometric mean; ${H.p(prod-1)} is the cumulative, not annual, return.`)}});
bx('qm-twr',1,2,'Time-weighted return','TWR = (1+r₁)(1+r₂)… − 1, sub-periods split at each external cash flow',H=>{
  const c=H.cur(),V0=H.ri(80,400)*1000,r1=H.rf(-0.1,0.2,0.005),V1=Math.round(V0*(1+r1)),C=H.ri(10,120)*1000,r2=H.rf(-0.1,0.2,0.005),V2=Math.round((V1+C)*(1+r2));
  const R1=V1/V0-1,R2=V2/(V1+C)-1,twr=(1+R1)*(1+R2)-1;
  return{q:`A portfolio is worth ${H.m(V0,c,0)} on 1 January and ${H.m(V1,c,0)} on 30 June, just before the client adds ${H.m(C,c,0)}. On 31 December it is worth ${H.m(V2,c,0)}. The time-weighted return for the year is <i>closest to</i>:`,
    c:H.p(twr),w:[H.p((V2-V0-C)/V0),H.p((R1+R2)/2)],
    e:bxStep(`H1: ${V1}/${V0} − 1 = ${H.p(R1)}`,`H2: ${V2}/(${V1}+${C}) − 1 = ${H.p(R2)}`,`TWR = (1 + ${H.p(R1)})(1 + ${H.p(R2)}) − 1 = <b>${H.p(twr)}</b>`,`TWR removes the effect of the client's cash flow; it links sub-period returns geometrically.`)}});
bx('qm-ann',1,2,'Annualizing a return','R_annual = (1 + R_period)^(365/days) − 1',H=>{
  const d=H.pick([30,45,60,90,120,150,200,250]),r=H.rf(0.005,0.06,0.001),a=Math.pow(1+r,365/d)-1;
  return{q:H.say(`An investment earned ${H.p(r,1)} over ${d} days. Assuming a 365-day year and compounding, its annualized return is <i>closest to</i>:`,`What is the annualized equivalent of a ${H.p(r,1)} return earned over ${d} days (365-day year, compounded)?`),
    c:H.p(a),w:[H.p(r*365/d),H.p(Math.pow(1+r,d/365)-1,3)],
    e:bxStep(`(1 + ${r.toFixed(3)})^(365/${d}) − 1 = <b>${H.p(a)}</b>`,`${H.p(r*365/d)} is simple (non-compounded) scaling.`)}});
bx('qm-ccr',1,2,'Continuously compounded return','r_cc = ln(P₁/P₀) = ln(1 + HPR)',H=>{
  const P0=H.rf(10,200,0.25),P1=+(P0*(1+H.rf(-0.2,0.4,0.005))).toFixed(2),r=Math.log(P1/P0);
  return{q:`A share price moves from ${H.n(P0)} to ${H.n(P1)} over one year. The continuously compounded return is <i>closest to</i>:`,
    c:H.p(r),w:[H.p(P1/P0-1),H.p(Math.log10(P1/P0))],
    e:bxStep(`r_cc = ln(${P1}/${P0}) = ln(${(P1/P0).toFixed(4)}) = <b>${H.p(r)}</b>`,`${H.p(P1/P0-1)} is the discrete holding period return.`)}});
bx('qm-real',1,2,'Real return','(1 + nominal) = (1 + real)(1 + inflation)',H=>{
  const n=H.rf(0.02,0.14,0.001),i=H.rf(0.005,0.08,0.001),r=(1+n)/(1+i)-1;
  return{q:`A bond fund returned ${H.p(n,1)} last year while inflation was ${H.p(i,1)}. The real return is <i>closest to</i>:`,
    c:H.p(r),w:[H.p(n-i),H.p((1+n)*(1+i)-1)],
    e:bxStep(`Real = (1 + ${H.p(n,1)}) / (1 + ${H.p(i,1)}) − 1 = <b>${H.p(r)}</b>`,`n − i = ${H.p(n-i)} is only the approximation.`)}});
bx('qm-fv',1,4,'Future value with periodic compounding','FV = PV (1 + r/m)^(m·n)',H=>{
  const c=H.cur(),PV=H.ri(5,200)*500,r=H.rf(0.02,0.1,0.0025),n=H.ri(2,15),m=H.pick([2,4,12]),lab={2:'semiannually',4:'quarterly',12:'monthly'}[m];
  const fv=PV*Math.pow(1+r/m,m*n);
  return{q:`${H.name()} deposits ${H.m(PV,c,0)} for ${n} years at a stated annual rate of ${H.p(r)} compounded ${lab}. The future value is <i>closest to</i>:`,
    c:H.m(fv,c),w:[H.m(PV*Math.pow(1+r,n),c),H.m(PV*(1+r*n),c)],
    e:bxStep(`FV = ${PV} × (1 + ${r}/${m})^(${m}×${n}) = <b>${H.m(fv,c)}</b>`,`Annual compounding gives ${H.m(PV*Math.pow(1+r,n),c)}; simple interest gives ${H.m(PV*(1+r*n),c)}.`)}});
bx('qm-pva',1,4,'Present value of an annuity','PV = A × [1 − (1 + r)^(−n)] / r',H=>{
  const c=H.cur(),A=H.ri(5,80)*250,r=H.rf(0.02,0.1,0.0025),n=H.ri(4,25),due=H.chance(.35);
  const pv=A*(1-Math.pow(1+r,-n))/r,pvd=pv*(1+r);
  return{q:`What is the present value of ${n} annual payments of ${H.m(A,c,0)}${due?', the first one received <b>today</b>,':', the first one received one year from now,'} discounted at ${H.p(r)}?`,
    c:H.m(due?pvd:pv,c),w:[H.m(due?pv:pvd,c),H.m(A*n/Math.pow(1+r,n),c)],
    e:bxStep(`Ordinary annuity: ${A} × [1 − (1+${r})^−${n}] / ${r} = ${H.m(pv,c)}`,due?`Annuity due (first payment today): × (1 + r) = <b>${H.m(pvd,c)}</b>`:`Payments start in one year, so this is an ordinary annuity: <b>${H.m(pv,c)}</b>`)}});
bx('qm-ear',1,4,'Effective annual rate','EAR = (1 + r/m)^m − 1 ; continuous: e^r − 1',H=>{
  const r=H.rf(0.03,0.16,0.0025),m=H.pick([2,4,12,365]),lab={2:'semiannual',4:'quarterly',12:'monthly',365:'daily'}[m],ear=Math.pow(1+r/m,m)-1;
  return{q:`A lender quotes a stated annual rate of ${H.p(r)} with ${lab} compounding. The effective annual rate is <i>closest to</i>:`,
    c:H.p(ear,3),w:[H.p(r,3),H.p(Math.pow(1+r/m,m/2)-1,3)],
    e:bxStep(`EAR = (1 + ${r}/${m})^${m} − 1 = <b>${H.p(ear,3)}</b>`)}});
bx('qm-perp',1,4,'Growing perpetuity','PV = C₁ / (r − g), with C₁ = C₀(1 + g)',H=>{
  const c=H.cur(),C0=H.rf(1,20,0.25),g=H.rf(0.01,0.05,0.0025),r=+(g+H.rf(0.03,0.08,0.0025)).toFixed(4),C1=C0*(1+g);
