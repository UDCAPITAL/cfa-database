"},{"r":11,"q":"A company has a return on equity of 15% and a dividend payout ratio of 40%. Its sustainable growth rate is closest to:","o":["6.0%","15.0%","9.0%"],"a":2,"e":"g = ROE x retention rate = 15% x (1 - 0.40) = 9.0%. 6.0% multiplies by the payout ratio instead of the retention rate, and 15.0% assumes all earnings are reinvested.","d":2,"t":"Sustainable growth rate","c":"Sustainable growth rate g = retention rate (b) x ROE, where b = 1 - dividend payout ratio."},{"r":12,"q":"Last year a company reported revenue of $500 million. An analyst forecasts revenue growth of 6% and COGS at 60% of revenue. Forecast gross profit is closest to:","o":["$200 million","$318 million","$212 million"],"a":2,"e":"Forecast revenue = 500 x 1.06 = $530 million; gross profit = 530 x 40% = $212 million. $200 million applies the margin to last year's revenue and $318 million is forecast COGS.","d":1,"t":"Revenue and gross profit forecast","c":"Forecasting: revenue next year = revenue this year x (1 + g); gross profit = revenue x (1 - COGS as a % of revenue)."},{"r":12,"q":"An analyst forecasts revenue of $730 million and days of sales outstanding of 40 days (365-day year). Forecast accounts receivable are closest to:","o":["$80.0 million","$18.2 million","$73.0 million"],"a":0,"e":"Receivables = (revenue / 365) x DSO = 2 x 40 = $80.0 million. $18.2 million divides revenue by DSO (confusing it with a turnover ratio) and $73.0 million applies an arbitrary 10%.","d":2,"t":"Working capital forecast","c":"Forecasting working capital from ratios: receivables = DSO x revenue / 365; inventory = DOH x COGS / 365; payables = DPO x COGS (or purchases) / 365."},{"r":12,"q":"An analyst who is overconfident in her forecasting ability will most likely:","o":["Rely too heavily on the company's historical base rates","Update forecasts too quickly in response to new information","Use ranges of possible outcomes that are too narrow"],"a":2,"e":"Overconfidence leads to underestimating uncertainty, and therefore to forecast ranges that are too narrow. Relying on historical base rates is rather a remedy, and updating too quickly is not the characteristic symptom (anchoring tends to produce the opposite).","d":1,"t":"Overconfidence bias","c":"Overconfidence bias: the analyst underestimates uncertainty and produces forecast intervals that are too narrow; remedies include scenarios and tracking the record of past forecasts."},{"r":12,"q":"Using Porter's five forces, an industry in which a few large suppliers provide a critical input with no close substitutes will most likely exhibit:","o":["Higher pricing power for industry participants","Lower threat of new entrants","Lower profit margins for industry participants"],"a":2,"e":"High supplier bargaining power lets suppliers capture part of the value through high input prices, which squeezes the margins of industry participants. It does not strengthen their pricing power and has no direct effect on the threat of new entrants.","d":2,"t":"Porter's five forces","c":"Porter's five forces: threat of new entrants, threat of substitutes, supplier power, buyer power and rivalry intensity. Concentrated suppliers with no substitutes have strong power and squeeze industry margins."},{"r":12,"q":"An analyst expects a company's unit volume to grow by 3% and its average selling price to increase by 5% next year. Forecast revenue growth is closest to:","o":["8.00%","8.15%","2.00%"],"a":1,"e":"Revenue growth = (1.03 x 1.05) - 1 = 8.15%. 8.00% adds the rates and ignores the cross effect, and 2.00% wrongly subtracts volume.","d":3,"t":"Volume and price growth","c":"Revenue growth from volume and price: (1 + g_revenue) = (1 + g_volume) x (1 + g_price), approximately g_volume + g_price."},{"r":12,"q":"For a mature company with no expected real growth, a long-term forecast of capital expenditures is most likely approximately equal to:","o":["Zero","Depreciation expense (maintenance capex), adjusted for inflation","A multiple of forecast revenue growth"],"a":1,"e":"With no growth, the company only needs to maintain its asset base: capex tends toward depreciation expense (adjusted for inflation). Zero capex would erode capacity, and a multiple of revenue growth makes no sense when real growth is zero.","d":2,"t":"Long-term capex forecast","c":"For a mature company with no real growth, long-term capex is modeled as maintenance capex, i.e., depreciation adjusted for inflation, often a capex/depreciation ratio slightly above 1."},{"r":12,"q":"A company has revenue of $1,200 million, variable costs equal to 50% of revenue and fixed operating costs of $400 million. If revenue increases by 10%, operating income will increase by approximately:","o":["10%","20%","30%"],"a":2,"e":"Current EBIT = 1,200 x 50% - 400 = $200 million; forecast EBIT = 1,320 x 50% - 400 = $260 million, i.e., +30%. Operating leverage (contribution margin 600 / EBIT 200 = 3) amplifies the 10% increase; 10% ignores fixed costs and 20% understates the leverage.","d":3,"t":"Operating leverage in forecasting","c":"Degree of operating leverage (DOL) = % change in EBIT / % change in revenue = contribution margin / EBIT. The higher the share of fixed costs, the more sensitive EBIT is to changes in revenue."},{"r":12,"q":"Which statement best distinguishes scenario analysis from sensitivity analysis in financial modeling?","o":["Sensitivity analysis changes several inputs simultaneously, whereas scenario analysis changes one input at a time","Scenario analysis changes several inputs simultaneously, whereas sensitivity analysis changes one input at a time","Both techniques require assigning probabilities to each outcome"],"a":1,"e":"Sensitivity analysis varies one assumption at a time, holding everything else constant; scenario analysis changes a consistent set of assumptions (e.g., a recession). Neither requires assigning probabilities, unlike a probabilistic simulation.","d":2,"t":"Scenario vs sensitivity analysis","c":"Sensitivity analysis varies a single assumption at a time; scenario analysis changes several mutually consistent assumptions simultaneously; simulation uses probability distributions for the inputs."}]},{"subject":5,"questions":[{"r":1,"q":"Which of the following features most clearly distinguishes common equity from debt securities?","o":["Common shareholders receive fixed, contractually promised periodic payments.","Common shareholders hold a residual claim on the company's assets after all liabilities are satisfied.","Common shareholders rank ahead of senior bondholders in a liquidation."],"a":1,"e":"Common shareholders hold a residual claim: they are paid after all creditors. Fixed contractual payments are a feature of debt, not common equity. In liquidation, bondholders rank ahead of shareholders, never the reverse.","d":1,"t":"Residual claim of common equity","c":"Common shares carry a residual claim: shareholders are paid after all creditors and preferred shareholders. Unlike debt, no payment is contractually promised and the maturity is perpetual."},{"r":1,"q":"A company has 200,000 cumulative preference shares outstanding with a par value of $100 and a 6% annual dividend rate. The company paid no preference dividends in the previous two years. The minimum total amount it must pay to preference shareholders this year before paying any dividend to common shareholders is closest to:","o":["$1,200,000","$2,400,000","$3,600,000"],"a":2,"e":"Annual dividend = 6% × $100 × 200,000 = $1.2 million. Because the shares are cumulative, the two years of arrears plus the current year must be paid: 3 × $1.2 million = $3.6 million. $1.2 million ignores the arrears and $2.4 million omits the current year.","d":2,"t":"Cumulative preference dividends","c":"For cumulative preference shares, unpaid dividends accumulate (dividends in arrears) and must be paid in full, arrears plus the current year's dividend, before any dividend to common shareholders. Annual dividend = dividend rate × par value × number of shares."},{"r":1,"q":"Compared with non-participating preference shares, participating preference shares most likely:","o":["entitle holders to receive additional dividends beyond the fixed rate if the company's profits exceed a specified level.","give holders the right to convert their shares into a fixed number of common shares.","allow holders to sell the shares back to the issuer at a pre-specified price."],"a":0,"e":"Participating preference shares entitle holders to the fixed dividend plus an additional dividend if profits exceed a threshold (and often an extra share in liquidation). Conversion into common shares describes a convertible preference share, and the right to sell back to the issuer describes a putable share.","d":1,"t":"Participating preference shares","c":"Participating preference shares receive the fixed dividend plus an additional share of profits (or liquidation proceeds) above a threshold. Non-participating shares are limited to the fixed dividend and par value."},{"r":1,"q":"A convertible preference share has a par value of $50 and can be converted into 2.5 common shares. The common shares currently trade at $22. The conversion value of one preference share is closest to:","o":["$50.00","$55.00","$20.00"],"a":1,"e":"Conversion value = conversion ratio × common share price = 2.5 × $22 = $55. $50 is the par value, not the conversion value, and $20 comes from the incorrect division 50 / 2.5 (the implied conversion price).","d":1,"t":"Conversion value of convertible preference shares","c":"Conversion value = conversion ratio × price of the common share. Converting is rational when this value exceeds the value (or par value) of the preference share."},{"r":1,"q":"All else equal, which type of preference share most likely has the highest required rate of return for investors?","o":["Putable preference shares","Non-callable, non-putable preference shares","Callable preference shares"],"a":2,"e":"The call option belongs to the issuer: the investor bears reinvestment risk and therefore requires a higher return. Conversely, a put option belongs to the investor and lowers the required return; the share with no embedded option lies in between.","d":2,"t":"Callable vs putable preference shares","c":"A call feature belongs to the issuer and hurts the investor, who therefore requires a higher return. A put feature belongs to the investor and lowers the required return. Ranking of required returns: callable > straight > putable."},{"r":1,"q":"A company reports net income of $45 million. Its book value of equity was $280 million at the beginning of the year and $320 million at the end of the year. Using average equity, the company's return on equity (ROE) is closest to:","o":["15.0%","16.1%","14.1%"],"a":0,"e":"ROE = net income / average equity = 45 / ((280 + 320) / 2) = 45 / 300 = 15.0%. 16.1% uses beginning equity and 14.1% uses ending equity instead of the average asked for.","d":1,"t":"Return on equity","c":"ROE = net income / average equity, where average equity = (beginning + ending) / 2. Beginning-of-period equity is used when measuring the return on capital invested at the start of the year."},{"r":1,"q":"A company has 10 million shares outstanding trading at $36 per share. The book value of its shareholders' equity is $240 million. Which statement is most accurate?","o":["The price-to-book ratio is 0.67, suggesting the market values the company below its accounting net assets.","The price-to-book ratio is 1.5, suggesting investors expect the company to earn returns above its cost of equity or hold value not captured on the balance sheet.","The price-to-book ratio is 1.5, indicating the shares are overvalued because market value should equal book value."],"a":1,"e":"Book value per share = $240 million / 10 million = $24; P/B = 36 / 24 = 1.5. A P/B above 1 reflects expected future profitability or unrecorded intangible assets and does not mean the shares are overvalued. 0.67 is the inverted ratio (B/P).","d":2,"t":"Market value vs book value of equity","c":"Market value of equity = shares outstanding × share price. A price-to-book ratio above 1 means the market expects future value creation or values assets not recognized on the balance sheet (intangibles, growth)."},{"r":1,"q":"A company's cost of equity is best described as:","o":["the dividend yield the company currently pays on its common shares.","the company's accounting return on equity.","the minimum rate of return that investors require for providing equity capital to the company."],"a":2,"e":"The cost of equity is the minimum return investors require to hold the shares given their risk. The dividend yield is only one component of it, and ROE is an accounting profitability measure, not a market-required return.","d":1,"t":"Cost of equity","c":"The cost of equity is the minimum return shareholders require to hold the stock given its risk. It is not an accounting cost: it is implicit and estimated, for example, with the CAPM or a DDM."},{"r":2,"q":"A shareholder owns 1,500 shares of a company that is electing five directors at its annual meeting. Under cumulative voting, the maximum number of votes the shareholder can cast for a single director is:","o":["1,500","300","7,500"],"a":2,"e":"Under cumulative voting, total votes = number of shares × number of seats to fill = 1,500 × 5 = 7,500, which the shareholder can concentrate on a single candidate. 1,500 corresponds to statutory voting (one vote per share per seat), and 300 wrongly divides by the number of seats.","d":1,"t":"Cumulative voting","c":"Cumulative voting: total votes = number of shares × number of board seats being elected, and the shareholder may cast all of them for a single candidate. Under statutory voting, each share carries one vote per seat."},{"r":2,"q":"Compared with statutory voting, cumulative voting is most likely to:","o":["increase the ability of minority shareholders to obtain board representation.","increase the control of majority shareholders over all board seats.","reduce the total number of votes available to each shareholder."],"a":0,"e":"Cumulative voting lets minority shareholders concentrate all their votes on one or a few candidates, increasing their chances of winning a seat. Statutory voting instead favors majority shareholders, and the total number of votes per shareholder is the same under both systems (only their allocation changes).","d":1,"t":"Cumulative vs statutory voting","c":"Cumulative voting allows minority shareholders to concentrate their votes and obtain board representation. Statutory voting favors majority shareholders, who can elect every director."},{"r":2,"q":"A company has 80 million Class A shares with one vote per share and 20 million Class B shares with ten votes per share, held by the founders. Both classes have equal economic rights. The founders' share of total voting power is closest to:","o":["20.0%","71.4%","66.7%"],"a":1,"e":"Class B votes = 20 million × 10 = 200 million; total votes = 80 million + 200 million = 280 million; founders' share = 200 / 280 = 71.4%. 20.0% is the economic share (20 million / 100 million shares), and 66.7% wrongly divides 200 by 300.","d":2,"t":"Dual-class share structure","c":"In a dual-class structure, control is measured by voting rights, not capital: voting share = votes of the class / total votes (shares × votes per share). Founders can control the company with a minority of the capital."},{"r":2,"q":"Which of the following statements about depository receipts is most accurate?","o":["Sponsored depository receipts are issued without the involvement of the foreign company.","Holders of unsponsored depository receipts typically have the same voting rights as direct shareholders.","In an unsponsored depository receipt, the depository bank rather than the receipt holder typically retains the voting rights."],"a":2,"e":"In an unsponsored DR, the foreign company is not involved and the depository bank retains the voting rights. A sponsored DR, by contrast, involves the company directly and generally passes voting rights to holders; the other two statements therefore reverse the characteristics.","d":2,"t":"Sponsored vs unsponsored depository receipts","c":"A sponsored DR is issued with the participation of the foreign company: investors receive voting rights and better information. An unsponsored DR is issued without the issuer's involvement, and the depository bank keeps the voting rights."},{"r":2,"q":"A global registered share (GRS) is best described as a share that:","o":["is traded on different stock exchanges around the world in different currencies without currency conversion when moving between markets.","is issued by a depository bank in a foreign market and represents a basket of ordinary shares.","can only be traded on the issuer's home-country exchange in its domestic currency."],"a":0,"e":"A GRS is a single ordinary share listed on several exchanges and tradable in different currencies, with no conversion needed when moving between markets. A security issued by a depository bank describes a depository receipt, and restriction to the home market contradicts the very definition of a GRS.","d":1,"t":"Global registered shares","c":"A global registered share (GRS) is a single common share traded on several exchanges in different currencies, without conversion through a depository receipt."},{"r":2,"q":"A shareholder who cannot attend the annual general meeting authorizes another party to vote on her behalf. This is best described as:","o":["cumulative voting","proxy voting","statutory voting"],"a":1,"e":"Proxy voting means authorizing a third party (often management or a proxy adviser) to vote on one's behalf. Cumulative and statutory voting are methods of counting votes in director elections, not a delegation of the right to vote.","d":1,"t":"Proxy voting","c":"Proxy voting allows a shareholder who cannot attend the general meeting to authorize another party (often management or a voting adviser) to vote on their behalf."},{"r":2,"q":"A Hong Kong company's ordinary shares trade at HKD 25.00. Each of its American depository receipts (ADRs) represents 4 ordinary shares. If the exchange rate is HKD 7.80 per USD, the ADR's price, ignoring transaction costs, is closest to:","o":["USD 3.21","USD 0.80","USD 12.82"],"a":2,"e":"ADR price = 4 × HKD 25 / HKD 7.80 per USD = 100 / 7.80 = USD 12.82. USD 3.21 is the price of a single ordinary share (ratio ignored), and USD 0.80 divides by the ratio instead of multiplying.","d":2,"t":"ADR pricing and ratio","c":"Theoretical DR price = local share price × DR ratio (shares per DR) ÷ exchange rate quoted in local currency per USD (or × USD per local currency). Arbitrage keeps the DR price close to this value."},{"r":2,"q":"Which type of American depository receipt allows a foreign company to raise new capital through a public offering in the United States?","o":["Level III ADR","Level I ADR","Level II ADR"],"a":0,"e":"Only a Level III ADR allows capital to be raised through a public offering in the US market, which requires the strictest SEC registration. Level I trades over the counter with no capital raising, and Level II is listed on a US exchange but cannot raise new capital.","d":2,"t":"ADR levels","c":"Level I ADR: over-the-counter, no capital raising. Level II: US exchange listing, no capital raising. Level III: listing and public offering of new shares in the US. Rule 144A: private placement to qualified institutional buyers."},{"r":3,"q":"A company sells 10 million shares in its IPO at an offer price of $20. The shares close at $25 on the first day of trading. The amount of money 'left on the table' by the issuer is closest to:","o":["$50 million","$200 million","$250 million"],"a":0,"e":"Money left on the table = (first-day closing price − offer price) × number of shares = (25 − 20) × 10 million = $50 million. $200 million is the gross proceeds of the offering and $250 million is the market value of the shares at the end of the first day.","d":1,"t":"IPO underpricing","c":"IPO 'money left on the table' = (first-day closing price − offer price) × number of shares issued. It measures underpricing: capital the issuer could have raised."},{"r":3,"q":"A company with shares trading at $40 announces a rights offering allowing shareholders to buy one new share for every four shares held at a subscription price of $30. The theoretical value of one right (per existing share) is closest to:","o":["$2.50","$2.00","$10.00"],"a":1,"e":"Theoretical ex-rights price (TERP) = (4 × 40 + 1 × 30) / 5 = $38.00. Value of one right = 40 − 38 = $2.00. $2.50 divides the $10 gap by 4 instead of 5 (ignoring dilution from the new share), and $10 is the raw gap between share price and subscription price.","d":3,"t":"Rights offering valuation","c":"Rights offering: value of a right = (pre-issue price − subscription price) / (N + 1), where N = existing shares needed per new share. Ex-rights price = (N × share price + subscription price) / (N + 1)."},{"r":3,"q":"An investor buys shares at $50 per share using an initial margin of 40%. The maintenance margin requirement is 25%. The price below which the investor would receive a margin call is closest to:","o":["$37.50","$30.00","$40.00"],"a":2,"e":"Margin call price = P0 × (1 − initial margin) / (1 − maintenance margin) = 50 × 0.60 / 0.75 = $40.00. $37.50 just applies the maintenance margin to the initial price, and $30.00 is the amount borrowed per share.","d":2,"t":"Margin call price","c":"Margin call price = P0 × (1 − initial margin) / (1 − maintenance margin). Below this price, the account's equity falls under the maintenance margin."},{"r":3,"q":"An investor buys a stock at $50 with an initial margin of 40% and sells it one year later at $60. Ignoring dividends, interest, and transaction costs, the investor's return on equity invested is closest to:","o":["50%","20%","16.7%"],"a":0,"e":"Investor's equity = 40% × 50 = $20; gain = 60 − 50 = $10; return = 10 / 20 = 50%. 20% is the unleveraged return (10 / 50), and 16.7% divides the gain by the selling price instead of the equity invested; leverage (1 / 0.40 = 2.5) multiplies the 20% return.","d":1,"t":"Leveraged return on margin purchase","c":"Return on a margin purchase = (change in value + dividends − interest − fees) / initial equity. Leverage ratio = 1 / initial margin: it magnifies both gains and losses."},{"r":3,"q":"Which method of going public is least likely to raise new capital for the company at the time of listing?","o":["Initial public offering","Direct listing","Merger with a special purpose acquisition company (SPAC)"],"a":1,"e":"In a direct listing, existing shares are simply admitted to trading, with no new shares issued and no underwriting syndicate. An IPO raises primary capital, and a SPAC merger brings the target the cash the SPAC holds in trust.","d":1,"t":"Direct listing vs IPO vs SPAC","c":"A direct listing admits existing shares to trading without issuing new shares or using an underwriting syndicate, so it raises no capital. An IPO and a SPAC merger bring in new capital."},{"r":3,"q":"Compared with a public offering, a private placement of equity most likely involves:","o":["higher issuance costs and more extensive regulatory disclosure.","shares that can be freely traded on a public exchange immediately after issuance.","lower issuance costs and less regulatory disclosure, but shares that are less liquid."],"a":2,"e":"A private placement, restricted to qualified investors, lowers issuance costs and disclosure requirements, but the securities are illiquid (no organized secondary market) and often issued at a discount. Higher costs and disclosure, along with immediate free tradability, characterize a public offering.","d":1,"t":"Private placement vs public offering","c":"A private placement targets a small number of qualified investors: lower costs and disclosure requirements and faster execution, but less liquid shares and therefore a price discount (higher required return) compared with a public offering."},{"r":3,"q":"An investor has short sold a stock at $60 and wants to limit her potential loss if the price rises. The most appropriate order to place is a:","o":["buy stop order at $66","sell stop order at $54","buy limit order at $54"],"a":0,"e":"To protect a short position against a price rise, use a buy stop order placed above the current price ($66), which triggers if the stock rises. A sell stop order protects a long position, and a buy limit order at $54 only executes if the price falls, so it does not limit the loss.","d":2,"t":"Stop orders for short positions","c":"A stop order becomes active when the price reaches the stop price. To limit the loss on a short position, place a stop-buy order above the current price; for a long position, place a stop-sell (stop-loss) order below it."},{"r":3,"q":"A dealer quotes a bid of $20.10 and an ask of $20.15 for a stock. A buyer's order is executed at $20.14. The effective spread of this trade is closest to:","o":["$0.015","$0.030","$0.050"],"a":1,"e":"Midquote = (20.10 + 20.15) / 2 = $20.125; effective spread = 2 × (20.14 − 20.125) = $0.030. $0.015 forgets to multiply by 2, and $0.050 is the quoted spread, which is larger because the order received price improvement.","d":3,"t":"Effective vs quoted spread","c":"Quoted spread = ask − bid. Effective spread = 2 × |execution price − midquote|, where midquote = (bid + ask) / 2. An effective spread below the quoted spread indicates price improvement."},{"r":4,"q":"An investor buys a share at $40, receives a dividend of $1.20 during the year, and sells the share at $43 at year-end. The holding period return is closest to:","o":["7.5%","10.5%","3.0%"],"a":1,"e":"HPR = (P1 − P0 + D) / P0 = (43 − 40 + 1.20) / 40 = 10.5%. 7.5% counts only the capital gain and 3.0% only the dividend yield.","d":1,"t":"Holding period return","c":"Holding period return = (P1 − P0 + D1) / P0 = dividend yield + capital gain yield."},{"r":4,"q":"An analyst expects a stock's dividend yield to be 2.0%, its earnings per share to grow by 5.0%, and its P/E ratio to expand from 15.0 to 16.0 over the next year. Using an additive approximation, the expected total return is closest to:","o":["7.0%","8.0%","13.7%"],"a":2,"e":"Return ≈ dividend yield + EPS growth + change in P/E = 2.0% + 5.0% + (16/15 − 1 = 6.7%) = 13.7%. 7.0% ignores the multiple expansion, and 8.0% treats it as a one-percentage-point increase rather than a relative change.","d":2,"t":"Decomposition of equity returns","c":"Expected equity return ≈ dividend yield + EPS growth + change in the multiple (P/E), where change in multiple = (ending P/E / beginning P/E) − 1. Exact multiplicative version: (1 + g)(1 + ΔP/E) − 1 + dividend yield."},{"r":4,"q":"A non-dividend-paying stock rises from $50 to $80 over four years. Its annualized (geometric) return is closest to:","o":["12.47%","15.00%","60.00%"],"a":0,"e":"Annualized return = (80/50)^(1/4) − 1 = 1.6^0.25 − 1 = 12.47%. 15.00% is the simple arithmetic average (60% / 4), which ignores compounding, and 60.00% is the cumulative four-year return.","d":1,"t":"Annualized return","c":"Geometric annualized return = (ending value / beginning value)^(1/n) − 1. Do not simply divide the cumulative return by the number of years."},{"r":4,"q":"Over very long investment horizons, which source of equity return is least likely to be a sustainable contributor to total return?","o":["Dividend income and its reinvestment","Continued expansion of valuation multiples such as the P/E ratio","Growth in earnings per share"],"a":1,"e":"Valuation multiples cannot rise indefinitely and tend to revert to their mean; their contribution cancels out over the long run. Reinvested dividends and earnings growth, on the other hand, are the sustainable sources of equity returns.","d":2,"t":"Sustainability of return sources","c":"Over the long run, the sustainable sources of equity returns are the dividend (or payout) yield and earnings growth. Multiple (P/E) expansion cannot continue indefinitely and tends to mean-revert."},{"r":4,"q":"A company with a market capitalization of $2.0 billion pays $40 million in dividends, repurchases $60 million of shares, and issues $20 million of new shares during the year. Its net payout yield is closest to:","o":["2.0%","5.0%","4.0%"],"a":2,"e":"Net payout yield = (dividends + buybacks − issuance) / market capitalization = (40 + 60 − 20) / 2,000 = 4.0%. 2.0% counts only dividends and 5.0% forgets to subtract share issuance.","d":2,"t":"Net payout yield","c":"Net payout yield = (dividends + share repurchases − share issuance) / market capitalization."},{"r":4,"q":"A stock portfolio earned a nominal return of 9% during a year in which inflation was 3%. The portfolio's real return is closest to:","o":["5.83%","6.00%","12.27%"],"a":0,"e":"Real return = (1 + nominal) / (1 + inflation) − 1 = 1.09 / 1.03 − 1 = 5.83%. 6.00% is the simple subtraction approximation, and 12.27% compounds the two rates instead of removing inflation.","d":1,"t":"Real vs nominal return","c":"Exact real return = (1 + nominal return) / (1 + inflation) − 1. The approximation nominal return − inflation slightly overstates the real return."},{"r":4,"q":"A company's net income grows by 6% while share repurchases reduce its share count by 2%. The growth rate of earnings per share is closest to:","o":["3.88%","8.16%","6.00%"],"a":1,"e":"EPS growth = (1 + net income growth) / (1 − reduction in share count) − 1 = 1.06 / 0.98 − 1 = 8.16%. 3.88% multiplies by 0.98 instead of dividing, and 6.00% ignores the accretive effect of buybacks.","d":3,"t":"EPS growth and buybacks","c":"EPS growth = (1 + net income growth) / (1 − % reduction in shares outstanding) − 1 ≈ net income growth + share count reduction. Buybacks raise EPS for a given level of net income."},{"r":4,"q":"All else equal, an increase in the equity risk premium demanded by investors is most likely to cause:","o":["an increase in equity valuation multiples such as the P/E ratio.","no change in valuation multiples, because only expected earnings growth affects P/E ratios.","a decrease in equity valuation multiples such as the P/E ratio."],"a":2,"e":"A higher risk premium raises the required return r; since P/E = payout ratio / (r − g), the multiple falls. Higher multiples would require a lower r, and P/E does depend on the required return, not only on growth.","d":2,"t":"Equity risk premium and multiples","c":"Required return r = risk-free rate + equity risk premium (ERP). A higher ERP raises r and, all else equal, lowers valuation multiples (justified P/E = payout / (r − g)) and prices."},{"r":5,"q":"An analyst estimates the intrinsic value of a stock at $48. The stock trades at $42. If the analyst's estimate is correct, the stock is:","o":["overvalued","fairly valued","undervalued"],"a":2,"e":"Intrinsic value ($48) is above the market price ($42): the stock is undervalued and a buy candidate. It would be overvalued if the price exceeded intrinsic value, and fairly valued only if the two were (approximately) equal.","d":1,"t":"Intrinsic value vs market price","c":"If intrinsic value > market price, the stock is undervalued; if intrinsic value < market price, it is overvalued. The difference is the estimated mispricing."},{"r":5,"q":"A valuation model that estimates a stock's value as a multiple of its sales per share is best classified as a(n):","o":["multiplier model","present value model","asset-based valuation model"],"a":0,"e":"The price-to-sales ratio is a multiplier model (method of multiples). A present value model discounts future flows (dividends, FCFE), and an asset-based model values assets minus liabilities at fair value.","d":1,"t":"Categories of valuation models","c":"Three main families of models: present value (DCF: DDM, FCFE, FCFF), multiplier models (P/E, P/S, EV/EBITDA…) and asset-based models. A multiple applied to a per-share fundamental is a multiplier model."},{"r":5,"q":"Asset-based valuation models are most appropriate for valuing a company that:","o":["derives most of its value from intangible assets such as brands and human capital.","is being liquidated or holds mostly tangible assets with readily determinable market values.","is a fast-growing technology company with large expected future cash flows."],"a":1,"e":"The asset-based approach fits when value rests on tangible assets that are easy to measure at fair value, or in liquidation. It greatly understates companies whose value comes from intangibles or future growth cash flows, which are better captured by discounting cash flows.","d":1,"t":"Asset-based valuation applicability","c":"Asset-based models suit companies with mostly tangible assets that are easy to value at fair value (holding companies, natural resources, firms being liquidated), and fit poorly for companies rich in intangibles."},{"r":5,"q":"An analyst's estimate of intrinsic value differs substantially from a widely followed stock's market price. The analyst's most appropriate first step is to:","o":["immediately issue a strong buy or sell recommendation, since large differences indicate the largest opportunities.","conclude that the market is inefficient and that the model needs no further review.","re-examine the model's assumptions and inputs to see whether the difference reflects an error or a genuine mispricing."],"a":2,"e":"For a widely followed stock, the market is probably fairly efficient; a large gap should first raise suspicion of an assumption or model error. Issuing an immediate recommendation or concluding the market is inefficient without checking ignores this likelihood.","d":2,"t":"Confidence in mispricing estimates","c":"When an intrinsic value estimate for a widely followed stock differs sharply from the market price, the analyst should first re-examine the assumptions and model: a closely followed market is usually efficient, so a large gap often signals an estimation error."},{"r":5,"q":"A company has a market capitalization of $800 million, total debt of $300 million, preferred stock of $50 million, and cash and equivalents of $120 million. Its enterprise value is closest to:","o":["$1,030 million","$980 million","$1,150 million"],"a":0,"e":"Enterprise value = market capitalization + debt + preferred stock − cash = 800 + 300 + 50 − 120 = $1,030 million. $980 million omits preferred stock, and $1,150 million forgets to subtract cash.","d":2,"t":"Enterprise value","c":"Enterprise value (EV) = market capitalization + market value of debt + preferred stock + minority interest − cash and short-term investments."},{"r":5,"q":"Using an asset-based approach, an analyst estimates the fair value of a company's assets at $900 million and the fair value of its liabilities at $550 million. The company has 20 million shares outstanding. The estimated value per share is closest to:","o":["$45.00","$17.50","$27.50"],"a":1,"e":"Value per share = (fair value of assets − fair value of liabilities) / shares outstanding = (900 − 550) / 20 = $17.50. $45.00 ignores liabilities and $27.50 divides only the liabilities.","d":1,"t":"Asset-based value per share","c":"Value per share (asset-based approach) = (fair value of assets − fair value of liabilities, including preferred stock) / number of common shares."},{"r":5,"q":"Which statement about absolute and relative valuation is most accurate?","o":["If a stock is undervalued relative to its peers, it must also be undervalued on an absolute basis.","Relative valuation estimates intrinsic value directly from the present value of expected future cash flows.","A stock can appear undervalued relative to its peers while being overvalued on an absolute (intrinsic value) basis."],"a":2,"e":"Relative valuation compares a stock with its peers: if the whole sector is overvalued, a stock cheaper than its peers can still be overvalued in absolute terms. The second statement is therefore false, and discounting future cash flows describes absolute, not relative, valuation.","d":2,"t":"Absolute vs relative valuation","c":"Absolute valuation estimates intrinsic value from the company's fundamentals (DCF). Relative valuation compares multiples with those of comparable companies or history: it gives a relative value, not an intrinsic value."},{"r":5,"q":"The value of a company assuming it will continue operating into the foreseeable future is best described as its:","o":["going-concern value","liquidation value","fair market value under forced sale"],"a":0,"e":"Going-concern value assumes the company continues operating. Liquidation value instead assumes the assets are sold and operations cease, often at a discount in a forced sale.","d":1,"t":"Going-concern vs liquidation value","c":"Going-concern value assumes the company keeps operating; liquidation value is what the assets would fetch if sold separately. Fair value is the price between informed, willing parties."},{"r":6,"q":"A company just paid an annual dividend of $2.00. Dividends are expected to grow at 4% per year indefinitely, and the required return on equity is 9%. Using the Gordon growth model, the value of the stock is closest to:","o":["$41.60","$40.00","$43.26"],"a":0,"e":"V0 = D1 / (r − g) = 2.00 × 1.04 / (0.09 − 0.04) = 2.08 / 0.05 = $41.60. $40.00 uses D0 instead of D1, and $43.26 uses D2.","d":1,"t":"Gordon growth model","c":"Gordon (constant growth) DDM: V0 = D1 / (r − g), with D1 = D0 × (1 + g). Valid only if r > g and growth is constant forever."},{"r":6,"q":"A company just paid a dividend of $1.00. Dividends are expected to grow at 20% for the next two years and then at 5% per year indefinitely. The required return is 11%. The value of the stock today is closest to:","o":["$20.45","$22.70","$17.50"],"a":1,"e":"D1 = 1.20; D2 = 1.44; P2 = D3 / (r − g) = 1.512 / 0.06 = 25.20. V0 = 1.20 / 1.11 + (1.44 + 25.20) / 1.11² = $22.70. $20.45 omits the high-growth dividends, and $17.50 applies 5% growth from today.","d":3,"t":"Two-stage dividend discount model","c":"Multistage DDM: discount each dividend of the high-growth phase, then compute the terminal value at the end of that phase Vn = Dn+1 / (r − g) and discount it over n periods. V0 = Σ Dt/(1+r)^t + Vn/(1+r)^n."},{"r":6,"q":"A non-callable, non-convertible perpetual preferred share pays an annual dividend of $4.50. If investors require a 6% return, the value of the preferred share is closest to:","o":["$79.50","$70.75","$75.00"],"a":2,"e":"Value of a perpetual preferred share = D / r = 4.50 / 0.06 = $75.00. Because the dividend is fixed, neither growth ($79.50) nor an extra period of discounting ($70.75) should be applied.","d":1,"t":"Preferred share valuation","c":"Non-callable perpetual preferred share: V0 = D / r (a perpetuity). Its value moves inversely with the required return."},{"r":6,"q":"A stock trades at $50, the expected dividend next year is $2.00, and the required return is 10%. Assuming the Gordon growth model holds, the implied constant dividend growth rate is closest to:","o":["6.0%","14.0%","4.0%"],"a":0,"e":"g = r − D1 / P0 = 10% − 2.00 / 50 = 10% − 4% = 6.0%. 14.0% adds the dividend yield instead of subtracting it, and 4.0% is the dividend yield itself.","d":2,"t":"Implied growth rate","c":"Rearranging the Gordon model, the implied growth rate is g = r − D1 / P0, and the implied required return is r = D1 / P0 + g."},{"r":6,"q":"A company has a return on equity of 15% and a dividend payout ratio of 40%. Its sustainable growth rate is closest to:","o":["6.0%","9.0%","15.0%"],"a":1,"e":"g = ROE × retention rate = 15% × (1 − 0.40) = 9.0%. 6.0% multiplies ROE by the payout ratio instead of the retention rate, and 15.0% assumes all earnings are reinvested.","d":1,"t":"Sustainable growth rate","c":"Sustainable growth rate g = b × ROE, where b = retention rate = 1 − dividend payout ratio."},{"r":6,"q":"A company's free cash flow to the firm (FCFF) next year is expected to be $120 million, growing at 3% per year indefinitely. Its WACC is 8%, the market value of its debt is $600 million, and it has 50 million shares outstanding. The value per share is closest to:","o":["$48.00","$18.00","$36.00"],"a":2,"e":"Firm value = FCFF1 / (WACC − g) = 120 / 0.05 = $2,400 million; equity = 2,400 − 600 = $1,800 million; per share = 1,800 / 50 = $36.00. $48.00 forgets to subtract debt, and $18.00 omits growth in the denominator.","d":2,"t":"FCFF valuation","c":"Firm value with FCFF: V_firm = FCFF1 / (WACC − g). Equity value = firm value − market value of debt (and preferred stock); divide by shares outstanding for value per share."},{"r":6,"q":"The Gordon (constant) growth model is most appropriate for valuing a company that:","o":["is mature, pays dividends, and is expected to grow at a stable rate below the required return.","pays no dividends and is in a high-growth phase.","is expected to grow at a rate higher than its required rate of return indefinitely."],"a":0,"e":"The Gordon model assumes constant, perpetual dividend growth below the required return: it suits mature, dividend-paying companies. A high-growth company paying no dividend needs a multistage or FCFE model, and if g ≥ r the model gives no finite value.","d":1,"t":"Applicability of the Gordon growth model","c":"The Gordon model suits mature companies paying dividends linked to earnings, with stable growth below the required return and no higher than the long-term growth rate of the economy."},{"r":6,"q":"A company is not expected to pay dividends for the next three years. It is expected to pay its first dividend of $2.00 at the end of Year 4, with dividends growing at 5% per year thereafter. If the required return is 12%, the value of the stock today is closest to:","o":["$28.57","$20.34","$18.16"],"a":1,"e":"P3 = D4 / (r − g) = 2.00 / 0.07 = $28.57; V0 = 28.57 / 1.12³ = $20.34. $28.57 is not discounted, and $18.16 discounts over four periods even though the Gordon model already gives a value at the end of Year 3.","d":3,"t":"Delayed-dividend DDM","c":"For a company not yet paying dividends, compute the value at t = n − 1 with the Gordon model (Vn−1 = Dn / (r − g)), then discount it back n − 1 periods to today."},{"r":7,"q":"A company has a dividend payout ratio of 40%, a required return on equity of 10%, and an expected constant growth rate of 6%. Its justified forward P/E ratio is closest to:","o":["10.6","10.0","15.0"],"a":1,"e":"Justified forward P/E = payout ratio / (r − g) = 0.40 / 0.04 = 10.0. 10.6 is the justified trailing P/E, which multiplies by (1 + g), and 15.0 wrongly uses the retention rate.","d":2,"t":"Justified forward P/E","c":"Justified forward (leading) P/E = (D1/E1) / (r − g) = payout ratio / (r − g). Justified trailing P/E = payout × (1 + g) / (r − g)."},{"r":7,"q":"A stock has a P/E ratio of 18 and an expected earnings growth rate of 12%. Its PEG ratio is closest to:","o":["0.67","2.16","1.50"],"a":2,"e":"PEG = P/E / expected growth (in percentage points) = 18 / 12 = 1.50. 0.67 is the inverted ratio, and 2.16 multiplies P/E by the growth rate.","d":1,"t":"PEG ratio","c":"PEG ratio = P/E / expected EPS growth expressed in percentage points (e.g., 12, not 0.12). A lower PEG suggests a relatively more attractive stock, given comparable risk."},{"r":7,"q":"When comparing companies with significantly different capital structures, which multiple is most appropriate?","o":["EV/EBITDA","P/E","Price-to-book"],"a":0,"e":"EV/EBITDA relates the value to all capital providers to a pre-interest earnings measure, so it is little affected by financial leverage. P/E and P/B are equity multiples, sensitive to interest expense and the structure of liabilities.","d":1,"t":"EV/EBITDA and capital structure","c":"EV/EBITDA is an enterprise value multiple: EBITDA is a pre-interest flow to all capital providers, so the ratio is relatively insensitive to differences in capital structure (leverage), unlike P/E."},{"r":7,"q":"The price-to-book ratio is most appropriate for valuing:","o":["software companies with significant internally developed intangible assets.","banks and other financial institutions whose assets are largely carried at or near market value.","service companies with few tangible assets."],"a":1,"e":"P/B is relevant when assets are mainly financial and carried close to market value, as at banks. For companies whose value rests on unrecognized intangibles (software, services), book value is not very meaningful.","d":1,"t":"P/B applicability","c":"P/B suits companies whose assets are mostly liquid and carried near market value (banks, insurers). It is less relevant for companies rich in unrecorded intangibles or with negative equity."},{"r":7,"q":"A company has a sustainable ROE of 14%, a long-term growth rate of 5%, and a required return on equity of 10%. Its justified price-to-book ratio is closest to:","o":["1.4","2.8","1.8"],"a":2,"e":"Justified P/B = (ROE − g) / (r − g) = (0.14 − 0.05) / (0.10 − 0.05) = 1.8. 1.4 simply divides ROE by r (the no-growth case), and 2.8 divides ROE by (r − g) without subtracting g in the numerator.","d":3,"t":"Justified price-to-book","c":"Justified P/B = (ROE − g) / (r − g). An ROE above the required return (ROE > r) justifies a P/B above 1."},{"r":7,"q":"A stock trades at $60. The company reported EPS of $4.00, which includes a non-recurring gain of $0.80 per share. The trailing P/E based on underlying (recurring) earnings is closest to:","o":["18.75","15.00","12.50"],"a":0,"e":"Recurring EPS = 4.00 − 0.80 = $3.20; P/E = 60 / 3.20 = 18.75. 15.00 uses reported EPS including the non-recurring item, and 12.50 adds the gain instead of subtracting it.","d":2,"t":"Underlying earnings and P/E","c":"To compare P/Es, use underlying (normalized) earnings by removing non-recurring items: underlying EPS = reported EPS − one-off gains (+ one-off losses); P/E = price / underlying EPS."},{"r":7,"q":"Which is most likely an advantage of the price-to-sales ratio over the P/E ratio?","o":["The price-to-sales ratio captures differences in cost structures and profit margins across companies.","Sales are positive even when earnings are negative, and are less easily manipulated than earnings.","Sales reflect the claims of equity holders only, consistent with using share price in the numerator."],"a":1,"e":"Sales are almost always positive and less prone to accounting manipulation than earnings, which makes P/S useful for loss-making companies. However, P/S does not reflect differences in margins, and sales accrue to all capital providers, which is inconsistent with a share price in the numerator.","d":2,"t":"Price-to-sales ratio","c":"The price-to-sales ratio (P/S) works even for loss-making or cyclical companies, and sales are more stable and harder to manipulate than earnings. Limitation: it ignores differences in margins and cost structures."},{"r":7,"q":"A key limitation of the method of comparables is that:","o":["it cannot be applied to companies that do not pay dividends.","it requires explicit long-term forecasts of free cash flows.","a stock judged undervalued relative to its peers may still be overvalued if the entire peer group is overvalued."],"a":2,"e":"The method of comparables relies on the law of one price: it only gives a relative value, so if the whole peer group is overvalued, that overvaluation carries into the estimate. It can be applied to non-dividend payers, and it is discounting models (not multiples) that require long-term cash flow forecasts.","d":2,"t":"Method of comparables limitations","c":"The method of comparables gives a relative value: if all the comparables (or the market) are overvalued, the target will be too. It also depends on choosing genuinely comparable companies."},{"r":8,"q":"A company's revenue was $500 million last year and is forecast to grow by 6%. Cost of goods sold is forecast at 62% of revenue. Forecast gross profit is closest to:","o":["$190.0 million","$328.6 million","$201.4 million"],"a":2,"e":"Forecast revenue = 500 × 1.06 = $530 million; gross profit = 530 × (1 − 0.62) = $201.4 million. $190.0 million ignores revenue growth, and $328.6 million is cost of goods sold, not gross profit.","d":1,"t":"Gross profit forecast","c":"Gross profit forecast: forecast revenue = revenue × (1 + growth); COGS = COGS % of revenue × forecast revenue; gross profit = forecast revenue − COGS = forecast revenue × (1 − COGS/revenue)."},{"r":8,"q":"An analyst forecasts revenue of $730 million and days sales outstanding (DSO) of 45 days, using a 365-day year. The forecast accounts receivable balance is closest to:","o":["$90.0 million","$16.2 million","$91.25 million"],"a":0,"e":"Accounts receivable = revenue / 365 × DSO = 730 / 365 × 45 = 2 × 45 = $90.0 million. $16.2 million divides revenue by DSO (that gives a turnover, not a balance), and $91.25 million uses a 360-day year contrary to the question.","d":2,"t":"Working capital forecast using DSO","c":"Forecasting working capital with turnover ratios: receivables = revenue × DSO / 365; inventory = COGS × DOH / 365; payables = COGS (or purchases) × DPO / 365."},{"r":8,"q":"A company's debt is $400 million at the beginning of the year and is forecast to be $500 million at year-end. If the interest rate on debt is 6%, forecast interest expense based on average debt is closest to:","o":["$24 million","$27 million","$30 million"],"a":1,"e":"Interest expense = rate × average debt = 6% × (400 + 500) / 2 = 6% × 450 = $27 million. $24 million uses beginning debt and $30 million uses ending debt.","d":1,"t":"Interest expense forecast","c":"Forecast interest expense = interest rate × average debt for the period, where average debt = (beginning debt + ending debt) / 2 (or beginning debt if the question says so)."},{"r":8,"q":"An analyst forecasts a company's revenue by estimating the growth of its overall market and the company's expected market share. This approach is best described as:","o":["a bottom-up approach","a hybrid time-series approach","a top-down approach"],"a":2,"e":"Starting from the size and growth of the market and deriving sales via market share is a top-down approach. A bottom-up approach starts from company-specific data (capacity, stores, prices and volumes), and time-series extrapolation is also a bottom-up method.","d":1,"t":"Top-down vs bottom-up forecasting","c":"Top-down approach: start from the economy or market (size, growth), then apply the company's market share. Bottom-up approach: start from company data (volumes, prices, segments, capacity). Hybrid = a combination of both."},{"r":8,"q":"A company has annual fixed operating costs of $300 million and variable costs equal to 40% of revenue. Revenue is $1,000 million and is forecast to rise by 10%. The forecast percentage increase in operating profit (EBIT) is closest to:","o":["20%","10%","6%"],"a":0,"e":"Current EBIT = 1,000 × 0.60 − 300 = $300 million; forecast EBIT = 1,100 × 0.60 − 300 = $360 million; increase = 360 / 300 − 1 = 20%. Operating leverage (DOL = 600 / 300 = 2) amplifies the 10% revenue increase; 10% ignores fixed costs, and 6% only adds the contribution margin ($60 million) as a percentage of revenue.","d":3,"t":"Operating leverage in forecasting","c":"With fixed costs, EBIT changes more than revenue (operating leverage). DOL = contribution margin / EBIT = % change in EBIT / % change in revenue. Recompute EBIT as revenue × (1 − variable cost ratio) − fixed costs."},{"r":8,"q":"When forecasting a company's future income tax expense, an analyst should most appropriately:","o":["use the most recent reported effective tax rate, including all one-time tax benefits.","use a normalized effective tax rate that excludes the effect of one-off tax items.","assume a tax rate of zero for any year in which the company used tax loss carryforwards."],"a":1,"e":"The forecast should reflect a recurring tax rate: one-off items (exceptional credits, settlements of tax disputes) should be excluded. Using the latest reported rate would include these non-recurring items, and tax loss carryforwards are limited in time, so a zero rate is not sustainable.","d":2,"t":"Tax rate forecasting","c":"To forecast taxes, use a normalized effective tax rate that excludes one-off items and reflects the geographic mix of earnings and changes in tax law. The statutory rate is used only as a fallback."},{"r":8,"q":"In forecasting capital expenditures, an analyst most likely expects that for a company in a steady state with little growth, capital expenditures will be:","o":["substantially above depreciation, reflecting large growth investments.","close to zero, since no expansion is planned.","approximately equal to depreciation, reflecting mainly maintenance spending."],"a":2,"e":"For a company with no growth, capital expenditures mainly maintain the asset base and are therefore close to depreciation. Capex far above depreciation indicates an expansion phase, and zero capex would not maintain production capacity.","d":1,"t":"Maintenance vs growth capex","c":"Maintenance capex replaces worn-out assets and is roughly equal to depreciation for a stable company (adjusted for inflation). Growth capex funds expansion and is linked to volume growth."},{"r":8,"q":"A company's cost of goods sold equals 60% of revenue. Its input costs are expected to rise by 10%, with volumes unchanged. The price increase required to keep its gross margin percentage unchanged is closest to:","o":["10%","6%","4%"],"a":0,"e":"On revenue of 100, COGS rises from 60 to 66. To keep a 40% gross margin, revenue must be 66 / 0.60 = 110, i.e., a 10% price increase. 6% only preserves the gross profit amount (revenue of 106 for gross profit of 40), which brings the margin down to 37.7%; 4% has no economic justification (10% × 40%).","d":3,"t":"Input cost inflation pass-through","c":"Input cost inflation pass-through: to keep the gross margin percentage constant, prices must rise by the same percentage as COGS (here input costs). Merely preserving the gross profit amount requires a smaller price increase, equal to COGS share of revenue × input cost increase."},{"r":9,"q":"According to Porter's five forces framework, high switching costs for customers most likely:","o":["reduce the bargaining power of buyers.","increase the bargaining power of buyers.","increase the threat of substitute products."],"a":0,"e":"High switching costs make it expensive for customers to move to a competitor: their bargaining power falls and industry profitability improves. Buyer power would increase only if switching costs were low, and high switching costs reduce rather than increase the threat of substitutes.","d":1,"t":"Porter's five forces: buyer power","c":"Porter's five forces: threat of new entrants, supplier power, buyer power, threat of substitutes, and intensity of rivalry. High switching costs reduce buyers' bargaining power and the threat of substitutes."},{"r":9,"q":"An industry consists of four firms with market shares of 40%, 30%, 20%, and 10%. The Herfindahl-Hirschman Index (HHI) is closest to:","o":["2,500","3,000","100"],"a":1,"e":"HHI = sum of squared market shares = 40² + 30² + 20² + 10² = 1,600 + 900 + 400 + 100 = 3,000. 2,500 is the HHI of an industry with four equal-sized firms (4 × 25²), and 100 is the sum of the shares, not of their squares.","d":2,"t":"Herfindahl-Hirschman Index","c":"Herfindahl-Hirschman Index (HHI) = Σ (market share)², with shares in decimals (result between 0 and 1) or in percent (result up to 10,000). The higher it is, the more concentrated the industry; 1/HHI = equivalent number of equal-sized firms."},{"r":9,"q":"An industry's largest firms have market shares of 25%, 20%, 15%, 10%, 8%, and 7%; the remainder is shared by many small firms. The four-firm concentration ratio is closest to:","o":["60%","85%","70%"],"a":2,"e":"Four-firm concentration ratio = sum of the shares of the four largest firms = 25 + 20 + 15 + 10 = 70%. 60% adds only the top three, and 85% the top six.","d":1,"t":"Concentration ratio","c":"N-firm concentration ratio (CR_N) = sum of the market shares of the N largest firms. Unlike the HHI, it ignores how share is distributed among those firms."},{"r":9,"q":"An industry experiencing slowing demand growth, intense price competition, overcapacity, and the exit of weaker firms is most likely in which stage of the industry life cycle?","o":["Shakeout","Growth","Embryonic"],"a":0,"e":"The shakeout stage is characterized by slowing growth, overcapacity, price competition, and the exit of the weakest players. The growth stage features rapidly rising demand and weaker competition, and the embryonic stage slow growth with high prices.","d":2,"t":"Industry life cycle","c":"Industry life cycle: embryonic, growth, shakeout (slowing demand, overcapacity, price wars, exits), mature (slow growth, consolidation), decline."},{"r":9,"q":"Which industry is most likely classified as defensive?","o":["Automobile manufacturing","Electric utilities","Luxury goods"],"a":1,"e":"Electric utilities sell essential services whose demand is not very sensitive to the business cycle: it is a defensive industry. Automobiles and luxury goods are cyclical industries whose demand depends heavily on economic conditions and disposable income.","d":1,"t":"Cyclical vs defensive industries","c":"Cyclical industry: demand sensitive to the economic cycle (autos, durable goods, materials). Defensive (non-cyclical) industry: stable demand throughout the cycle (consumer staples, health care, utilities)."},{"r":9,"q":"In a PESTLE analysis, an aging population that changes demand for healthcare services is best classified as a:","o":["political factor","technological factor","social factor"],"a":2,"e":"Demographic changes (aging, population structure, lifestyles) are social factors. Political factors relate to government action and stability, and technological factors to innovation and its effects on supply and demand.","d":1,"t":"PESTLE analysis","c":"PESTLE: Political, Economic, Social (demographics, lifestyles, tastes), Technological, Legal and Environmental factors. Demographics fall under social/demographic factors."},{"r":9,"q":"Which combination of industry characteristics most likely leads to the most intense competitive rivalry?","o":["Undifferentiated products, high fixed costs, and slow industry growth","Highly differentiated products, low fixed costs, and rapid industry growth","Few competitors with dominant market shares and high barriers to entry"],"a":0,"e":"Standardized products (price competition), high fixed costs (incentive to fill capacity) and slow growth (market share gains only at competitors' expense) intensify rivalry. Differentiation and rapid growth reduce it, as does high concentration with barriers to entry.","d":2,"t":"Intensity of rivalry","c":"Rivalry is more intense when there are many similarly sized competitors, slow growth, high fixed costs, undifferentiated products, low switching costs and high exit barriers."},{"r":9,"q":"An analyst estimates that a market has 20 million households, of which 30% will adopt a product at an average annual spend of $250 per household. If the company captures a 12% market share, its forecast annual revenue is closest to:","o":["$1,500 million","$180 million","$600 million"],"a":1,"e":"Addressable market = 20 million × 30% × $250 = $1.5 billion; revenue = $1.5 billion × 12% = $180 million. $1,500 million is the size of the entire market, and $600 million omits the 30% adoption rate.","d":2,"t":"Market sizing","c":"Market size = number of potential units (households, users) × adoption (penetration) rate × average spend per unit."},{"r":10,"q":"A company reports EBIT of $150 million, faces a tax rate of 25%, and has average invested capital of $900 million. Its return on invested capital (ROIC) is closest to:","o":["16.7%","12.5%","4.2%"],"a":1,"e":"ROIC = NOPAT / invested capital = 150 × (1 − 0.25) / 900 = 112.5 / 900 = 12.5%. 16.7% uses pre-tax EBIT, and 4.2% applies the tax rate instead of its complement.","d":2,"t":"Return on invested capital","c":"ROIC = NOPAT / average invested capital, with NOPAT = EBIT × (1 − tax rate). Invested capital = equity + net debt (or working capital + operating fixed assets)."},{"r":10,"q":"A company is most likely creating value for its shareholders when:","o":["its revenue grows faster than the industry average, regardless of returns on capital.","its return on invested capital is positive but below its weighted average cost of capital.","its return on invested capital consistently exceeds its weighted average cost of capital."],"a":2,"e":"Value creation requires the return on invested capital to exceed its cost (ROIC > WACC). Revenue growth financed at an ROIC below WACC destroys value, and an ROIC that is merely positive but below WACC does not adequately compensate capital providers.","d":1,"t":"ROIC vs WACC and value creation","c":"A company creates value when its ROIC exceeds its cost of capital (WACC): each unit invested earns more than it costs. Growth with ROIC < WACC destroys value."},{"r":10,"q":"A company has days sales outstanding of 40, days of inventory on hand of 55, and days payables outstanding of 35. Its cash conversion cycle is closest to:","o":["60 days","130 days","50 days"],"a":0,"e":"Cash conversion cycle = DSO + DIO − DPO = 40 + 55 − 35 = 60 days. 130 days adds all three components, and 50 days wrongly subtracts DSO (55 + 35 − 40).","d":1,"t":"Cash conversion cycle","c":"Cash conversion cycle = DSO + DOH − DPO (days of receivables + days of inventory − days of payables)."},{"r":10,"q":"A company has a net profit margin of 5%, total asset turnover of 1.6, and a financial leverage ratio (average assets / average equity) of 2.0. Its return on equity is closest to:","o":["8%","16%","4%"],"a":1,"e":"ROE (DuPont) = net margin × asset turnover × leverage = 5% × 1.6 × 2.0 = 16%. 8% is ROA (without leverage) and 4% divides by leverage instead of multiplying.","d":2,"t":"DuPont analysis","c":"Three-factor DuPont: ROE = net profit margin × asset turnover × financial leverage = (NI/Sales) × (Sales/Average assets) × (Average assets/Average equity)."},{"r":10,"q":"Compared with a company selling products through one-time transactions, a company with a subscription-based business model most likely has:","o":["revenue that is more sensitive to individual large orders.","no need to track customer retention metrics.","more predictable and recurring revenue."],"a":2,"e":"A subscription model generates recurring revenue that is more predictable from one period to the next. Dependence on large one-off orders characterizes a transactional model, and retention (churn) is in fact a key metric for subscription models.","d":1,"t":"Business model analysis","c":"A subscription model generates recurring, more predictable revenue, better visibility and often higher customer value than a transactional (one-time sale) model, at the cost of upfront customer acquisition costs."},{"r":10,"q":"A subscription business earns average revenue of $20 per user per month with a 75% gross margin. Its monthly customer churn rate is 2.5%. Ignoring discounting, the estimated gross-profit lifetime value of a customer is closest to:","o":["$600","$800","$180"],"a":0,"e":"Average customer life = 1 / 2.5% = 40 months; LTV = 20 × 75% × 40 = $600. $800 ignores the gross margin (computed on revenue), and $180 counts only one year of gross profit.","d":3,"t":"Customer lifetime value","c":"Simplified customer lifetime value (no discounting) = revenue per period × gross margin / churn rate per period; 1/churn = average customer lifetime."},{"r":10,"q":"A company expects unit volumes to rise by 4% and average selling prices to rise by 3% next year. Its expected revenue growth is closest to:","o":["7.00%","7.12%","1.00%"],"a":1,"e":"Revenue growth = (1 + volume) × (1 + price) − 1 = 1.04 × 1.03 − 1 = 7.12%. 7.00% is the additive approximation that omits the cross term, and 1.00% subtracts the two effects.","d":2,"t":"Volume and price revenue drivers","c":"Revenue growth = (1 + volume growth) × (1 + price growth) − 1 ≈ sum of the two rates (the approximation omits the cross term)."},{"r":10,"q":"Which observation is most likely a warning sign about the quality of a company's reported revenue?","o":["Operating cash flow consistently exceeding net income.","Days sales outstanding remaining stable while revenue grows.","Accounts receivable growing significantly faster than revenue over several periods."],"a":2,"e":"Receivables growing much faster than revenue can signal aggressive revenue recognition (sales not being collected). Operating cash flow exceeding net income and stable DSO are, on the contrary, signs of good earnings quality.","d":2,"t":"Earnings quality red flags","c":"Revenue quality red flags: receivables (DSO) rising faster than revenue, premature revenue recognition, end-of-period sales (channel stuffing), and a persistent gap between net income and operating cash flow."},{"r":11,"q":"A stock trades at $40. An analyst's 12-month target price is $46, and she expects a dividend of $1.00 during the year. The expected total return is closest to:","o":["15.0%","2.5%","17.5%"],"a":2,"e":"Expected total return = (target price − current price + dividend) / current price = (46 − 40 + 1) / 40 = 17.5%. 15.0% ignores the dividend and 2.5% counts only the dividend yield.","d":1,"t":"Expected total return from target price","c":"Expected total return = (target price − current price + expected dividend) / current price."},{"r":11,"q":"Which element is least likely to be considered essential in an equity research report?","o":["A detailed narrative of the company's founding history","A clear investment thesis and valuation supporting the recommendation","A discussion of the key risks to the investment thesis"],"a":0,"e":"A research report must contain an investment thesis, a valuation supporting the recommendation, and the key risks. A detailed history of the company's founding is rarely useful for the investment decision and is not an essential element.","d":1,"t":"Components of a research report","c":"A research report contains: the recommendation and investment thesis, company and industry analysis, forecasts and valuation, risks, and regulatory disclosures. Elements unrelated to the investment decision are not essential."},{"r":11,"q":"An effective equity research report most likely:","o":["presents the valuation as a single precise figure without discussing sensitivity to assumptions.","clearly distinguishes facts from the analyst's opinions and discloses the key assumptions behind the valuation.","omits discussion of risks so as not to weaken the recommendation."],"a":1,"e":"A good report clearly separates facts from opinions and sets out the key assumptions and the valuation's sensitivity to them. Presenting a single value with no sensitivity analysis or omitting risks gives a false impression of certainty and undermines objectivity.","d":2,"t":"Quality of research reports","c":"A good research report is clear, consistent and objective: it separates facts from opinions, states key assumptions, quantifies risks and scenarios, and clearly links the analysis to the recommendation."},{"r":11,"q":"An analyst owns shares in a company she is about to recommend in a research report. She should most appropriately:","o":["sell the shares before publication and make no disclosure.","publish the report without disclosure because personal holdings are confidential.","disclose the ownership in the report as a potential conflict of interest."],"a":2,"e":"Conflicts of interest that could affect objectivity, such as personal holdings of the stock, must be disclosed in the report. Selling the shares without disclosure does not satisfy the duty of transparency to readers, and the confidentiality of personal holdings does not override this obligation.","d":2,"t":"Disclosure of conflicts of interest","c":"Analysts must fully and clearly disclose any conflict of interest (share ownership, business relationships, compensation) that could impair their objectivity, in line with Standard VI(A) Disclosure of Conflicts."},{"r":11,"q":"An analyst assigns a 25% probability to a bull case value of $60, a 50% probability to a base case value of $48, and a 25% probability to a bear case value of $30. The probability-weighted value is closest to:","o":["$46.50","$46.00","$48.00"],"a":0,"e":"Weighted value = 0.25 × 60 + 0.50 × 48 + 0.25 × 30 = 15 + 24 + 7.5 = $46.50. $46.00 is a simple average that ignores the probabilities, and $48.00 uses only the base case.","d":2,"t":"Probability-weighted scenario value","c":"Scenario-weighted value = Σ (scenario probability × value in that scenario), with probabilities summing to 100%."},{"r":11,"q":"A research firm rates a stock 'Buy' if its expected total return exceeds the required return by more than 5 percentage points, 'Sell' if it falls short of the required return by more than 5 percentage points, and 'Hold' otherwise. A stock trades at $50, has a target price of $54, an expected dividend of $1.00, and a required return of 9%. The most appropriate rating is:","o":["Buy","Hold","Sell"],"a":1,"e":"Expected return = (54 − 50 + 1) / 50 = 10%, 1 point above the 9% required return and within the ±5-point band: the rating is 'Hold'. 'Buy' would require a return above 14% and 'Sell' a return below 4%.","d":2,"t":"Rating systems in research reports","c":"Rating systems typically compare the expected total return (target price plus dividends) with the required return or a benchmark; the recommendation depends on the gap relative to defined thresholds."},{"r":11,"q":"A well-constructed investment thesis in an equity research report is best described as one that:","o":["is broad enough to remain valid under any future outcome.","relies mainly on the consensus view of other analysts.","is specific, identifies catalysts, and states what developments would prove it wrong."],"a":2,"e":"A good thesis is specific, falsifiable (it is clear what would invalidate it) and identifies catalysts that will lead the market to recognize the value. A thesis valid under every outcome conveys no information, and relying on consensus offers no differentiated view.","d":3,"t":"Investment thesis","c":"A strong investment thesis is concise, explains why the market misprices the stock (variant perception), identifies catalysts and states what would invalidate it."},{"r":11,"q":"After publishing a 'Buy' recommendation, an analyst learns of new information that invalidates a central assumption of the investment thesis. The analyst should most appropriately:","o":["promptly update the analysis and, if warranted, revise the recommendation and communicate the change.","maintain the recommendation until the next scheduled quarterly update.","ignore the information because changing recommendations frequently damages credibility."],"a":0,"e":"When a central assumption is invalidated, the analyst must promptly revise the analysis and, if warranted, the recommendation, then inform clients. Waiting for the next scheduled publication or ignoring the information leaves investors with a recommendation that no longer has a reasonable basis.","d":2,"t":"Updating research recommendations","c":"When a central assumption of the thesis is invalidated, the analyst should promptly reassess the recommendation and publish an update; keeping an outdated recommendation fails the duties of objectivity and diligence."},{"r":12,"q":"The risk-free rate is 3%, the expected market risk premium is 6%, and a stock's beta is 1.2. Using the CAPM, the stock's required return is closest to:","o":["10.2%","10.8%","7.2%"],"a":0,"e":"E(R) = Rf + β × market premium = 3% + 1.2 × 6% = 10.2%. 10.8% multiplies beta by the total market return (9%) instead of the premium, and 7.2% omits the risk-free rate.","d":1,"t":"CAPM required return","c":"CAPM: E(Ri) = Rf + βi × [E(Rm) − Rf]. The market risk premium is [E(Rm) − Rf]; do not confuse it with the market return E(Rm)."},{"r":12,"q":"A stock has a standard deviation of returns of 30%, the market's standard deviation is 15%, and the correlation between the stock and the market is 0.6. The stock's beta is closest to:","o":["0.30","1.20","2.00"],"a":1,"e":"β = ρ × σi / σm = 0.6 × 30% / 15% = 1.20. 0.30 inverts the ratio of standard deviations, and 2.00 ignores the correlation.","d":2,"t":"Beta calculation","c":"Beta = Cov(Ri, Rm) / σm² = ρ(i,m) × σi / σm."},{"r":12,"q":"The risk-free rate is 3% and the expected market return is 10%. An analyst forecasts a 12% return for a stock with a beta of 1.1. Based on the security market line, the stock is most likely:","o":["overvalued","fairly valued","undervalued"],"a":2,"e":"Required return (SML) = 3% + 1.1 × (10% − 3%) = 10.7%. The forecast return (12%) is higher: the stock plots above the SML, so it is undervalued. An overvalued stock would plot below the SML, and a fairly valued one exactly on the line.","d":2,"t":"Security market line","c":"If the forecast return > the CAPM required return, the stock plots above the SML and is undervalued (buy). If it plots below the SML, it is overvalued."},{"r":12,"q":"Using the market model, a stock has an estimated alpha of 0.5% and a beta of 0.9. If the market return for the period is 4%, the predicted return on the stock is closest to:","o":["4.1%","3.6%","4.5%"],"a":0,"e":"Ri = αi + βi × Rm = 0.5% + 0.9 × 4% = 0.5% + 3.6% = 4.1%. 3.6% omits alpha, and 4.5% ignores beta.","d":1,"t":"Market model","c":"Market model: Ri = αi + βi × Rm + εi. The predicted return is αi + βi × Rm (the error term has an expected value of zero)."},{"r":12,"q":"A portfolio earned 14% when the market return was 10% and the risk-free rate was 3%. The portfolio's beta is 1.3. Jensen's alpha is closest to:","o":["4.0%","1.9%","11.0%"],"a":1,"e":"Required return = 3% + 1.3 × (10% − 3%) = 12.1%; Jensen's alpha = 14% − 12.1% = 1.9%. 4.0% simply compares with the market without adjusting for risk, and 11.0% is the portfolio's excess return over the risk-free rate.","d":2,"t":"Jensen's alpha","c":"Jensen's alpha = Rp − [Rf + βp × (Rm − Rf)]: realized return minus the CAPM required return. Positive = outperformance after adjusting for systematic risk."},{"r":12,"q":"According to the CAPM, investors are compensated for bearing:","o":["unsystematic risk only.","total risk, including both systematic and unsystematic risk.","systematic risk only."],"a":2,"e":"Unsystematic (specific) risk can be eliminated through diversification, so under the CAPM it is not rewarded. Only systematic risk, measured by beta, earns a risk premium; total risk is therefore not the relevant measure.","d":1,"t":"Systematic vs unsystematic risk","c":"Under the CAPM, only systematic (market) risk, measured by β, is rewarded; unsystematic risk can be diversified away and earns no premium."},{"r":12,"q":"Using a Fama-French three-factor model, a stock has a market factor sensitivity of 1.0, a size (SMB) sensitivity of 0.4, and a value (HML) sensitivity of -0.3. The risk-free rate is 3%, the market risk premium is 5%, the SMB premium is 2%, and the HML premium is 3%. The stock's expected return is closest to:","o":["7.9%","9.7%","4.9%"],"a":0,"e":"E(R) = 3% + 1.0 × 5% + 0.4 × 2% + (−0.3) × 3% = 3% + 5% + 0.8% − 0.9% = 7.9%. 9.7% ignores the negative sign of the HML sensitivity, and 4.9% omits the risk-free rate.","d":3,"t":"Fama-French three-factor model","c":"Fama-French three-factor model: E(Ri) − Rf = βmkt × (Rm − Rf) + βSMB × SMB + βHML × HML. SMB = size premium (small minus big), HML = value premium (high minus low book-to-market)."},{"r":12,"q":"A stock has a beta of 1.2 and a standard deviation of returns of 30%. The market's standard deviation is 18%. The proportion of the stock's total variance explained by systematic risk is closest to:","o":["72.0%","51.8%","48.2%"],"a":1,"e":"Systematic variance = (β × σm)² = (1.2 × 18%)² = 0.046656; total variance = 0.30² = 0.09; systematic share = 0.046656 / 0.09 = 51.8%. 72.0% compares standard deviations rather than variances, and 48.2% is the share of specific risk.","d":3,"t":"Decomposition of total risk","c":"Total risk: σi² = βi² × σm² + σ²(ε). Systematic share = βi² × σm² / σi² (= R² of the regression = ρ²); the remainder is specific risk."}]},{"subject":6,"questions":[{"r":1,"q":"The legal contract that specifies the obligations of a bond issuer and the rights of the bondholders is best described as the:","o":["affirmative covenant.","bond indenture.","credit default swap."],"a":1,"e":"The indenture (trust deed) is the legal contract that describes the form of the bond, the issuer's obligations and the bondholders' rights. An affirmative covenant is only one part of that contract, and a CDS is a credit derivative separate from the issue.","d":1,"t":"Bond indenture","c":"The bond indenture (trust deed) is the legal contract between issuer and bondholders: it sets out the bond's features, the issuer's obligations (covenants) and the investors' rights. A trustee typically monitors compliance on behalf of bondholders."},{"r":1,"q":"Which of the following provisions in a bond indenture is most likely classified as an affirmative covenant?","o":["A negative pledge clause preventing the issuer from pledging assets to other lenders","A limitation on the sale of the issuer's operating assets","A pari passu clause requiring the bonds to rank equally with the issuer's other senior unsecured debt"],"a":2,"e":"Affirmative covenants require the issuer to do something; the curriculum classifies pari passu and cross-default clauses as affirmative. A negative pledge and a limit on asset sales restrict the issuer's actions: they are negative covenants.","d":3,"t":"Affirmative vs negative covenants","c":"Affirmative covenants oblige the issuer to do things (pay on time, maintain assets, pari passu, cross-default). Negative covenants prohibit actions (negative pledge, limits on additional debt, asset sales or distributions)."},{"r":1,"q":"An unsecured bond backed only by the general creditworthiness of the issuer is best described as a:","o":["covered bond.","collateral trust bond.","debenture."],"a":2,"e":"A debenture is unsecured debt, backed only by the issuer's general creditworthiness. A covered bond benefits from a segregated asset pool (dual recourse), and a collateral trust bond is secured by financial securities.","d":1,"t":"Secured vs unsecured debt","c":"Secured debt is backed by specific collateral (e.g., collateral trust bonds, equipment trust certificates); unsecured debt (debentures) relies only on the issuer's general credit. Covered bonds give dual recourse: to the issuer and to a segregated cover pool."},{"r":1,"q":"An investor holds 50 bonds, each with a par value of 1,000, paying a 4.5% annual coupon in semiannual installments. The total amount of each coupon payment received is closest to:","o":["2,250.00","1,125.00","22.50"],"a":1,"e":"Semiannual coupon per bond = 4.5% / 2 × 1,000 = 22.50; for 50 bonds: 22.50 × 50 = 1,125.00. 2,250 is the total annual coupon and 22.50 is the coupon on a single bond.","d":1,"t":"Coupon payment","c":"Periodic coupon = (annual coupon rate ÷ number of payments per year) × par value × number of bonds held. The coupon rate is always applied to par, not to the market price."},{"r":1,"q":"Which of the following is an example of an external credit enhancement?","o":["Subordination of junior tranches","Overcollateralization","A letter of credit provided by a bank"],"a":2,"e":"A letter of credit (like a guarantee or a surety bond) is provided by a third party: it is an external credit enhancement. Overcollateralization and subordination are internal enhancements built into the structure of the issue.","d":2,"t":"Credit enhancement","c":"Internal credit enhancements are built into the deal structure (subordination/waterfall, overcollateralization, excess spread, reserve accounts). External enhancements come from a third party (bank guarante
