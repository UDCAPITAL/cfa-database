ta but only 61% accuracy on new data. This most likely indicates:","o":["underfitting","a model with high bias and low variance","overfitting"],"a":2,"e":"Excellent in-sample performance and poor out-of-sample performance characterize overfitting: the model has learned the noise. Underfitting would show poor performance on the training data as well. An overfitted model has high variance, not high bias.","d":2,"t":"Overfitting","c":"Overfitting shows up as excellent performance on the training sample but weak performance out of sample: the model has learned the noise and generalizes poorly. Underfitting gives poor results on both."},{"r":11,"q":"A classification model for predicting corporate defaults produces 40 true positives, 10 false positives, 20 false negatives, and 130 true negatives. The model's recall is:","o":["66.7%","80.0%","85.0%"],"a":0,"e":"Recall = TP/(TP + FN) = 40/(40 + 20) = 66.7%. 80.0% is precision, TP/(TP + FP); 85.0% is accuracy, (TP + TN)/total.","d":2,"t":"Recall","c":"Confusion matrix: precision = TP / (TP + FP); recall (sensitivity) = TP / (TP + FN); accuracy = (TP + TN) / total."},{"r":11,"q":"A classification model produces 40 true positives, 10 false positives, 40 false negatives, and 110 true negatives. The model's F1 score is:","o":["0.650","0.615","0.750"],"a":1,"e":"Precision = 40/50 = 0.80; recall = 40/80 = 0.50; F1 = 2PR/(P + R) = 0.80/1.30 = 0.615. 0.650 is the arithmetic mean of P and R (F1 is a harmonic mean); 0.750 is accuracy.","d":3,"t":"F1 score","c":"F1 score = 2 × precision × recall / (precision + recall), the harmonic mean of precision and recall."},{"r":11,"q":"A variable has a minimum of 20, a maximum of 80, a mean of 50, and a standard deviation of 12. Using min-max normalization, an observation of 56 is rescaled to:","o":["0.50","0.70","0.60"],"a":2,"e":"Normalization = (X − min)/(max − min) = (56 − 20)/(80 − 20) = 36/60 = 0.60. 0.50 is standardization (56 − 50)/12; 0.70 simply divides by the maximum (56/80).","d":2,"t":"Data normalization","c":"Min-max normalization: X' = (X − Xmin) / (Xmax − Xmin), rescaling values to between 0 and 1; standardization: (X − μ) / σ."},{"r":11,"q":"When developing a machine learning model, the primary purpose of the validation sample is to:","o":["tune hyperparameters and select among candidate models before final testing","provide the final unbiased estimate of out-of-sample performance","estimate the model parameters"],"a":0,"e":"The validation sample is used to tune hyperparameters and choose the model. The final, unbiased estimate of out-of-sample performance is the role of the test sample. Parameters are estimated on the training sample.","d":2,"t":"Training, validation and test samples","c":"Three samples: training to estimate the model, validation to tune hyperparameters and select the model, and test to measure final out-of-sample performance."}]},{"subject":2,"questions":[{"r":1,"q":"A monopolist faces the inverse demand curve P = 100 - 2Q and has a constant marginal cost of 20. The profit-maximizing price is closest to:","o":["20","60","40"],"a":1,"e":"The monopolist sets MR equal to MC: MR = 100 - 4Q = 20, so Q = 20 and P = 100 - 2×20 = 60. A price of 20 corresponds to P = MC (the competitive outcome), and 40 results from confusing the optimal quantity with the price or from an arbitrary average.","d":2,"t":"Monopoly profit maximization","c":"Every firm maximizes profit where MR = MC. For a linear inverse demand P = a - bQ, the monopolist's MR = a - 2bQ (same intercept, twice the slope); the price is then read off the demand curve, so P > MC."},{"r":1,"q":"In long-run equilibrium, a firm in a perfectly competitive market most likely:","o":["produces where price equals minimum average total cost","earns a positive economic profit protected by barriers to entry","charges a price above marginal cost"],"a":0,"e":"Under perfect competition, free entry eliminates all economic profit in the long run: P = MR = MC = minimum ATC. Barriers to entry and a price above marginal cost characterize market structures with pricing power (monopoly, monopolistic competition).","d":1,"t":"Perfect competition long run","c":"Perfect competition: many firms, homogeneous product, no barriers to entry, price takers (P = MR). In the long run, entry and exit drive economic profit to zero, with P = MC = minimum ATC."},{"r":1,"q":"An industry consists of four firms with market shares of 40%, 30%, 20% and 10%. The Herfindahl-Hirschman Index (HHI), with shares expressed in percent, is closest to:","o":["2,500","1,000","3,000"],"a":2,"e":"HHI = 40² + 30² + 20² + 10² = 1,600 + 900 + 400 + 100 = 3,000. 2,500 would correspond to four equal-sized firms (4 × 25²), and 1,000 to a squaring error; an HHI of 3,000 indicates a highly concentrated market.","d":2,"t":"Herfindahl-Hirschman Index","c":"The Herfindahl-Hirschman Index is the sum of the squared market shares of the firms in the market (0 to 10,000 with shares in percent). N equal-sized firms give HHI = 10,000/N; the higher the HHI, the more concentrated the market."},{"r":1,"q":"According to the kinked demand curve model of oligopoly, prices tend to be stable because competitors are expected to:","o":["match price increases but not price decreases","match price decreases but not price increases","ignore both price increases and price decreases"],"a":1,"e":"In the kinked demand curve model, competitors match a price cut (so as not to lose market share) but not a price increase: demand is elastic above the current price and inelastic below it. The resulting gap in marginal revenue makes the price sticky; the other two behaviors do not create this kink.","d":2,"t":"Kinked demand curve","c":"Kinked demand curve (oligopoly): rivals follow price cuts but ignore price increases, so the firm's demand curve is kinked at the prevailing price and MR has a vertical gap. MC can shift within that gap without changing price or output, which explains price rigidity."},{"r":1,"q":"In long-run equilibrium, a firm in monopolistic competition is most likely to:","o":["earn zero economic profit while operating with excess capacity","earn positive economic profit because its product is differentiated","produce at the minimum point of its average total cost curve"],"a":0,"e":"In the long run, entry by new competitors shifts each firm's demand curve until it is tangent to ATC: zero economic profit. Because demand slopes downward, the tangency lies to the left of minimum ATC, hence excess capacity; product differentiation does not protect profit permanently.","d":2,"t":"Monopolistic competition long run","c":"Monopolistic competition: many firms, differentiated products, low barriers to entry, downward-sloping demand. Long-run equilibrium: P = ATC (zero economic profit) but P > MR = MC, at an output below the minimum-ATC level (excess capacity)."},{"r":1,"q":"A perfectly competitive firm faces a market price of $15. At its profit-maximizing output, average variable cost is $12 and average total cost is $18. If market conditions are expected to persist, the firm should most likely:","o":["shut down immediately because price is below average total cost","continue operating indefinitely because price exceeds average variable cost","continue operating in the short run but exit the market in the long run"],"a":2,"e":"Since P (15) > AVC (12), the firm covers its variable costs and part of its fixed costs ($3 per unit): it should keep operating in the short run. But P < ATC (18) means an economic loss of $3 per unit; if this persists, the firm should exit the market in the long run. Shutting down immediately would increase the loss (all fixed costs), and staying indefinitely ignores the economic loss.","d":3,"t":"Short-run shutdown decision","c":"Short run: operate if P ≥ AVC (fixed costs are sunk), shut down if P < AVC. Long run: stay only if P ≥ ATC, otherwise exit. The breakeven point is P = minimum ATC and the shutdown point is P = minimum AVC."},{"r":1,"q":"An industry has five firms with market shares of 30%, 25%, 20%, 15% and 10%. If the two smallest firms merge, the increase in the HHI is closest to:","o":["625","300","2,550"],"a":1,"e":"HHI before = 900 + 625 + 400 + 225 + 100 = 2,250; after the merger (combined share 25%): 900 + 625 + 400 + 625 = 2,550. The increase is 300 (= 2 × 15 × 10). 625 is only the square of the merged share, and 2,550 is the post-merger level, not the change.","d":3,"t":"HHI merger impact","c":"When two firms with shares s1 and s2 merge, the HHI rises by (s1 + s2)² - s1² - s2² = 2 × s1 × s2. Regulators look at both the post-merger HHI level and the size of this increase."},{"r":1,"q":"Regardless of market structure, a firm maximizes profit by producing the quantity at which:","o":["marginal revenue equals marginal cost","price equals average total cost","total revenue is maximized"],"a":0,"e":"The MR = MC rule applies to all market structures; under perfect competition it becomes P = MC because P = MR. P = ATC is the breakeven point (zero profit), and maximizing total revenue (MR = 0) ignores costs.","d":1,"t":"Profit maximization rule","c":"Profit is maximized at the output where marginal revenue equals marginal cost (MR = MC), with MC rising. Market structure only changes how MR relates to price: P = MR for a price taker, P > MR for a firm facing downward-sloping demand."},{"r":2,"q":"Which of the following is most likely classified as a leading economic indicator?","o":["Building permits for new private housing units","Average duration of unemployment","Industrial production"],"a":0,"e":"Building permits anticipate future construction activity: they are a leading indicator. Average duration of unemployment is a lagging indicator, and industrial production is a coincident indicator.","d":1,"t":"Leading indicators","c":"Leading indicators turn before the business cycle (e.g., building permits, new orders, stock prices, yield spread, initial jobless claims); coincident indicators move with it (industrial production, employment, personal income); lagging indicators turn after it (unemployment duration, prime rate, inventory/sales ratio, unit labor costs)."},{"r":2,"q":"When an economy moves from a peak into the early stage of a contraction, the inventory-to-sales ratio most likely:","o":["decreases, because firms deliberately rebuild inventories","remains unchanged, because firms adjust output immediately","increases, because sales fall faster than firms can cut production"],"a":2,"e":"At the start of a contraction, sales slow unexpectedly while production still follows the previous pace: inventories pile up and the inventory-to-sales ratio rises. Firms then cut production to work off these inventories; deliberate restocking happens rather in the recovery, and the adjustment is never instantaneous.","d":2,"t":"Inventory-sales ratio","c":"The inventory-to-sales ratio is a lagging indicator: it rises involuntarily when sales fall at the end of an expansion, then falls as firms cut output, and drops further when sales pick up in the recovery, prompting restocking that amplifies the upturn."},{"r":2,"q":"In the early stage of an economic recovery, firms most likely respond to rising demand by first:","o":["hiring large numbers of permanent full-time employees","increasing hours worked and using temporary workers","raising wages sharply to attract new workers"],"a":1,"e":"Early in a recovery, uncertainty about whether demand will last leads firms to increase hours worked (overtime) and use temporary staff before hiring permanent employees. Large-scale permanent hiring and marked wage increases come later in the cycle, when the labor market tightens.","d":2,"t":"Labor market over the cycle","c":"Over the cycle, firms adjust labor first on the intensive margin (hours, overtime, temporary workers) and only later on the extensive margin (permanent hiring or layoffs). The unemployment rate is therefore a lagging indicator, while average weekly hours tend to lead."},{"r":2,"q":"A country has 152 million employed persons, 8 million unemployed persons and 90 million working-age persons not in the labor force. The unemployment rate is closest to:","o":["5.00%","3.20%","5.26%"],"a":0,"e":"Labor force = 152 + 8 = 160 million; unemployment rate = 8 / 160 = 5.00%. 3.20% wrongly divides by the working-age population (250 million), and 5.26% divides only by the employed (152 million).","d":2,"t":"Unemployment rate","c":"Labor force = employed + unemployed (people without a job actively seeking work). Unemployment rate = unemployed / labor force; participation rate = labor force / working-age population. People not seeking work are outside the labor force."},{"r":2,"q":"A country has 152 million employed, 8 million unemployed and 90 million working-age persons outside the labor force. If 2 million discouraged workers start actively looking for jobs but none find one, the new unemployment rate is closest to:","o":["6.25%","5.00%","6.17%"],"a":2,"e":"Discouraged workers who actively start looking for a job enter the labor force as unemployed: unemployed = 10 million, labor force = 162 million, rate = 10 / 162 = 6.17%. 6.25% forgets to increase the labor force (10/160), and 5.00% wrongly assumes they remain outside the labor force.","d":3,"t":"Discouraged workers","c":"Discouraged workers (who have stopped searching) are excluded from the labor force, which makes the measured unemployment rate understate labor-market slack. When they resume searching, both the number of unemployed and the labor force increase."},{"r":2,"q":"Which school of economic thought most directly attributes business cycles to central banks keeping interest rates artificially low, leading to malinvestment?","o":["Keynesian","Austrian","Real business cycle"],"a":1,"e":"The Austrian school explains cycles by interest rates held artificially low, which trigger misdirected overinvestment (malinvestment) followed by a correction. Keynesians emphasize aggregate demand shocks and 'animal spirits', while real business cycle theory attributes fluctuations to real shocks (technology, supply).","d":2,"t":"Theories of the business cycle","c":"Main schools on business cycles: Neoclassical/RBC (real supply shocks, markets self-correct), Keynesian (demand shocks, sticky wages, active fiscal policy), Monetarist (money supply errors, steady money growth rule), Austrian (artificially low rates cause malinvestment and busts), New Classical (rational responses to real shocks)."},{"r":2,"q":"Which of the following statements about credit cycles is most accurate?","o":["Credit cycles tend to be longer and deeper than business cycles, and recessions that coincide with credit contractions tend to be more severe","Credit cycles are shorter than business cycles and have little effect on real estate prices","Credit expansions typically lower asset prices because borrowing costs rise"],"a":0,"e":"Credit cycles are generally longer and deeper than business cycles; when a recession coincides with a credit contraction, it is deeper and longer. Credit expansion, on the contrary, fuels rising asset prices, especially real estate, which invalidates the other two statements.","d":3,"t":"Credit cycles","c":"Credit cycles describe the expansion and contraction of credit availability and pricing. They tend to be longer and larger than business cycles, amplify them (easy credit inflates asset prices, especially property), and recessions coinciding with credit busts are deeper and longer."},{"r":2,"q":"Which of the following is best classified as a lagging economic indicator?","o":["ISM new orders index","Personal income less transfer payments","Average prime rate charged by banks"],"a":2,"e":"The average bank prime rate reacts with a delay to changes in activity: it is a lagging indicator. The ISM new orders index is leading, and personal income excluding transfers is coincident.","d":1,"t":"Lagging indicators","c":"Lagging indicators confirm turning points after they occur: average duration of unemployment, inventory-to-sales ratio, change in unit labor costs, average prime rate, commercial and industrial loans outstanding, consumer credit to income, and change in services CPI."},{"r":3,"q":"In an economy with a marginal propensity to consume of 0.80 and a proportional income tax rate of 25%, the government increases spending by $50 billion. Assuming no crowding out, the increase in GDP is closest to:","o":["$250.0 billion","$66.7 billion","$125.0 billion"],"a":2,"e":"Multiplier = 1 / [1 - c(1 - t)] = 1 / [1 - 0.8 × 0.75] = 1 / 0.4 = 2.5; ΔGDP = 2.5 × 50 = $125 billion. $250 billion ignores the tax (1/(1 - 0.8) = 5), and $66.7 billion wrongly uses 1/(1 - t).","d":2,"t":"Fiscal multiplier","c":"Fiscal multiplier with a proportional income tax: 1 / [1 - MPC × (1 - t)]. Taxes reduce the multiplier because each round of spending is based on disposable income only; ΔGDP = multiplier × ΔG."},{"r":3,"q":"Assume a closed economy with a marginal propensity to consume of 0.75 and lump-sum taxes. If the government increases spending by $100 million and simultaneously increases taxes by $100 million, the change in GDP is closest to:","o":["$0","+$100 million","+$400 million"],"a":1,"e":"Spending effect: 100 × 1/(1 - 0.75) = +$400 million; tax effect: -0.75 × 4 × 100 = -$300 million; net effect = +$100 million (balanced budget multiplier = 1). Zero wrongly assumes the two effects cancel out, and $400 million ignores the tax increase.","d":3,"t":"Balanced budget multiplier","c":"With lump-sum taxes, the spending multiplier is 1/(1 - MPC) and the tax multiplier is -MPC/(1 - MPC). An equal increase in spending and taxes therefore raises GDP by the amount of the spending increase (balanced budget multiplier = 1)."},{"r":3,"q":"Which of the following is best described as an automatic stabilizer?","o":["A progressive income tax system","A newly legislated infrastructure spending program","Central bank purchases of government bonds"],"a":0,"e":"A progressive income tax automatically lowers tax revenue in a recession and raises it in an expansion, with no new government decision. A legislated infrastructure program is a discretionary measure, and central bank bond purchases are monetary policy.","d":1,"t":"Automatic stabilizers","c":"Automatic stabilizers are features of the fiscal system that counter the cycle without new legislation: progressive income taxes, unemployment benefits and welfare transfers. Discretionary fiscal policy requires a deliberate decision (new spending, tax changes)."},{"r":3,"q":"If Ricardian equivalence holds, a debt-financed tax cut will most likely:","o":["increase aggregate demand by the full amount of the tax cut","reduce aggregate demand because interest rates rise","have no effect on aggregate demand because households save the tax cut"],"a":2,"e":"Under Ricardian equivalence, households anticipate that today's debt will be repaid through future taxes: they save the entire tax cut, so consumption and aggregate demand are unchanged. The other two answers assume households ignore the government's intertemporal budget constraint.","d":2,"t":"Ricardian equivalence","c":"Ricardian equivalence: if consumers are forward-looking, a debt-financed tax cut is offset by higher private saving in anticipation of future taxes, so the timing of taxes does not affect aggregate demand. It fails if consumers are myopic, credit-constrained or do not care about future generations."},{"r":3,"q":"The delay between the time a government recognizes the need for fiscal action and the time the policy is legislated and implemented is best described as the:","o":["recognition lag","action lag","impact lag"],"a":1,"e":"The action lag covers the time needed to decide, legislate and implement the measure, which is often long for fiscal policy. The recognition lag comes before (time to identify the problem, since data are published with a delay) and the impact lag comes after (time for the measure to take effect).","d":2,"t":"Fiscal policy lags","c":"Fiscal (and monetary) policy faces three lags: recognition lag (identifying the need for action), action lag (deciding and implementing), and impact lag (time for the policy to affect the economy). These lags can make discretionary policy procyclical."},{"r":3,"q":"Compared with changes in direct taxes, changes in indirect taxes such as sales taxes are most likely to:","o":["be implemented quickly after being announced","take longer to implement because of payroll system changes","have no effect on consumer spending"],"a":0,"e":"Indirect taxes (VAT, sales taxes, excise duties) can be changed almost immediately and quickly influence spending. It is direct (income) taxes that take longer to implement, and an increase in a consumption tax does reduce spending.","d":2,"t":"Direct vs indirect taxes","c":"Indirect taxes (sales, VAT, excise) can be adjusted quickly and act fast on spending, and can also target social goals (e.g., tobacco). Direct taxes (income, wealth) are slower to change but act as automatic stabilizers and redistribute income."},{"r":3,"q":"A government's actual budget deficit rises from 3.0% of GDP to 6.0% of GDP. Over the same period, the estimated cyclical component of the deficit rises from 1.0% to 2.5% of GDP. The government's discretionary fiscal stance is best described as:","o":["expansionary, because the structural deficit increased by 3.0 percentage points","neutral, because the increase in the deficit is entirely cyclical","expansionary, because the structural deficit increased by 1.5 percentage points"],"a":2,"e":"Structural deficit = actual deficit - cyclical component: 3.0 - 1.0 = 2.0%, then 6.0 - 2.5 = 3.5%, i.e., +1.5 points: discretionary policy is expansionary. +3.0 points is the change in the actual deficit, which includes the effect of automatic stabilizers; the increase is not entirely cyclical (only 1.5 of the 3 points).","d":3,"t":"Structural vs cyclical deficit","c":"The actual budget balance mixes cyclical effects (automatic stabilizers) and discretionary policy. The structural (cyclically adjusted) balance removes the cyclical component; its change is the best measure of the fiscal stance (a larger structural deficit = expansionary)."},{"r":3,"q":"Crowding out most likely occurs when government borrowing:","o":["lowers interest rates and increases private investment","raises interest rates and reduces private investment","is financed entirely by the central bank at a zero interest rate"],"a":1,"e":"Crowding out occurs when government borrowing increases the demand for loanable funds, pushes up interest rates and reduces private investment. A fall in rates produces the opposite effect, and monetary financing by the central bank does not put this direct pressure on rates.","d":1,"t":"Crowding out","c":"Crowding out: government borrowing competes with the private sector for loanable funds, raising interest rates and reducing private investment (and interest-sensitive consumption), which weakens the fiscal multiplier."},{"r":4,"q":"The reserve requirement is 8%. If a bank receives a new deposit of $20 million and banks lend out all excess reserves, the maximum total increase in deposits in the banking system is closest to:","o":["$230.0 million","$250.0 million","$21.7 million"],"a":1,"e":"Money multiplier = 1 / 0.08 = 12.5; maximum increase in deposits = 20 × 12.5 = $250 million. $230 million counts only the deposits created in addition to the initial deposit, and $21.7 million wrongly uses 1 / (1 - 0.08).","d":2,"t":"Money multiplier","c":"In a fractional reserve system, the money multiplier is 1 / reserve requirement. A new deposit can increase total deposits by up to deposit × (1 / reserve ratio), assuming banks lend all excess reserves and no cash leaks out of the system."},{"r":4,"q":"A central bank estimates trend real GDP growth at 2.0% and has an inflation target of 2.0%. If its policy rate is currently 3.0%, the monetary policy stance is best described as:","o":["expansionary, because the policy rate is below the neutral rate of 4.0%","contractionary, because the policy rate exceeds the inflation target","neutral, because the policy rate lies between trend growth and the inflation target"],"a":0,"e":"Neutral rate = trend growth + inflation target = 2.0% + 2.0% = 4.0%. A policy rate of 3.0%, below the neutral rate, is expansionary. Comparing the rate with the inflation target alone or with the range between the two components is not relevant.","d":2,"t":"Neutral interest rate","c":"Neutral policy rate = trend real growth rate + inflation target. A policy rate above the neutral rate is contractionary (restrictive); below it, expansionary (accommodative)."},{"r":4,"q":"The nominal one-year interest rate is 6.5% and expected inflation is 3.5%. Using the exact Fisher relationship, the real interest rate is closest to:","o":["3.00%","10.23%","2.90%"],"a":2,"e":"Exact Fisher relationship: (1 + r) = 1.065 / 1.035, so r = 2.90%. 3.00% is the linear approximation (6.5 - 3.5), and 10.23% wrongly multiplies the two factors (1.065 × 1.035 - 1).","d":2,"t":"Fisher effect","c":"Fisher effect: (1 + nominal rate) = (1 + real rate) × (1 + expected inflation), approximated by nominal ≈ real + expected inflation. A risk premium for inflation uncertainty can be added."},{"r":4,"q":"According to the quantity theory of money, if the money supply grows by 7%, velocity is constant and real output grows by 3%, inflation is closest to:","o":["7%","4%","10%"],"a":1,"e":"MV = PY: in growth rates, %ΔP ≈ %ΔM + %ΔV - %ΔY = 7% + 0% - 3% = 4% (exactly 1.07/1.03 - 1 = 3.9%). 7% ignores real growth, and 10% adds it instead of subtracting it.","d":1,"t":"Quantity theory of money","c":"Quantity theory of money: M × V = P × Y. With constant velocity, inflation ≈ money growth - real output growth; money neutrality implies that in the long run money growth affects only the price level."},{"r":4,"q":"When a central bank purchases government securities from commercial banks in the open market, the most likely effect is:","o":["an increase in bank reserves and downward pressure on short-term interest rates","a decrease in bank reserves and upward pressure on short-term interest rates","no change in bank reserves because only the composition of bank assets changes"],"a":0,"e":"The central bank pays for the securities by crediting the banks' reserves: reserves rise, lending capacity increases and short-term rates fall (expansionary policy). The opposite answer describes a sale of securities, and reserves do change because central bank money is created.","d":1,"t":"Open market operations","c":"Open market operations: buying securities injects reserves into the banking system (expansionary, lower short-term rates); selling securities drains reserves (contractionary). This is the main day-to-day monetary policy tool."},{"r":4,"q":"Expansionary monetary policy is least likely to be effective when:","o":["banks are eager to lend and borrowers are creditworthy","the transmission mechanism through asset prices is functioning normally","interest rates are near zero and households and firms hoard additional money"],"a":2,"e":"In a liquidity trap, rates are close to zero and agents hold onto the extra money instead of spending it: monetary policy loses its effectiveness. Banks willing to lend and normal transmission through asset prices are, on the contrary, the conditions for effective policy.","d":2,"t":"Liquidity trap","c":"Limits of monetary policy: in a liquidity trap (rates near zero) extra money is hoarded; it is also weakened when banks will not lend, when bond markets ignore the central bank, or under deflation. Quantitative easing is used when conventional rate cuts are exhausted."},{"r":4,"q":"A government adopts expansionary fiscal policy while the central bank adopts restrictive monetary policy. The most likely outcome is:","o":["lower interest rates and a larger private sector share of GDP","higher interest rates and a larger public sector share of GDP","lower interest rates and a smaller public sector share of GDP"],"a":1,"e":"Expansionary fiscal policy combined with restrictive monetary policy raises interest rates (both push in the same direction); government demand increases while private investment is crowded out, hence a larger share of the public sector. Low rates and a larger private sector characterize the opposite mix (tight fiscal, easy monetary).","d":3,"t":"Fiscal-monetary policy interaction","c":"Policy mix: easy fiscal + tight monetary → higher rates, larger public sector share of GDP; tight fiscal + easy monetary → lower rates, larger private sector share; both easy → strong demand growth; both tight → falling demand."},{"r":4,"q":"A central bank is free to set its policy rate, but the inflation target it must achieve is set by the government. The central bank has:","o":["operational independence but not target independence","target independence but not operational independence","both operational and target independence"],"a":0,"e":"Operational independence lets the central bank choose the means (level of the policy rate); target independence would let it set the inflation target itself. Here the government sets the target (as for the Bank of England), so only operational independence exists.","d":2,"t":"Central bank independence","c":"Central bank independence can be operational (freedom to choose the tools, e.g., the policy rate, to hit a target) and/or target independence (freedom to set the target itself). Effective central banks also need credibility and transparency."},{"r":5,"q":"A country that actively cooperates with many other countries and embraces globalization is best described under which geopolitical archetype?","o":["Multilateralism","Hegemony","Bilateralism"],"a":0,"e":"Cooperation + globalization = multilateralism (e.g., membership in many international agreements and institutions). Hegemony combines globalization with non-cooperation, and bilateralism combines cooperation with a nationalist orientation limited to a few partners.","d":1,"t":"Geopolitical archetypes - multilateralism","c":"Geopolitical archetypes cross two axes: cooperation vs non-cooperation and globalization vs nationalism. Cooperative + globalization = multilateralism; cooperative + nationalism = bilateralism; non-cooperative + globalization = hegemony; non-cooperative + nationalism = autarky."},{"r":5,"q":"A large country that is integrated in global trade but prefers to set the rules unilaterally rather than cooperate with other countries is best described as following:","o":["autarky","multilateralism","hegemony"],"a":2,"e":"Hegemony combines openness to globalization with non-cooperative behavior: the country imposes its rules thanks to its weight. Autarky combines non-cooperation and nationalism (turning inward), and multilateralism requires active cooperation.","d":2,"t":"Geopolitical archetypes - hegemony","c":"A hegemon is a globally integrated but non-cooperative actor that uses its economic, military or cultural weight to set rules. An autarkic state is non-cooperative and nationalist, seeking self-sufficiency."},{"r":5,"q":"A national election scheduled to take place in six months, whose outcome could change trade policy, is best classified as:","o":["exogenous risk","event risk","thematic risk"],"a":1,"e":"Event risk is tied to a known, dated event (election, summit, vote). Exogenous risk is a sudden, unanticipated shock (coup, natural disaster), and thematic risk refers to persistent, slowly evolving trends (cyber threats, climate).","d":2,"t":"Types of geopolitical risk","c":"Types of geopolitical risk: event risk (known dates, e.g., elections, legislation), exogenous risk (sudden unanticipated shocks, e.g., wars, uprisings, disasters), and thematic risk (known, long-lasting concerns that evolve over time, e.g., climate change, cyber threats)."},{"r":5,"q":"Freezing another country's central bank foreign currency reserves held abroad is best classified as which type of geopolitical tool?","o":["Financial tool","Economic tool","National security tool"],"a":0,"e":"Freezing foreign exchange reserves or restricting access to capital markets and payment systems are financial tools. Economic tools target trade (tariffs, trade agreements), and national security tools involve force or military diplomacy.","d":2,"t":"Tools of geopolitics","c":"Geopolitical tools: national security tools (armed conflict, espionage, alliances), economic tools (tariffs, trade agreements, embargoes, cartels), and financial tools (currency reserve freezes, sanctions on access to capital markets, payment systems and investment)."},{"r":5,"q":"Soft power is best described as a country's ability to influence others through:","o":["military force and the threat of armed conflict","economic sanctions and trade tariffs","culture, values, education and media rather than coercion"],"a":2,"e":"Soft power is influence obtained through attractiveness (culture, values, education, media) rather than coercion. Military force is hard power, and sanctions and tariffs are instruments of economic coercion.","d":1,"t":"Soft power","c":"Hard power coerces through military or economic force; soft power influences behavior through attraction and persuasion (culture, values, education, media, diplomacy). Both shape a state's geopolitical influence."},{"r":5,"q":"Which statement about the velocity of geopolitical risk is most accurate?","o":["Low-velocity risks are the most likely to trigger an immediate flight to safety in financial markets","High-velocity risks tend to cause sharp, short-term market reactions, whereas low-velocity risks tend to affect long-term value through slowly building costs","Velocity is irrelevant for investors because only the likelihood of a risk affects portfolios"],"a":1,"e":"High-velocity risks (sudden shocks) trigger fast and often temporary market reactions, such as a flight to safe-haven assets; low-velocity risks (thematic, climate) weigh gradually on costs and long-term value. Risk assessment must combine likelihood, velocity and size of impact, so it is not limited to likelihood.","d":3,"t":"Velocity of geopolitical risk","c":"Geopolitical risk is assessed on three dimensions: likelihood, velocity (how fast it affects markets) and size of impact. High-velocity risks drive short-term volatility and flight to safety; low-velocity risks affect fundamentals and long-term valuations."},{"r":5,"q":"Which of the following is best classified as a non-state actor in geopolitics?","o":["A multinational corporation","A national central bank","A country's armed forces"],"a":0,"e":"Non-state actors (multinational companies, NGOs, charities, influential individuals) do not hold sovereign authority but influence international relations. A national central bank and the armed forces are state actors.","d":2,"t":"State and non-state actors","c":"State actors are governments and their agencies (central banks, armed forces, ministries) exercising sovereign authority. Non-state actors (NGOs, multinationals, charities, influential individuals) participate in global affairs without sovereign power."},{"r":5,"q":"A shift of major economies away from globalization toward more nationalist and autarkic policies is most likely to result in:","o":["lower input costs because of greater domestic sourcing","larger cross-border capital flows to emerging markets","higher production costs and less efficient supply chains"],"a":2,"e":"A nationalist retreat reduces specialization according to comparative advantage: supply chains become less efficient and production costs rise, with a risk of inflation. Reshoring supply tends to raise costs, and cross-border capital flows tend to decline.","d":3,"t":"Deglobalization implications","c":"Deglobalization (nationalism, autarky, protectionism) reduces gains from comparative advantage and economies of scale, raising production costs and inflation risk, reducing cross-border trade and capital flows, and pushing firms to reshore or diversify supply chains."},{"r":6,"q":"Country A needs 4 labor hours to produce one unit of wine and 2 labor hours to produce one unit of cloth. Country B needs 6 labor hours for one unit of wine and 2 labor hours for one unit of cloth. Which country has a comparative advantage in wine?","o":["Country B","Neither country, because both need the same hours to produce cloth","Country A"],"a":2,"e":"Opportunity cost of one unit of wine: A = 4/2 = 2 units of cloth, B = 6/2 = 3 units of cloth. A has the lower opportunity cost, so the comparative advantage in wine (and B in cloth: 1/3 vs 1/2 unit of wine). Equal labor hours for cloth do not prevent a comparative advantage, which rests on relative costs.","d":2,"t":"Comparative advantage","c":"Absolute advantage = producing a good with fewer resources; comparative advantage = producing it at a lower opportunity cost (units of the other good forgone). Trade gains come from specializing according to comparative advantage, even if one country has an absolute advantage in both goods."},{"r":6,"q":"A trading bloc that eliminates trade barriers among members and adopts a common trade policy toward non-members, but does not allow free movement of labor and capital, is best described as a:","o":["free trade area","customs union","common market"],"a":1,"e":"A customs union adds a common external trade policy to a free trade area. A free trade area lets each member set its own tariffs toward third countries, and a common market adds free movement of factors of production.","d":1,"t":"Trading blocs - customs union","c":"Levels of regional integration, from lowest to highest: free trade area (no internal barriers), customs union (+ common external trade policy), common market (+ free movement of labor and capital), economic union (+ common economic institutions and policies), monetary union (+ single currency)."},{"r":6,"q":"When a small country imposes an import tariff, the most likely effect is that:","o":["domestic producer surplus increases","domestic consumer surplus increases","national welfare increases because of the tariff revenue"],"a":0,"e":"The tariff raises the domestic price: domestic producers produce more at a higher price, and their surplus increases. Consumer surplus falls, and for a small country the tariff revenue does not offset the deadweight losses, so national welfare decreases.","d":2,"t":"Effects of a tariff","c":"An import tariff raises the domestic price: producer surplus and government revenue increase, consumer surplus falls by more, so a small country suffers a net welfare loss (deadweight loss from inefficient production and reduced consumption). A large country may partly offset this through better terms of trade."},{"r":6,"q":"A small country imports a good at a world price of $10. Before a tariff, domestic production is 40 units and domestic consumption is 100 units. After a $2 per-unit tariff, domestic production rises to 50 units and consumption falls to 90 units. Assuming linear supply and demand, the deadweight loss from the tariff is closest to:","o":["$80","$10","$20"],"a":2,"e":"Production deadweight loss = ½ × 2 × (50 - 40) = $10; consumption deadweight loss = ½ × 2 × (100 - 90) = $10; total = $20. $80 is the tariff revenue (2 × (90 - 50)), which is a transfer rather than a loss, and $10 includes only one of the two triangles.","d":3,"t":"Tariff deadweight loss","c":"Deadweight loss of a tariff = two triangles: ½ × tariff × increase in domestic production + ½ × tariff × decrease in domestic consumption. Tariff revenue = tariff × imports after the tariff and is a transfer, not a loss."},{"r":6,"q":"Under a voluntary export restraint (VER), the quota rents most likely accrue to:","o":["the importing country's government","foreign exporters","domestic consumers in the importing country"],"a":1,"e":"With a voluntary export restraint, the exporting country limits its own sales: foreign exporters sell at the higher domestic price and capture the quota rent. The importing government receives nothing (unlike with a tariff or auctioned licenses), and consumers pay more.","d":2,"t":"Voluntary export restraint","c":"Quotas and VERs raise the domestic price like a tariff. With an import quota, the rents go to whoever holds the licenses (domestic government if auctioned); with a VER, they go to foreign exporters, so the importing country's welfare loss is larger."},{"r":6,"q":"If a large country grants an export subsidy, the most likely effect is that:","o":["the world price falls and the exporting country's terms of trade deteriorate","the world price rises and the exporting country's terms of trade improve","the world price is unaffected because exports are subsidized domestically"],"a":0,"e":"A large country that subsidizes its exports increases world supply, which lowers the world price: it sells more cheaply abroad, its terms of trade worsen and its national welfare loss is larger than for a small country. The world price does not rise, and it is unchanged only for a small country.","d":2,"t":"Export subsidy","c":"An export subsidy raises the domestic price (toward world price + subsidy), benefits producers and costs consumers and taxpayers, creating a net welfare loss. A large country also depresses the world price, worsening its terms of trade and enlarging the loss."},{"r":6,"q":"Which form of regional integration involves the highest degree of integration?","o":["Common market","Free trade area","Monetary union"],"a":2,"e":"A monetary union (e.g., the eurozone) adds a common currency and a single monetary policy to an economic union: it is the highest degree of integration. A common market involves neither common economic policy nor a common currency, and a free trade area is the lowest level.","d":1,"t":"Monetary union","c":"Regional integration ladder: free trade area < customs union < common market < economic union < monetary union. Each step adds a layer: common external tariff, free factor mobility, common economic policies and institutions, then a single currency."},{"r":6,"q":"Over a year, a country's export price index rises from 100 to 108 while its import price index rises from 100 to 120. The country's terms of trade index at the end of the year is closest to:","o":["111, indicating an improvement","90, indicating a deterioration","88, indicating a deterioration"],"a":1,"e":"Terms of trade = export price index / import price index × 100 = 108 / 120 × 100 = 90: the country must export more to import the same quantity, which is a deterioration. 111 inverts the ratio, and 88 subtracts the indices (100 + 8 - 20) instead of dividing them.","d":3,"t":"Terms of trade","c":"Terms of trade = (index of export prices / index of import prices) × 100. A rise means a country can buy more imports per unit of exports (improvement); a fall means a deterioration."},{"r":7,"q":"An exchange rate regime in which the monetary authority makes a legal commitment to exchange domestic currency for a specified foreign currency at a fixed rate, and the monetary base is fully backed by foreign reserves, is best described as a:","o":["crawling peg","currency board arrangement","managed floating regime"],"a":1,"e":"A currency board rests on a legal commitment to convertibility at a fixed rate, with the monetary base fully backed by reserves in the anchor currency (e.g., Hong Kong). A crawling peg periodically adjusts the rate, and a managed float has no fixed parity.","d":1,"t":"Currency board","c":"Exchange rate regimes, from most to least rigid: no separate legal tender (dollarization, monetary union), currency board (legal commitment, full reserve backing), fixed peg, target zone, crawling peg, managed float, independent float."},{"r":7,"q":"A country that formally adopts another country's currency as its legal tender (dollarization) most likely:","o":["gives up independent monetary policy and its central bank's ability to act as lender of last resort","retains full control over its domestic money supply","eliminates any exposure to the monetary policy of the issuing country"],"a":0,"e":"By adopting another country's currency, the state gives up its own monetary policy, seigniorage revenue and the ability of its central bank to act as lender of last resort. It no longer controls its money supply and instead becomes fully subject to the issuing country's monetary policy.","d":2,"t":"Formal dollarization","c":"Formal dollarization imports the credibility and monetary policy of the anchor country, but the adopting country loses independent monetary policy, seigniorage and a lender of last resort; it does not automatically gain the anchor's creditworthiness."},{"r":7,"q":"The nominal exchange rate expressed in USD per EUR increases by 5%. Over the same period, the eurozone price level rises by 2% and the US price level rises by 3%. From a US perspective, the change in the real exchange rate (USD per EUR) is closest to:","o":["+6.03%","+5.00%","+3.98%"],"a":2,"e":"Real exchange rate (USD/EUR) = S × P(eurozone) / P(US); change = 1.05 × 1.02 / 1.03 - 1 = +3.98%: the euro appreciates in real terms, slightly less than in nominal terms because US inflation is higher. +6.03% inverts the price levels (1.05 × 1.03 / 1.02), and +5.00% ignores the price effect.","d":3,"t":"Real exchange rate","c":"Real exchange rate (price/base) = nominal rate (price/base) × (base-country price level / price-country price level). The base currency appreciates in real terms if its nominal appreciation exceeds the inflation differential working against it."},{"r":7,"q":"Hedge funds and commodity trading advisors in the foreign exchange market are best classified as:","o":["real money accounts","leveraged accounts","sell-side dealers"],"a":1,"e":"Hedge funds and CTAs use leverage and active strategies: they are 'leveraged accounts' on the buy side. 'Real money accounts' are investors with little or no leverage (pension funds, mutual funds, insurers), and the sell side consists of market-making banks.","d":1,"t":"FX market participants","c":"FX market participants: sell side (dealer banks making markets) and buy side, which includes corporations, real money accounts (unleveraged: pension funds, mutual funds, insurers, endowments), leveraged accounts (hedge funds, CTAs), retail, governments, central banks and sovereign wealth funds."},{"r":7,"q":"Which of the following is least likely an objective of a government imposing capital flow restrictions?","o":["Improving the efficiency of global capital allocation","Reducing the volatility of short-term (\"hot money\") flows","Ensuring that domestic savings finance domestic investment"],"a":0,"e":"Capital controls aim to limit the volatility of speculative flows, steer domestic saving toward domestic investment, protect strategic sectors or preserve a peg. They reduce the efficiency of global capital allocation, so that is not an objective.","d":2,"t":"Capital restrictions","c":"Capital restrictions (taxes, quotas, outright bans on capital flows) are used to reduce flow volatility, protect a peg or monetary independence, keep domestic savings at home and protect strategic industries, at the cost of less efficient global capital allocation."},{"r":7,"q":"A transaction consisting of the simultaneous spot purchase of a currency and the forward sale of the same amount of that currency is best described as a(n):","o":["outright forward contract","currency option","FX swap"],"a":2,"e":"An FX swap combines a spot transaction with the reverse forward transaction on the same amount; it is used notably to roll hedges or to fund in foreign currency. An outright forward has only a single future leg, and an option gives a right without an obligation.","d":1,"t":"FX swap","c":"FX instruments: spot (settles T+2 for most pairs), outright forward (single exchange at a future date at a rate fixed today), FX swap (simultaneous spot and offsetting forward), futures (exchange-traded forwards) and options (right but not obligation)."},{"r":7,"q":"A country's private saving is 18% of GDP, private investment is 22% of GDP and the government runs a fiscal deficit of 3% of GDP. The country's current account balance is closest to:","o":["a deficit of 1% of GDP","a deficit of 7% of GDP","a surplus of 7% of GDP"],"a":1,"e":"Identity: current account = (S - I) + (T - G) = (18 - 22) + (-3) = -7% of GDP, financed by net capital inflows. -1% wrongly treats the fiscal deficit as a surplus (-4 + 3), and +7% reverses the sign.","d":3,"t":"Current account and saving-investment balance","c":"National accounts identity: current account balance = (private saving - investment) + (taxes - government spending). A current account deficit reflects domestic spending exceeding saving and must be financed by a capital/financial account surplus."},{"r":7,"q":"A country that maintains a fixed exchange rate and allows free movement of capital must, according to the impossible trinity, give up:","o":["an independent monetary policy","the convertibility of its currency for trade transactions","its ability to run fiscal deficits"],"a":0,"e":"The impossible trinity states that a country cannot simultaneously have a fixed exchange rate, free capital mobility and independent monetary policy: with the first two, its rates must follow those of the anchor currency. Current account convertibility and fiscal policy are not part of the trilemma.","d":2,"t":"Impossible trinity","c":"Impossible trinity (trilemma): a country can achieve at most two of fixed exchange rate, free capital mobility and independent monetary policy. Choosing a peg with open capital markets means giving up monetary autonomy."},{"r":8,"q":"The spot exchange rate is 1.0850 USD per EUR. The equivalent quote expressed in EUR per USD is closest to:","o":["0.9217","0.9150","1.0850"],"a":0,"e":"To invert a quote, take the reciprocal: 1 / 1.0850 = 0.9217 EUR per USD. 0.9150 wrongly subtracts from 2 (2 - 1.0850), and 1.0850 simply confuses the base currency and the price currency.","d":1,"t":"Inverting exchange rate quotes","c":"An exchange rate quote A/B gives the number of units of the price currency A per unit of base currency B. The inverse quote B/A is the reciprocal: 1 / (A/B)."},{"r":8,"q":"The spot rates are 1.2700 USD per GBP and 150.00 JPY per USD. The JPY per GBP cross rate is closest to:","o":["118.11","151.27","190.50"],"a":2,"e":"JPY/GBP = (JPY/USD) × (USD/GBP) = 150.00 × 1.2700 = 190.50: the USD cancels out. 118.11 divides instead of multiplying (150 / 1.27), and 151.27 adds the two rates, which has no economic meaning.","d":2,"t":"Cross rates","c":"Cross rates: multiply or divide the two quotes so that the common currency cancels out, e.g., (A/B) × (B/C) = A/C. Inverting a quote first may be needed so the common currency appears once in a numerator and once in a denominator."},{"r":8,"q":"The exchange rate moves from 1.1000 USD per EUR to 1.0500 USD per EUR. Relative to the euro, the US dollar has:","o":["appreciated by 4.55%","appreciated by 4.76%","depreciated by 4.55%"],"a":1,"e":"Expressed in EUR per USD, the rate moves from 1/1.10 to 1/1.05: change = 1.10 / 1.05 - 1 = +4.76%, the dollar appreciates. 4.55% (1.05/1.10 - 1 in absolute value) measures the depreciation of the euro against the dollar, not the appreciation of the dollar; and the dollar does not depreciate since fewer dollars are needed per euro.","d":2,"t":"Percentage change in currency value","c":"The percentage change in a quote measures the change of the base currency. To get the price currency's change, invert the quote first: % change of the price currency = (S0 / S1) - 1. An appreciation of x% for one currency is not a depreciation of x% for the other."},{"r":8,"q":"The spot rate is 1.0800 USD per EUR. The 180-day USD interest rate is 4.5% and the 180-day EUR interest rate is 2.5%, both quoted on an annual basis using an actual/360 convention. The 180-day forward rate (USD per EUR) is closest to:","o":["1.0907","1.1011","1.0694"],"a":0,"e":"Covered interest rate parity: F = S × (1 + i_USD × 180/360) / (1 + i_EUR × 180/360) = 1.08 × 1.0225 / 1.0125 = 1.0907. 1.1011 uses the annual rates without adjusting them to 180 days, and 1.0694 inverts the rates of the price currency (USD) and the base currency (EUR).","d":3,"t":"Forward rate - covered interest parity","c":"Covered interest rate parity: F(price/base) = S(price/base) × [1 + i_price × (days/360)] / [1 + i_base × (days/360)]. Rates must be de-annualized to the contract period; the price-currency rate is in the numerator."},{"r":8,"q":"The GBP/USD spot rate is quoted as 1.3250 USD per GBP, and the one-year forward points are +35.0. The one-year outright forward rate is closest to:","o":["1.3215","1.6750","1.3285"],"a":2,"e":"Forward points are expressed in the fourth decimal place: 35 / 10,000 = 0.0035; forward = 1.3250 + 0.0035 = 1.3285. 1.3215 subtracts the points even though they are positive, and 1.6750 applies the wrong scale (35/100).","d":1,"t":"Forward points","c":"Forward rates are often quoted as forward points (forward - spot), scaled to the last decimal of the spot quote (usually ÷ 10,000). Outright forward = spot + points / 10,000; positive points mean the base currency trades at a forward premium."},{"r":8,"q":"The one-year interest rate is 5.0% in USD and 1.0% in CHF. For an exchange rate quoted in USD per CHF, the CHF most likely trades at a:","o":["forward discount","forward premium","zero forward premium, because forward rates are unbiased predictors of future spot rates"],"a":1,"e":"With a USD per CHF quote, F = S × (1.05 / 1.01) > S: the base currency (CHF), which has the lower interest rate, trades at a forward premium. This premium exactly offsets the interest rate differential through arbitrage; it does not depend on assuming that the forward is an unbiased predictor of the future spot rate.","d":2,"t":"Forward premium and discount","c":"Under covered interest parity, the currency with the lower interest rate trades at a forward premium and the higher-yielding currency at a forward discount, so that hedged returns are equal. This is an arbitrage relationship, not a forecast of the future spot rate."},{"r":8,"q":"The spot rate is 150.00 JPY per USD. The one-year interest rate is 0.5% in JPY and 4.5% in USD. Based on covered interest rate parity, the one-year forward rate (JPY per USD) is closest to:","o":["144.26","155.97","144.00"],"a":0,"e":"F = S × (1 + i_JPY) / (1 + i_USD) = 150 × 1.005 / 1.045 = 144.26: the USD, with the higher rate, trades at a forward discount. 155.97 inverts the rates (confusing price and base currencies), and 144.00 applies the approximation 150 × (1 - 4%).","d":3,"t":"Forward rate with JPY","c":"Covered interest rate parity: F(price/base) = S × (1 + i_price) / (1 + i_base) for a one-year horizon. If the base currency has the higher interest rate, F < S (forward discount on the base currency)."},{"r":8,"q":"A euro-based investor holds a US equity that returns 6% in USD terms over a year. During the year, the USD depreciates by 3% against the EUR. The investor's return in EUR terms is closest to:","o":["3.00%","9.18%","2.82%"],"a":2,"e":"Return in EUR = (1 + R_asset) × (1 + R_currency) - 1 = 1.06 × 0.97 - 1 = 2.82%. 3.00% is the additive approximation (6% - 3%), which ignores the cross term, and 9.18% wrongly treats the fall of the dollar as an appreciation (1.06 × 1.03 - 1).","d":2,"t":"Foreign currency return","c":"Domestic-currency return on a foreign asset: R_DC = (1 + R_FC) × (1 + R_FX) - 1, where R_FX is the change in the value of the foreign currency against the domestic currency. The approximation R_FC + R_FX ignores the cross product."}]},{"subject":3,"questions":[{"r":1,"q":"Which business structure is characterized by no legal separation between the owner and the business and by the owner's unlimited personal liability?","o":["Sole proprietorship","Limited partnership, for the limited partners","Publicly traded corporation"],"a":0,"e":"In a sole proprietorship, the owner and the business are one and the same: the owner bears unlimited liability with personal assets. Limited partners in a limited partnership have liability limited to their investment, and shareholders of a listed corporation can lose only what they invested.","d":1,"t":"Sole proprietorship","c":"A sole proprietorship has no legal identity separate from its owner: the owner controls everything, keeps all profits and bears unlimited personal liability."},{"r":1,"q":"Which statement about a limited partnership is most accurate?","o":["Limited partners' liability is limited to their investment, but they generally do not participate in managing the business.","All partners share unlimited liability and management responsibilities equally.","The general partner's liability is limited to its capital contribution."],"a":0,"e":"In a limited partnership, the general partner manages the business and has unlimited liability, while limited partners have liability limited to their investment in exchange for no management role. The second option describes a general partnership; the third reverses the roles.","d":1,"t":"Limited partnership","c":"In a limited partnership, at least one general partner manages the business with unlimited liability, while limited partners do not manage and risk only their investment."},{"r":1,"q":"A corporation pays a 25% corporate income tax, and its shareholders pay a 20% tax on dividends. If the corporation distributes all of its after-tax earnings as dividends, the effective tax rate on each unit of pre-tax corporate earnings is closest to:","o":["25%","40%","45%"],"a":1,"e":"On 100 of pre-tax earnings, 100 × (1 − 0.25) = 75 remains after corporate tax, then 75 × (1 − 0.20) = 60 after dividend tax: effective rate = 1 − 0.60 = 40%. Adding the two rates (45%) ignores that the dividend tax applies to an already reduced amount; 25% omits the second layer of tax.","d":2,"t":"Double taxation","c":"Double taxation: earnings are taxed at the corporate level and again when distributed. Effective rate = t_corp + (1 − t_corp) × t_div."},{"r":1,"q":"Compared with a publicly listed company, a private company most likely:","o":["faces less extensive public disclosure requirements.","has shares that are more liquid for its investors.","can raise equity capital more easily from a broad investor base."],"a":0,"e":"A private company is not subject to the disclosure requirements of listed companies, which lowers its reporting costs. In exchange, its shares are less liquid and it finds it harder to raise equity from a broad investor base, so the other two options are incorrect.","d":1,"t":"Private vs public companies","c":"A private company has illiquid shares, lighter disclosure and regulatory requirements, concentrated ownership and more limited access to market financing than a public company."},{"r":1,"q":"Which of the following business forms is most likely to be taxed as a pass-through entity, with profits taxed only at the owners' level?","o":["A publicly traded corporation","A private corporation that retains all of its earnings","A partnership"],"a":2,"e":"Partnerships are pass-through entities: profits are taxed directly at the partners' level, with no entity-level tax. A corporation, listed or not, is taxed at its own level even if it distributes nothing.","d":2,"t":"Pass-through taxation","c":"Pass-through structures (sole proprietorships, partnerships, LLC/S-corp depending on jurisdiction) pay no entity-level tax: income is taxed once, directly in the owners' hands."},{"r":1,"q":"Relative to a general partnership, a key advantage of the corporate form is most likely:","o":["easier access to capital through the issuance of transferable shares.","the avoidance of any entity-level taxation.","the absence of separation between ownership and control."],"a":0,"e":"A corporation, a separate legal entity with freely transferable shares, can raise capital from many investors and has an unlimited life. By contrast, it bears entity-level tax (double taxation) and is precisely characterized by the separation of ownership and control.","d":1,"t":"Advantages of corporate form","c":"A corporation is a separate legal entity: limited shareholder liability, transferable shares, unlimited life and broad access to capital, at the cost of possible double taxation and agency conflicts."},{"r":1,"q":"An entrepreneur owns 50% of a corporation that earns $400,000 before taxes. The corporate tax rate is 21%, all after-tax earnings are paid out as dividends, and dividends are taxed at 15% at the shareholder level. The entrepreneur's after-tax income from the business is closest to:","o":["$128,000","$134,300","$158,000"],"a":1,"e":"Entrepreneur's share: 400,000 × 50% = 200,000; after corporate tax: 200,000 × 0.79 = 158,000; after dividend tax: 158,000 × 0.85 = $134,300. $158,000 forgets the dividend tax, and $128,000 wrongly subtracts both rates together (1 − 0.21 − 0.15).","d":3,"t":"After-tax owner income","c":"Shareholder's after-tax income = share of pre-tax earnings × (1 − t_corp) × (1 − t_div), when all earnings are distributed."},{"r":1,"q":"A private company wants its existing shares to begin trading on a stock exchange without issuing new shares or raising new capital. Which method is most appropriate?","o":["Initial public offering","Merger with a special purpose acquisition company (SPAC)","Direct listing"],"a":2,"e":"A direct listing lets existing shareholders sell their shares on the exchange without issuing new shares or using underwriting banks. An IPO generally involves issuing new shares to raise funds, and a SPAC merger brings the company the cash raised by the SPAC.","d":2,"t":"Direct listing","c":"Ways to go public: IPO (new shares issued via underwriters), direct listing (existing shares only, no capital raised) and SPAC (merger with an already listed shell company)."},{"r":2,"q":"Which statement best describes stakeholder theory?","o":["Corporate decisions should consider the interests of all groups affected by the company, not only shareholders.","The sole objective of the company is to maximize shareholder value.","Only parties with contractual claims on the company should influence its decisions."],"a":0,"e":"Stakeholder theory broadens the company's objective to all affected groups (employees, customers, suppliers, creditors, government, society). Maximizing shareholder value alone is shareholder theory; limiting influence to contractual parties is not the accepted definition.","d":1,"t":"Shareholder vs stakeholder theory","c":"Shareholder theory targets maximization of shareholder value; stakeholder theory also takes into account the interests of employees, customers, suppliers, creditors, government and society."},{"r":2,"q":"A company has zero-coupon debt with a face value of $60 million maturing in one year. If the value of the company's assets at maturity is $45 million, the payoffs to debtholders and equity holders, respectively, are:","o":["$60 million and −$15 million","$45 million and −$15 million","$45 million and $0"],"a":2,"e":"Debtholders receive min(V, D) = min(45, 60) = $45 million and shareholders max(V − D, 0) = max(−15, 0) = 0. Thanks to limited liability, the shareholders' payoff cannot be negative: answers with −$15 million ignore this, and debtholders cannot receive more than the value of the assets.","d":2,"t":"Equity vs debt payoff","c":"At maturity of zero-coupon debt with face value F: debtholders receive min(V, F) and shareholders max(V − F, 0). Shareholders hold a call-option-like payoff on the assets; debtholders have a capped payoff."},{"r":2,"q":"In a typical corporation, members of the board of directors are elected by:","o":["shareholders.","senior management.","creditors."],"a":0,"e":"Directors are elected by shareholders, to whom the board is accountable; it is the board that appoints and oversees management. Creditors protect their interests through contractual clauses (covenants), not by electing the board.","d":1,"t":"Board election","c":"The board of directors is elected by shareholders at the general meeting; the board then appoints and oversees management."},{"r":2,"q":"After issuing a large amount of debt, a company's managers switch the firm's investments toward much riskier projects. This behavior most likely:","o":["transfers value from shareholders to debtholders.","benefits debtholders and shareholders equally.","transfers value from debtholders to shareholders."],"a":2,"e":"The shareholders' position resembles a call option on the firm's assets: more risk raises the option's value, while debtholders' payoff is capped and their risk of loss rises. This behavior (asset substitution) therefore transfers value from debtholders to shareholders, not the reverse.","d":2,"t":"Asset substitution","c":"Asset substitution: after borrowing, shareholders/managers have an incentive to take more risk, because they capture the upside while debtholders bear the downside; this transfers value from debtholders to shareholders."},{"r":2,"q":"The primary interest of governments and regulators as corporate stakeholders is most likely:","o":["tax revenue and compliance with laws and regulations.","maximizing the company's share price.","receiving fixed interest and principal payments."],"a":0,"e":"Governments and regulators are mainly concerned with tax revenue, regulatory compliance and the company's impact on the economy and society. Maximizing the share price is the shareholders' objective, and fixed interest and principal payments concern creditors.","d":1,"t":"Government as stakeholder","c":"Governments and regulators seek to protect the public interest: tax revenue, compliance with laws, economic stability and protection of other stakeholders."},{"r":2,"q":"A company has debt with a face value of $100 due in one year and must choose between two projects. Project X will produce an asset value of $100 with certainty. Project Y will produce an asset value of either $40 or $180 with equal probability. If the company chooses Project Y, the expected payoff to debtholders is closest to:","o":["$70","$100","$110"],"a":0,"e":"With Project Y, debtholders receive min(40, 100) = 40 or min(180, 100) = 100, for an expected value of 0.5 × 40 + 0.5 × 100 = $70. $100 corresponds to Project X (riskless), and $110 is the total expected asset value, which includes the shareholders' expected payoff (0.5 × 80 = $40). Shareholders therefore prefer Y at the debtholders' expense.","d":3,"t":"Debtholder vs shareholder conflict","c":"To compare projects from debtholders' and shareholders' viewpoints, compute each party's expected payoff: debtholders = min(V, F), shareholders = max(V − F, 0). Higher volatility benefits shareholders at debtholders' expense."},{"r":2,"q":"A company issues a large amount of new debt and uses the proceeds to repurchase shares. Which stakeholder group is most likely to be harmed?","o":["Remaining shareholders","Senior managers holding stock options","Existing bondholders"],"a":2,"e":"Additional debt raises default risk without existing creditors being compensated for that risk: the value of their bonds falls. Remaining shareholders and managers holding options instead benefit from leverage and the potential rise in the share price.","d":2,"t":"Leveraged recapitalization","c":"An increase in leverage (e.g., a leveraged recapitalization) raises default risk and lowers the value of existing debt: incumbent bondholders are typically harmed to the benefit of shareholders."},{"r":2,"q":"Which mechanism is most commonly used by lenders to protect themselves against actions by management that favor shareholders?","o":["Restrictive covenants in the loan agreement","Voting for the board of directors","Say-on-pay votes"],"a":0,"e":"Creditors have no voting rights; they protect themselves with restrictive covenants limiting, for example, additional borrowing, dividends or asset sales. Board elections and say-on-pay votes are shareholder rights.","d":2,"t":"Creditor protection","c":"Creditors protect themselves through affirmative and negative (restrictive) covenants: limits on borrowing, dividends and asset sales, required financial ratios, as well as collateral."},{"r":3,"q":"The principal–agent problem in corporate governance most likely arises because:","o":["shareholders have unlimited liability for the company's obligations.","creditors elect the board of directors.","managers may act in their own interests rather than in the interests of shareholders."],"a":2,"e":"The agency problem arises from the separation of ownership (shareholders, principals) and control (managers, agents): managers may pursue their own interests (perks, empire building, risk aversion). Shareholders have limited liability, and it is they, not creditors, who elect the board.","d":1,"t":"Principal-agent problem","c":"The principal–agent problem arises from the separation of ownership and control: managers (agents) have interests and information that differ from those of shareholders (principals)."},{"r":3,"q":"A company's board is divided into three classes, with only one class elected each year. This structure most likely:","o":["makes it more difficult for shareholders to replace a majority of the board quickly.","increases the board's accountability to shareholders.","facilitates hostile takeovers."],"a":0,"e":"With a staggered board, at least two annual meetings are needed to replace a majority of directors, which protects incumbent management and acts as a takeover defense. It therefore reduces the board's accountability to shareholders and makes hostile takeovers harder.","d":2,"t":"Staggered board","c":"A staggered (classified) board is only partially re-elected each year: it provides continuity but makes a hostile takeover or board replacement slower and harder, which can entrench management."},{"r":3,"q":"A shareholder owns 300 shares. Five board seats are up for election, and the company uses cumulative voting. The maximum number of votes the shareholder can cast for a single candidate is:","o":["60","300","1,500"],"a":2,"e":"Under cumulative voting, total votes = shares × seats = 300 × 5 = 1,500, which can all be concentrated on one candidate. 300 corresponds to statutory voting, where each candidate gets at most one vote per share; 60 wrongly divides shares by the number of seats.","d":2,"t":"Cumulative voting","c":"Cumulative voting: total votes = number of shares × number of board seats being elected, and a shareholder may concentrate all votes on a single candidate."},{"r":3,"q":"A company has 1,000 voting shares outstanding and uses cumulative voting to elect four directors. Assuming all shares are voted, the minimum number of shares a shareholder must own to guarantee the election of one director is closest to:","o":["200","201","251"],"a":1,"e":"Formula: shares needed = voting shares / (seats + 1) + 1 = 1,000 / 5 + 1 = 201. With 200 shares, the other shareholders (800 shares, 3,200 votes) could split 800 votes across each of 4 candidates and tie at 800 votes; 251 wrongly uses 1,000 / 4 + 1.","d":3,"t":"Cumulative voting threshold","c":"Cumulative voting: shares needed to guarantee the election of n directors ≈ [n × voting shares / (seats + 1)] + 1."},{"r":3,"q":"A \"say on pay\" provision allows:","o":["employees to vote on the pay of board members.","executives to set their own compensation without board approval.","shareholders to vote on executive compensation."],"a":2,"e":"Say on pay gives shareholders a (often advisory) vote on executive compensation, to better align it with their interests. It is neither a vote by employees nor autonomy for executives, which would worsen the agency conflict.","d":1,"t":"Say on pay","c":"Say on pay gives shareholders a (often non-binding) vote on executive compensation, to align it with their interests."},{"r":3,"q":"A company has a dual-class share structure in which the founders hold shares with ten votes each while public investors hold shares with one vote each. The governance risk most directly associated with this structure is:","o":["conflicts between controlling and minority shareholders.","conflicts between debtholders and shareholders.","excessive influence of activist investors."],"a":0,"e":"Multiple-vote shares let founders control the company with a small share of the capital, exposing minority shareholders to decisions that favor only the controlling holders (controlling vs minority shareholder conflict). The structure is unrelated to the debtholder–shareholder conflict, and it actually limits activists' influence.","d":2,"t":"Dual-class shares","c":"Dual-class shares separate control from economic ownership: a group with a minority of the capital can control the company, at the risk of harming minority shareholders."},{"r":3,"q":"An activist investor seeks to replace several directors by persuading other shareholders to give it the right to vote their shares at the annual meeting. This is best described as a:","o":["tender offer.","staggered board.","proxy contest."],"a":2,"e":"A proxy contest involves soliciting other shareholders' proxies to elect one's own candidates to the board. A tender offer aims to buy shares directly, and a staggered board is a defensive device, not an activist strategy.","d":1,"t":"Proxy contest","c":"Proxy contest (proxy fight): a group solicits other shareholders' proxies to elect its own directors; it is a classic tool of activist investors."},{"r":3,"q":"Effective corporate governance is most likely to result in:","o":["a lower cost of capital for the company.","higher agency costs.","greater management discretion over related-party transactions."],"a":0,"e":"Good governance lowers the risk perceived by capital providers (fewer agency conflicts, better information), which reduces the cost of capital and improves performance. It reduces agency costs and tightly controls related-party transactions rather than giving management more latitude.","d":2,"t":"Benefits of good governance","c":"Good governance reduces agency costs, improves operational efficiency, information quality and control, and tends to lower the cost of capital and increase firm value."},{"r":4,"q":"A company has days sales outstanding of 45 days, days of inventory on hand of 60 days, and days payables outstanding of 35 days. Its cash conversion cycle is:","o":["50 days","70 days","140 days"],"a":1,"e":"CCC = DSO + DIO − DPO = 45 + 60 − 35 = 70 days. 140 days wrongly adds payables days instead of subtracting them, and 50 days subtracts receivables days instead of adding them (60 + 35 − 45).","d":1,"t":"Cash conversion cycle","c":"Cash conversion cycle = DSO + DOH − DPO (days sales outstanding + days of inventory on hand − days payables outstanding)."},{"r":4,"q":"A company reports annual revenue of $7,300,000, cost of goods sold of $5,475,000, average accounts receivable of $800,000, average inventory of $900,000, and average accounts payable of $600,000. Using a 365-day year, the company's cash conversion cycle is closest to:","o":["55 days","60 days","140 days"],"a":1,"e":"DSO = 800 / (7,300 / 365) = 40 days; DIO = 900 / (5,475 / 365) = 60 days; DPO = 600 / (5,475 / 365) = 40 days; CCC = 40 + 60 − 40 = 60 days. 55 days wrongly computes DIO and DPO with revenue instead of COGS, and 140 days adds DPO.","d":2,"t":"Cash conversion cycle computation","c":"DSO = average receivables / (revenue/365); DOH = average inventory / (COGS/365); DPO = average payables / (COGS/365, or purchases/365); CCC = DSO + DOH − DPO."},{"r":4,"q":"A supplier offers terms of 2/10, net 40. If a company forgoes the discount and pays on day 40, the effective annual cost of the trade credit (365-day year) is closest to:","o":["18.6%","24.8%","27.9%"],"a":2,"e":"Cost = (1 + 2/98)^(365/30) − 1 = (1.020408)^12.1667 − 1 ≈ 27.9%, since the extra financing period is 40 − 10 = 30 days. 24.8% is the simple, uncompounded rate (2/98 × 365/30), and 18.6% wrongly uses the full 40-day period (2/98 × 365/40) instead of the 30 extra days, without compounding.","d":3,"t":"Cost of trade credit","c":"Effective annual cost of trade credit (terms d/D, net N) = (1 + d/(1 − d))^(365/(N − D)) − 1."},{"r":4,"q":"Which of the following is a secondary source of liquidity?","o":["Cash flow from operations","Unused bank lines of credit","Liquidating long-term assets"],"a":2,"e":"Secondary sources of liquidity (asset sales, debt renegotiation, bankruptcy proceedings) change the company's financial or operating structure. Cash flow from operations and unused bank lines of credit are primary sources, available in the normal course of business.","d":1,"t":"Secondary sources of liquidity","c":"Primary sources of liquidity: cash, existing credit lines, operating cash flows. Secondary sources: asset liquidation, debt renegotiation, bankruptcy filing — they can change the financial structure or operations."},{"r":4,"q":"A company finances part of its permanent working capital needs with short-term borrowing. Compared with a conservative approach, this aggressive approach most likely results in:","o":["higher financing costs and lower refinancing risk.","lower financing costs and lower refinancing risk.","lower financing costs but higher refinancing risk."],"a":2,"e":"An aggressive strategy funds permanent needs with short-term debt, usually cheaper but needing regular rollover: refinancing and interest rate risk rise. The conservative strategy (long-term funding) is costlier but less risky; no strategy is both cheaper and less risky.","d":2,"t":"Working capital financing strategy","c":"Working capital financing: conservative approach = permanent needs funded long term (higher cost, lower risk); aggressive approach = reliance on short-term funding (lower cost but higher refinancing and rate risk)."},{"r":4,"q":"A company has cash of $50 million, marketable securities of $30 million, accounts receivable of $70 million, inventory of $120 million, and current liabilities of $100 million. Its quick ratio is:","o":["0.8","1.5","2.7"],"a":1,"e":"Quick ratio = (cash + marketable securities + receivables) / current liabilities = (50 + 30 + 70) / 100 = 1.5. 2.7 is the current ratio (including inventory) and 0.8 is the cash ratio (excluding receivables).","d":1,"t":"Quick ratio","c":"Quick ratio = (cash + marketable securities + accounts receivable) / current liabilities; inventory is excluded."},{"r":4,"q":"All else equal, which of the following actions will most likely shorten a company's cash conversion cycle?","o":["Offering customers longer credit terms","Taking longer to pay suppliers","Increasing inventory levels relative to sales"],"a":1,"e":"CCC = DSO + DIO − DPO falls when DPO rises, i.e., by paying suppliers later. Extending customer credit raises DSO and increasing inventory raises DIO, which lengthens the cycle.","d":1,"t":"Reducing the cash conversion cycle","c":"The cash conversion cycle shortens by collecting from customers faster (DSO ↓), selling inventory faster (DOH ↓) or paying suppliers later (DPO ↑)."},{"r":4,"q":"Which of the following is best described as a pull on liquidity rather than a drag on liquidity?","o":["Suppliers reducing the credit they extend, forcing earlier payments","Slow collection of accounts receivable","Obsolete inventory that takes longer to sell"],"a":0,"e":"A pull accelerates cash outflows (earlier payments to suppliers, reduced credit lines), whereas a drag delays cash inflows. Slow collection of receivables and obsolete inventory slow cash inflows: they are drags.","d":2,"t":"Pulls on liquidity","c":"Drag on liquidity: delayed cash inflows (slow receivables, obsolete inventory). Pull on liquidity: accelerated cash outflows (suppliers demanding faster payment, reduced credit lines)."},{"r":5,"q":"A project requires an initial investment of $1,000 and is expected to generate cash flows of $300, $4
